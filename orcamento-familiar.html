    alterar(() => {
      if (editando.pat){
        Object.assign(S.ativos.find(b => b.id === editando.pat), dados);
        editando.pat = null;
      } else {
        // Ao criar, pode semear os encargos típicos do tipo de ativo,
        // já ligados às categorias correspondentes e com valor por preencher.
        const encargos = sugerir
          ? (ENCARGOS_TIPICOS[tipo] || []).map(e => ({
              id: uid("en"), nome: e.nome, valor: 0,
              frequencia: e.freq, categoriaId: catPorNome(e.cat),
            }))
          : [];
        S.ativos.push(Object.assign({id:uid("pt"), encargos, rendimentos:[], aportes:[]}, dados));
      }
    }, editando.pat ? "alteração do ativo" : "novo ativo");
    toast(sugerir && !editando.pat ? "Ativo criado com os encargos típicos — preencha os valores." : "Ativo guardado.");
  },
  patEditar(el){ editando.pat = el.dataset.id; render(); window.scrollTo({top:0}); },
  patAdotar(el){
    const b = S.ativos.find(x => x.id === el.dataset.id);
    if (!b) return;
    pedirValor("Valor atual — "+b.nome,
      "Estimativa pela taxa de valorização: "+eur(valorEstimado(b))+". Confirme ou corrija.",
      (v) => {
        alterar(() => { b.atual = Math.max(0, v); });
        toast(v > 0 ? "Valor atualizado." : "Passou a usar a estimativa.");
      },
      fmtNum.format(valorEstimado(b)));
  },
  patApagar(el){
    const b = S.ativos.find(x => x.id === el.dataset.id);
    const cr = b ? creditosDoAtivo(b) : [];
    apagarComAnulacao('Ativo "'+((b && b.nome) || "ativo")+'" eliminado'+
      (cr.length ? " — "+cr.length+" crédito(s) ficam sem ativo" : "")+'.', () => {
      S.ativos = S.ativos.filter(x => x.id !== el.dataset.id);
      S.creditos.forEach(c => { if (c.ativoId === el.dataset.id) c.ativoId = ""; });
    });
  },

  /* --- encargos e rendimentos dos ativos --- */
  fluxoNovo(el){
    editando.fluxo = {ativoId: el.dataset.ativo, tipo: el.dataset.tipo, id: null};
    render();
  },
  fluxoEditar(el){
    editando.fluxo = {ativoId: el.dataset.ativo, tipo: el.dataset.tipo, id: el.dataset.id};
    render();
  },
  fluxoCancelar(){ editando.fluxo = null; render(); },
  fluxoSalvar(el){
    const a = S.ativos.find(x => x.id === el.dataset.ativo);
    if (!a) return;
    const tipo = el.dataset.tipo;
    const nome = $("#flNome").value.trim();
    const valor = parseNum($("#flValor").value);
    const categoriaId = $("#flCat").value;
    if (!nome){ invalido("flNome", "Indique a designação."); return; }
    if (!categoriaId){ invalido("flCat", "Escolha a categoria de destino."); return; }
    const dados = {nome, valor: Math.abs(valor), frequencia: $("#flFreq").value, categoriaId};
    const chave = tipo === "encargo" ? "encargos" : "rendimentos";
    const st = editando.fluxo;
    alterar(() => {
      if (!Array.isArray(a[chave])) a[chave] = [];
      if (st && st.id){
        const alvo = a[chave].find(x => x.id === st.id);
        if (alvo) Object.assign(alvo, dados);
      } else {
        a[chave].push(Object.assign({id:uid(tipo === "encargo" ? "en" : "rn")}, dados));
      }
      editando.fluxo = null;
    });
    toast(tipo === "encargo" ? "Encargo guardado." : "Rendimento guardado.");
  },
  fluxoApagar(el){
    const a = S.ativos.find(x => x.id === el.dataset.ativo);
    if (!a) return;
    const chave = el.dataset.tipo === "encargo" ? "encargos" : "rendimentos";
    const item = (a[chave] || []).find(x => x.id === el.dataset.id);
    apagarComAnulacao('"'+((item && item.nome) || "item")+'" removido de '+a.nome+'.', () => {
      a[chave] = (a[chave] || []).filter(x => x.id !== el.dataset.id);
    });
  },

  /* --- membros e categorias --- */
  mbAdd(){
    const nome = $("#mbNome").value.trim();
    if (!nome){ $("#mbNome").focus(); return; }
    alterar(() => { S.membros.push({id:uid("mb"), nome}); });
    toast("Membro adicionado.");
  },
  mbApagar(el){
    const m = membro(el.dataset.id);
    apagarComAnulacao('Membro "'+((m && m.nome) || "membro")+'" removido.', () => {
      S.membros = S.membros.filter(x => x.id !== el.dataset.id);
      S.movimentos.forEach(mv => { if (mv.membroId === el.dataset.id) mv.membroId = ""; });
      S.recorrentes.forEach(r => { if (r.membroId === el.dataset.id) r.membroId = ""; });
    });
  },
  catSalvar(){
    const nome = $("#ctNome").value.trim();
    if (!nome){ invalido("ctNome", "Indique o nome."); return; }
    const tipo = $("#ctTipo").value;
    const dados = {nome, tipo, grupo: tipo === "rendimento" ? null : $("#ctGrupo").value,
      cor: $("#ctCor").value, icone: ($("#ctIcone") ? $("#ctIcone").value.trim() : "")};
    alterar(() => {
      if (editando.cat){
        Object.assign(cat(editando.cat), dados);
        editando.cat = null;
      } else {
        S.categorias.push(Object.assign({id:uid("cat")}, dados));
      }
    }, "categoria");
    toast("Categoria guardada.");
  },
  catEditar(el){ editando.cat = el.dataset.id; render(); window.scrollTo({top:0}); },
  catApagar(el){
    const id = el.dataset.id;
    const c = cat(id);
    const n = S.movimentos.filter(m => m.categoriaId === id).length +
              S.recorrentes.filter(r => r.categoriaId === id).length;
    if (n){ toast("Categoria em uso em "+n+" registo(s) — reatribua primeiro."); return; }
    apagarComAnulacao('Categoria "'+((c && c.nome) || "categoria")+'" eliminada.', () => {
      S.categorias = S.categorias.filter(x => x.id !== id);
      delete S.limites[id];
    });
  },
};

   uma ação rápida sem tirar as mãos do teclado.

const semAcento = (s) => String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();

function comandosPaleta(){
  const vistas = [["painel","📊","Painel"],["rendimentos","💶","Rendimentos"],["despesas","🧾","Despesas"],
    ["ativos","🏦","Ativos"],["creditos","🏠","Créditos"],["objetivos","🎯","Objetivos"],
    ["estrategias","📈","Estratégias"],["config","⚙️","Definições"]]
    .map(([v,i,l]) => ({icone:i, lbl:"Ir para "+l, tipo:"vista", run: () => irPara(v)}));
  const focar = (id) => { const e = $("#"+id); if (e){ e.focus(); e.scrollIntoView({block:"center"}); } };
  const acoes = [
    {icone:"➕", lbl:"Novo movimento", tipo:"ação", run: () => { irPara("movimentos"); focar("mvValor"); }},
    {icone:"➕", lbl:"Nova rubrica do plano", tipo:"ação", run: () => { irPara("plano"); focar("rcNome"); }},
    {icone:"➕", lbl:"Novo ativo", tipo:"ação", run: () => { irPara("ativos"); focar("ptNome"); }},
    {icone:"➕", lbl:"Novo crédito", tipo:"ação", run: () => { irPara("creditos"); focar("crNome"); }},
    {icone:"➕", lbl:"Novo objetivo", tipo:"ação", run: () => { irPara("objetivos"); focar("obNome"); }},
    {icone:"💾", lbl:"Exportar cópia de segurança (JSON)", tipo:"ação", run: exportJSON},
    {icone:"🖨️", lbl:"Imprimir", tipo:"ação", run: () => window.print()},
    {icone:"🎓", lbl:"Visita guiada pela aplicação", tipo:"ação", run: () => ACOES.tutorialIniciar()},
    {icone:"↶", lbl:"Desfazer a última alteração", tipo:"ação", run: desfazer},
    {icone:"↷", lbl:"Refazer", tipo:"ação", run: refazer},
    {icone:"◐", lbl:"Alternar tema claro/escuro", tipo:"ação", run: () => $("#temaBtn").click()},
    {icone:"🎨", lbl:"Mudar a paleta de cor", tipo:"ação", run: () => { irPara("config"); window.scrollTo({top:0}); }},
  ];
  const extra = temDados() ? [] : [{icone:"✨", lbl:"Carregar exemplo", tipo:"ação", run: () => ACOES.exemplo()}];
  return vistas.concat(acoes, extra);
}

let paletaSel = 0;
function abrirPaleta(){
  paletaSel = 0;
  $("#paleta").innerHTML =
    '<div class="overlay"><div class="caixa" role="dialog" aria-modal="true" aria-label="Paleta de comandos">'+
    '<input id="paletaIn" placeholder="Escreva para procurar — vistas e ações" autocomplete="off">'+
    '<ul id="paletaLista" role="listbox"></ul></div></div>';
  pintarPaleta("");
  const inp = $("#paletaIn");
  inp.focus();
  inp.addEventListener("input", () => { paletaSel = 0; pintarPaleta(inp.value); });
  $("#paleta .overlay").addEventListener("click", (e) => {
    if (e.target === e.currentTarget) fecharPaleta();

}
function fecharPaleta(){ $("#paleta").innerHTML = ""; }
function paletaAberta(){ return !!$("#paletaIn"); }

/**
 * Resultados vindos dos dados do agregado — movimentos, ativos, créditos,
 * objetivos, fontes e categorias. Só entram quando há termo de procura.
 */
function comandosDados(t){
  if (t.length < 2) return [];
  const bate = (s) => semAcento(s).indexOf(t) >= 0;
  const out = [];
  S.ativos.filter(a => bate(a.nome)).slice(0, 4).forEach(a =>
    out.push({icone:"🏦", lbl:a.nome+" — "+eur(valorAtivo(a)), tipo:"ativo",
      run: () => { irPara("ativos"); }}));
  S.creditos.filter(c => bate(c.nome)).slice(0, 3).forEach(c =>
    out.push({icone:"🏠", lbl:c.nome+" — "+eur(saldoDevedorMes(c, MES))+" em dívida", tipo:"crédito",
      run: () => { irPara("creditos"); }}));
  S.objetivos.filter(o => bate(o.nome)).slice(0, 3).forEach(o =>
    out.push({icone:"🎯", lbl:o.nome+" — "+eur(parseNum(o.atual))+" de "+eur(parseNum(o.alvo)), tipo:"objetivo",
      run: () => { irPara("objetivos"); }}));
  S.rendimentos.filter(r => bate(r.nome)).slice(0, 3).forEach(r =>
    out.push({icone:"💶", lbl:r.nome, tipo:"fonte", run: () => { ui.abertos["rd-"+r.id] = true; irPara("rendimentos"); }}));
  S.categorias.filter(c => bate(c.nome)).slice(0, 3).forEach(c =>
    out.push({icone:c.icone || "🏷", lbl:c.nome, tipo:"categoria",
      run: () => { filtros.categoria = c.id; filtros.texto = ""; irPara("movimentos"); }}));
  // Movimentos: procura na descrição, dos mais recentes para trás
  S.movimentos.filter(m => bate(m.descricao || ""))
    .sort((a,b) => String(b.data).localeCompare(String(a.data))).slice(0, 5).forEach(m =>
      out.push({icone:"🧾", lbl:(m.descricao || "—")+" — "+eur(Math.abs(parseNum(m.valor)))+
        " · "+(m.data || "").split("-").reverse().join("/"), tipo:"movimento",
        run: () => { MES = mesDoDia(m.data) || MES; filtros.texto = m.descricao || ""; irPara("movimentos"); }}));
  return out;
}

function filtrarComandos(termo){
  const t = semAcento(termo).trim();
  const lista = comandosPaleta();
  if (!t) return lista;
  return lista.filter(c => semAcento(c.lbl).indexOf(t) >= 0).concat(comandosDados(t));
}
function pintarPaleta(termo){
  const lista = filtrarComandos(termo);
  paletaSel = Math.max(0, Math.min(paletaSel, lista.length - 1));
  $("#paletaLista").innerHTML = lista.length
    ? lista.map((c,i) =>
        '<li role="option" data-i="'+i+'" aria-selected="'+(i === paletaSel)+'">'+
        '<span class="ticon" aria-hidden="true">'+c.icone+'</span>'+esc(c.lbl)+
        '<span class="tipo">'+esc(c.tipo)+'</span></li>').join("")
    : '<li aria-selected="false" style="color:var(--muted);cursor:default">Nada corresponde à procura.</li>';
  $$("#paletaLista li[data-i]").forEach(li => {
    li.addEventListener("click", () => { executarPaleta(parseInt(li.dataset.i, 10)); });
  });
}
function executarPaleta(i){
  const lista = filtrarComandos($("#paletaIn") ? $("#paletaIn").value : "");
  const c = lista[i != null ? i : paletaSel];
  fecharPaleta();
  if (c) c.run();
}

/* Sequências de atalhos: g+letra navega, n+letra cria. */
let seqTecla = null, seqT = null;
const SEQ_IR = {p:"painel", r:"rendimentos", d:"despesas", a:"ativos", c:"creditos",
                o:"objetivos", e:"estrategias", f:"config"};
const SEQ_NOVO = {m:["movimentos","mvValor"], r:["plano","rcNome"], a:["ativos","ptNome"],
                  c:["creditos","crNome"], o:["objetivos","obNome"]};

function abrirAtalhos(){
  const linha = (t, d) => '<tr><td style="white-space:nowrap">'+t+'</td><td class="muted">'+esc(d)+'</td></tr>';
  const k = (s) => '<kbd>'+esc(s)+'</kbd>';
  $("#modalHost").innerHTML =
    '<div class="overlay"><div class="dialog" role="dialog" aria-modal="true" style="max-width:520px">'+
    '<h3>Atalhos de teclado</h3>'+
    '<div class="tblwrap"><table><tbody>'+
    linha(k("Ctrl")+" + "+k("K"), "Paleta de comandos")+
    linha(k("Ctrl")+" + "+k("Z"), "Desfazer a última alteração")+
    linha(k("Ctrl")+" + "+k("Shift")+" + "+k("Z")+" ou "+k("Ctrl")+" + "+k("Y"), "Refazer")+
    linha(k("?"), "Esta folha de atalhos")+
    linha(k("g")+" depois "+k("p")+" "+k("r")+" "+k("d")+" "+k("a")+" "+k("c")+" "+k("o")+" "+k("e")+" "+k("f"),
      "Ir para: Painel, Rendimentos, Despesas, Ativos, Créditos, Objetivos, Estratégias, deFinições")+
    linha(k("n")+" depois "+k("m")+" "+k("r")+" "+k("a")+" "+k("c")+" "+k("o"),
      "Novo: Movimento, Rubrica, Ativo, Crédito, Objetivo")+
    linha(k("←")+" "+k("→"), "Navegar na visita guiada")+
    linha(k("Esc"), "Fechar diálogos, paleta e visita")+
    '</tbody></table></div>'+
    '<div class="actions"><button class="btn" data-dlg="no">Fechar</button></div>'+
    '</div></div>';
  const host = $("#modalHost");
  host.querySelector('[data-dlg="no"]').onclick = () => { host.innerHTML = ""; };
  host.querySelector(".overlay").onclick = (ev) => { if (ev.target === ev.currentTarget) host.innerHTML = ""; };
}

document.addEventListener("keydown", (e) => {
  if ((e.ctrlKey || e.metaKey) && (e.key === "k" || e.key === "K")){
    e.preventDefault();
    if (paletaAberta()) fecharPaleta(); else abrirPaleta();
    return;
  }
  /* Desfazer e refazer. Nos campos de texto não se toca: aí o Ctrl+Z é
     o do navegador, e roubá-lo faria perder o que se está a escrever. */
  if ((e.ctrlKey || e.metaKey) && !e.altKey){
    const t = e.target;
    const aEscrever = t && (/^(INPUT|TEXTAREA)$/.test(t.tagName) || t.isContentEditable);
    if (!aEscrever){
      const k = e.key.toLowerCase();
      if (k === "z" && !e.shiftKey){ e.preventDefault(); desfazer(); return; }
      if ((k === "z" && e.shiftKey) || k === "y"){ e.preventDefault(); refazer(); return; }
    }
  }
  // Sequências g/n e a folha "?" — nunca enquanto se escreve num campo
  const alvoTexto = e.target && (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable);
  if (!alvoTexto && !paletaAberta() && !tutorialAtivo() && !e.ctrlKey && !e.metaKey && !e.altKey){
    if (e.key === "?"){ e.preventDefault(); abrirAtalhos(); return; }
    if (seqTecla){
      const seq = seqTecla; seqTecla = null; clearTimeout(seqT);
      const t = e.key.toLowerCase();
      if (seq === "g" && SEQ_IR[t]){ e.preventDefault(); irPara(SEQ_IR[t]); return; }
      if (seq === "n" && SEQ_NOVO[t]){
        e.preventDefault();
        irPara(SEQ_NOVO[t][0]);
        const campo = $("#"+SEQ_NOVO[t][1]);
        if (campo){ campo.focus(); campo.scrollIntoView({block:"center"}); }
        return;
      }
    } else if (e.key === "g" || e.key === "n"){
      seqTecla = e.key;
      clearTimeout(seqT);
      seqT = setTimeout(() => { seqTecla = null; }, 1500);
      return;
    }
  } else if (alvoTexto){
    seqTecla = null;
  }
  if (tutorialAtivo()){
    if (e.key === "Escape"){ e.preventDefault(); tutorialFim(false); }
    else if (e.key === "ArrowRight"){ e.preventDefault(); tutorialIr(tutorialPasso + 1); }
    else if (e.key === "ArrowLeft"){ e.preventDefault(); tutorialIr(tutorialPasso - 1); }
    return;
  }
  if (!paletaAberta()) return;
  if (e.key === "Escape"){ e.preventDefault(); fecharPaleta(); }
  else if (e.key === "ArrowDown"){ e.preventDefault(); paletaSel++; pintarPaleta($("#paletaIn").value); }
  else if (e.key === "ArrowUp"){ e.preventDefault(); paletaSel = Math.max(0, paletaSel - 1); pintarPaleta($("#paletaIn").value); }
  else if (e.key === "Enter"){ e.preventDefault(); executarPaleta(); }
});

/* ---------------------------------------------------------------
   Importação de extratos bancários em CSV
   Deteta o separador, adivinha as colunas pelo cabeçalho, converte
   datas e valores, sugere categorias pelos movimentos já classificados
   e ignora duplicados. Tudo local, como o resto.
   --------------------------------------------------------------- */
function csvParse(texto){
  const linhas = String(texto || "").replace(/\r/g, "").split("\n").filter(l => l.trim() !== "");
  if (!linhas.length) return {sep: ";", linhas: []};
  const primeira = linhas[0];
  const sep = [";", "\t", ","]
    .map(s => [s, primeira.split(s).length - 1])
    .sort((a,b) => b[1] - a[1])[0][0];
  const parseLinha = (l) => {
    const out = []; let cur = "", dentro = false;
    for (let i = 0; i < l.length; i++){
      const ch = l[i];
      if (dentro){
        if (ch === '"'){ if (l[i+1] === '"'){ cur += '"'; i++; } else dentro = false; }
        else cur += ch;
      }
      else if (ch === '"') dentro = true;
      else if (ch === sep){ out.push(cur.trim()); cur = ""; }
      else cur += ch;
    }
    out.push(cur.trim());
    return out;
  };
  return {sep, linhas: linhas.map(parseLinha)};
}

/** Índices prováveis das colunas de data, descrição e valor, pelo cabeçalho. */
function csvAdivinhaColunas(cabecalho){
  const achar = (rx) => cabecalho.findIndex(c => rx.test(semAcento(c)));
  return {
    data:  achar(/data|date/),
    desc:  achar(/desc|memo|movim|detalh|hist/),
    valor: achar(/valor|montante|amount|import|debito|credito/),
  };
}

/**
 * Converte a data de um extrato para ISO (aaaa-mm-dd); null se não for uma
 * data real. A validação do calendário importa: uma linha com «31-02» ou
 * «13» de mês passaria a um movimento que nenhuma vista mensal mostraria.
 */
function csvDataISO(v){
  const s = String(v || "").trim();
  let a, mes, dia;
  let m = s.match(/^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})/);
  if (m){ a = +m[1]; mes = +m[2]; dia = +m[3]; }
  else {
    m = s.match(/^(\d{1,2})[-/.](\d{1,2})[-/.](\d{4})/);
    if (!m) return null;
    dia = +m[1]; mes = +m[2]; a = +m[3];
  }
  if (mes < 1 || mes > 12 || dia < 1) return null;
  if (dia > new Date(a, mes, 0).getDate()) return null;   // dia inexistente nesse mês
  return a + "-" + String(mes).padStart(2,"0") + "-" + String(dia).padStart(2,"0");
}

/**
 * Sugere a categoria: primeiro as regras que o utilizador ensinou, depois
 * a semelhança com movimentos já classificados.
 */
function categoriaSugerida(descricao){
  const d = semAcento(descricao);
  const regra = (S.regrasCategoria || []).find(r => r.categoriaId && d.indexOf(semAcento(r.padrao)) >= 0);
  if (regra) return regra.categoriaId;

  const tokens = semAcento(descricao).split(/[^a-z0-9]+/).filter(t => t.length >= 4);
  if (!tokens.length) return "";
  const votos = {};
  S.movimentos.forEach(m => {
    if (!m.categoriaId || !m.descricao) return;
    const dele = semAcento(m.descricao);
    tokens.forEach(t => {
      if (dele.indexOf(t) >= 0) votos[m.categoriaId] = (votos[m.categoriaId] || 0) + 1;
    });
  });
  const melhor = Object.entries(votos).sort((a,b) => b[1] - a[1])[0];
  return melhor ? melhor[0] : "";
}

/* ---------------------------------------------------------------
   Arrastar para reordenar — categorias e rubricas do plano.
   O núcleo é uma função pura (testável); o arrasto só a invoca.
   --------------------------------------------------------------- */
function reordenarCategoria(idArrastada, idAlvo){
  const de = S.categorias.findIndex(c => c.id === idArrastada);
  const para = S.categorias.findIndex(c => c.id === idAlvo);
  if (de < 0 || para < 0 || de === para) return false;
  const [c] = S.categorias.splice(de, 1);
  S.categorias.splice(para, 0, c);
  return true;
}
function reordenarRubrica(idArrastada, idAlvo){
  // A ordem manual fica gravada em cada rubrica; a partir da primeira
  // arrumação, a lista respeita-a (antes disso, ordena por valor).
  const doTipo = S.recorrentes.filter(r => r.tipo === "despesa");
  const atual = doTipo.slice().sort((a,b) =>
    (a.ordem != null && b.ordem != null) ? a.ordem - b.ordem : recMensal(b) - recMensal(a));
  const de = atual.findIndex(r => r.id === idArrastada);
  const para = atual.findIndex(r => r.id === idAlvo);
  if (de < 0 || para < 0 || de === para) return false;
  const [r] = atual.splice(de, 1);
  atual.splice(para, 0, r);
  atual.forEach((x, i) => { x.ordem = i; });
  return true;
}

/* ---------------------------------------------------------------
   Edição em linha — clique duplo numa célula e escreve-se ali.
   Enter grava, Escape desiste, sair do campo grava.
   --------------------------------------------------------------- */
function editarCelula(td){
  if (td.querySelector("input, select")) return;
  const campo = td.dataset.edit, id = td.dataset.id;
  const m = S.movimentos.find(x => x.id === id);
  if (!m) return;

  const original = td.innerHTML;
  let ed;
  if (campo === "categoriaId"){
    td.innerHTML = selectCategorias("edCel", m.categoriaId, m.tipo === "rendimento" ? "rendimento" : "despesa");
    ed = td.querySelector("select");
  } else {
    const val = campo === "valor" ? fmtNum.format(Math.abs(parseNum(m.valor))) : (m[campo] || "");
    td.innerHTML = '<input id="edCel" value="'+esc(val)+'"'+
      (campo === "valor" ? ' inputmode="decimal" style="text-align:right"' : "")+'>';
    ed = td.querySelector("input");
  }
  ed.focus();
  if (ed.select) ed.select();

  let terminado = false;
  const desistir = () => { if (terminado) return; terminado = true; td.innerHTML = original; };
  const gravar = () => {
    if (terminado) return;
    terminado = true;
    const bruto = ed.value;
    if (campo === "valor"){
      const v = Math.abs(parseNum(bruto));
      if (!(v > 0)){ td.innerHTML = original; toast("Valor inválido — nada mudou."); return; }
      alterar(() => { m.valor = v; });
    } else if (campo === "categoriaId"){
      alterar(() => { m.categoriaId = bruto; });
    } else {
      alterar(() => { m[campo] = bruto.trim(); });
    }
  };
  ed.addEventListener("keydown", (e) => {
    if (e.key === "Enter"){ e.preventDefault(); gravar(); }
    else if (e.key === "Escape"){ e.preventDefault(); desistir(); }
  });
  ed.addEventListener("blur", gravar);
  if (campo === "categoriaId") ed.addEventListener("change", gravar);
}

document.addEventListener("dblclick", (e) => {

/* Navegação das tabelas de movimentos pelo teclado: setas percorrem,
   Enter edita a descrição, Espaço seleciona, Delete elimina. */
document.addEventListener("keydown", (e) => {
  const tr = e.target.closest && e.target.closest("tr[data-mov]");
  if (!tr) return;
  const linhas = $$("tr[data-mov]");
  const i = linhas.indexOf(tr);
  if (e.key === "ArrowDown" && i < linhas.length - 1){ e.preventDefault(); linhas[i+1].focus(); }
  else if (e.key === "ArrowUp" && i > 0){ e.preventDefault(); linhas[i-1].focus(); }
  else if (e.key === "Enter"){
    const td = tr.querySelector('td[data-edit="descricao"]');
    if (td){ e.preventDefault(); editarCelula(td); }
  }
  else if (e.key === " "){
    const chk = tr.querySelector('input[data-act="movSel"]');
    if (chk){ e.preventDefault(); chk.checked = !chk.checked; ACOES.movSel(chk); }
  }
  else if (e.key === "Delete"){
    const btn = tr.querySelector('[data-act="movApagar"]');
    if (btn){ e.preventDefault(); btn.click(); }
  }
});

/** Ajuda de um KPI, pelo rótulo. Tenta exato e depois por prefixo. */
function ajudaKpi(rotulo){
  const r = String(rotulo || "").trim();
  if (AJUDAS_KPI[r]) return AJUDAS_KPI[r];
  for (const [pre, a] of AJUDAS_KPI_PREFIXO){
    if (r.indexOf(pre) === 0) return a;
  }
  return null;
}

/**
 * Ajuda aplicável a um elemento, subindo na árvore.
 * A ordem importa: o mais específico primeiro.
 */
function ajudaDe(el){
  if (!el || !el.closest) return null;

  const exp = el.closest("[data-ajuda]");
  if (exp) return exp.getAttribute("data-ajuda").split("§");

  // Nas etiquetas e nos `output`, a ajuda pertence ao campo a que se referem.
  const campo = el.closest("input,select,textarea,label.field,output,.ctrl");
  if (campo){
    const ids = [campo.getAttribute("for"), campo.id];
    if (campo.classList && campo.classList.contains("ctrl")){
      const dentro = campo.querySelector("[data-slider]");
      if (dentro) ids.push(dentro.id);
    }
    for (const id of ids) if (id && AJUDAS_CAMPO[id]) return AJUDAS_CAMPO[id];
  }

  const cab = el.closest("th[data-sort]");
  if (cab){
    const k = cab.dataset.sort + "." + cab.dataset.col;
    if (AJUDAS_COL[k]) return AJUDAS_COL[k];
  }

  const cartao = el.closest(".kpi");
  if (cartao){
    const lbl = cartao.querySelector(".lbl");
    const a = ajudaKpi(lbl ? lbl.textContent : "");
    if (a) return a;
  }

  const sep = el.closest("nav.tabs button[data-view]");
  if (sep && AJUDAS_VISTA[sep.dataset.view]) return AJUDAS_VISTA[sep.dataset.view];

  const acao = el.closest("[data-act]");
  if (acao && AJUDAS_ACAO[acao.dataset.act]) return AJUDAS_ACAO[acao.dataset.act];

  return null;
}

/** Elementos que podem ter ajuda — restringe a varredura ao que interessa. */
const SEL_AJUDAVEL = ".kpi, th[data-sort], nav.tabs button[data-view], label.field, .ctrl, [data-act], [data-ajuda]";

/**
 * Assinala visualmente o que tem explicação (cursor de ajuda) e remove o
 * `title` nativo desses elementos, para não haver duas dicas sobrepostas.
 */
function marcarAjudas(){
  if (S.ajudas === false) return;
  $$(SEL_AJUDAVEL).forEach(el => {
    if (!ajudaDe(el)) return;
    el.classList.add("temAjuda");
    if (el.hasAttribute("title")) el.removeAttribute("title");
  });
  // Os campos são marcados pelo id, porque a ajuda está associada ao input.
  // Também aqui se retira o `title` nativo: dois balões sobrepostos são pior
  // do que nenhum, e o explicador diz sempre mais.
  Object.keys(AJUDAS_CAMPO).forEach(id => {
    const n = document.getElementById(id);
    if (n){
      n.classList.add("temAjuda");
      if (n.hasAttribute("title")) n.removeAttribute("title");
      const lbl = document.querySelector('label[for="'+id+'"]');
      if (lbl){
        lbl.classList.add("temAjuda");
        if (lbl.hasAttribute("title")) lbl.removeAttribute("title");
      }
    }
  });
}

/** Desenha uma explicação em prosa na caixa flutuante. */
function mostrarAjuda(a, ev){
  const t = $("#tip");
  t.innerHTML = '<div class="tt">'+esc(a[0])+'</div>'+
    '<div class="txt">'+esc(a[1])+'</div>'+
    (a[2] ? '<div class="calc"><span>Cálculo</span> '+esc(a[2])+'</div>' : "");
  t.classList.add("show", "prosa");
  posicionarTip(ev);
}

/* Sugestão flutuante dos gráficos */
function posicionarTip(ev){
  const t = $("#tip");
  const r = t.getBoundingClientRect();
  let x = ev.clientX + 14, y = ev.clientY + 14;
  if (x + r.width > window.innerWidth - 8) x = ev.clientX - r.width - 14;
  if (y + r.height > window.innerHeight - 8) y = ev.clientY - r.height - 14;
  t.style.left = Math.max(8, x) + "px";
  t.style.top = Math.max(8, y) + "px";
}
document.addEventListener("pointermove", (e) => {
  const t = $("#tip");

  // Os valores dos gráficos têm prioridade: são mais específicos que a prosa.
  const el = e.target.closest ? e.target.closest("[data-tip]") : null;
  if (el){
    const dados = (el.getAttribute("data-tip") || "").split("§");
    t.innerHTML = '<div class="tt">'+esc(dados[0])+'</div>'+
      dados.slice(1).map(p => {
        const i = p.indexOf("=");
        return '<div class="tr"><span>'+esc(i < 0 ? p : p.slice(0,i))+'</span>'+
               '<span>'+esc(i < 0 ? "" : p.slice(i+1))+'</span></div>';
      }).join("");
    t.classList.add("show");
    t.classList.remove("prosa");
    posicionarTip(e);
    return;
  }

  if (S.ajudas !== false){
    const a = ajudaDe(e.target);
    if (a){ mostrarAjuda(a, e); return; }
  }
  t.classList.remove("show");
});
document.addEventListener("pointerleave", () => $("#tip").classList.remove("show"));
window.addEventListener("scroll", () => $("#tip").classList.remove("show"), {passive:true});
document.addEventListener("change", (e) => {
  const t = e.target;
  if (t.id === "fCat"){ filtros.categoria = t.value; render(); }
  else if (t.id === "fMembro"){ filtros.membro = t.value; render(); }
  else if (t.id === "fTipo"){ filtros.tipo = t.value; render(); }
  else if (t.id === "mvTipo" || t.id === "rcTipo" || t.id === "ctTipo"){
    // Ao mudar o tipo, recarregar as categorias compatíveis.
    const mapa = {mvTipo:"mvCat", rcTipo:"rcCat"};
    const alvo = mapa[t.id];
    if (alvo){
      const sel = $("#"+alvo);
      if (sel){
        const atual = sel.value;
        sel.innerHTML = '<option value="">— escolher —</option>' +
          S.categorias.filter(c => c.tipo === t.value)
            .map(c => '<option value="'+esc(c.id)+'">'+esc(c.nome)+'</option>').join("");
        sel.value = atual;
      }
    }
    if (t.id === "ctTipo"){
      const g = $("#ctGrupo");
      if (g) g.disabled = (t.value === "rendimento");
    }
  }
  // Ao mudar de classe/tipo, mostrar os valores típicos como sugestão
  else if (t.id === "ivClasse"){
    const cl = classeDe(t.value);
    const r = $("#ivRetorno"), q = $("#ivQueda");
    if (r) r.placeholder = String(cl.ret).replace(".",",") + " (classe)";
    if (q) q.placeholder = String(cl.queda).replace(".",",") + " (classe)";
  }
  /* Mudar a classe do ativo muda os campos aplicáveis (VPT, IUC, cotação…):
     repinta o formulário preservando o que já lá estava escrito. */
  else if (t.id === "ptTipo"){
    rascunhoAtivo = Object.assign(capturarAtivo(), {classe: t.value});
    render();
    rascunhoAtivo = null;
    const el = $("#ptTipo"); if (el) el.focus();
  }
  /* Estratégias: instrumento e opção «jovem» mudam só o resultado. Mudar o
     instrumento para/de PPR faz aparecer o controlo de idade, logo repinta. */
  else if (t.id === "estInstrumento"){
    const antes = S.estrategia.instrumento;
    S.estrategia.instrumento = t.value;
    guardarAdiado();
    if (antes === "ppr" || t.value === "ppr"){ render(); return; }
    const alvo = $("#estOut"); if (alvo) alvo.innerHTML = emPasse(estrategiaOut);
  }
  else if (t.id === "estJovem"){
    S.estrategia.jovemImt = t.checked;
    guardarAdiado();
    const alvo = $("#estOut"); if (alvo) alvo.innerHTML = emPasse(estrategiaOut);
  }
  /* A espécie muda a incidência sugerida e, nas prestações sociais, faz
     aparecer uma calculadora. Como isso altera a forma do formulário, é
     preciso repintá-lo — preservando o que já lá estava escrito. */
  /* Mudar a espécie ou um parâmetro da calculadora repinta o formulário
     (a forma muda), preservando o que já lá está. `capturarComponente` lê
     tudo o que estiver em ecrã de uma só vez. */
  else if (t.id === "cpEspecie"){
    const esp = especieDe(t.value);
    rascunhoComponente = Object.assign(capturarComponente(),
      {especie: t.value, frequencia: esp.freq, ss: esp.ss, irs: esp.irs});
    render();
    rascunhoComponente = null;
  }
  else if (CAMPOS_CALC_COMPONENTE.indexOf(t.id) >= 0){
    if (!editando.comp) return;
    rascunhoComponente = capturarComponente();
    render();
    rascunhoComponente = null;
  }
  // O regime de taxa muda os campos do formulário: repinta-o preservando o resto.
  else if (t.id === "crTipoTaxa"){
    const rascunho = {
      nome: $("#crNome").value, capital: parseNum($("#crCapital").value),
      prazoMeses: $("#crPrazo").value, inicio: $("#crInicio").value ? $("#crInicio").value+"-01" : "",
      tipoTaxa: t.value, ativoId: $("#crAtivo").value,
      seguroMensal: parseNum($("#crSeguro").value),
      indexante: $("#crIndexante") ? $("#crIndexante").value : "euribor6m",
      indexanteValor: $("#crIndexValor") ? parseNum($("#crIndexValor").value) : "",
      spread: $("#crSpread") ? parseNum($("#crSpread").value) : "",
      revisaoMeses: $("#crRevisao") ? $("#crRevisao").value : "",
      taxaAnual: $("#crTaxa") ? parseNum($("#crTaxa").value) : "",
      categoriaJurosId: $("#crCatJuros").value,
      categoriaCapitalId: $("#crCatCapital").value,
      categoriaSeguroId: $("#crCatSeguro").value,
    };
    rascunhoCredito = rascunho;
    render();
    rascunhoCredito = null;
  }
  else if (t.id === "fxEstadoCivil"){
    alterar(() => { S.fiscal.estadoCivil = t.value; });
  }
  else if (t.id === "fxRegiao"){
    alterar(() => { S.fiscal.regiao = t.value; });
  }
  else if (t.id === "crIndexante"){
    const r = $("#crRevisao");
    if (r) r.placeholder = (INDEXANTES[t.value] || INDEXANTES.euribor6m).revisao + " (indexante)";
  }
});
document.addEventListener("blur", (e) => {
  const t = e.target;
  if (t.classList && t.classList.contains("fiscalIn")){
    const k = t.dataset.k, v = parseNum(t.value);
    if (Math.abs(parseNum(S.fiscal[k]) - v) < 0.0005) return;
    alterar(() => {
      S.fiscal[k] = v;
      // O limite da dedução do PPR não é livre: deriva da idade do titular.
      if (k === "pprIdade") S.fiscal.pprLimiteAno = limitePPR(v);
    });
    return;
  }
  if (t.classList && t.classList.contains("limIn")){
    const id = t.dataset.id, v = parseNum(t.value);
    const antes = parseNum(S.limites[id]);
    if (Math.abs(antes - v) < 0.005) return;
    alterar(() => { if (v > 0) S.limites[id] = v; else delete S.limites[id]; });
  }
}, true);

/* Enter submete o formulário visível */
document.addEventListener("keydown", (e) => {
  if (e.key !== "Enter") return;
  const t = e.target;
  if (!(t.tagName === "INPUT" || t.tagName === "SELECT")) return;
  if (t.classList.contains("limIn")){ t.blur(); return; }
  const form = t.closest(".form");
  if (form){
    const btn = form.querySelector(".btn.primary[data-act]");
    if (btn){ e.preventDefault(); btn.click(); }
  } else if (t.id === "mbNome"){
    e.preventDefault(); ACOES.mbAdd();
  }
});

/* Tema — modo (auto/claro/escuro) e paleta de cor.
   As cores do quadro servem para pintar as amostras em Definições. */
const PALETAS = {
  meianoite: {lbl:"Meia-noite", claro:"#2f5fd0", escuro:"#7aa2ff"},
  oceano:    {lbl:"Oceano",     claro:"#0d7f91", escuro:"#4fc8dc"},
  floresta:  {lbl:"Floresta",   claro:"#2c7d44", escuro:"#6fd08c"},
  poente:    {lbl:"Pôr do sol", claro:"#c05621", escuro:"#ffa268"},
  ameixa:    {lbl:"Ameixa",     claro:"#7a3fc4", escuro:"#b78bff"},
  grafite:   {lbl:"Grafite",    claro:"#44546c", escuro:"#9db0ca"},
  areia:     {lbl:"Areia",      claro:"#8a6134", escuro:"#d9a75f"},
  pastel:    {lbl:"Pastel",     claro:"#c26a96", escuro:"#e8a7c6"},
};
/** O modo efetivamente em vigor, resolvendo o «auto» pela preferência do sistema. */
function modoEfetivo(){
  if (S.tema === "dark" || S.tema === "light") return S.tema;
  return (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light";
}
function aplicarTema(){
  document.documentElement.setAttribute("data-theme", S.tema || "auto");
  const p = PALETAS[S.paleta] ? S.paleta : "meianoite";
  if (p === "meianoite") document.documentElement.removeAttribute("data-paleta");
  else document.documentElement.setAttribute("data-paleta", p);
  if (S.densidade === "compacta") document.documentElement.setAttribute("data-densidade", "compacta");
  else document.documentElement.removeAttribute("data-densidade");
  if (S.texto === "grande" || S.texto === "maior") document.documentElement.setAttribute("data-texto", S.texto);
  else document.documentElement.removeAttribute("data-texto");
  if (S.contraste === "alto") document.documentElement.setAttribute("data-contraste", "alto");
  else document.documentElement.removeAttribute("data-contraste");
  const b = $("#temaBtn");
  b.textContent = S.tema === "dark" ? "☾" : S.tema === "light" ? "☀" : "◐";
  b.title = "Tema: " + (S.tema === "dark" ? "escuro" : S.tema === "light" ? "claro" : "automático");
}
/* Interruptor dos explicadores */
function aplicarAjudas(){
  const on = S.ajudas !== false;
  const b = $("#ajudaBtn");
  b.setAttribute("aria-pressed", String(on));
  b.style.opacity = on ? "1" : ".5";
  b.title = on ? "Explicadores ligados — clique para desligar"
               : "Explicadores desligados — clique para ligar";
  if (!on){
    $("#tip").classList.remove("show");
    $$(".temAjuda").forEach(el => el.classList.remove("temAjuda"));
  } else {
    marcarAjudas();
  }
}
$("#ajudaBtn").addEventListener("click", () => {
  S.ajudas = S.ajudas === false;
  guardar();
  aplicarAjudas();
  toast(S.ajudas === false ? "Explicadores desligados." : "Explicadores ligados.");
});

$("#temaBtn").addEventListener("click", () => {
  const ordem = ["auto","light","dark"];
  S.tema = ordem[(ordem.indexOf(S.tema || "auto") + 1) % 3];
  guardar(); aplicarTema();
});

      '<div class="row">'+
        '<div style="flex:1 1 100%"><button class="btn" style="width:100%" data-act="exportJSON">⬇ Exportar cópia (JSON)</button></div>'+

        '<div style="flex:1 1 100%"><button class="btn" style="width:100%" data-act="exportCSV">⬇ Movimentos (CSV)</button></div>'+

        '<div style="flex:1 1 100%"><button class="btn" style="width:100%" data-act="imprimir">🖨 Imprimir / guardar PDF</button></div>'+

  host.querySelector('[data-dlg="no"]').onclick = fechar;
  host.querySelector(".overlay").onclick = (ev) => { if (ev.target === ev.currentTarget) fechar(); };
  host.querySelectorAll("[data-act]").forEach(b => b.addEventListener("click", () => setTimeout(fechar, 30)));
});

document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && $("#modalHost").innerHTML) $("#modalHost").innerHTML = "";
});

/* ---------------------------------------------------------------
   Arranque
   --------------------------------------------------------------- */
carregar();
aplicarTema();
restaurarSessao();
render();
aplicarAjudas();

/* A sessão acompanha o que se vai fazendo, sem estorvar o que se escreve. */
document.addEventListener("input", guardarSessaoAdiado);
document.addEventListener("change", guardarSessaoAdiado);
window.addEventListener("beforeunload", guardarSessao);
document.addEventListener("visibilitychange", () => { if (document.hidden) guardarSessao(); });

if ("serviceWorker" in navigator && location.protocol.startsWith("http")){
  // Registo opcional: só funciona se existir sw.js junto do ficheiro.
  navigator.serviceWorker.register("./sw.js").catch(() => {});
}
