<!doctype html>
<html lang="pt" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orçamento Familiar</title>
<meta name="description" content="Ferramenta de cálculo e gestão do orçamento familiar — rendimentos, despesas, poupança, objetivos e créditos.">
<meta name="theme-color" content="#0f172a">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💶</text></svg>">
<style>
/* ============================================================
   Paleta e temas
   ============================================================ */
:root{
  --bg:#f4f6fa; --surface:#ffffff; --surface-2:#eef1f7; --surface-3:#e3e8f0;
  --border:#d8dee9; --text:#131a26; --muted:#5c6a80;
  --accent:#2f5fd0; --accent-soft:#e3ebfd;
  --pos:#0f7a4d; --pos-soft:#dff3e8;
  --neg:#c0392b;
  --warn:#b5730a; --warn-soft:#fdf0d8;
  --shadow:0 1px 2px rgba(15,23,42,.06),0 8px 24px rgba(15,23,42,.07);
  --radius:14px;
}
html[data-theme="dark"]{
  --bg:#0c1119; --surface:#141b26; --surface-2:#1b2431; --surface-3:#243044;
  --border:#2a3547; --text:#e8edf5; --muted:#95a3b8;
  --accent:#7aa2ff; --accent-soft:#1c2942;
  --pos:#4ade9b; --pos-soft:#12301f;
  --neg:#ff8a7a;
  --warn:#f0b64b; --warn-soft:#33270e;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);
}
@media (prefers-color-scheme:dark){
  html[data-theme="auto"]{
    --bg:#0c1119; --surface:#141b26; --surface-2:#1b2431; --surface-3:#243044;
    --border:#2a3547; --text:#e8edf5; --muted:#95a3b8;
    --accent:#7aa2ff; --accent-soft:#1c2942;
    --pos:#4ade9b; --pos-soft:#12301f;
    --neg:#ff8a7a;
    --warn:#f0b64b; --warn-soft:#33270e;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);
  }
}

/* ============================================================
   Paletas de cor — variações sobre o modo claro/escuro.
   Mudam o acento e a temperatura das superfícies; as cores
   semânticas (positivo, negativo, aviso) não mudam.
   ============================================================ */
/* Claro */
html[data-paleta="oceano"]{--accent:#0d7f91;--accent-soft:#dbf1f4;--bg:#f1f7f8}
html[data-paleta="floresta"]{--accent:#2c7d44;--accent-soft:#e1f2e6;--bg:#f2f7f3}
html[data-paleta="poente"]{--accent:#c05621;--accent-soft:#fbeadd;--bg:#faf6f1}
html[data-paleta="ameixa"]{--accent:#7a3fc4;--accent-soft:#efe6fa;--bg:#f7f4fa}
html[data-paleta="grafite"]{--accent:#44546c;--accent-soft:#e7ebf1;--bg:#f5f6f8}
/* Areia — bege quente até nas superfícies e no texto */
html[data-paleta="areia"]{--bg:#f4eee1;--surface:#fbf7ee;--surface-2:#f1e9d8;--surface-3:#e7dcc4;
  --border:#d8ccb2;--text:#2b241a;--muted:#7c6f59;--accent:#8a6134;--accent-soft:#f0e2ca}
/* Pastel — tons suaves e rosados */
html[data-paleta="pastel"]{--bg:#faf4f7;--surface:#fffdfe;--surface-2:#f7ecf2;--surface-3:#efdfe8;
  --border:#e4cfda;--muted:#7c6a75;--accent:#c26a96;--accent-soft:#fae5ef}
/* Escuro forçado */
html[data-theme="dark"][data-paleta="oceano"]{--bg:#091417;--surface:#101d21;--surface-2:#162629;--surface-3:#1f3237;--border:#2b444b;--accent:#4fc8dc;--accent-soft:#123037}
html[data-theme="dark"][data-paleta="floresta"]{--bg:#0b130d;--surface:#121c14;--surface-2:#18261b;--surface-3:#213225;--border:#2f4433;--accent:#6fd08c;--accent-soft:#143120}
html[data-theme="dark"][data-paleta="poente"]{--bg:#151009;--surface:#1e1710;--surface-2:#281f15;--surface-3:#34291c;--border:#463829;--accent:#ffa268;--accent-soft:#33210f}
html[data-theme="dark"][data-paleta="ameixa"]{--bg:#110d19;--surface:#191323;--surface-2:#211a2e;--surface-3:#2b233c;--border:#3b3152;--accent:#b78bff;--accent-soft:#251639}
html[data-theme="dark"][data-paleta="grafite"]{--accent:#9db0ca;--accent-soft:#222b38}
html[data-theme="dark"][data-paleta="areia"]{--bg:#171208;--surface:#211a0e;--surface-2:#2b2314;--surface-3:#382e1b;--border:#4b3f28;--text:#efe7d6;--muted:#b5a88c;--accent:#d9a75f;--accent-soft:#33270f}
html[data-theme="dark"][data-paleta="pastel"]{--bg:#171219;--surface:#211a23;--surface-2:#2b222e;--surface-3:#372c3b;--border:#4b3d4f;--muted:#b39fad;--accent:#e8a7c6;--accent-soft:#33202b}
/* Escuro por preferência do sistema */
@media (prefers-color-scheme:dark){
  html[data-theme="auto"][data-paleta="oceano"]{--bg:#091417;--surface:#101d21;--surface-2:#162629;--surface-3:#1f3237;--border:#2b444b;--accent:#4fc8dc;--accent-soft:#123037}
  html[data-theme="auto"][data-paleta="floresta"]{--bg:#0b130d;--surface:#121c14;--surface-2:#18261b;--surface-3:#213225;--border:#2f4433;--accent:#6fd08c;--accent-soft:#143120}
  html[data-theme="auto"][data-paleta="poente"]{--bg:#151009;--surface:#1e1710;--surface-2:#281f15;--surface-3:#34291c;--border:#463829;--accent:#ffa268;--accent-soft:#33210f}
  html[data-theme="auto"][data-paleta="ameixa"]{--bg:#110d19;--surface:#191323;--surface-2:#211a2e;--surface-3:#2b233c;--border:#3b3152;--accent:#b78bff;--accent-soft:#251639}
  html[data-theme="auto"][data-paleta="grafite"]{--accent:#9db0ca;--accent-soft:#222b38}
  html[data-theme="auto"][data-paleta="areia"]{--bg:#171208;--surface:#211a0e;--surface-2:#2b2314;--surface-3:#382e1b;--border:#4b3f28;--text:#efe7d6;--muted:#b5a88c;--accent:#d9a75f;--accent-soft:#33270f}
  html[data-theme="auto"][data-paleta="pastel"]{--bg:#171219;--surface:#211a23;--surface-2:#2b222e;--surface-3:#372c3b;--border:#4b3d4f;--muted:#b39fad;--accent:#e8a7c6;--accent-soft:#33202b}
}

/* ============================================================
   Base
   ============================================================ */
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--text);
  font-family:"Segoe UI","Avenir Next",system-ui,-apple-system,Roboto,sans-serif;
  font-size:15px; line-height:1.5; -webkit-text-size-adjust:100%;
}
h1,h2,h3,h4{margin:0;font-weight:650;letter-spacing:-.01em}
button{font:inherit;color:inherit}
a{color:var(--accent)}
.num{font-variant-numeric:tabular-nums}
.pos{color:var(--pos)} .neg{color:var(--neg)} .muted{color:var(--muted)}
.warn-txt{color:var(--warn);font-weight:600}
.hidden{display:none !important}

/* ============================================================
   Cabeçalho
   ============================================================ */
header{
  position:sticky; top:0; z-index:40;
  background:var(--surface); border-bottom:1px solid var(--border);
}
.topbar{
  display:flex; align-items:center; gap:12px; flex-wrap:wrap;
  padding:10px 16px; max-width:1240px; margin:0 auto;
}
.brand{display:flex;align-items:center;gap:9px;margin-right:auto;min-width:0}
.brand .logo{font-size:22px;line-height:1}
.brand h1{font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{display:block;font-size:11px;color:var(--muted);font-weight:400}
.topbar .grp{display:flex;align-items:center;gap:6px}

.btn{
  display:inline-flex;align-items:center;gap:6px;
  border:1px solid var(--border); background:var(--surface-2);
  border-radius:9px; padding:7px 12px; cursor:pointer;
  font-size:13.5px; font-weight:550; white-space:nowrap;
  transition:background .12s,border-color .12s,transform .06s;
}
.btn:hover{background:var(--surface-3)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--neg);border-color:var(--neg)}
.btn.sm{padding:4px 9px;font-size:12.5px;border-radius:7px}
.btn.icon{padding:7px 9px}
.btn[disabled]{opacity:.45;cursor:not-allowed}

input,select,textarea{
  font:inherit; color:var(--text); background:var(--surface);
  border:1px solid var(--border); border-radius:9px; padding:7px 10px; width:100%;
}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
input[type=checkbox]{width:auto}
label.field{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:3px}

/* Separadores */
nav.tabs{border-bottom:1px solid var(--border);background:var(--surface);overflow-x:auto}
nav.tabs .inner{display:flex;gap:2px;max-width:1240px;margin:0 auto;padding:0 12px}
nav.tabs button{
  background:none;border:0;border-bottom:2.5px solid transparent;
  padding:10px 13px;cursor:pointer;font-size:14px;font-weight:550;color:var(--muted);
  white-space:nowrap;
}
nav.tabs button:hover{color:var(--text)}
nav.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}

main{max-width:1240px;margin:0 auto;padding:18px 16px 80px}

/* ============================================================
   Cartões e grelhas
   ============================================================ */
.card{
  background:var(--surface); border:1px solid var(--border);
  border-radius:var(--radius); box-shadow:var(--shadow); padding:16px;
}
.card + .card{margin-top:16px}
.card h2{font-size:15px;margin-bottom:2px}
.card .sub{font-size:12.5px;color:var(--muted);margin-bottom:12px}
.card-head{display:flex;align-items:flex-start;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.card-head .t{margin-right:auto;min-width:0}
/* Título de secção dentro de um cartão */
h3.sec{
  font-size:13px;margin:18px 0 8px;color:var(--muted);
  text-transform:uppercase;letter-spacing:.04em;font-weight:650;
}
h3.sec:first-child{margin-top:0}
.card-head h3.sec{margin:0}

.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.row > *{flex:1 1 150px;min-width:0}
.row > .shrink{flex:0 0 auto}

/* KPIs */
.kpi{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:13px 15px;box-shadow:var(--shadow);
}
.kpi .lbl{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:650}
.kpi .val{font-size:24px;font-weight:700;margin-top:3px;font-variant-numeric:tabular-nums}
.kpi .hint{font-size:12px;color:var(--muted);margin-top:2px}
.kpi.accent{border-left:4px solid var(--accent)}
.kpi.good{border-left:4px solid var(--pos)}
.kpi.bad{border-left:4px solid var(--neg)}
.kpi.warnb{border-left:4px solid var(--warn)}

/* Tabelas */
.tblwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--border);vertical-align:middle}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:650;white-space:nowrap}
td.r,th.r{text-align:right}
.num,td.num,output{font-variant-numeric:tabular-nums}
tbody tr:nth-child(even){background:rgba(148,163,184,.055)}
tbody tr:hover{background:var(--surface-2)}
tfoot td{font-weight:700;border-top:2px solid var(--border);border-bottom:0}
.empty{padding:26px;text-align:center;color:var(--muted);font-size:14px}

/* Cabeçalhos ordenáveis */
th.sortable{cursor:pointer;user-select:none;transition:color .12s}
th.sortable:hover{color:var(--accent)}
th.sortable.on{color:var(--accent)}
th.sortable .seta{font-size:9px;letter-spacing:0}
th.sortable:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}

/* Comandos com deslizador */
.ctrl{display:flex;flex-direction:column;gap:3px}
.ctrl .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.ctrl .lbl{font-size:12px;font-weight:600;color:var(--muted)}
.ctrl output{font-size:13.5px;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums}
input[type=range]{
  -webkit-appearance:none;appearance:none;width:100%;height:22px;
  background:transparent;border:0;padding:0;cursor:pointer;
}
input[type=range]::-webkit-slider-runnable-track{height:5px;border-radius:999px;background:var(--surface-3)}
input[type=range]::-moz-range-track{height:5px;border-radius:999px;background:var(--surface-3)}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;appearance:none;width:16px;height:16px;border-radius:50%;
  background:var(--accent);border:2px solid var(--surface);margin-top:-6px;
  box-shadow:0 1px 4px rgba(0,0,0,.25);transition:transform .1s;
}
input[type=range]::-moz-range-thumb{
  width:16px;height:16px;border-radius:50%;background:var(--accent);
  border:2px solid var(--surface);box-shadow:0 1px 4px rgba(0,0,0,.25);
}
input[type=range]:active::-webkit-slider-thumb{transform:scale(1.2)}
input[type=range]:focus-visible{outline:2px solid var(--accent);outline-offset:4px;border-radius:4px}

/* Interruptor de segmentos */
.seg{display:inline-flex;border:1px solid var(--border);border-radius:9px;overflow:hidden;background:var(--surface-2)}
.seg button{
  background:none;border:0;padding:5px 11px;cursor:pointer;font-size:12.5px;font-weight:600;
  color:var(--muted);border-right:1px solid var(--border);
}
.seg button:last-child{border-right:0}
.seg button:hover{background:var(--surface-3);color:var(--text)}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}

/* Sugestão flutuante dos gráficos */
#tip{
  position:fixed;z-index:70;pointer-events:none;opacity:0;transition:opacity .12s;
  background:var(--surface);border:1px solid var(--border);border-radius:9px;
  box-shadow:var(--shadow);padding:8px 11px;font-size:12.5px;max-width:250px;
}
#tip.show{opacity:1}
#tip.prosa{max-width:330px;padding:11px 13px}
#tip .tt{font-weight:700;margin-bottom:3px;font-size:13px}
#tip .tr{display:flex;justify-content:space-between;gap:14px;font-variant-numeric:tabular-nums}
#tip .tr span:first-child{color:var(--muted)}
#tip .txt{color:var(--muted);line-height:1.45}
#tip .calc{
  margin-top:7px;padding-top:6px;border-top:1px solid var(--border);
  font-variant-numeric:tabular-nums;color:var(--text);
}
#tip .calc span{
  color:var(--accent);font-weight:650;font-size:10.5px;
  text-transform:uppercase;letter-spacing:.05em;margin-right:6px;
}

/* Assinala o que tem explicação, sem poluir a interface */
.temAjuda{cursor:help}
label.field.temAjuda{text-decoration:underline dotted var(--border) 1px;text-underline-offset:3px}
label.field.temAjuda:hover{text-decoration-color:var(--accent)}
.kpi.temAjuda:hover{border-color:var(--accent)}
@media (hover:none){.temAjuda{cursor:default}}

/* Gráficos interativos */
.chart [data-tip]{cursor:pointer}
.chart .slice{transition:opacity .15s,transform .15s;transform-origin:center}
.chart.dim .slice{opacity:.32}
.chart.dim .slice.on{opacity:1}
.chart .hit{fill:transparent}
.chart .hit:hover{fill:currentColor;fill-opacity:.05}
.chart .guia{opacity:0;transition:opacity .1s}
.chart .hit:hover ~ .guia{opacity:1}
.legend div[data-foco]{cursor:pointer;border-radius:6px;padding:1px 5px;margin:-1px -5px;transition:background .12s}
.legend div[data-foco]:hover{background:var(--surface-2)}
.legend div[data-foco].on{background:var(--accent-soft)}

/* Etiquetas */
.tag{
  display:inline-flex;align-items:center;gap:5px;
  padding:2px 8px;border-radius:999px;font-size:11.5px;font-weight:600;
  background:var(--surface-3);white-space:nowrap;
}
.dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto;display:inline-block}
.tag.g-necessidades{background:var(--accent-soft);color:var(--accent)}
.tag.g-desejos{background:var(--warn-soft);color:var(--warn)}
.tag.g-poupanca{background:var(--pos-soft);color:var(--pos)}

/* Barras de progresso */
.bar{height:9px;border-radius:999px;background:var(--surface-3);overflow:hidden;min-width:70px}
.bar > span{display:block;height:100%;border-radius:999px;transition:width .3s}
.barlbl{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:3px}

/* Formulários embutidos */
.form{background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:13px;margin-bottom:14px}
.form h3{font-size:13.5px;margin-bottom:10px}
.form .actions{display:flex;gap:8px;margin-top:11px;flex-wrap:wrap}

/* Notificação */
#toast{
  position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);
  background:var(--text);color:var(--bg);padding:9px 16px;border-radius:999px;
  font-size:13.5px;font-weight:600;opacity:0;pointer-events:none;transition:.22s;z-index:99;
  box-shadow:var(--shadow);max-width:90vw;text-align:center;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* Diálogo */
.overlay{
  position:fixed;inset:0;background:rgba(9,14,22,.55);z-index:80;
  display:flex;align-items:center;justify-content:center;padding:16px;
}
.dialog{
  background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);
  max-width:440px;width:100%;padding:20px;border:1px solid var(--border);
}
.dialog h3{font-size:16px;margin-bottom:8px}
.dialog p{margin:0 0 16px;color:var(--muted);font-size:14px}
.dialog .actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}

/* Gráficos */
.chart{width:100%;height:auto;display:block;overflow:visible}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:12px;font-size:13px}
.legend div{display:flex;align-items:center;gap:6px}
.legend .v{color:var(--muted);font-variant-numeric:tabular-nums}

/* Nota informativa */
.note{
  background:var(--surface-2);border:1px solid var(--border);border-left:3px solid var(--accent);
  border-radius:9px;padding:10px 13px;font-size:13px;color:var(--muted);
}
.note strong{color:var(--text)}

/* Micro-movimento — discreto, e desligado com prefers-reduced-motion */
@keyframes encherBarra{from{transform:scaleX(0)}}
.bar > span{transform-origin:left;animation:encherBarra .45s ease-out}
@keyframes surgirOverlay{from{opacity:0}}
@keyframes poparDialogo{from{opacity:0;transform:translateY(8px) scale(.98)}}
.overlay{animation:surgirOverlay .16s ease-out}
.dialog{animation:poparDialogo .18s ease-out}
@keyframes desenharAnel{from{stroke-dashoffset:var(--anel-c)}}
.anel-prog{animation:desenharAnel .6s ease-out}
@keyframes cairConfete{to{transform:translateY(105vh) rotate(680deg)}}
.confete{position:fixed;top:-14px;width:8px;height:12px;z-index:120;pointer-events:none;
  animation:cairConfete 2.3s ease-in forwards}

/* Ícones dos separadores */
nav.tabs .ticon{font-size:14px;margin-right:6px;opacity:.85}

/* Validação em linha */
input.invalido,select.invalido{border-color:var(--neg) !important;outline:1px solid var(--neg)}
.fielderr{color:var(--neg);font-size:12px;margin-top:3px}

/* Anel de progresso dos objetivos */
.anel{flex:0 0 auto}
.anel text{font-variant-numeric:tabular-nums}

/* Tendência nos KPIs */
.kpi .delta{display:inline-block;font-size:11.5px;font-weight:650;padding:1px 8px;border-radius:999px;
  margin-left:8px;vertical-align:2px;font-variant-numeric:tabular-nums}
.kpi .delta.pos{color:var(--pos);background:color-mix(in srgb,var(--pos) 14%,transparent)}
.kpi .delta.neg{color:var(--neg);background:color-mix(in srgb,var(--neg) 14%,transparent)}
.kpi .spark{width:100%;height:26px;margin-top:6px;display:block;opacity:.9}

/* Barras de comparação das estratégias */
.cbar{display:grid;grid-template-columns:minmax(90px,150px) minmax(0,1fr) 90px;gap:7px 10px;
  align-items:center;font-size:13px}
.cbar .trilho{background:var(--surface-3);border-radius:5px;height:14px;overflow:hidden}
.cbar .trilho > span{display:block;height:100%;border-radius:5px;transform-origin:left;animation:encherBarra .45s ease-out}
.cbar .v{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}

/* Dica do próximo passo */
.dica{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;
  background:color-mix(in srgb,var(--accent) 8%,var(--surface));border:1px solid var(--border);
  border-left:3px solid var(--accent);border-radius:var(--radius);padding:11px 14px;margin-bottom:16px;font-size:13.5px}

/* Botão de anulação no toast */
#toast button{background:none;border:0;color:var(--accent-2,#9db9ff);color:var(--bg);
  text-decoration:underline;font-weight:700;font-size:13.5px;cursor:pointer;margin-left:10px;padding:0}
#toast.show{pointer-events:auto}

/* Navegação inferior (móvel) */
#tabsMovel{display:none}

/* Paleta de comandos */
#paleta .overlay{align-items:flex-start;padding-top:12vh}
#paleta .caixa{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  box-shadow:var(--shadow);width:100%;max-width:520px;overflow:hidden}
#paleta input{width:100%;border:0;border-bottom:1px solid var(--border);border-radius:0;
  background:transparent;padding:13px 16px;font-size:15px}
#paleta ul{list-style:none;margin:0;padding:6px;max-height:46vh;overflow-y:auto}
#paleta li{padding:9px 12px;border-radius:8px;font-size:14px;cursor:pointer;display:flex;gap:10px;align-items:center}
#paleta li .ticon{opacity:.8}
#paleta li[aria-selected="true"]{background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--text)}
#paleta .tipo{margin-left:auto;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}

/* Indicador de gravação */
#estadoGuardado{font-size:11.5px;white-space:nowrap;min-width:0}
@media (max-width:640px){ #estadoGuardado{display:none} }

/* Relatório mensal */
.relatorio .capa{border-bottom:2px solid var(--border);padding-bottom:14px;margin-bottom:4px}
.relatorio .capa h1{font-size:22px;letter-spacing:-.02em}
.relatorio .capa .mes{font-size:16px;color:var(--accent);font-weight:650;margin-top:2px}
.relatorio .capa .sub{font-size:12.5px;color:var(--muted);margin-top:3px}
.relatorio .card{break-inside:avoid;page-break-inside:avoid;margin-bottom:14px}
.relatorio .card h2{font-size:15px;margin-bottom:9px}

/* Arranque por perfil */
.perfis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:9px;margin-top:6px}
.perfil{display:flex;flex-direction:column;gap:3px;text-align:left;cursor:pointer;
  background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius);
  padding:12px 13px;transition:border-color .12s,background .12s}
.perfil:hover{border-color:var(--accent);background:var(--surface-3)}
.perfil:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.perfil .pi{font-size:22px}
.perfil .pl{font-size:13.5px;font-weight:650}
.perfil .pd{font-size:11.5px;color:var(--muted);line-height:1.4}

/* Estados vazios ilustrados */
.vazio{text-align:center;padding:26px 18px;color:var(--muted)}
.vazio .ilu{width:100%;max-width:250px;height:auto;margin-bottom:12px;color:var(--muted)}
.vazio h3{font-size:15px;color:var(--text);margin-bottom:5px}
.vazio p{font-size:13px;max-width:430px;margin:0 auto 13px;line-height:1.55}

/* Seleção múltipla e ações em lote */
tr.selecionada > td{background:color-mix(in srgb,var(--accent) 11%,transparent)}
tr[data-mov]:focus{outline:2px solid var(--accent);outline-offset:-2px}
.lote{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:11px;
  background:var(--accent-soft);border:1px solid var(--border);border-radius:var(--radius);padding:9px 12px}
.lote .n{font-size:13.5px;font-weight:650;color:var(--accent);white-space:nowrap}
.lote select{flex:1 1 160px;min-width:0}
td[data-edit]{cursor:text}
td[data-edit]:hover{background:var(--surface-2)}
td[data-edit] input,td[data-edit] select{width:100%;padding:3px 6px;font-size:13.5px}

/* Barra com marca de ritmo */
.bar.comRitmo{position:relative;overflow:visible}
.bar.comRitmo > span{border-radius:999px}
.marcaRitmo{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--text);
  opacity:.5;border-radius:1px}

/* Mapa anual: categorias × meses */
.mapa{display:grid;gap:3px;font-size:10.5px;min-width:430px}
.mapa .mh{text-align:center;color:var(--muted);font-weight:650}
.mapa .mr{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;padding-right:6px;display:flex;align-items:center}
.mapa .mc{height:19px;border-radius:3px;background:var(--surface-3)}
.mapa .mc.hit{cursor:default}

/* Alertas e saúde dos dados */
.alertas{display:flex;flex-direction:column;gap:2px}
.alerta{display:flex;align-items:center;gap:11px;width:100%;text-align:left;
  background:none;border:0;border-radius:9px;padding:9px 10px;cursor:pointer;
  border-bottom:1px solid var(--border);transition:background .12s}
.alerta:last-child{border-bottom:0}
.alerta:hover{background:var(--surface-2)}
.alerta:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.alerta .ai{font-size:16px;flex:0 0 auto;width:18px;text-align:center}
.alerta .at{display:flex;flex-direction:column;gap:1px;min-width:0;flex:1 1 auto}
.alerta .t1{font-size:13.5px;font-weight:550}
.alerta .t2{font-size:12px;color:var(--muted)}
.alerta .av{color:var(--muted);font-size:12px;flex:0 0 auto;white-space:nowrap}

/* Teclas, pegas de arrasto */
kbd{background:var(--surface-3);border:1px solid var(--border);border-bottom-width:2px;
  border-radius:5px;padding:1px 6px;font-size:12px;font-family:inherit}
.pega{cursor:grab;color:var(--muted);user-select:none;font-size:13px}
tr.arrastando{opacity:.4}
tr.alvo-drop td{border-top:2px solid var(--accent)}

/* Calendário-mapa de calor dos movimentos */
.hmap-wrap{margin:4px 0 14px}
.hmap{display:grid;grid-template-columns:repeat(7,minmax(30px,44px));gap:4px}
.hmap .hdia{font-size:10.5px;text-transform:uppercase;color:var(--muted);text-align:center;font-weight:650}
.hmap .hcel{background:var(--surface-2);border:1px solid var(--border);border-radius:7px;
  min-height:30px;display:flex;align-items:center;justify-content:center;
  font-size:12px;font-variant-numeric:tabular-nums;color:var(--text)}
.hmap .hcel.hit{cursor:default}

/* Modo privacidade — os valores desfocam-se; as formas mantêm-se */
body.privado .num,body.privado .kpi .val,body.privado output,
body.privado .chart text,body.privado .cbar .v,body.privado .anel text,
body.privado .barlbl,body.privado .legend .v,body.privado #brandSub{
  filter:blur(5px);user-select:none}
body.privado .kpi .delta{filter:blur(5px)}

/* Tamanho do texto — escala tudo o que usa rem/em e o corpo */
html[data-texto="grande"] body{font-size:16.5px}
html[data-texto="grande"] th,html[data-texto="grande"] td{font-size:14.5px}
html[data-texto="grande"] .kpi .val{font-size:26px}
html[data-texto="maior"] body{font-size:18px}
html[data-texto="maior"] th,html[data-texto="maior"] td{font-size:16px}
html[data-texto="maior"] .kpi .val{font-size:28px}
html[data-texto="maior"] .kpi .lbl,html[data-texto="grande"] .kpi .lbl{font-size:12.5px}

/* Alto contraste — bordas e texto mais firmes, sem sombras a diluir */
html[data-contraste="alto"]{--border:#000;--muted:#3a3a3a;--shadow:none}
html[data-contraste="alto"][data-theme="dark"],
html[data-contraste="alto"] body{--shadow:none}
html[data-contraste="alto"] .card,html[data-contraste="alto"] .kpi,
html[data-contraste="alto"] .form,html[data-contraste="alto"] .note{border-width:2px}
html[data-contraste="alto"] th,html[data-contraste="alto"] td{border-bottom-color:var(--border)}
html[data-contraste="alto"] .btn{border-width:2px;font-weight:650}
html[data-contraste="alto"] tbody tr:nth-child(even){background:transparent}
html[data-contraste="alto"] .muted,html[data-contraste="alto"] .kpi .hint{color:var(--muted)}
@media (prefers-color-scheme:dark){
  html[data-contraste="alto"][data-theme="auto"]{--border:#fff;--muted:#d6d6d6}
}
html[data-contraste="alto"][data-theme="dark"]{--border:#fff;--muted:#d6d6d6}

/* Densidade compacta — mais linhas por ecrã */
html[data-densidade="compacta"] body{font-size:14px}
html[data-densidade="compacta"] th,html[data-densidade="compacta"] td{padding:5px 7px;font-size:13px}
html[data-densidade="compacta"] .card{padding:12px}
html[data-densidade="compacta"] .kpi{padding:9px 12px}
html[data-densidade="compacta"] .kpi .val{font-size:20px}
html[data-densidade="compacta"] .form{padding:10px}
html[data-densidade="compacta"] main{padding-top:12px}
html[data-densidade="compacta"] .card-head{margin-bottom:8px}

/* Amostras de paleta (Definições → Aparência) */
.paletas{display:flex;flex-wrap:wrap;gap:8px}
.amostra{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--border);
  background:var(--surface-2);border-radius:999px;padding:7px 14px 7px 9px;cursor:pointer;
  font-size:13px;font-weight:550;transition:border-color .12s,background .12s}
.amostra:hover{background:var(--surface-3)}
.amostra[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);
  background:var(--accent-soft)}
.amostra .pinta{width:16px;height:16px;border-radius:50%;flex:0 0 auto;
  box-shadow:inset 0 0 0 2px rgba(255,255,255,.25)}
.amostra:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Visita guiada */
#tutFundo{position:fixed;inset:0;background:rgba(9,14,22,.62);z-index:90;animation:surgirOverlay .16s ease-out}
.tut-alvo{position:relative;z-index:91;outline:3px solid var(--accent);outline-offset:4px;
  border-radius:8px;pointer-events:none}
@keyframes poparTutorial{from{opacity:0;transform:translate(-50%,8px) scale(.98)}}
#tutorial .tutcard{position:fixed;left:50%;transform:translateX(-50%);bottom:26px;z-index:95;
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  box-shadow:var(--shadow);max-width:500px;width:calc(100vw - 28px);padding:15px 18px;
  animation:poparTutorial .18s ease-out}
#tutorial h3{font-size:16px;margin:8px 0 6px}
#tutorial p{font-size:13.5px;color:var(--muted);margin:0 0 12px;line-height:1.55}
#tutorial p strong{color:var(--text)}
#tutorial .tutacts{display:flex;gap:8px;align-items:center}
#tutorial .tutacts .esp{flex:1 1 auto}
.tutprog{height:4px;border-radius:99px;background:var(--surface-3);overflow:hidden}
.tutprog > span{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .25s}

@media (max-width:640px){
  .topbar{padding:9px 12px;gap:8px}
  .brand h1{font-size:15px}
  main{padding:14px 11px 84px}
  .card{padding:13px}
  .kpi .val{font-size:21px}
  th,td{padding:7px 8px;font-size:13.5px}
  nav.tabs{display:none}
  #tabsMovel{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:70;
    background:var(--surface);border-top:1px solid var(--border);
    padding:4px max(6px,env(safe-area-inset-left)) max(6px,env(safe-area-inset-bottom))}
  #tabsMovel button{flex:1 1 0;background:none;border:0;color:var(--muted);font-size:11px;
    display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:9px;cursor:pointer}
  #tabsMovel button .ticon{font-size:19px}
  #tabsMovel button[aria-selected="true"]{color:var(--accent)}
  #tabsMovel button:focus-visible{outline:2px solid var(--accent)}
  #folhaMais{position:fixed;left:8px;right:8px;bottom:64px;z-index:71;background:var(--surface);
    border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);
    display:flex;flex-wrap:wrap;gap:4px;padding:8px}
  #folhaMais button{flex:1 1 40%;background:var(--surface-2);border:1px solid var(--border);
    border-radius:9px;color:var(--text);padding:10px;font-size:13px;cursor:pointer}
  #folhaMais button[aria-selected="true"]{border-color:var(--accent);color:var(--accent)}
  #tutorial .tutcard{bottom:84px}
}

/* Tabelas em cartões, nos ecrãs estreitos */
@media (max-width:480px){
  .tblcards table,.tblcards tbody,.tblcards tr,.tblcards td{display:block}
  .tblcards thead{display:none}
  .tblcards tbody tr{border:1px solid var(--border);border-radius:11px;margin-bottom:9px;
    padding:9px 11px;background:var(--surface-2)}
  .tblcards tbody tr:nth-child(even){background:var(--surface-2)}
  .tblcards td{border-bottom:0;padding:2.5px 0;display:flex;justify-content:space-between;
    align-items:center;gap:10px;text-align:right}
  .tblcards td.r{text-align:right}
  .tblcards td[data-lbl]::before{content:attr(data-lbl);font-size:11px;text-transform:uppercase;
    letter-spacing:.04em;color:var(--muted);font-weight:650;text-align:left;flex:0 0 auto}
  .tblcards td:not([data-lbl]){justify-content:flex-end}
  .tblcards tfoot td{border-top:0}
}

@media print{
  header,nav.tabs,.no-print,#toast,#tabsMovel,#folhaMais,#paleta,#tutorial,#tutFundo{display:none !important}
  body{background:#fff;color:#000;font-size:11.5pt}
  .card{box-shadow:none;border:1px solid #bbb;break-inside:avoid;page-break-inside:avoid}
  main{max-width:none;padding:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}
</style>
</head>
<body>

<header>
  <div class="topbar">
    <div class="brand">
      <span class="logo" aria-hidden="true">💶</span>
      <div>
        <h1>Orçamento Familiar</h1>
        <small id="brandSub">Gestão e cálculo do orçamento do agregado</small>
      </div>
    </div>
    <div class="grp">
      <label class="field hidden" for="mesSel">Mês</label>
      <input type="month" id="mesSel" style="width:160px" aria-label="Mês em análise">
      <button class="btn icon" id="mesPrev" title="Mês anterior" aria-label="Mês anterior">‹</button>
      <button class="btn icon" id="mesNext" title="Mês seguinte" aria-label="Mês seguinte">›</button>
    </div>
    <div class="grp">
      <span id="estadoGuardado" class="muted" aria-live="polite"></span>
      <button class="btn icon" data-act="desfazer" aria-label="Desfazer" disabled>↶</button>
      <button class="btn icon" data-act="refazer" aria-label="Refazer" disabled>↷</button>
      <button class="btn icon" data-act="privAlternar" title="Modo privacidade — desfoca os valores" aria-label="Modo privacidade" aria-pressed="false">👁</button>
      <button class="btn icon" data-act="tutorialIniciar" title="Visita guiada" aria-label="Visita guiada">🎓</button>
      <button class="btn icon" id="ajudaBtn" aria-label="Explicadores" aria-pressed="true">?</button>
      <button class="btn icon" id="temaBtn" title="Alternar tema" aria-label="Alternar tema">◐</button>
      <button class="btn" id="menuBtn" aria-haspopup="true">Dados ▾</button>
    </div>
  </div>
</header>

<nav class="tabs">
  <div class="inner" role="tablist" id="tabs">
    <button role="tab" data-view="painel" aria-selected="true"><span class="ticon" aria-hidden="true">📊</span>Painel</button>
    <button role="tab" data-view="rendimentos" aria-selected="false"><span class="ticon" aria-hidden="true">💶</span>Rendimentos</button>
    <button role="tab" data-view="despesas" aria-selected="false"><span class="ticon" aria-hidden="true">🧾</span>Despesas</button>
    <button role="tab" data-view="ativos" aria-selected="false"><span class="ticon" aria-hidden="true">🏦</span>Ativos</button>
    <button role="tab" data-view="creditos" aria-selected="false"><span class="ticon" aria-hidden="true">🏠</span>Créditos</button>
    <button role="tab" data-view="objetivos" aria-selected="false"><span class="ticon" aria-hidden="true">🎯</span>Objetivos</button>
    <button role="tab" data-view="estrategias" aria-selected="false"><span class="ticon" aria-hidden="true">📈</span>Estratégias</button>
    <button role="tab" data-view="config" aria-selected="false"><span class="ticon" aria-hidden="true">⚙️</span>Definições</button>
  </div>
</nav>

<nav id="tabsMovel" class="no-print" aria-label="Navegação principal">
  <button data-view="painel" aria-selected="true"><span class="ticon" aria-hidden="true">📊</span>Painel</button>
  <button data-view="rendimentos" aria-selected="false"><span class="ticon" aria-hidden="true">💶</span>Rendimentos</button>
  <button data-view="despesas" aria-selected="false"><span class="ticon" aria-hidden="true">🧾</span>Despesas</button>
  <button data-view="ativos" aria-selected="false"><span class="ticon" aria-hidden="true">🏦</span>Ativos</button>
  <button id="btnMais" aria-expanded="false"><span class="ticon" aria-hidden="true">⋯</span>Mais</button>
</nav>
<div id="folhaMais" class="no-print" hidden>
  <button data-view="creditos">🏠 Créditos</button>
  <button data-view="objetivos">🎯 Objetivos</button>
  <button data-view="estrategias">📈 Estratégias</button>
  <button data-view="config">⚙️ Definições</button>
</div>

<main id="app"></main>

<div id="toast" role="status" aria-live="polite"></div>
<div id="tip" role="tooltip"></div>
<div id="modalHost"></div>
<div id="paleta"></div>
<div id="tutorial"></div>

<script>
"use strict";
/* ================================================================
   Orçamento Familiar — aplicação de ficheiro único
   Sem dependências externas. Dados guardados no navegador
   (localStorage) e exportáveis para JSON/CSV.
   ================================================================ */

const STORE_KEY = "orcamento-familiar-v1";
const APP_VERSION = 1;

/* ---------------------------------------------------------------
   Utilitários
   --------------------------------------------------------------- */
const $  = (sel, root) => (root || document).querySelector(sel);
const $$ = (sel, root) => Array.from((root || document).querySelectorAll(sel));

const uid = (p) => p + "-" + Math.random().toString(36).slice(2, 9);

/** Escapa texto para interpolação segura em HTML. */
function esc(v){
  return String(v == null ? "" : v)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}

const fmtEUR = new Intl.NumberFormat("pt-PT",{style:"currency",currency:"EUR"});
const fmtEUR0 = new Intl.NumberFormat("pt-PT",{style:"currency",currency:"EUR",maximumFractionDigits:0});
const fmtNum = new Intl.NumberFormat("pt-PT",{minimumFractionDigits:2,maximumFractionDigits:2});

const eur  = (n) => fmtEUR.format(Number.isFinite(n) ? n : 0);
const eur0 = (n) => fmtEUR0.format(Number.isFinite(n) ? n : 0);
const pct  = (n) => (Number.isFinite(n) ? n : 0).toLocaleString("pt-PT",{maximumFractionDigits:1}) + "%";

/**
 * Aceita "1.234,56", "1234.56", "20.000" e "20,5".
 * Com vírgula presente, o ponto é separador de milhares. Sem vírgula, só se
 * tratam os pontos como milhares quando o padrão é inequívoco (grupos de três).
 */
function parseNum(v){
  if (typeof v === "number") return Number.isFinite(v) ? v : 0;
  if (v == null) return 0;
  let s = String(v).trim().replace(/[\s €]/g,"");
  if (!s) return 0;
  const neg = s.charAt(0) === "-";
  s = s.replace(/^[+-]/,"");
  if (s.includes(",")){
    s = s.replace(/\./g,"").replace(",",".");
  } else if (/^\d{1,3}(\.\d{3})+$/.test(s)){
    s = s.replace(/\./g,"");
  }
  const n = parseFloat(s);
  return Number.isFinite(n) ? (neg ? -n : n) : 0;
}

const hoje = () => new Date();
const isoDia = (d) => {
  const dt = d instanceof Date ? d : new Date(d);
  return dt.getFullYear() + "-" + String(dt.getMonth()+1).padStart(2,"0") + "-" + String(dt.getDate()).padStart(2,"0");
};
const isoMes = (d) => isoDia(d).slice(0,7);
const mesDoDia = (dia) => String(dia || "").slice(0,7);

const MESES = ["janeiro","fevereiro","março","abril","maio","junho",
               "julho","agosto","setembro","outubro","novembro","dezembro"];

function mesLabel(m, curto){
  if (!m || m.length < 7) return "—";
  const [a,mm] = m.split("-").map(Number);
  const nome = MESES[mm-1] || "";
  return curto ? (nome.slice(0,3) + "/" + String(a).slice(2)) : (nome + " de " + a);
}
/** Desloca um mês "YYYY-MM" em n meses. */
function mesShift(m, n){
  const [a,mm] = m.split("-").map(Number);
  const d = new Date(a, mm - 1 + n, 1);
  return isoMes(d);
}
/** Número de meses entre dois "YYYY-MM" (b - a). */
function mesDiff(a, b){
  const [a1,m1] = a.split("-").map(Number);
  const [a2,m2] = b.split("-").map(Number);
  return (a2-a1)*12 + (m2-m1);
}

/* Frequências das rubricas recorrentes → fator mensal */
const FREQ = {
  mensal:     {lbl:"Mensal",              f:1},
  semanal:    {lbl:"Semanal",             f:52/12},
  quinzenal:  {lbl:"Quinzenal",           f:26/12},
  bimestral:  {lbl:"Bimestral (2 meses)", f:1/2},

  /* Acréscimo mensal por criança com menos de 36 meses, quando o agregado
     tem duas ou mais nessa condição. Índices por escalão (1.º a 5.º). */
  menos36: {
    duas:     [64.96,  57.64, 54.35, 39.28, 0],
    maisDuas: [106.96, 92.32, 85.76, 55.70, 0],
  },

  deficiencia: [

/** Escalão do abono a partir do rendimento de referência anual. */
const escalaoAbono = (rendimentoReferencia) =>
  ABONO_FAMILIA.escaloes.find(e => parseNum(rendimentoReferencia) <= e.ate) ||
  ABONO_FAMILIA.escaloes[ABONO_FAMILIA.escaloes.length - 1];

/**
 * Acréscimo mensal por criança com menos de 36 meses, quando o agregado tem
 * duas ou mais. Só há majoração a partir da segunda; abaixo disso, zero.
 */
function acrescimoMenos36(numCriancasMenos36, escalaoN){
  const n = Math.round(parseNum(numCriancasMenos36));
  if (n < 2 || escalaoN >= 5) return 0;
  const tabela = n === 2 ? ABONO_FAMILIA.menos36.duas : ABONO_FAMILIA.menos36.maisDuas;
  return tabela[escalaoN - 1] || 0;
}

/** Bonificação por deficiência, pela idade em meses. */
function bonificacaoDeficiencia(idadeMeses, monoparental){
  const anos = parseNum(idadeMeses) / 12;
  const faixa = ABONO_FAMILIA.deficiencia.find(d => anos <= d.ateAnos);
  if (!faixa) return 0;
  const mono = monoparental ? 1 + ABONO_FAMILIA.majoracaoMonoparental/100 : 1;
  return faixa.valor * mono;
}

/* Situações familiares que determinam qual das tabelas se aplica. */
const ESTADOS_CIVIS = {
  nao_casado: {lbl:"Não casado"},
  casado_2:   {lbl:"Casado, dois titulares"},
  casado_1:   {lbl:"Casado, único titular"},
};

/** Região fiscal em vigor; o Continente é o recurso se nada estiver definido. */
const regiaoRF = () =>
  TABELAS_RF.regioes[S.fiscal && S.fiscal.regiao] ? S.fiscal.regiao : "continente";
/** Uma tabela concreta, na região em vigor. */
const tabRF = (chave, regiao) => {
  const r = TABELAS_RF.regioes[regiao || regiaoRF()];
  return r ? r.t[chave] : null;
};

/**
 * Escolhe a tabela de retenção aplicável.
 * `cat` é "A" (trabalho dependente) ou "H" (pensões).
 * As tabelas de pensões não têm parcela por dependente — a coluna que
 * existe nas tabelas X e XI é a de deficiente das Forças Armadas.
 * A escolha da tabela é igual nas três regiões: o que muda são os números.
 */
function tabelaRF(cat, estadoCivil, dependentes, deficiencia){
  const dep = Math.max(0, Math.round(parseNum(dependentes)));
  const ec = ESTADOS_CIVIS[estadoCivil] ? estadoCivil : "nao_casado";
  if (cat === "H"){
    if (deficiencia) return ec === "casado_1" ? "XI" : "X";
    return ec === "casado_1" ? "IX" : "VIII";
  }
  if (deficiencia){
    if (ec === "casado_1") return "VII";
    if (ec === "casado_2") return dep > 0 ? "VI" : "IV";
    return dep > 0 ? "V" : "IV";
  }
  if (ec === "casado_1") return "III";
  if (ec === "casado_2") return "I";
  return dep > 0 ? "II" : "I";
}

/** Escalão aplicável a uma remuneração, dentro de uma tabela. */
function escalaoRF(tab, remuneracao){
  const R = Math.max(0, parseNum(remuneracao));
  const e = tab.e;
  for (let k = 0; k < e.length; k++){
    if (!e[k].sup && R <= e[k].a) return e[k];
  }
  return e[e.length - 1];   // o «superior a»
}

/**
 * Retenção sobre um pagamento, pela tabela oficial.
 *   retenção = R × taxa − parcela a abater − (parcela por dependente × nº)
 * A parcela a abater é fixa na maioria dos escalões e, nos primeiros,
 * dada por coef × fator × (limiar − R).
 * Nunca devolve negativo: a retenção é zero, não um crédito.
 */
function retencaoRF(remuneracao, chaveTabela, dependentes, regiao){
  const tab = tabRF(chaveTabela, regiao);
  const R = Math.max(0, parseNum(remuneracao));
  if (!tab || R <= 0) return 0;
  const esc = escalaoRF(tab, R);
  const parcela = Array.isArray(esc.p)
    ? esc.p[0] * esc.p[1] * (esc.p[2] - R)
    : parseNum(esc.p);
  const porDep = (tab.dep === "dep" ? parseNum(esc.d) : 0) * Math.max(0, Math.round(parseNum(dependentes)));
  return Math.max(0, R * parseNum(esc.t) - parcela - porDep);
}
/** Taxa efetiva de retenção sobre um pagamento (%). */
const taxaRF = (remuneracao, chaveTabela, dependentes, regiao) => {
  const R = Math.max(0, parseNum(remuneracao));
  return R > 0 ? retencaoRF(R, chaveTabela, dependentes, regiao) / R * 100 : 0;
};

   --------------------------------------------------------------- */
/** Cabeçalho clicável. `cols` mapeia coluna → função de extração. */
function th(tabela, col, rotulo, classe){
  const o = ordem[tabela];
  const ativo = o && o.col === col;
  const seta = ativo ? (o.dir === 1 ? " ▲" : " ▼") : "";
  return '<th class="sortable '+(classe || "")+(ativo ? " on" : "")+
    '" data-sort="'+esc(tabela)+'" data-col="'+esc(col)+'" role="button" tabindex="0">'+
    esc(rotulo)+'<span class="seta">'+seta+'</span></th>';
}
/** Ordena uma lista segundo o estado da tabela; `cols` são os extratores. */
function ordenado(lista, tabela, cols, omissao){
  const o = ordem[tabela] || omissao;
  if (!o || !cols[o.col]) return lista;
  const get = cols[o.col];
  return lista.slice().sort((a,b) => {
    const va = get(a), vb = get(b);
    let c;
    if (typeof va === "number" && typeof vb === "number") c = va - vb;
    else c = String(va == null ? "" : va).localeCompare(String(vb == null ? "" : vb), "pt");
    return c * o.dir;
  });
}
