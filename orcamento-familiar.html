      '<h2>'+esc(def.icone)+' '+esc(def.lbl)+'</h2>'+
      '<div class="sub">'+esc(def.desc)+'</div></div>'+
      '<div class="no-print" style="white-space:nowrap">'+
        '<input type="month" data-act="eseMes" data-i="'+i+'" value="'+esc(ev.mes)+'" '+
          'aria-label="Mês de início" style="width:auto;display:inline-block"> '+
        '<button class="btn sm ghost" data-act="eseRemover" data-i="'+i+'" title="Remover">✕</button>'+
      '</div></div>'+
      '<div class="grid g2">'+def.params.map(par =>
        '<div class="ctrl"><div class="top"><span class="lbl">'+esc(par.lbl)+
          (par.pontual ? ' <span class="tag">uma vez</span>' : '')+'</span>'+
          '<output id="ese'+i+'_'+esc(par.k)+'Out">'+
            esc(par.meses ? p[par.k]+" meses" : par.pct ? pct(p[par.k]) : eur(p[par.k]))+'</output></div>'+
        '<input type="range" data-ese="'+i+'" data-p="'+esc(par.k)+'" '+
          'data-sufixo="'+(par.meses ? " meses" : par.pct ? "%" : " €")+'" '+
          'min="'+par.min+'" max="'+par.max+'" step="'+par.passo+'" value="'+esc(p[par.k])+'" '+
          'aria-label="'+esc(par.lbl)+'" aria-valuetext="'+
            esc(par.meses ? p[par.k]+" meses" : par.pct ? pct(p[par.k]) : eur(p[par.k]))+'"></div>').join("")+
      '</div></div>';
  }).join('<div style="height:14px"></div>');

  return escolha + '<div style="height:16px"></div>' + cartoes +
    '<div style="height:16px"></div><div id="eseOut">'+ eseResultado() +'</div>';
}

/** O resultado do cenário, isolado para os deslizadores o repintarem só a ele. */
function eseResultado(){
  const cen = ui.cenarioVida || {eventos: [], meses: 24};
  const eventos = cen.eventos || [];
  if (!eventos.length) return "";
  const c = compararCenario(eventos, cen.meses || 24);

  const difSaldo = c.saldoDepois - c.saldoAntes;
  const corSaldo = c.saldoDepois >= 0 ? (difSaldo >= 0 ? "good" : "warnb") : "bad";

  // Gráfico: as duas tesourarias sobrepostas
  const W = 720, H = 210, padL = 62, padR = 14, padT = 14, padB = 28;
  const iw = W - padL - padR, ih = H - padT - padB;
  const vals = c.real.map(x => x.acumulado).concat(c.cen.map(x => x.acumulado)).concat([0]);
  const max = Math.max(...vals), min = Math.min(...vals);
  const amp = (max - min) || 1;
  const x = (i) => padL + (i / Math.max(1, c.meses - 1)) * iw;
  const y = (v) => padT + ih - ((v - min) / amp) * ih;

  let grelha = "";
  for (let g = 0; g <= 3; g++){
    const v = min + amp * g / 3, yy = y(v);
    grelha += '<line x1="'+padL+'" y1="'+yy.toFixed(1)+'" x2="'+(W-padR)+'" y2="'+yy.toFixed(1)+
      '" stroke="currentColor" opacity=".12"/>'+
      '<text x="'+(padL-7)+'" y="'+(yy+4).toFixed(1)+'" text-anchor="end" font-size="10" fill="currentColor" opacity=".55">'+
      esc(eur0(v))+'</text>';
  }
  const linhaZero = (min < 0 && max > 0)
    ? '<line x1="'+padL+'" y1="'+y(0).toFixed(1)+'" x2="'+(W-padR)+'" y2="'+y(0).toFixed(1)+
      '" stroke="var(--neg)" stroke-width="1.5" stroke-dasharray="4 3" opacity=".8"/>' : "";
  const pontos = (serie) => serie.map((s,i) => x(i).toFixed(1)+","+y(s.acumulado).toFixed(1)).join(" ");
  const areaCen = '<polygon fill="var(--accent)" opacity=".13" points="'+
    padL+','+y(Math.max(min,0)).toFixed(1)+' '+pontos(c.cen)+' '+(padL+iw).toFixed(1)+','+y(Math.max(min,0)).toFixed(1)+'"/>';

  let eixo = "", zonas = "";
  const passo = Math.ceil(c.meses / 8) || 1;
  c.cen.forEach((s,i) => {
    zonas += '<rect class="hit" x="'+(x(i) - iw/c.meses/2).toFixed(1)+'" y="'+padT+'" width="'+
      (iw/c.meses).toFixed(1)+'" height="'+ih+'"'+
      tipData(mesLabel(s.mes), [["No cenário", eur(s.acumulado)], ["Como está hoje", eur(c.real[i].acumulado)],
        ["Diferença", eur(s.acumulado - c.real[i].acumulado)]].concat(
        s.pontual > 0 ? [["Encargo pontual", eur(s.pontual)]] : []))+'/>';
    if (i % passo === 0) eixo += '<text x="'+x(i).toFixed(1)+'" y="'+(H-8)+
      '" text-anchor="middle" font-size="10" fill="currentColor" opacity=".6">'+
      esc(mesLabel(s.mes, true))+'</text>';
  });
  const marcaRutura = c.rutura
    ? '<circle cx="'+x(c.cen.indexOf(c.rutura)).toFixed(1)+'" cy="'+y(c.rutura.acumulado).toFixed(1)+
      '" r="5" fill="var(--neg)"/>' : "";

  const veredicto = c.rutura
    ? {txt:"A tesouraria fica negativa em "+mesLabel(c.rutura.mes)+" ("+eur(c.rutura.acumulado)+")"+
         (c.ruturaReal ? " — mas já ficaria em "+mesLabel(c.ruturaReal.mes)+" sem este cenário." : "."),
       cor:"var(--neg)"}
    : {txt:"A tesouraria aguenta os "+c.meses+" meses. No fim ficam "+eur(c.fimCen)+
         " ("+(c.fimCen - c.fimReal >= 0 ? "+" : "")+eur(c.fimCen - c.fimReal)+" face a hoje).",
       cor: c.fimCen >= c.fimReal ? "var(--pos)" : "var(--warn)"};

  return '<div class="card"><div class="card-head"><div class="t"><h2>O que muda</h2>'+
    '<div class="sub">Os indicadores referem-se a <strong>'+esc(mesLabel(c.mesRegime))+'</strong>, quando o '+
    'cenário está em pleno. No gráfico, o cenário a cheio e o presente a tracejado.</div></div>'+
    '<span class="seg no-print">'+[12,24,36].map(n =>
      '<button data-act="eseHorizonte" data-v="'+n+'" aria-pressed="'+((cen.meses||24) === n)+'">'+n+'m</button>').join("")+
    '</span></div>'+
    '<div class="grid g4" style="margin-bottom:14px">'+
      kpi("Saldo mensal", eur(c.saldoDepois),
          (difSaldo >= 0 ? "+" : "")+eur(difSaldo)+" face a hoje", corSaldo)+
      kpi("Rendimento", eur(c.rendDepois),
          (c.rendDepois - c.rendAntes >= 0 ? "+" : "")+eur(c.rendDepois - c.rendAntes), "good")+
      kpi("Despesa", eur(c.despDepois),
          (c.despDepois - c.despAntes >= 0 ? "+" : "")+eur(c.despDepois - c.despAntes), "bad")+
      kpi("Encargos pontuais", eur(c.pontualTotal), "Entradas, mudanças, enxoval", "warnb")+
    '</div>'+
    '<div class="tblwrap"><svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" '+
      'aria-label="Tesouraria no cenário face à atual">'+
      grelha + linhaZero + areaCen +
      '<polyline fill="none" stroke="var(--muted)" stroke-width="1.8" stroke-dasharray="5 4" points="'+pontos(c.real)+'"/>'+
      '<polyline fill="none" stroke="var(--accent)" stroke-width="2.6" stroke-linejoin="round" points="'+pontos(c.cen)+'"/>'+
      marcaRutura + eixo + zonas + '</svg></div>'+
    '<div class="legend">'+
      '<div><span class="dot" style="background:var(--accent)"></span><span>No cenário</span></div>'+
      '<div><span class="dot" style="background:var(--muted)"></span><span>Como está hoje</span></div>'+
    '</div>'+
    '<div style="font-size:13px;margin-top:10px;color:'+veredicto.cor+'">'+esc(veredicto.txt)+'</div>'+
    (c.detalhe.length
      ? '<div class="tblwrap" style="margin-top:12px"><table><thead><tr><th>O que muda</th>'+
        '<th class="r">Efeito</th></tr></thead><tbody>'+
        c.detalhe.map(d => '<tr><td>'+esc(d.nome)+
          (d.umaVez ? ' <span class="tag">uma vez</span>' : '')+'</td>'+
          '<td class="r num '+(d.valor >= 0 ? "pos" : "neg")+'">'+(d.valor >= 0 ? "+" : "")+
          esc(eur(d.valor))+(d.umaVez ? '' : '/mês')+'</td></tr>').join("")+
        '</tbody></table></div>' : "")+
    '<div class="note no-print" style="margin-top:12px">Isto é uma simulação: os seus dados não mudaram. '+
    'Para tornar um cenário real, crie as rubricas em <strong>Despesas fixas</strong> — ou use '+
    '<strong>Planear despesa</strong> para os encargos pontuais.</div>'+
    '</div>';
}

/* ---------------------------------------------------------------
   Guardar como aplicação

   Instalada, a ferramenta ganha janela própria sem barra de endereço,
   ícone no ecrã principal ou no menu, e abre offline. Os dados são os
   mesmos — o armazenamento é do mesmo sítio — mas convém dizê-lo, que é
   a primeira dúvida de quem instala.

   Cada navegador convida à sua maneira, e nenhum deixa a aplicação
   convidar sozinha: o Chrome e o Edge disparam `beforeinstallprompt`, e
   aí há botão; o Safari não tem convite nenhum e só resta explicar o
   caminho. Onde não se pode, diz-se o que fazer em vez de fingir.
   --------------------------------------------------------------- */
let _conviteInstalar = null;   // o convite adiado, quando o navegador o dá
let _instalada = false;        // confirmada nesta sessão

const emAplicacao = () =>
  _instalada ||
  (window.matchMedia && matchMedia("(display-mode: standalone)").matches) ||
  (window.matchMedia && matchMedia("(display-mode: window-controls-overlay)").matches) ||
  navigator.standalone === true;   // Safari no iPhone e no iPad

/** Que navegador é, só para dizer o caminho certo a quem não tem botão. */
function caminhoDeInstalacao(){
  const ua = navigator.userAgent;
  const iOS = /iPad|iPhone|iPod/.test(ua) ||
    (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  if (iOS) return {nome:"Safari", passos:["Partilhar (o quadrado com a seta)",
    "Adicionar ao ecrã principal", "Adicionar"]};
  if (/Firefox/.test(ua)) return {nome:"Firefox", passos:["Menu ⋯",
    "Instalar", "no computador, o Firefox só instala com uma extensão"]};
  if (/Edg\//.test(ua)) return {nome:"Edge", passos:["Menu ⋯",
    "Aplicações", "Instalar este site como uma aplicação"]};
  if (/Chrome|Chromium/.test(ua)) return {nome:"Chrome", passos:["Menu ⋮",
    "Transmitir, guardar e partilhar", "Instalar página como aplicação"]};
  return {nome:"navegador", passos:["procure «Instalar» ou «Adicionar ao ecrã principal» no menu"]};
}

/**
 * Ícone do ecrã principal, desenhado aqui e agora. O Safari só aceita PNG
 * nesta ligação — e a aplicação é um ficheiro só, sem imagens ao lado. Sai
 * do desenho para um `canvas` e daí para uma data: URI.
 */
function pintarIconeApp(tamanho, cor){
  try{
    const c = document.createElement("canvas");
    c.width = c.height = tamanho;
    const g = c.getContext("2d");
    if (!g) return null;
    const r = Math.round(tamanho * 0.22);
    g.fillStyle = cor;
    // Rectângulo de cantos redondos, à mão: `roundRect` é recente de mais
    g.beginPath();
    g.moveTo(r, 0); g.lineTo(tamanho - r, 0); g.quadraticCurveTo(tamanho, 0, tamanho, r);
    g.lineTo(tamanho, tamanho - r); g.quadraticCurveTo(tamanho, tamanho, tamanho - r, tamanho);
    g.lineTo(r, tamanho); g.quadraticCurveTo(0, tamanho, 0, tamanho - r);
    g.lineTo(0, r); g.quadraticCurveTo(0, 0, r, 0);
    g.closePath(); g.fill();
    g.fillStyle = "#ffffff";
    g.textAlign = "center"; g.textBaseline = "middle";
    g.font = "600 " + Math.round(tamanho * 0.56) + "px system-ui, sans-serif";
    g.fillText("€", tamanho / 2, tamanho * 0.54);
    return c.toDataURL("image/png");
  }catch(e){ return null; }
}

/** Põe (ou repõe) o ícone de ecrã principal na cor de acento em vigor. */
let _corDoIcone = null;
function aplicarIconeApp(){
  const cor = getComputedStyle(document.documentElement)
    .getPropertyValue("--accent").trim() || "#2f5fd0";
  /* Desenhar um PNG de 180 px custa perto de 4 ms — quase tudo o que
     `aplicarTema` gasta — e o desenho só muda quando a cor muda. Num
     telemóvel modesto, repeti-lo à toa é meio quadro de animação deitado
     fora de cada vez que se toca no tema. */
  if (cor === _corDoIcone && document.querySelector('link[rel="apple-touch-icon"]')) return true;
  const url = pintarIconeApp(180, cor);
  if (!url) return false;
  _corDoIcone = cor;
  let l = document.querySelector('link[rel="apple-touch-icon"]');
  if (!l){ l = document.createElement("link"); l.rel = "apple-touch-icon"; document.head.appendChild(l); }
  l.href = url;
  return true;
}

/* Estado dos requisitos de instalação. O Chrome e o Android só oferecem a
   instalação se todos estiverem cumpridos, e não dizem qual falta — por isso
   diz-se aqui. Preenche-se sozinho, e a vista repinta quando fica pronto. */
let _requisitos = {feito:false, https:false, manifesto:false, icones:false, sw:false};

function verificarRequisitos(){
  const r = {feito:true, https:false, manifesto:false, icones:false, sw:false, detalhe:{}};
  r.https = location.protocol === "https:" || location.hostname === "localhost" ||
            location.hostname === "127.0.0.1";
  const promessas = [];

  promessas.push(fetch("./manifest.json").then(res => res.ok ? res.json() : null).then(m => {
    if (!m) return;
    r.manifesto = !!(m.name || m.short_name) && !!m.start_url &&
      ["standalone","fullscreen","minimal-ui"].indexOf(m.display) >= 0;
    r.detalhe.nome = m.name;
    // O Chrome exige um ícone de 192 px ou mais que exista mesmo
    const grandes = (m.icons || []).filter(i => /\b(192|512)x(192|512)\b/.test(i.sizes || ""));
    return Promise.all(grandes.map(i =>
      fetch(i.src).then(res => res.ok).catch(() => false)
    )).then(oks => { r.icones = oks.length > 0 && oks.some(Boolean);
                     r.detalhe.icones = oks.filter(Boolean).length + "/" + oks.length; });
  }).catch(() => {}));

  if ("serviceWorker" in navigator){
    promessas.push(navigator.serviceWorker.getRegistrations()
      .then(rs => { r.sw = rs.some(x => x.active); }).catch(() => {}));
  }

  return Promise.all(promessas).then(() => {
    _requisitos = r;
    if (VIEW === "config") render();
    return r;
  });
}

/** Cartão de instalação, nas Definições. */
function cartaoAplicacao(){
  const dentro = emAplicacao();
  const via = caminhoDeInstalacao();
  const podeJa = !!_conviteInstalar;
  const deDisco = location.protocol === "file:";

  let corpo;
  if (dentro){
    corpo = '<div class="note" style="border-left-color:var(--pos)">'+
      '<strong>Já está instalada.</strong> Abre em janela própria e funciona sem rede. '+
      'Os dados são os mesmos de sempre — ficam neste aparelho, no armazenamento deste navegador.</div>';
  } else if (deDisco){
    corpo = '<div class="note"><strong>Aberta a partir do disco.</strong> Para instalar, o ficheiro '+
      'tem de ser servido por um endereço — ponha-o num servidor, ou abra-o pelo endereço da rede local. '+
      'Nenhum navegador instala uma página aberta com <code>file://</code>.</div>';
  } else if (podeJa){
    corpo = '<p class="sub">Fica com ícone próprio, abre em janela sem barra de endereço, '+
      'e continua a funcionar sem rede.</p>'+
      '<div class="actions"><button class="btn primary" data-act="appInstalar">Instalar</button></div>';
  } else {
    corpo = '<p class="sub">Fica com ícone próprio, abre em janela sem barra de endereço, '+
      'e continua a funcionar sem rede.</p>'+
      '<div class="note"><strong>No '+esc(via.nome)+':</strong> '+
      via.passos.map(esc).join(' <span class="muted">›</span> ')+'</div>'+
      '<div class="muted" style="font-size:12px;margin-top:7px">O botão de instalação aparece aqui '+
      'assim que o navegador o oferecer — nem todos oferecem, e alguns só depois de a página ser visitada '+
      'mais do que uma vez.</div>';
  }

  /* Lista dos requisitos, para quem não vê o botão saber porquê. Só se mostra
     quando falta alguma coisa: com tudo pronto seria ruído. */
  let porque = "";
  const q = _requisitos;
  if (!dentro && !podeJa && !deDisco && q.feito){
    const faltas = [];
    if (!q.https)     faltas.push("Endereço seguro (https, ou localhost)");
    if (!q.manifesto) faltas.push("Manifesto com nome, arranque e janela própria");
    if (!q.icones)    faltas.push("Ícone de 192 px ou maior que o navegador consiga ir buscar");
    if (!q.sw)        faltas.push("Service worker ativo (o ficheiro <code>sw.js</code> ao lado)");
    if (faltas.length){
      porque = '<div class="note" style="border-left-color:var(--warn);margin-top:11px">'+
        '<strong>Falta para o Chrome e o Android oferecerem a instalação:</strong>'+
        '<ul style="margin:6px 0 0 18px;padding:0">'+
        faltas.map(f => '<li>'+f+'</li>').join("")+'</ul></div>';
    } else {
      porque = '<div class="note" style="border-left-color:var(--pos);margin-top:11px">'+
        '<strong>Está tudo pronto do lado da aplicação</strong> — endereço, manifesto, ícones '+
        'e service worker. O Chrome costuma oferecer a instalação depois de a página ser '+
        'visitada mais do que uma vez; entretanto, o caminho do menu acima funciona sempre.</div>';
    }
  }

  return '<div class="card"><h2>Guardar como aplicação</h2>'+ corpo + porque +
    '<div class="note" style="margin-top:12px"><strong>Instalar não copia nada para lado nenhum.</strong> '+
    'A aplicação continua sem servidor e sem conta: o que muda é a janela e o ícone. '+
    'As cópias de segurança continuam a ser suas, em <em>Dados ▾</em>.</div></div>';
}

/* ---------------------------------------------------------------
   Números que transitam — ao mudar de mês ou de parâmetro, o valor
   interpola em vez de saltar. Puramente visual: o texto final é
   sempre o que a função de formatação produziu.
   --------------------------------------------------------------- */
let _valoresAntes = new Map();
function animarValores(){
  if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const agora = new Map();
  $$(".kpi").forEach(k => {
    const lbl = k.querySelector(".lbl"), val = k.querySelector(".val");
    if (!lbl || !val) return;
    const chave = lbl.textContent;
    const texto = val.firstChild && val.firstChild.nodeType === 3 ? val.firstChild.nodeValue : val.textContent;
    const numero = parseNum(texto);
    agora.set(chave, {texto, numero});
    const antes = _valoresAntes.get(chave);
    if (!antes || antes.texto === texto || !Number.isFinite(numero) || !Number.isFinite(antes.numero)) return;
    if (Math.abs(numero - antes.numero) < 0.005) return;
    interpolar(val, antes.numero, numero, texto);
  });
  _valoresAntes = agora;
}
/** Interpola o primeiro nó de texto do elemento, mantendo o sufixo. */
function interpolar(el, de, para, textoFinal){
  const no = el.firstChild;
  if (!no || no.nodeType !== 3) return;
  const decimais = /,\d/.test(textoFinal) ? 2 : 0;
  const sufixo = textoFinal.trim().slice(-1) === "%" ? "%" : (/€/.test(textoFinal) ? " €" : "");
  const ini = performance.now(), dur = 420;
  const passo = (t) => {
    const k = Math.min(1, (t - ini) / dur);
    const suave = 1 - Math.pow(1 - k, 3);
    if (k >= 1){ no.nodeValue = textoFinal; return; }
    no.nodeValue = (de + (para - de) * suave)
      .toLocaleString("pt-PT", {minimumFractionDigits:decimais, maximumFractionDigits:decimais}) + sufixo;
    requestAnimationFrame(passo);
  };
  requestAnimationFrame(passo);
}

/**
 * Relatório mensal — uma folha desenhada para imprimir ou guardar em PDF,
 * para a conversa de casal ou para o contabilista. Reaproveita as peças
 * do painel, sem os comandos.
 */
/**
 * Retrato do ano. O relatório mensal responde a «como correu este mês»;
 * este responde à pergunta que se faz em dezembro, e que hoje obrigava a
 * abrir doze meses um a um. Só usa meses com movimentos: um ano a meio
 * mostra-se a meio, em vez de fingir zeros.
 */
function dadosAno(ano){
  const a = ano || MES.slice(0, 4);
  const meses = [];
  for (let i = 1; i <= 12; i++) meses.push(a + "-" + String(i).padStart(2, "0"));
  const linhas = meses.map(m => {
    const r = realMes(m);
    const temDados = r.rend > 0 || r.desp > 0;
    return {mes: m, rend: r.rend, desp: r.desp, saldo: r.saldo, porCat: r.porCat, temDados};
  });
  const comDados = linhas.filter(x => x.temDados);
  const rend = comDados.reduce((s,x) => s + x.rend, 0);
  const desp = comDados.reduce((s,x) => s + x.desp, 0);

  // Categorias do ano, com o mesmo período do ano anterior para comparar
  const cats = S.categorias.filter(c => c.tipo === "despesa").map(c => {
    const total = comDados.reduce((s,x) => s + (x.porCat[c.id] || 0), 0);
    const antes = comDados.reduce((s,x) => {
      const r = realMes((Number(a) - 1) + x.mes.slice(4));
      return s + ((r.rend > 0 || r.desp > 0) ? (r.porCat[c.id] || 0) : 0);
    }, 0);
    return {cat: c, total, antes, dif: total - antes,
            pct: antes > 0 ? (total - antes) / antes * 100 : null};
  }).filter(x => x.total > 0 || x.antes > 0).sort((x,y) => y.total - x.total);

  const melhor = comDados.slice().sort((x,y) => y.saldo - x.saldo)[0] || null;
  const pior   = comDados.slice().sort((x,y) => x.saldo - y.saldo)[0] || null;
  const hist = (S.patrimonioHist || []).filter(x => x.mes.slice(0,4) === a);
  const notas = meses.filter(m => S.notas && S.notas[m]).map(m => ({mes: m, txt: S.notas[m]}));

  return {ano: a, linhas, comDados, rend, desp, saldo: rend - desp,
          taxa: rend > 0 ? (rend - desp) / rend * 100 : 0,
          cats, melhor, pior, notas,
          patrimonioInicio: hist.length ? hist[0].liquido : null,
          patrimonioFim: hist.length ? hist[hist.length-1].liquido : null,
          fechados: meses.filter(m => S.fechados && S.fechados[m]).length};
}

/**
 * Abre um relatório e manda imprimir. A vista do relatório não tem controlo
 * nenhum — é uma folha, não um ecrã — e por isso a reposição tem de correr
 * aconteça o que acontecer: `window.print()` rebenta em quiosques, em
 * webviews e onde a política de impressão o proíbe, e sem o `finally` quem
 * carregasse no botão ficava preso numa página sem saída até recarregar.
 */
function abrirRelatorio(modo){
  ui.relatorio = modo;
  render();
  // Deixar pintar antes de abrir o diálogo de impressão do navegador
  setTimeout(() => {
    try { window.print(); }
    catch(e){ avisarImpressaoFalhou(e); }
    finally { ui.relatorio = false; render(); }
  }, 120);
}
function avisarImpressaoFalhou(e){
  toast("Não foi possível abrir a impressão neste navegador. "+
        "Em Dados ▾ pode exportar uma cópia.");
  if (window.console && console.warn) console.warn("impressão:", e);
}

function viewRelatorio(){
  const p = planoMes(MES), r = realMes(MES);
  const usarReal = r.rend > 0 || r.desp > 0;
  const rend = usarReal ? r.rend : p.rend, desp = usarReal ? r.desp : p.desp;
  const saldo = rend - desp;
  const b = balanco();
  const g = usarReal ? porGrupo(MES) : (function(){
    const acc = {necessidades:0, desejos:0, poupanca:0};
    S.categorias.filter(c => c.tipo === "despesa").forEach(c => {
      acc[c.grupo || "desejos"] += p.porCat[c.id] || 0;
    });
    return acc;
  })();

  const desvios = [["Rendimentos", p.rend, r.rend, true], ["Despesas", p.desp, r.desp, false],
                   ["Saldo", p.saldo, r.saldo, true]].map(([n, prev, real, maior]) => {
    const dif = real - prev, bom = maior ? dif >= 0 : dif <= 0;
    return '<tr><td>'+esc(n)+'</td><td class="r num">'+esc(eur(prev))+'</td>'+
      '<td class="r num">'+esc(eur(real))+'</td>'+
      '<td class="r num '+(dif === 0 ? "" : bom ? "pos" : "neg")+'">'+(dif > 0 ? "+" : "")+esc(eur(dif))+'</td></tr>';
  }).join("");

  const porCat = S.categorias.filter(c => c.tipo === "despesa")
    .map(c => ({c, v: (usarReal ? r : p).porCat[c.id] || 0}))
    .filter(x => x.v > 0).sort((a,b2) => b2.v - a.v)
    .map(x => '<tr><td>'+esc(catRotulo(x.c.id))+'</td>'+
      '<td class="r num">'+esc(eur(x.v))+'</td>'+
      '<td class="r num muted">'+esc(pct(desp > 0 ? x.v/desp*100 : 0))+'</td></tr>').join("");

  return '<div class="relatorio">'+
    '<div class="capa"><h1>Orçamento familiar</h1>'+
      '<div class="mes">'+esc(mesLabel(MES))+'</div>'+
      '<div class="sub">'+(usarReal ? "Com base nos movimentos registados" : "Com base no plano mensal")+
      ' · emitido em '+esc(isoDia(hoje()).split("-").reverse().join("/"))+
      (S.fechados && S.fechados[MES] ? ' · mês fechado' : '')+'</div>'+
      // A nota do mês é o que explica os números a quem lê o relatório meses
      // depois — inclui-se logo na capa, e não numa página perdida.
      ((S.notas && S.notas[MES])
        ? '<div class="notaRel">✎ '+esc(S.notas[MES])+'</div>' : "")+
      '</div>'+

    '<div class="grid g4" style="margin:16px 0">'+
      kpi("Rendimento", eur(rend), usarReal ? "Real" : "Previsto")+
      kpi("Despesa", eur(desp), usarReal ? "Real" : "Prevista")+
      kpi("Saldo", eur(saldo), saldo >= 0 ? "Sobra" : "Défice")+
      kpi("Taxa de poupança", pct(rend > 0 ? saldo/rend*100 : 0), "Alvo: 20%")+
    '</div>'+

    sankeyOrcamento(rend, g, usarReal)+

    '<div class="card"><h2>Previsto vs. real</h2>'+
      '<div class="tblwrap"><table><thead><tr><th></th><th class="r">Previsto</th><th class="r">Real</th>'+
      '<th class="r">Desvio</th></tr></thead><tbody>'+desvios+'</tbody></table></div></div>'+

    '<div class="card"><h2>Despesa por categoria</h2>'+
      (porCat
        ? '<div class="tblwrap"><table><thead><tr><th>Categoria</th><th class="r">Valor</th><th class="r">Peso</th></tr></thead>'+
          '<tbody>'+porCat+'</tbody></table></div>'
        : '<div class="empty">Sem despesa registada neste mês.</div>')+'</div>'+

    '<div class="card"><h2>Património e compromissos</h2>'+
      '<div class="grid g3">'+
        kpi("Património líquido", eur(b.liquido), "Ativos menos dívida")+
        kpi("Ativos", eur(b.ativos), eur(b.carteira)+" financeiros")+
        kpi("Dívida", eur(b.divida), S.creditos.length+" crédito(s)")+
      '</div></div>'+

    (S.objetivos.length
      ? '<div class="card"><h2>Objetivos</h2><div class="tblwrap"><table><thead><tr><th>Objetivo</th>'+
        '<th class="r">Poupado</th><th class="r">Meta</th><th class="r">Progresso</th></tr></thead><tbody>'+
        S.objetivos.map(o => {
          const at = poupadoObjetivo(o), al = parseNum(o.alvo);
          return '<tr><td>'+esc(o.nome)+'</td><td class="r num">'+esc(eur(at))+'</td>'+
            '<td class="r num">'+esc(eur(al))+'</td>'+
            '<td class="r num">'+esc(pct(al > 0 ? Math.min(100, at/al*100) : 0))+'</td></tr>';
        }).join("")+'</tbody></table></div></div>'

    '<div class="note" style="margin-top:14px">Documento gerado localmente pela ferramenta, a partir dos dados '+
    'deste navegador. Os valores fiscais seguem o regime português de '+esc(String(TABELAS_RF._meta.ano))+'.</div>'+
    '</div>';
}

/**
 * Emblemas nos separadores: um ponto com número no separador que tem
 * assunto pendente. Serve para o separador dizer se vale a pena entrar,
 * em vez de obrigar a entrar para descobrir que não valia.
 */
function emblemasVistas(){
  const e = {};
  const somar = (v, n) => { if (n > 0) e[v] = (e[v] || 0) + n; };
  try {
    somar("painel", alertas().filter(a => a.grau >= 1).length);
    somar("despesas", S.movimentos.filter(m => mesDoDia(m.data) === MES && !m.categoriaId).length);
    somar("creditos", S.creditos.filter(c => {
      if (!creditoAtivo(c, MES) || c.tipoTaxa !== "variavel") return false;
      // `proximaRevisao` devolve o mês, não quantos faltam
      const p = proximaRevisao(c, MES);
      if (!p) return false;
      const faltam = mesDiff(MES, p);
      return faltam >= 0 && faltam <= 1;
    }).length);
    somar("objetivos", S.objetivos.filter(o =>
      parseNum(o.alvo) > 0 && poupadoObjetivo(o) >= parseNum(o.alvo) && !o.celebrado).length);
  } catch(err){ /* um emblema nunca pode impedir a aplicação de pintar */ }
  return e;
}

function pintarEmblemas(){
  const e = emblemasVistas();
  $$("#tabs button[data-view], #tabsMovel button[data-view], #folhaMais button[data-view]").forEach(b => {
    const n = e[b.dataset.view] || 0;
    let ponto = b.querySelector(".emblema");
    if (!n){ if (ponto) ponto.remove(); b.removeAttribute("data-pendentes"); return; }
    if (!ponto){
      ponto = document.createElement("span");
      ponto.className = "emblema";
      ponto.setAttribute("aria-hidden", "true");
      b.appendChild(ponto);
    }
    ponto.textContent = n > 9 ? "9+" : String(n);
    b.setAttribute("data-pendentes", n + " por tratar");
  });
}

/**
 * Fita de meses: sete barras de saldo clicáveis, à volta do mês em
 * análise. A altura é o saldo, a cor o sinal, e os meses ainda por
 * acontecer ficam esbatidos. Substitui carregar cinco vezes na seta.
 */
function pintarFita(){
  const host = $("#fitaMeses");
  if (!host) return;
  const hojeM = isoMes(hoje());
  const meses = [];
  for (let i = -4; i <= 2; i++) meses.push(mesShift(MES, i));

  const dados = emPasse(() => meses.map(m => {
    const r = realMes(m), p = planoMes(m);
    const usa = (r.rend > 0 || r.desp > 0) ? r : p;
    // A taxa de poupança dá a cor: a fita passa a ser um mini-mapa do ano,
    // não só um sinal de mais ou menos.
    const taxa = usa.rend > 0 ? usa.saldo / usa.rend * 100 : null;
    return {mes: m, saldo: usa.saldo, taxa, futuro: m > hojeM};
  }));
  const max = Math.max(1, ...dados.map(d => Math.abs(d.saldo)));

  /* Do vermelho (défice) ao verde (20% ou mais, o alvo da regra 50/30/20),
     passando pelo âmbar. Sem rendimento não há taxa, e fica-se pelo sinal. */
  const corDaTaxa = (t, saldo) => {
    if (t == null) return saldo >= 0 ? "var(--pos)" : "var(--neg)";
    if (t < 0)  return "var(--neg)";
    if (t < 10) return "var(--warn)";
    if (t < 20) return "color-mix(in srgb,var(--pos) 55%,var(--warn))";
    return "var(--pos)";
  };

  host.innerHTML = dados.map(d => {
    const h = Math.max(3, Math.round(Math.abs(d.saldo) / max * 24));
    const cor = corDaTaxa(d.taxa, d.saldo);
    const atual = d.mes === MES;
    // Selo de mês fechado e marca de nota: a fita passa a dizer o que já
    // foi arrumado e o que tem história escrita.
    const fechado = !!(S.fechados && S.fechados[d.mes]);
    const nota = (S.notas && S.notas[d.mes]) || "";
    return '<button data-mes="'+esc(d.mes)+'"'+(atual ? ' aria-current="true"' : '')+
      ' title="'+esc(mesLabel(d.mes))+' · saldo '+esc(eur(d.saldo))+
        (d.taxa != null ? " · poupança "+esc(pct(d.taxa)) : "")+(d.futuro ? " (previsto)" : "")+
        (fechado ? " · mês fechado" : "")+(nota ? " · "+esc(nota) : "")+'">'+
      '<span class="cx"><span class="bx" style="height:'+h+'px;background:'+cor+
        ';opacity:'+(atual ? 1 : d.futuro ? .35 : .55)+'"></span></span>'+
      '<span class="lx">'+esc(mesLabel(d.mes, true).split("/")[0])+
        (fechado ? '<span class="selo" aria-label="mês fechado">✓</span>' : "")+
        (nota ? '<span class="selo" aria-label="tem nota">✎</span>' : "")+'</span></button>';
  }).join("");
}

/**

   Notificações e diálogos
   --------------------------------------------------------------- */
/* Avisos em fila: com ações em lote, um aviso novo apagava o anterior
   antes de dar tempo de o ler. Passam a esperar pela vez. */
let toastT;
let _filaToast = [];
let _toastOcupado = false;

const FILA_TOAST_MAX = 3;
function toast(msg){
  _filaToast.push({msg});
  // Com tecto: uma enxurrada de avisos não deve virar apresentação de
  // slides. Ficam os últimos, que são os que dizem respeito ao que se fez.
  if (_filaToast.length > FILA_TOAST_MAX) _filaToast.splice(0, _filaToast.length - FILA_TOAST_MAX);
  if (!_toastOcupado) _proximoToast();
}
function _proximoToast(){
  const t = $("#toast");
  if (!_filaToast.length){ _toastOcupado = false; t.classList.remove("show"); return; }
  _toastOcupado = true;
  const {msg, botao} = _filaToast.shift();
  t.textContent = msg;
  if (botao) t.appendChild(botao);
  t.classList.add("show");
  clearTimeout(toastT);
  toastT = setTimeout(() => {
    t.classList.remove("show");
    // Deixa a saída acontecer antes de mostrar o seguinte
    setTimeout(_proximoToast, 220);
  }, botao ? 6000 : 2600);
}
/**
 * Aviso com um botão de ação (a anulação). Mostra-se já, sem esperar pela
 * fila: a janela para carregar em «Anular» é curta, e fazê-la começar
 * 220 ms depois seria roubar tempo a quem se arrependeu.
 */
function toastComBotao(msg, botao){
  _filaToast.unshift({msg, botao});
  clearTimeout(toastT);
  _toastOcupado = false;
  _proximoToast();
}

/**
 * Erro de validação junto ao próprio campo, em vez de um toast genérico:
 * marca o campo, escreve a mensagem por baixo e limpa ao primeiro toque.
 */
function invalido(id, msg){
  const el = $("#"+id);
  if (!el){ toast(msg); return; }
  el.classList.add("invalido");
  let err = el.parentElement.querySelector(".fielderr");
  if (!err){
    err = document.createElement("div");
    err.className = "fielderr";
    el.parentElement.appendChild(err);
  }
  err.textContent = msg;
  el.focus();
  el.addEventListener("input", () => { el.classList.remove("invalido"); err.remove(); }, {once:true});
}

/* ---------------------------------------------------------------
   Eliminar com anulação — em vez de perguntar antes, apaga já e
   dá seis segundos para mudar de ideias. Menos fricção, a mesma
   segurança. (O «Apagar tudo» mantém o diálogo de confirmação.)

   Assenta no histórico geral: o botão «Anular» é só um atalho
   descoberto para o mesmo Ctrl+Z, e não um mecanismo à parte.
   --------------------------------------------------------------- */
function apagarComAnulacao(msg, fn, rotulo){
  // Compara-se o topo da pilha, não o seu tamanho: com o histórico cheio,
  // cada passo novo faz cair o mais antigo e o tamanho fica igual — o que
  // fazia o «Anular» desaparecer exatamente para quem mais mexe nos dados,
  // embora o Ctrl+Z continuasse a funcionar.
  const topoAntes = historico.atras[historico.atras.length - 1];
  alterar(fn, rotulo || "eliminação");
  // Só oferece anular se a eliminação chegou mesmo ao histórico
  let b = null;
  if (historico.atras[historico.atras.length - 1] !== topoAntes){
    b = document.createElement("button");
    b.type = "button";
    b.textContent = "Anular";
    // O botão consome-se ao ser usado: o aviso sai de cena já, sem esperar
    // a vez na fila, para não continuar a oferecer o que já foi feito.
    b.onclick = () => {
      clearTimeout(toastT);
      $("#toast").classList.remove("show");
      _toastOcupado = false;
      desfazer();
    };
  }
  toastComBotao(msg, b);
}

function confirmar(titulo, texto, onOk, labelOk){
  const host = $("#modalHost");
  host.innerHTML =
    '<div class="overlay"><div class="dialog" role="dialog" aria-modal="true">'+
      '<h3>'+esc(titulo)+'</h3><p>'+esc(texto)+'</p>'+
      '<div class="actions"><button class="btn ghost" data-dlg="no">Cancelar</button>'+
      '<button class="btn danger" data-dlg="yes">'+esc(labelOk || "Eliminar")+'</button></div>'+
    '</div></div>';
  const fechar = () => { host.innerHTML = ""; };
  host.querySelector('[data-dlg="no"]').onclick = fechar;
  host.querySelector('[data-dlg="yes"]').onclick = () => { fechar(); onOk(); };
  host.querySelector(".overlay").onclick = (e) => { if (e.target === e.currentTarget) fechar(); };
  host.querySelector('[data-dlg="yes"]').focus();
}

/**
 * Diálogo de palavra-passe. A dupla escrita só se pede a gravar: a
 * decifrar, um engano nota-se logo — a decifra falha. A gravar, um engano
 * é indetetável até ao dia em que o ficheiro faz falta.
 */
function pedirSenha(cfg){
  const host = $("#modalHost");
  host.innerHTML =
    '<div class="overlay"><div class="dialog" role="dialog" aria-modal="true">'+
      '<h3>'+esc(cfg.titulo)+'</h3><p>'+esc(cfg.texto)+'</p>'+
      (cfg.aviso ? '<div class="note" style="border-left-color:var(--neg);margin-bottom:11px">'+
        '<strong>Sem recuperação:</strong> '+esc(cfg.aviso)+'</div>' : '')+
      '<input id="dlgSenha" type="password" autocomplete="new-password" placeholder="Palavra-passe">'+
      (cfg.confirmar
        ? '<input id="dlgSenha2" type="password" autocomplete="new-password" '+
          'placeholder="Escreva outra vez" style="margin-top:8px">' : '')+
      '<div id="dlgSenhaErro" class="erro" style="min-height:16px;margin-top:6px"></div>'+
      '<div class="actions" style="margin-top:8px"><button class="btn ghost" data-dlg="no">Cancelar</button>'+
      '<button class="btn primary" data-dlg="yes">Continuar</button></div>'+
    '</div></div>';
  const fechar = () => { host.innerHTML = ""; };

/**
 * Campos de valor que fazem contas: escrever «43,20+18» ou «120*3» e o
 * campo resolve ao sair. Só aritmética — a lista de carateres permitidos
 * é branca, e nada além dela chega a ser avaliado.
 */
function avaliarExpressao(texto){
  const s = String(texto || "").trim();
  if (!s || !/[+\-*/]/.test(s)) return null;          // sem operador, não é conta
  if (!/^[0-9 .,+\-*/()]+$/.test(s)) return null;     // qualquer outra coisa: não se toca
  // Vírgula decimal para ponto; pontos de milhares desaparecem
  const limpo = s.replace(/\.(?=\d{3}\b)/g, "").replace(/,/g, ".");
  if (!/^[0-9 .+\-*/()]+$/.test(limpo)) return null;
  try {
    const v = Function('"use strict";return ('+limpo+')')();
    return (typeof v === "number" && isFinite(v)) ? v : null;
  } catch(e){ return null; }
}

/* Ao sair de um campo decimal, resolve-se a conta que lá estiver. */
document.addEventListener("blur", (e) => {
  const el = e.target;
  if (!el || el.tagName !== "INPUT") return;
  if (el.inputMode !== "decimal" && el.getAttribute("inputmode") !== "decimal") return;
  const v = avaliarExpressao(el.value);
  if (v == null) return;
  el.value = fmtNum.format(Math.round(v * 100) / 100);
  el.dispatchEvent(new Event("input", {bubbles:true}));
  el.dispatchEvent(new Event("change", {bubbles:true}));
}, true);

/* ---------------------------------------------------------------
   Cópia cifrada

   Os dados vivem só neste navegador, e quem os quer guardar no e-mail
   ou na nuvem passa a expor o orçamento inteiro a quem lá chegar. A
   cifra é AES-GCM com chave derivada por PBKDF2 (WebCrypto, sem
   dependências). Sem palavra-passe não há recuperação possível: não há
   servidor, não há cópia, não há «esqueci-me». O aviso é dito por
   extenso antes de gravar, e a confirmação da palavra-passe é pedida
   duas vezes, porque um engano na primeira é indetetável.
   --------------------------------------------------------------- */
const CIFRA_MARCA = "orcamento-familiar-cifrado";
const CIFRA_ITER = 250000;   // custo deliberado, para travar tentativa e erro

function temCripto(){
  return !!(window.crypto && window.crypto.subtle && window.TextEncoder);
}
/* Base64 em blocos: `String.fromCharCode.apply` passa o array inteiro como
   argumentos e rebenta a pilha algures acima das dezenas de milhar. Um
   orçamento com anos de movimentos chega lá à vontade — e seria justamente
   quem mais dados tem a falhar a exportação. */
const b64 = {
  para(buf){
    const u = new Uint8Array(buf);
    const BLOCO = 0x8000;
    let s = "";
    for (let i = 0; i < u.length; i += BLOCO){
      s += String.fromCharCode.apply(null, u.subarray(i, i + BLOCO));
    }
    return btoa(s);
  },
  de: (s) => Uint8Array.from(atob(s), c => c.charCodeAt(0)),
};

async function derivarChave(senha, sal){
  const enc = new TextEncoder();
  const base = await crypto.subtle.importKey("raw", enc.encode(senha), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey(
    {name:"PBKDF2", salt: sal, iterations: CIFRA_ITER, hash:"SHA-256"},
    base, {name:"AES-GCM", length:256}, false, ["encrypt","decrypt"]);
}

async function cifrar(texto, senha){
  const sal = crypto.getRandomValues(new Uint8Array(16));
  const iv  = crypto.getRandomValues(new Uint8Array(12));
  const chave = await derivarChave(senha, sal);
  const dados = await crypto.subtle.encrypt({name:"AES-GCM", iv},
    chave, new TextEncoder().encode(texto));
  return JSON.stringify({
    formato: CIFRA_MARCA, versao: 1, algoritmo:"AES-GCM", derivacao:"PBKDF2-SHA256",
    iteracoes: CIFRA_ITER, sal: b64.para(sal), iv: b64.para(iv), dados: b64.para(dados),
    criadoEm: isoDia(hoje()),
  }, null, 2);
}

async function decifrar(pacote, senha){
  const chave = await derivarChave(senha, b64.de(pacote.sal));
  const claro = await crypto.subtle.decrypt(
    {name:"AES-GCM", iv: b64.de(pacote.iv)}, chave, b64.de(pacote.dados));
  return new TextDecoder().decode(claro);
}

/** Um ficheiro é uma cópia cifrada nossa? */
function ehPacoteCifrado(d){
  return !!(d && d.formato === CIFRA_MARCA && d.sal && d.iv && d.dados);
}

function exportJSONCifrado(){
  if (!temCripto()){
    toast("Este navegador não oferece a cifra necessária. Use a cópia normal.");
    return;
  }
  pedirSenha({
    titulo: "Exportar cópia cifrada",
    texto: "O ficheiro fica ilegível sem a palavra-passe. Escolha uma que consiga recuperar.",
    confirmar: true,
    aviso: "Não há forma de recuperar os dados sem esta palavra-passe. Não existe servidor, "+
           "não existe cópia de recuperação e não existe «esqueci-me» — se a perder, o ficheiro "+
           "fica inútil para sempre. Guarde-a num gestor de palavras-passe.",
    onOk: async (senha) => {
      try {
        const txt = await cifrar(JSON.stringify(S), senha);
        descarregar("orcamento-familiar-cifrado-" + isoDia(hoje()) + ".json", txt);
        toast("Cópia cifrada exportada. Guarde a palavra-passe em sítio seguro.");
      } catch(e){ toast("Não foi possível cifrar: " + e.message); }
    },
  });

function importJSON(){
  const inp = document.createElement("input");
  inp.type = "file"; inp.accept = "application/json,.json";
  inp.onchange = () => {
    const file = inp.files && inp.files[0];
    if (!file) return;
    const fr = new FileReader();
    fr.onload = () => {
      try{
        const d = JSON.parse(String(fr.result));
        if (!d || typeof d !== "object") throw new Error("formato");
        // Um ficheiro cifrado reconhece-se e pede a palavra-passe
        if (ehPacoteCifrado(d)){
          if (!temCripto()){ toast("Este navegador não consegue decifrar o ficheiro."); return; }
          pedirSenha({
            titulo: "Cópia cifrada",
            texto: "Este ficheiro foi cifrado em "+esc(d.criadoEm || "data desconhecida")+
                   ". Escreva a palavra-passe com que o gravou.",
            onOk: async (senha) => {
              let dados;
              try { dados = JSON.parse(await decifrar(d, senha)); }
              catch(e){ toast("Palavra-passe errada, ou ficheiro danificado."); return; }
              confirmar("Importar dados",
                "Isto substitui o orçamento atual pelos dados do ficheiro. Continuar?", () => {
                S = normalizar(dados);
                guardar(); aplicarTema(); render();
                toast("Dados importados da cópia cifrada.");
              }, "Importar");
            },
          });
          return;
        }
        confirmar("Importar dados", "Isto substitui o orçamento atual pelos dados do ficheiro. Continuar?", () => {
          S = normalizar(d);
          guardar(); aplicarTema(); render();
          toast("Dados importados.");
        }, "Importar");
      }catch(e){ toast("Ficheiro inválido."); }
    };
    fr.readAsText(file);
  };
  inp.click();
}

    const especie = $("#cpEspecie").value;

    // Uma prestação social pode ser legitimamente zero — um agregado no 5.º

    if (especie === "parentalidade"){

  limDoHistorico(){
    const cats = S.categorias.filter(c => c.tipo === "despesa");
    const sugeridos = [];
    cats.forEach(c => {
      const m = medianaCategoria(c.id, 6);
      if (m && m.valor > 0) sugeridos.push({id: c.id, valor: Math.round(m.valor / 5) * 5, n: m.n});

    if (!plano) return;
    const ajustes = ui.corteAjustes || {};
    const novos = plano.linhas.map(x => {
      const corte = ajustes[x.cat.id] != null ? parseNum(ajustes[x.cat.id]) : x.corte;
      return {id: x.cat.id, nome: x.cat.nome, limite: Math.max(0, Math.round((x.gasto - corte) * 100) / 100)};
    }).filter(x => x.limite > 0);
    if (!novos.length){ toast("Nada para aplicar."); return; }
    confirmar("Aplicar o plano de corte",
      "Serão definidos "+novos.length+" limites: "+novos.slice(0,4).map(x => x.nome+" "+eur(x.limite)).join(", ")+

  /* --- copiar os movimentos do mês anterior --- */
  copiarMesAnterior(){
    const origem = mesShift(MES, -1);
    const doOutro = S.movimentos.filter(m => mesDoDia(m.data) === origem);
    if (!doOutro.length){ toast("Sem movimentos em "+mesLabel(origem)+" para copiar."); return; }
    // Não repetir o que já cá está: mesma descrição e valor
    const existentes = new Set(S.movimentos.filter(m => mesDoDia(m.data) === MES)
      .map(m => semAcento(m.descricao)+"|"+Math.abs(parseNum(m.valor)).toFixed(2)));
    const novos = doOutro.filter(m =>
      !existentes.has(semAcento(m.descricao)+"|"+Math.abs(parseNum(m.valor)).toFixed(2)));
    if (!novos.length){ toast("Todos os movimentos de "+mesLabel(origem)+" já cá estão."); return; }

    const [ano, mm] = MES.split("-").map(Number);
    const ultimo = new Date(ano, mm, 0).getDate();
    confirmar("Copiar de "+mesLabel(origem)+"?",
      "Vai criar "+novos.length+" movimento(s) em "+mesLabel(MES)+", com o mesmo dia, descrição e valor. "+
      "Os que já existem aqui ficam de fora.",
      () => {
        alterar(() => {
          novos.forEach(m => {
            const dia = Math.min(parseInt(m.data.slice(8), 10) || 1, ultimo);
            S.movimentos.push(Object.assign({}, m, {id: uid("mv"),
              data: MES+"-"+String(dia).padStart(2, "0")}));
          });
        }, "cópia do mês anterior");
        toast(novos.length+" movimento(s) copiados de "+mesLabel(origem)+".");
      }, "Copiar");
  },

  /* --- importação de extrato CSV --- */
  csvAbrir(){
    const host = $("#modalHost");
    host.innerHTML =
      '<div class="overlay"><div class="dialog" role="dialog" aria-modal="true" style="max-width:640px">'+
      '<h3>Importar extrato bancário (CSV)</h3>'+
      '<p>Cole o conteúdo do extrato, ou escolha o ficheiro. Nada sai deste navegador.</p>'+
      '<input type="file" id="csvFicheiro" accept=".csv,.txt" style="margin-bottom:8px">'+
      '<textarea id="csvTexto" rows="6" style="width:100%" placeholder="Data;Descrição;Valor&#10;02-07-2026;COMPRA CONTINENTE;-34,50"></textarea>'+
      '<div id="csvPasso2"></div>'+
      '<div class="actions"><button class="btn ghost" data-dlg="no">Cancelar</button>'+
      '<button class="btn primary" data-act="csvAnalisar">Analisar</button></div>'+
      '</div></div>';
    const fechar = () => { host.innerHTML = ""; };
    host.querySelector('[data-dlg="no"]').onclick = fechar;
    host.querySelector(".overlay").onclick = (e) => { if (e.target === e.currentTarget) fechar(); };
    $("#csvFicheiro").addEventListener("change", (e) => {
      const f = e.target.files && e.target.files[0];
      if (!f) return;
      const leitor = new FileReader();
      leitor.onload = () => { $("#csvTexto").value = String(leitor.result || ""); ACOES.csvAnalisar(); };
      leitor.readAsText(f);
    });
  },
  csvAnalisar(){
    const {linhas} = csvParse($("#csvTexto").value);
    if (linhas.length < 2){ toast("Cole pelo menos um cabeçalho e uma linha."); return; }
    const cabec = linhas[0];
    const palpite = csvAdivinhaColunas(cabec);
    // Se a primeira linha já parecer dados (tem data), não é cabeçalho.
    const temCabec = csvDataISO(cabec[palpite.data >= 0 ? palpite.data : 0]) == null;
    const cols = cabec.map((c, i) => temCabec && c ? c : "Coluna " + (i + 1));
    const sel = (id, escolhido) =>
      '<select id="'+id+'">'+cols.map((c, i) =>
        '<option value="'+i+'"'+(i === escolhido ? " selected" : "")+'>'+esc(c)+'</option>').join("")+'</select>';
    const dados = temCabec ? linhas.slice(1) : linhas;
    const prev = dados.slice(0, 4).map(l =>
      '<tr>'+cols.map((c, i) => '<td>'+esc(l[i] || "")+'</td>').join("")+'</tr>').join("");
    _csv = {dados};
    $("#csvPasso2").innerHTML =
      '<div class="row" style="margin-top:10px">'+
        '<div><label class="field">Coluna da data</label>'+sel("csvColData", Math.max(0, palpite.data))+'</div>'+
        '<div><label class="field">Coluna da descrição</label>'+sel("csvColDesc", Math.max(0, palpite.desc))+'</div>'+
        '<div><label class="field">Coluna do valor</label>'+sel("csvColValor", Math.max(0, palpite.valor))+'</div>'+
      '</div>'+
      '<label style="display:inline-flex;align-items:center;gap:7px;font-size:13.5px;margin-top:9px">'+
        '<input type="checkbox" id="csvNeg" checked> Valores negativos são despesas; positivos, rendimentos</label>'+
      '<div class="tblwrap" style="margin-top:9px;max-height:150px;overflow-y:auto"><table><thead><tr>'+
        cols.map(c => '<th>'+esc(c)+'</th>').join("")+'</tr></thead><tbody>'+prev+'</tbody></table></div>'+
      '<div class="actions" style="margin-top:10px">'+
        '<button class="btn primary" data-act="csvImportar">Importar '+dados.length+' linha(s)</button></div>'+
      '<div class="note" style="margin-top:8px">A categoria de cada movimento é sugerida pelos movimentos já '+
      'classificados com descrições parecidas; duplicados (mesma data, valor e descrição) são ignorados.</div>';
  },
  csvImportar(){
    if (!_csv || !_csv.dados){ toast("Analise o extrato primeiro."); return; }
    const iData = parseInt($("#csvColData").value, 10);
    const iDesc = parseInt($("#csvColDesc").value, 10);
    const iValor = parseInt($("#csvColValor").value, 10);
    const negDespesa = $("#csvNeg").checked;
    const existentes = new Set(S.movimentos.map(m =>
      (m.data || "")+"|"+Math.abs(parseNum(m.valor)).toFixed(2)+"|"+semAcento(m.descricao)));
    let novos = [], duplicados = 0, invalidas = 0;
    _csv.dados.forEach(l => {
      const data = csvDataISO(l[iData]);
      const bruto = String(l[iValor] || "");
      const negativo = /^-|^\(/.test(bruto.trim());
      const valor = Math.abs(parseNum(bruto));
      if (!data || !(valor > 0)){ invalidas++; return; }
      const descricao = l[iDesc] || "";
      const chave = data+"|"+valor.toFixed(2)+"|"+semAcento(descricao);
      if (existentes.has(chave)){ duplicados++; return; }
      existentes.add(chave);
      novos.push({id: uid("mv"), data, descricao,
        tipo: negDespesa ? (negativo ? "despesa" : "rendimento") : "despesa",
        valor, categoriaId: categoriaSugerida(descricao), membroId: ""});
    });
    if (!novos.length){
      toast("Nada para importar — "+duplicados+" duplicado(s), "+invalidas+" linha(s) inválida(s).");
      return;
    }
    alterar(() => { novos.forEach(m => S.movimentos.push(m)); }, "importação de "+novos.length+" movimento(s)");
    // Saltar para o mês com mais movimentos importados, para os ver já.
    const porMes = {};
    novos.forEach(m => { const k = m.data.slice(0, 7); porMes[k] = (porMes[k] || 0) + 1; });
    MES = Object.entries(porMes).sort((a,b) => b[1] - a[1])[0][0];
    _csv = null;
    $("#modalHost").innerHTML = "";
    irPara("movimentos");
    const semCat = novos.filter(m => !m.categoriaId).length;
    toast("Importados "+novos.length+" movimento(s)"+
      (duplicados ? ", "+duplicados+" duplicado(s) ignorado(s)" : "")+
      (invalidas ? ", "+invalidas+" inválida(s)" : "")+
      (semCat ? " — "+semCat+" sem categoria, atribua-a ao editar." : "."));
  },
  gerarPlano(){
    const rubricas = S.recorrentes.filter(r => recAtiva(r, MES) && r.frequencia === "mensal");
    const creds = S.creditos.filter(c => creditoAtivo(c, MES));
    // Encargos e rendimentos mensais dos ativos
    const fluxosAtivos = [];
    S.ativos.forEach(a => {
      (a.encargos || []).filter(e => e.frequencia === "mensal" && parseNum(e.valor) > 0)
        .forEach(e => fluxosAtivos.push({tipo:"despesa", nome: a.nome+" — "+e.nome, valor: parseNum(e.valor), categoriaId: e.categoriaId}));
      (a.rendimentos || []).filter(x => x.frequencia === "mensal" && parseNum(x.valor) > 0)
        .forEach(x => fluxosAtivos.push({tipo:"rendimento", nome: a.nome+" — "+x.nome, valor: parseNum(x.valor), categoriaId: x.categoriaId}));
    });

    // Cada crédito gera até três movimentos: juros, capital e seguros.
    const linhasCredito = [];
    creds.forEach(c => {
      const p = parcelaMes(c, MES);
      if (!p) return;
      const nome = c.nome || "crédito";
      if (p.juros > 0)   linhasCredito.push({nome:"Juros — "+nome,       valor:p.juros,   categoriaId: catCredito(c,"juros")});
      if (p.capital > 0) linhasCredito.push({nome:"Amortização — "+nome, valor:p.capital, categoriaId: catCredito(c,"capital")});
      if (p.seguro > 0)  linhasCredito.push({nome:"Seguros — "+nome,     valor:p.seguro,  categoriaId: catCredito(c,"seguro")});
    });

    const total = rubricas.length + linhasCredito.length + fluxosAtivos.length;
    if (!total){ toast("Sem rubricas mensais no plano."); return; }

      alterar(() => {

        // Um dia 31 num mês de 30 encosta ao último dia, que é o que o banco faz.
        rubricas.forEach(r => S.movimentos.push({
          id:uid("mv"),
          data: r.dia ? MES + "-" + String(diaNoMes(r.dia, MES)).padStart(2, "0") : dia1,
          tipo:r.tipo, descricao:r.nome,
          categoriaId:r.categoriaId, membroId:r.membroId || "", valor:parseNum(r.valor),
        }));
        fluxosAtivos.forEach(x => S.movimentos.push({
          id:uid("mv"), data:dia1, tipo:x.tipo, descricao:x.nome,
          categoriaId:x.categoriaId, membroId:"", valor:x.valor,
        }));
        linhasCredito.forEach(x => S.movimentos.push({
          id:uid("mv"), data:dia1, tipo:"despesa", descricao:x.nome,
          categoriaId:x.categoriaId, membroId:"", valor:x.valor,
        }));
      });
      toast("Plano lançado em movimentos.");
    }, "Lançar");
  },

  /* Subir e descer — o equivalente ao arrasto, para quem usa o dedo. */
  ordemMover(el){
    const {tipo, id} = el.dataset;
    const d = parseInt(el.dataset.d, 10);
    let mudou = false;
    alterar(() => {
      if (tipo === "cat"){
        const lista = S.categorias.map(c => c.id);
        const alvo = _vizinho(lista, id, d);
        if (alvo) mudou = reordenarCategoria(id, alvo);
      } else if (tipo === "painel"){
        const visiveis = cartoesPainel();
        const lista = visiveis.concat(Object.keys(CARTOES_PAINEL).filter(k => visiveis.indexOf(k) < 0));
        const alvo = _vizinho(lista, id, d);
        if (alvo) mudou = reordenarPainel(id, alvo);
      } else {
        const temOrdem = S.recorrentes.some(r => r.tipo === "despesa" && r.ordem != null);
        const lista = S.recorrentes.filter(r => r.tipo === "despesa")
          .sort((a,b) => temOrdem
            ? (a.ordem != null ? a.ordem : 1e9) - (b.ordem != null ? b.ordem : 1e9)
            : recMensal(b) - recMensal(a))
          .map(r => r.id);
        const alvo = _vizinho(lista, id, d);
        if (alvo) mudou = reordenarRubrica(id, alvo);
      }
    }, "ordem");
    if (!mudou) toast(d < 0 ? "Já está no topo." : "Já está no fim.");
  },

  estUsarEsforco(){

  estExecutar(){
    const e = S.estrategia;
    const o = OBJETIVOS_ESTRATEGIA[e.objetivo] || OBJETIVOS_ESTRATEGIA.reforma;
    const cfg = cfgEstrategia(e);
    const inst = cfg.instrumento;
    const mensal = Math.max(0, parseNum(e.mensal));
    const inicial = Math.max(0, parseNum(e.inicial));
    const anos = Math.max(1, Math.round(parseNum(e.anos)));

    if (mensal <= 0 && inicial <= 0){ toast("Defina uma poupança mensal ou um valor inicial."); return; }

    const nome = o.lbl + " — " + classeDe(inst).lbl;
    const nomeCategoria = e.objetivo === "emergencia" ? "Fundo de emergência" : "Investimentos";
    const resumo = "Vai criar uma rubrica de poupança de "+eur(mensal)+"/mês no plano, "+
      "um ativo «"+classeDe(inst).lbl+"»"+(inicial > 0 ? " com "+eur(inicial)+" inicial" : "")+" e "+eur(mensal)+"/mês de reforço"+
      (mv.meta > 0 ? ", e um objetivo de "+eur(mv.meta)+" para "+mesLabel(mesShift(MES, anos * 12)) : "")+".";

    confirmar("Executar estratégia", resumo, () => {
      alterar(() => {
        S.recorrentes.push({id:uid("rec"), tipo:"despesa", nome,
          categoriaId: catPorNome(nomeCategoria), membroId:"", valor: mensal,

        S.ativos.push({id:uid("pt"), nome, classe: inst,
          aquisicao: inicial, dataAquisicao: MES+"-01", valorizacao:"",
          atual: inicial, quantidade:0, cotacao:0,
          contribuicao: mensal, crescContrib: Math.max(0, parseNum(e.crescAnual)), reinvestimento:100,
          vpt:0, iuc:0, aportes:[], encargos:[], rendimentos:[]});
        if (mv.meta > 0){
          S.objetivos.push({id:uid("ob"), nome, alvo: mv.meta, atual: inicial,
            prazo: mesShift(MES, anos * 12)+"-01", cor: o.cor});
        }
      });

      irPara("ativos");
    }, "Executar");

    if (!nome){ invalido("crNome", "Indique a designação."); return; }
    if (capital <= 0){ invalido("crCapital", "Indique o capital."); return; }
    if (prazoMeses <= 0 || prazoMeses > 600){ invalido("crPrazo", "Prazo inválido (1 a 600 meses)."); return; }

    const dados = {
      nome, capital, prazoMeses, tipoTaxa,
      inicio: $("#crInicio").value ? $("#crInicio").value+"-01" : MES+"-01",
      ativoId: $("#crAtivo").value,
      seguroMensal: Math.max(0, parseNum($("#crSeguro").value)),
      categoriaJurosId: $("#crCatJuros").value,
      categoriaCapitalId: $("#crCatCapital").value,
      categoriaSeguroId: $("#crCatSeguro").value,
    };

    if (tipoTaxa === "variavel"){
      const ix = parseNum($("#crIndexValor").value);
      const sp = parseNum($("#crSpread").value);
      if (ix < -5 || ix > 25){ invalido("crIndexValor", "Valor do indexante inválido."); return; }
      if (sp < 0 || sp > 15){ invalido("crSpread", "Spread inválido."); return; }
      const rev = Math.round(parseNum($("#crRevisao").value));
      Object.assign(dados, {
        indexante: $("#crIndexante").value,
        indexanteValor: ix, spread: sp,
        revisaoMeses: rev > 0 ? rev : "",
        taxaAnual: ix + sp,   // guardado como referência
      });
    } else {
      const t = parseNum($("#crTaxa").value);
      if (t < 0 || t > 100){ invalido("crTaxa", "Taxa inválida."); return; }
      dados.taxaAnual = t;
    }

    alterar(() => {
      if (editando.cr){
        Object.assign(S.creditos.find(c => c.id === editando.cr), dados);
        editando.cr = null;
      } else {
        S.creditos.push(Object.assign({id:uid("cr")}, dados));

    }, "crédito");
    toast("Crédito guardado.");

  /* --- ativos --- */
  patSalvar(){
    const nome = $("#ptNome").value.trim();
    const aquisicao = parseNum($("#ptAquisicao").value);
    if (!nome){ invalido("ptNome", "Indique a designação."); return; }
    if (aquisicao <= 0){ invalido("ptAquisicao", "Indique o valor de aquisição."); return; }
    const dt = $("#ptData").value;
    const classe = $("#ptTipo").value;
    // Campos contextuais: só existem quando a classe os usa. Na edição,
    // um campo ausente mantém o valor guardado; num ativo novo, fica a zero.
    const ed = editando.pat ? S.ativos.find(b => b.id === editando.pat) : null;
    const lerNum = (id, guardado) => {
      const el = $("#"+id);
      if (el) return Math.max(0, parseNum(el.value));
      return ed ? Math.max(0, parseNum(guardado)) : 0;
    };
    const elContrato = $("#ptContrato");
    const vContrato = elContrato ? elContrato.value
      : ed ? (ed.contratoModerada ? "m" : ed.contratoNaoHabitacional ? "-1" : String(parseNum(ed.contratoAnos) || 0))
      : "0";
    const elReinv = $("#ptReinv");
    const dados = {

/* O cabeçalho recolhe ao descer e volta ao subir. Só em ecrã estreito,
   onde os seus 190 px pesam de facto; e nunca com um diálogo aberto ou
   com o cabeçalho no topo, para não esconder o que se está a usar. */
/* ---------------------------------------------------------------
   Orientação e classe de aparelho

   A aplicação decidia o desenho só pela largura, e isso engana-se num
   caso concreto e comum: um telemóvel deitado tem 812 px de largura —
   larguíssimo pelo critério antigo — mas 375 px de *altura*, dos quais o
   cabeçalho comia 156. Ficavam 219 px para o orçamento inteiro.

   A largura sozinha não distingue «telemóvel deitado» de «tablet de
   pé». O que os distingue é o lado *menor* do ecrã, que não muda ao
   rodar: é essa a medida que classifica o aparelho, e a orientação
   trata-se à parte. As duas ficam em atributos no <html>, para o CSS e
   o JS lerem o mesmo.
   --------------------------------------------------------------- */
const LIMIAR_TELEMOVEL = 500;   // lado menor abaixo disto é telemóvel
const LIMIAR_TABLET    = 900;   // e abaixo disto, tablet

/**
 * Classifica o ecrã. Aceita medidas por argumento para se poder verificar
 * cada quadrante — telemóvel de pé e deitado, tablet de pé e deitado —
 * sem depender do aparelho em que os testes calham correr.
 */
function classificarEcra(medidas){
  const m = medidas || {};
  const larg = m.larg != null ? m.larg
    : (window.innerWidth || document.documentElement.clientWidth || 0);
  const alt  = m.alt != null ? m.alt
    : (window.innerHeight || document.documentElement.clientHeight || 0);
  const menor = Math.min(larg, alt), maior = Math.max(larg, alt);
  const toque = m.toque != null ? !!m.toque
    : !!(window.matchMedia && window.matchMedia("(pointer:coarse)").matches);
  /* Numa janela sem dimensões (separador oculto, impressão) não se
     classifica nada: mudar o desenho com base em zero seria pior do que
     deixar como está. */
  const valido = larg > 0 && alt > 0;
  let dispositivo = "desktop";
  if (valido){
    if (menor < LIMIAR_TELEMOVEL) dispositivo = "telemovel";
    else if (menor < LIMIAR_TABLET && toque) dispositivo = "tablet";
  }
  const orientacao = !valido ? "" : (alt >= larg ? "retrato" : "paisagem");
  return {
    larg, alt, menor, maior, toque, valido, dispositivo, orientacao,
    /* O caso apertado: pouca altura e largura a sobrar. É o telemóvel
       deitado, e também o tablet pequeno virado — o desenho que serve um
       serve o outro, porque o problema é o mesmo. */
    deitado: valido && orientacao === "paisagem" && alt < 500,
  };
}

function aplicarOrientacao(){
  const e = classificarEcra();
  const raiz = document.documentElement;
  const mudouOrientacao = ui.ecra && ui.ecra.orientacao !== e.orientacao;
  const mudouDispositivo = ui.ecra && ui.ecra.dispositivo !== e.dispositivo;
  ui.ecra = e;

  if (!e.valido){ raiz.removeAttribute("data-orientacao"); raiz.removeAttribute("data-dispositivo"); return e; }
  raiz.setAttribute("data-orientacao", e.orientacao);
  raiz.setAttribute("data-dispositivo", e.dispositivo);
  /* Um atributo só para o caso que muda o desenho todo — telemóvel
     deitado —, para o CSS não ter de o compor a cada regra. Vale também
     para um tablet pequeno virado, que sofre do mesmo: altura escassa. */
  if (e.deitado) raiz.setAttribute("data-deitado", "telemovel");
  else raiz.removeAttribute("data-deitado");

  if (mudouOrientacao || mudouDispositivo){
    /* Ao rodar, o cabeçalho tem de voltar: recolhido em retrato, ficaria
       recolhido em paisagem sem que nenhum gesto o trouxesse de volta. */
    const h = document.querySelector("header");
    if (h) h.classList.remove("recolhido");
    fecharFolhaAcoes();
    const fm = $("#folhaMais"); if (fm) fm.hidden = true;
    /* Repintar só o que depende mesmo da largura — a fita de meses e os
       emblemas. Uma repintura completa reconstruiria o `#app`, e com ele
       os formulários: quem rodasse o telemóvel a meio de escrever um
       movimento perdia o que tinha escrito. O resto do desenho é CSS, e
       trata de si sozinho com os atributos que se acabaram de pôr. */
    clearTimeout(_orientT);
    _orientT = setTimeout(() => {
      try { pintarFita(); pintarEmblemas(); } catch(err){}
    }, 60);
  }
  return e;
}
let _orientT = null;

/* Três fontes para o mesmo acontecimento, porque nenhuma é fiável em todo
   o lado: o `matchMedia` da orientação, o `resize` (que também apanha
   janelas redimensionadas no computador) e a API `screen.orientation`,
   quando existe. `aplicarOrientacao` é idempotente, por isso repetir não
   custa nada. */
if (window.matchMedia){
  const mq = window.matchMedia("(orientation: portrait)");
  const ouvir = () => aplicarOrientacao();
  if (mq.addEventListener) mq.addEventListener("change", ouvir);
  else if (mq.addListener) mq.addListener(ouvir);
}
let _resizeT = null;
window.addEventListener("resize", () => {
  clearTimeout(_resizeT);
  _resizeT = setTimeout(aplicarOrientacao, 120);
}, {passive:true});
if (screen && screen.orientation && screen.orientation.addEventListener){
  screen.orientation.addEventListener("change", () => setTimeout(aplicarOrientacao, 60));
}
window.addEventListener("orientationchange", () => setTimeout(aplicarOrientacao, 60));

let _ultimoScroll = 0;
window.addEventListener("scroll", () => {
  // O cabeçalho recolhe onde a altura é escassa: telemóvel de pé ou deitado
  const e = ui.ecra || classificarEcra();
  if (!(e.dispositivo === "telemovel" || window.innerWidth <= 640)) return;
  const h = document.querySelector("header");
  const y = window.scrollY;
  if (y < 90 || $("#modalHost").innerHTML || $("#folhaAcoes").classList.contains("aberta")){
    h.classList.remove("recolhido");
  } else if (y > _ultimoScroll + 6){
    h.classList.add("recolhido");
    fecharFolhaAcoes();
  } else if (y < _ultimoScroll - 6){
    h.classList.remove("recolhido");
  }
  _ultimoScroll = y;
}, {passive:true});

/* Deslizar na horizontal muda de mês — o gesto que se espera num
   telemóvel. Ignora deslizes verticais, e o que acontece dentro de
   algo que rola na horizontal (tabelas, gráficos, a fita). */
let _gesto = null;
document.addEventListener("touchstart", (e) => {
  if (e.touches.length !== 1) return;
  const t = e.touches[0];
  const rolavel = e.target.closest && e.target.closest(".tblwrap, .chart, #fitaMeses, .hmap, .mapa, input, select, textarea");
  _gesto = rolavel ? null : {x: t.clientX, y: t.clientY, t: Date.now()};
}, {passive:true});
document.addEventListener("touchend", (e) => {
  if (!_gesto || !e.changedTouches.length) return;
  const g = _gesto; _gesto = null;
  const t = e.changedTouches[0];
  const dx = t.clientX - g.x, dy = t.clientY - g.y;
  if (Date.now() - g.t > 700) return;                    // devagar não é gesto
  if (Math.abs(dx) < 70 || Math.abs(dx) < Math.abs(dy) * 2) return;
  MES = mesShift(MES, dx < 0 ? 1 : -1);
  render();
  toast(mesLabel(MES));
}, {passive:true});

/**
 * Resultados vindos dos dados do agregado — movimentos, ativos, créditos,
 * objetivos, fontes e categorias. Só entram quando há termo de procura.
 */
function comandosDados(t){
  if (t.length < 2) return [];
  const bate = (s) => semAcento(s).indexOf(t) >= 0;
  const out = [];
  S.ativos.filter(a => bate(a.nome)).slice(0, 4).forEach(a =>
    out.push({icone:"🏦", lbl:a.nome+" — "+eur(valorAtivo(a)), tipo:"ativo",
      run: () => { irPara("ativos"); }}));
  S.creditos.filter(c => bate(c.nome)).slice(0, 3).forEach(c =>
    out.push({icone:"🏠", lbl:c.nome+" — "+eur(saldoDevedorMes(c, MES))+" em dívida", tipo:"crédito",
      run: () => { irPara("creditos"); }}));
  S.objetivos.filter(o => bate(o.nome)).slice(0, 3).forEach(o =>
    out.push({icone:"🎯", lbl:o.nome+" — "+eur(poupadoObjetivo(o))+" de "+eur(parseNum(o.alvo)), tipo:"objetivo",
      run: () => { irPara("objetivos"); }}));
  S.planeadas.filter(p => bate(p.nome)).slice(0, 3).forEach(p =>
    out.push({icone:"🛒", lbl:p.nome+" — "+eur(parseNum(p.valor))+
      (p.feitaEm ? " · realizada" : p.mes ? " · marcada para "+mesLabel(p.mes) : " · por marcar"),
      tipo:"compra planeada", run: () => { irPara("planear"); }}));
  S.rendimentos.filter(r => bate(r.nome)).slice(0, 3).forEach(r =>
    out.push({icone:"💶", lbl:r.nome, tipo:"fonte", run: () => { ui.abertos["rd-"+r.id] = true; irPara("rendimentos"); }}));
  S.categorias.filter(c => bate(c.nome)).slice(0, 3).forEach(c =>
    out.push({icone:c.icone || "🏷", lbl:c.nome, tipo:"categoria",
      run: () => { filtros.categoria = c.id; filtros.texto = ""; irPara("movimentos"); }}));
  // Movimentos: procura na descrição, dos mais recentes para trás
  S.movimentos.filter(m => bate(m.descricao || ""))
    .sort((a,b) => String(b.data).localeCompare(String(a.data))).slice(0, 5).forEach(m =>
      out.push({icone:"🧾", lbl:(m.descricao || "—")+" — "+eur(Math.abs(parseNum(m.valor)))+
        " · "+(m.data || "").split("-").reverse().join("/"), tipo:"movimento",
        run: () => { MES = mesDoDia(m.data) || MES; filtros.texto = m.descricao || ""; irPara("movimentos"); }}));
  return out;
}

function filtrarComandos(termo){
  const t = semAcento(termo).trim();

  return lista.filter(c => semAcento(c.lbl).indexOf(t) >= 0).concat(comandosDados(t));

/**
 * Registo em dois toques. O formulário completo tem seis campos e vive
 * dentro de um separador; a maior parte dos movimentos precisa de dois:
 * quanto, e em quê. As categorias oferecidas são as mais usadas nos
 * últimos três meses — o hábito de cada um, não uma lista fixa.
 */
function categoriasFrequentes(n){
  const conta = {};
  for (let i = 0; i < 3; i++){
    const m = mesShift(MES, -i);
    S.movimentos.filter(x => mesDoDia(x.data) === m && x.tipo !== "rendimento" && x.categoriaId)
      .forEach(x => { conta[x.categoriaId] = (conta[x.categoriaId] || 0) + 1; });
  }
  const usadas = Object.keys(conta)
    .filter(id => cat(id))
    .sort((a,b) => conta[b] - conta[a]);
  // Sem histórico suficiente, completa-se com as categorias de despesa do plano
  const doPlano = S.categorias.filter(c => c.tipo === "despesa" &&
    (planoMes(MES).porCat[c.id] || 0) > 0).map(c => c.id);
  const todas = usadas.concat(doPlano.filter(id => usadas.indexOf(id) < 0))
    .concat(S.categorias.filter(c => c.tipo === "despesa").map(c => c.id));
  const vistas = [];
  todas.forEach(id => { if (vistas.indexOf(id) < 0 && cat(id)) vistas.push(id); });
  return vistas.slice(0, n || 6);
}

/**
 * Linha do tempo do desfazer. Desfazer às cegas um passo de cada vez até
 * chegar ao ponto certo é trabalho de paciência; com a lista à frente,
 * salta-se direto. Os rótulos já existiam — só não se viam.
 */
function abrirHistorico(){
  if (!historico.atras.length && !historico.frente.length){
    toast("Ainda não há alterações para desfazer.");
    return;
  }
  const linha = (rot, i, tipo) =>
    '<button class="passoHist" data-hist="'+tipo+'" data-i="'+i+'">'+
      '<span class="hn">'+(tipo === "atras" ? "↶" : "↷")+'</span>'+
      '<span class="ht">'+esc(rot)+'</span>'+
      '<span class="hq">'+(tipo === "atras"
        ? (i === historico.atras.length - 1 ? "desfazer" : "desfazer até aqui")
        : "refazer até aqui")+'</span>'+
    '</button>';

  // Os mais recentes em cima, que é a ordem por que se procura
  const atras = historico.atras.map((h, i) => ({h, i})).reverse()
    .map(x => linha(x.h.rotulo, x.i, "atras")).join("");
  const frente = historico.frente.map((h, i) => ({h, i}))
    .map(x => linha(x.h.rotulo, x.i, "frente")).join("");

  $("#modalHost").innerHTML =
    '<div class="overlay"><div class="dialog" role="dialog" aria-modal="true" style="max-width:520px">'+
    '<h3>Linha do tempo</h3>'+
    '<p>As últimas alterações aos dados. Clique numa para voltar a esse ponto.</p>'+
    (atras ? '<div class="listaHist">'+atras+'</div>' : '<div class="empty">Nada por desfazer.</div>')+
    (frente ? '<h3 style="margin-top:14px;font-size:14px">Por refazer</h3>'+
      '<div class="listaHist">'+frente+'</div>' : '')+
    '<div class="actions"><button class="btn" data-dlg="no">Fechar</button></div>'+
    '</div></div>';
  const host = $("#modalHost");
  const fechar = () => { host.innerHTML = ""; };
  host.querySelector('[data-dlg="no"]').onclick = fechar;
  host.querySelector(".overlay").onclick = (ev) => { if (ev.target === ev.currentTarget) fechar(); };
  host.querySelectorAll("[data-hist]").forEach(b => {
    b.onclick = () => {
      const i = parseInt(b.dataset.i, 10);
      fechar();
      if (b.dataset.hist === "atras"){
        // Desfazer tantos passos quantos os que estão acima do escolhido
        const n = historico.atras.length - i;
        for (let k = 0; k < n && podeDesfazer(); k++) desfazer();
        toast(n === 1 ? "Desfeito." : n+" passos desfeitos.");
      } else {
        const n = historico.frente.length - i;
        for (let k = 0; k < n && podeRefazer(); k++) refazer();
        toast(n === 1 ? "Refeito." : n+" passos refeitos.");
      }
    };
  });
}

document.addEventListener("keydown", (e) => {
  if ((e.ctrlKey || e.metaKey) && (e.key === "k" || e.key === "K")){
    e.preventDefault();
    if (paletaAberta()) fecharPaleta(); else abrirPaleta();
    return;
  }
  /* Desfazer e refazer. Nos campos de texto não se toca: aí o Ctrl+Z é
     o do navegador, e roubá-lo faria perder o que se está a escrever. */
  if ((e.ctrlKey || e.metaKey) && !e.altKey){
    const t = e.target;
    const aEscrever = t && (/^(INPUT|TEXTAREA)$/.test(t.tagName) || t.isContentEditable);
    if (!aEscrever){
      const k = e.key.toLowerCase();
      if (k === "z" && !e.shiftKey){ e.preventDefault(); desfazer(); return; }
      if ((k === "z" && e.shiftKey) || k === "y"){ e.preventDefault(); refazer(); return; }
    }
  }
  // Sequências g/n e a folha "?" — nunca enquanto se escreve num campo
  const alvoTexto = e.target && (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable);
  if (!alvoTexto && !paletaAberta() && !tutorialAtivo() && !e.ctrlKey && !e.metaKey && !e.altKey){
    if (e.key === "?"){ e.preventDefault(); abrirAtalhos(); return; }
    /* Mudar de mês é o gesto mais frequente de todos, e era o único sem
       tecla. `[` e `]` andam para trás e para a frente; `T` volta a hoje. */
    if (e.key === "["){ e.preventDefault(); MES = mesShift(MES, -1); render(); return; }
    if (e.key === "]"){ e.preventDefault(); MES = mesShift(MES,  1); render(); return; }
    if (e.key === "t" || e.key === "T"){
      e.preventDefault();
      const hj = isoMes(hoje());
      if (MES !== hj){ MES = hj; render(); toast("De volta a "+mesLabel(hj)+"."); }
      return;
    }
    if (seqTecla){
      const seq = seqTecla; seqTecla = null; clearTimeout(seqT);
      const t = e.key.toLowerCase();
      if (seq === "g" && SEQ_IR[t]){ e.preventDefault(); irPara(SEQ_IR[t]); return; }
      if (seq === "n" && SEQ_NOVO[t]){
        e.preventDefault();
        irPara(SEQ_NOVO[t][0]);
        const campo = $("#"+SEQ_NOVO[t][1]);
        if (campo){ campo.focus(); campo.scrollIntoView({block:"center"}); }
        return;
      }
    } else if (e.key === "g" || e.key === "n"){
      seqTecla = e.key;
      clearTimeout(seqT);
      seqT = setTimeout(() => { seqTecla = null; }, 1500);
      return;
    }
  } else if (alvoTexto){
    seqTecla = null;
  }
  if (tutorialAtivo()){
    if (e.key === "Escape"){ e.preventDefault(); tutorialFim(false); }
    else if (e.key === "ArrowRight"){ e.preventDefault(); tutorialIr(tutorialPasso + 1); }
    else if (e.key === "ArrowLeft"){ e.preventDefault(); tutorialIr(tutorialPasso - 1); }
    return;
  }
  // O Esc fecha o que estiver por cima — e a folha «Mais» está por cima.
  if (e.key === "Escape" && !$("#folhaMais").hidden){ e.preventDefault(); fecharFolhaMais(); return; }
  /* E tira do relatório. Em uso normal ninguém precisa disto — o relatório
     repõe-se sozinho a seguir à impressão — mas é uma vista sem um único
     botão, e uma vista sem botões tem de ter pelo menos uma saída. */
  if (e.key === "Escape" && ui.relatorio){ e.preventDefault(); ui.relatorio = false; render(); return; }
  if (!paletaAberta()) return;
  if (e.key === "Escape"){ e.preventDefault(); fecharPaleta(); }
  else if (e.key === "ArrowDown"){ e.preventDefault(); paletaSel++; pintarPaleta($("#paletaIn").value); }
  else if (e.key === "ArrowUp"){ e.preventDefault(); paletaSel = Math.max(0, paletaSel - 1); pintarPaleta($("#paletaIn").value); }
  else if (e.key === "Enter"){ e.preventDefault(); executarPaleta(); }
});

/* ---------------------------------------------------------------
   Importação de extratos bancários em CSV
   Deteta o separador, adivinha as colunas pelo cabeçalho, converte
   datas e valores, sugere categorias pelos movimentos já classificados
   e ignora duplicados. Tudo local, como o resto.
   --------------------------------------------------------------- */
function csvParse(texto){
  const linhas = String(texto || "").replace(/\r/g, "").split("\n").filter(l => l.trim() !== "");
  if (!linhas.length) return {sep: ";", linhas: []};
  const primeira = linhas[0];
  const sep = [";", "\t", ","]
    .map(s => [s, primeira.split(s).length - 1])
    .sort((a,b) => b[1] - a[1])[0][0];
  const parseLinha = (l) => {
    const out = []; let cur = "", dentro = false;
    for (let i = 0; i < l.length; i++){
      const ch = l[i];
      if (dentro){
        if (ch === '"'){ if (l[i+1] === '"'){ cur += '"'; i++; } else dentro = false; }
        else cur += ch;
      }
      else if (ch === '"') dentro = true;
      else if (ch === sep){ out.push(cur.trim()); cur = ""; }
      else cur += ch;
    }
    out.push(cur.trim());
    return out;
  };
  return {sep, linhas: linhas.map(parseLinha)};
}

/** Índices prováveis das colunas de data, descrição e valor, pelo cabeçalho. */
function csvAdivinhaColunas(cabecalho){
  const achar = (rx) => cabecalho.findIndex(c => rx.test(semAcento(c)));
  return {
    data:  achar(/data|date/),
    desc:  achar(/desc|memo|movim|detalh|hist/),
    valor: achar(/valor|montante|amount|import|debito|credito/),
  };
}

/**
 * Converte a data de um extrato para ISO (aaaa-mm-dd); null se não for uma
 * data real. A validação do calendário importa: uma linha com «31-02» ou
 * «13» de mês passaria a um movimento que nenhuma vista mensal mostraria.
 */
function csvDataISO(v){
  const s = String(v || "").trim();
  let a, mes, dia;
  let m = s.match(/^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})/);
  if (m){ a = +m[1]; mes = +m[2]; dia = +m[3]; }
  else {
    m = s.match(/^(\d{1,2})[-/.](\d{1,2})[-/.](\d{4})/);
    if (!m) return null;
    dia = +m[1]; mes = +m[2]; a = +m[3];
  }
  if (mes < 1 || mes > 12 || dia < 1) return null;
  if (dia > new Date(a, mes, 0).getDate()) return null;   // dia inexistente nesse mês
  return a + "-" + String(mes).padStart(2,"0") + "-" + String(dia).padStart(2,"0");
}

/**
 * Sugere a categoria: primeiro as regras que o utilizador ensinou, depois
 * a semelhança com movimentos já classificados.
 */
function categoriaSugerida(descricao){
  const d = semAcento(descricao);
  const regra = (S.regrasCategoria || []).find(r => r.categoriaId && d.indexOf(semAcento(r.padrao)) >= 0);
  if (regra) return regra.categoriaId;

  const tokens = semAcento(descricao).split(/[^a-z0-9]+/).filter(t => t.length >= 4);
  if (!tokens.length) return "";
  const votos = {};
  S.movimentos.forEach(m => {
    if (!m.categoriaId || !m.descricao) return;
    const dele = semAcento(m.descricao);
    tokens.forEach(t => {
      if (dele.indexOf(t) >= 0) votos[m.categoriaId] = (votos[m.categoriaId] || 0) + 1;
    });
  });
  const melhor = Object.entries(votos).sort((a,b) => b[1] - a[1])[0];
  return melhor ? melhor[0] : "";
}
