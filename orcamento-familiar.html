      : mesP && !mesMarcado && mesP < MES
      ? '<div class="note" style="margin-top:9px;border-left-color:var(--warn)">O mês marcado ('+esc(mesLabel(mesP))+
        ') já passou — remarque, ou registe a compra se a fez.</div>'
      : "";

    const reserva = reservaMensalPlaneada(p);
    const linhaMarcada = mesP
      ? '<div style="font-size:13px;margin-top:8px">Marcada para <strong>'+esc(mesLabel(mesP))+'</strong>'+
        (reserva > 0.005 ? ' · pôr de parte '+esc(eur(reserva))+'/mês até lá' : '')+
        ' <button class="btn sm ghost no-print" data-act="planMarcar" data-id="'+esc(p.id)+'" data-mes="'+esc(mesP)+'">Desmarcar</button></div>'
      : "";

    // Reserva: ou o convite a criá-la, ou o progresso do objetivo ligado
    const blocoReserva = obj
      ? '<div style="display:flex;align-items:center;gap:10px;margin-top:9px">'+
          anelProgresso(parseNum(p.valor) > 0 ? Math.min(100, poupadoObjetivo(obj) / parseNum(p.valor) * 100) : 0, obj.cor || "var(--accent)", 46)+
          '<div style="font-size:12.5px">Reserva: <strong class="num">'+esc(eur(poupadoObjetivo(obj)))+'</strong> de '+esc(eur(parseNum(obj.alvo)))+
          ' — vive nos <button class="btn sm ghost no-print" data-act="ir" data-view="objetivos">Objetivos</button></div></div>'
      : "";

    // A reserva só vale a pena render se a espera for de um ano ou mais
    const podeEstrategia = mesDiff(MES, mesP || (an && an.melhor ? an.melhor.mes : MES)) >= 12 && parseNum(p.valor) >= 1000;
    const acoes = '<div class="actions no-print" style="margin-top:10px">'+
      (obj ? "" : '<button class="btn sm" data-act="planReservar" data-id="'+esc(p.id)+'">Reservar verba</button> ')+
      '<button class="btn sm" data-act="planRealizar" data-id="'+esc(p.id)+'">Registar a compra</button> '+
      (podeEstrategia ? '<button class="btn sm ghost" data-act="planEstrategia" data-id="'+esc(p.id)+'">Onde guardar a reserva →</button> ' : "")+
      '</div>';

    return '<div class="card">'+
      '<div class="card-head"><div class="t"><h2>'+esc(p.nome)+' — '+esc(eur(parseNum(p.valor)))+'</h2>'+
        '<div class="sub"><span class="tag"><span class="dot" style="background:'+esc(catCor(p.categoriaId))+'"></span>'+
        esc(catRotulo(p.categoriaId))+'</span></div></div>'+
        '<div class="no-print" style="white-space:nowrap">'+
          '<span class="seg" style="margin-right:6px">'+HORIZONTES_PLANEIO.map(h =>
            '<button data-act="planHorizonte" data-id="'+esc(p.id)+'" data-v="'+h+'" aria-pressed="'+(h === p.horizonte)+'">'+h+'m</button>').join("")+'</span>'+
          '<button class="btn sm ghost" data-act="planEditar" data-id="'+esc(p.id)+'" title="Editar">✎</button> '+
          '<button class="btn sm ghost" data-act="planApagar" data-id="'+esc(p.id)+'" title="Eliminar">✕</button>'+
        '</div></div>'+
      (ver ? '<div style="font-size:13px;color:'+corG(ver.grau)+'">'+esc(ver.txt)+'</div>' : "")+
      faixa + avisoMarcado + linhaMarcada + blocoReserva + acoes +
    '</div>';
  }).join('<div style="height:14px"></div>');

  const tabelaFeitas = feitas.length
    ? '<div style="height:16px"></div><div class="card"><div class="card-head"><div class="t"><h2>Já realizadas</h2>'+
      '<div class="sub">Compras planeadas que passaram aos movimentos.</div></div></div>'+
      '<div class="tblwrap"><table><thead><tr><th>O quê</th><th>Categoria</th><th class="r">Valor</th>'+
      '<th>Realizada em</th><th class="no-print"></th></tr></thead><tbody>'+
      feitas.map(p => '<tr><td>'+esc(p.nome)+'</td>'+
        '<td><span class="tag"><span class="dot" style="background:'+esc(catCor(p.categoriaId))+'"></span>'+esc(catRotulo(p.categoriaId))+'</span></td>'+
        '<td class="r num">'+esc(eur(parseNum(p.valor)))+'</td>'+
        '<td>'+esc((p.feitaEm || "").split("-").reverse().join("/"))+'</td>'+
        '<td class="r no-print"><button class="btn sm ghost" data-act="planVerMov" data-id="'+esc(p.id)+'">Ver movimento</button> '+
        '<button class="btn sm ghost" data-act="planApagar" data-id="'+esc(p.id)+'" title="Eliminar">✕</button></td></tr>').join("")+
      '</tbody></table></div></div>' : "";

  const vazio = !pendentes.length && !feitas.length
    ? '<div class="empty">Nada planeado ainda. Escolha um exemplo acima ou descreva a compra — a ferramenta '+
      'diz-lhe em que trimestre ela cabe melhor, olhando à tesouraria dos próximos meses.</div>' : "";

  return '<div class="card"><div class="card-head"><div class="t"><h2>Planear despesa</h2>'+
    '<div class="sub">Compras grandes que podem escolher a data — eletrodomésticos, informática, mobília, veículos. '+
    'A análise usa a projeção de tesouraria: meses de subsídio ajudam, meses de encargos anuais pesam.</div></div></div>'+
    form + vazio +'</div>'+
    (pendentes.length ? '<div style="height:16px"></div>'+cartoes : "")+
    tabelaFeitas;
}

/* ------------------------------- Objetivos ------------------------------- */
/** Anel de progresso com a percentagem no centro. */
function anelProgresso(prog, cor, tamanho){
  const t = tamanho || 74, r = t/2 - 7, c = 2 * Math.PI * r;
  const bruto = parseNum(prog);
  const p = Number.isFinite(bruto) ? Math.max(0, Math.min(100, bruto)) : 0;
  const off = c * (1 - p/100);
  return '<svg class="anel" viewBox="0 0 '+t+' '+t+'" width="'+t+'" height="'+t+'" role="img" '+
    'aria-label="'+esc(pct(p))+' do objetivo">'+
    '<circle cx="'+t/2+'" cy="'+t/2+'" r="'+r+'" fill="none" stroke="var(--surface-3)" stroke-width="8"/>'+
    '<circle class="anel-prog" cx="'+t/2+'" cy="'+t/2+'" r="'+r+'" fill="none" stroke="'+esc(cor)+'" stroke-width="8" '+
      'stroke-linecap="round" stroke-dasharray="'+c.toFixed(1)+'" stroke-dashoffset="'+off.toFixed(1)+'" '+
      'style="--anel-c:'+c.toFixed(1)+'" transform="rotate(-90 '+t/2+' '+t/2+')"/>'+
    '<text x="'+t/2+'" y="'+(t/2 + 5)+'" text-anchor="middle" font-size="'+(t >= 70 ? 15 : 12)+'" '+
      'font-weight="700" fill="var(--text)">'+esc(Math.round(p))+'%</text></svg>';
}

/* Confete de celebração — uma vez por objetivo, e nunca com
   prefers-reduced-motion ativo. */
function festejar(){
  if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const cores = ["#4ade9b","#7aa2ff","#f0b64b","#ff8a7a","#a07ae8","#3a97d4"];
  const host = document.createElement("div");
  host.setAttribute("aria-hidden", "true");
  for (let i = 0; i < 44; i++){
    const f = document.createElement("i");
    f.className = "confete";
    f.style.left = (Math.random()*100).toFixed(1)+"vw";
    f.style.background = cores[i % cores.length];
    f.style.animationDelay = (Math.random()*0.5).toFixed(2)+"s";
    f.style.animationDuration = (1.8 + Math.random()*1.2).toFixed(2)+"s";
    f.style.transform = "rotate("+Math.round(Math.random()*360)+"deg)";
    host.appendChild(f);
  }
  document.body.appendChild(host);
  setTimeout(() => host.remove(), 3600);
}
/** Marca objetivos acabados de concluir e celebra a primeira vez. */
function celebrarConcluidos(){
  let novo = false;
  S.objetivos.forEach(o => {
    const feito = parseNum(o.alvo) > 0 && poupadoObjetivo(o) >= parseNum(o.alvo);
    if (feito && !o.celebrado){ o.celebrado = true; novo = true; }
  });
  if (novo) festejar();
}

/* ===============================================================
   Estratégias de Poupança e Investimento

   Simuladores por objetivo (reforma, entrada de casa, automóvel,
   fundo de emergência, investir). Cada instrumento é projetado com
   o seu tratamento fiscal português de 2026, e a estratégia pode
   ser executada para o orçamento (rubrica + ativo + objetivo).

   Fontes dos valores fiscais (confirmadas em várias):
     · Certificados de Aforro Série F — base = Euribor 3M, máx. 2,5%,
       + prémios de permanência do 2.º ano; juros a 28% (liberatória).
     · Mais-valias mobiliárias (ações, ETF, obrigações) — 28%; se
       detidas < 365 dias e rendimento no último escalão (≥ 86 634 €),
       englobamento obrigatório (até 48%). CIRS art.º 72.º; PwC 2026.
     · Criptoativos — isentos se detidos ≥ 365 dias; senão 28% (2023+).
     · PPR — dedução à coleta de 20% até ao limite pela idade; 8% no
       resgate nas condições legais. EBF art.º 21.º.
     · IMT/IS na compra — Ofício Circulado 40129/2026 da AT; isenção
       jovem ≤ 35 anos até 330 539 € (Continente).
   =============================================================== */

/* IMT 2026 — Continente, habitação própria e permanente.
   imposto = valor × taxa − parcela a abater, exceto nos dois últimos
   escalões, que aplicam uma taxa única sobre todo o valor. */
const IMT_HPP_2026 = [
  {ate:106346,   taxa:0,   abater:0,        unica:false},
  {ate:145470,   taxa:2,   abater:2126.92,  unica:false},
  {ate:198347,   taxa:5,   abater:6491.02,  unica:false},
  {ate:330539,   taxa:7,   abater:10457.96, unica:false},
  {ate:660982,   taxa:8,   abater:13763.35, unica:false},
  {ate:1150853,  taxa:6,   abater:0,        unica:true},
  {ate:Infinity, taxa:7.5, abater:0,        unica:true},
];
const IS_COMPRA_CASA   = 0.8;     // imposto de selo na aquisição (%)
const ISENCAO_JOVEM_IMT = 330539; // isenção total IMT + IS, jovem ≤ 35 (Continente)
const CUSTOS_ESCRITURA = 1200;    // registos + notário, estimativa

/** IMT devido na compra de habitação própria e permanente (Continente). */
function imtCompra(preco, jovem){
  const v = Math.max(0, parseNum(preco));
  if (jovem && v <= ISENCAO_JOVEM_IMT) return 0;
  const e = IMT_HPP_2026.find(x => v <= x.ate) || IMT_HPP_2026[IMT_HPP_2026.length - 1];
  return e.unica ? v * e.taxa / 100 : Math.max(0, v * e.taxa / 100 - e.abater);
}
/** Tudo o que é preciso juntar para comprar: entrada + IMT + selo + escritura. */
function custosCompraCasa(preco, ltv, jovem){
  const p = Math.max(0, parseNum(preco));
  const isento = !!jovem && p <= ISENCAO_JOVEM_IMT;
  const imt  = imtCompra(p, jovem);
  const selo = isento ? 0 : p * IS_COMPRA_CASA / 100;
  const financia = Math.max(0, Math.min(100, parseNum(ltv))) / 100;
  const entrada = p * (1 - financia);
  const custos = imt + selo + CUSTOS_ESCRITURA;
  return {preco:p, entrada, imt, selo, escritura:CUSTOS_ESCRITURA, custos,
          jovemIsento:isento, total: entrada + custos};
}

/* Como cada instrumento é tributado, para efeitos da simulação. */
function modoFiscalEstrategia(k){
  if (k === "ppr") return "ppr";
  const c = classeDe(k);
  if (c.grupo === "mercado") return k === "cripto" ? "cripto" : "mais_valias";
  if (c.fiscal === "capitais") return "juro_anual";
  return "isento";
}
/** Rótulo curto e explicação longa do regime fiscal de um instrumento. */
function tratamentoFiscal(k){
  const tCap = pct(parseNum(S.fiscal.capitais));
  switch (modoFiscalEstrategia(k)){
    case "ppr": return {
      curto:"8% no resgate + dedução no IRS",
      longo:"Não é tributado durante a acumulação. No resgate dentro das condições legais, "+
        pct(parseNum(S.fiscal.pprSaida))+" sobre o rendimento. As entregas dão dedução à coleta de "+
        pct(parseNum(S.fiscal.pprBeneficio))+", até "+eur(limitePPR(parseNum(S.estrategia.idade)))+
        "/ano conforme a idade (EBF art.º 21.º)."};
    case "mais_valias": return {
      curto:"Mais-valias a "+tCap+" no resgate",
      longo:"As mais-valias (categoria G) são tributadas a "+tCap+" à saída, sobre o ganho. Se detiver "+
        "menos de 365 dias e tiver rendimento coletável no último escalão (≥ 86 634 €), o englobamento "+
        "é obrigatório e a taxa efetiva pode subir até 48%."};
    case "cripto": return {
      curto:"Isento ≥ 1 ano; "+tCap+" antes",
      longo:"Criptoativos detidos 365 dias ou mais ficam isentos de mais-valias (declaram-se no anexo G1). "+
        "Vendidos antes de um ano, são tributados a "+tCap+". Regra em vigor desde 2023."};
    case "juro_anual": return {
      curto:"Juros a "+tCap+" (retidos na fonte)",
      longo:"Os juros são tributados a "+tCap+" (taxa liberatória), retidos quando creditados. Nos "+
        "Certificados de Aforro Série F a taxa base segue a média da Euribor a 3 meses, com o máximo de "+
        "2,5%, mais prémios de permanência a partir do 2.º ano."};
    default: return {curto:"Sem imposto relevante", longo:"Sem tributação relevante nesta simulação."};
  }
}

/**
 * Simula uma estratégia mês a mês, com o tratamento fiscal do instrumento.
 * Instrumentos de juro (depósitos, poupança, aforro, obrigações) capitalizam
 * ao retorno líquido — o imposto é retido a cada crédito de juros. Os de
 * mercado e o PPR crescem ao bruto e só pagam imposto no resgate.
 */
function simularEstrategia(cfg){
  const anos = Math.max(0, Math.min(60, Math.round(parseNum(cfg.anos) || 0)));
  const meses = anos * 12;
  const rAnual = parseNum(cfg.retornoBruto) / 100;
  const infl = parseNum(cfg.inflacao) / 100;
  const modo = cfg.modoFiscal;
  const tCap = parseNum(S.fiscal.capitais) / 100;
  const tPPR = parseNum(S.fiscal.pprSaida) / 100;

  const base = 1 + rAnual;
  const rMesBruto = base > 0 ? Math.pow(base, 1/12) - 1 : -1;
  const baseLiq = 1 + rAnual * (1 - tCap);
  const rMesLiq = baseLiq > 0 ? Math.pow(baseLiq, 1/12) - 1 : -1;
  const rMes = (modo === "juro_anual") ? rMesLiq : rMesBruto;

  const inicial = Math.max(0, parseNum(cfg.inicial));
  let saldo = inicial, aportado = inicial;
  let mensal = Math.max(0, parseNum(cfg.mensal));
  const cresc = parseNum(cfg.crescAnual) / 100;
  const limitePprAno = limitePPR(cfg.idade);
  let beneficioPPR = 0;

  const serie = [{ano:0, valor:saldo, aportado:0, real:saldo}];
  for (let m = 1; m <= meses; m++){
    saldo = saldo * (1 + rMes) + mensal;
    aportado += mensal;
    if (m % 12 === 0){
      if (modo === "ppr"){
        beneficioPPR += Math.min(mensal * 12 * parseNum(S.fiscal.pprBeneficio) / 100, limitePprAno);
      }
      mensal *= (1 + cresc);
      const ano = m / 12;
      serie.push({ano, valor:saldo, aportado: aportado - inicial, real: saldo / Math.pow(1 + infl, ano)});
    }
  }

  const valorBruto = saldo;
  const ganho = Math.max(0, valorBruto - aportado);
  let imposto = 0;
  if (modo === "mais_valias") imposto = ganho * tCap;
  else if (modo === "cripto")  imposto = anos >= 1 ? 0 : ganho * tCap;
  else if (modo === "ppr")     imposto = ganho * tPPR;
  const valorLiquido = valorBruto - imposto;
  return {
    anos, aportado, valorBruto, ganho, imposto, valorLiquido, beneficioPPR, modo, serie,
    real: valorLiquido / Math.pow(1 + infl, anos || 0),
    rendimento: valorLiquido - aportado,
  };
}

/* Três cenários de retorno, para a banda do gráfico (mesmos aportes). */
function estrategiaSeries(cfg){
  const mk = (aj) => simularEstrategia(Object.assign({}, cfg, {retornoBruto: parseNum(cfg.retornoBruto) + aj})).serie;
  return {base: mk(CENARIOS.base.aj), otimista: mk(CENARIOS.otimista.aj), pessimista: mk(CENARIOS.pessimista.aj)};
}

/* Poupança mensal necessária para atingir uma meta líquida, por bisseção
   (o valor final é monótono crescente na entrega mensal). */
function mensalParaMeta(cfg, meta){
  const alvo = Math.max(0, parseNum(meta));
  if (alvo <= 0) return 0;
  const val = (mensal) => simularEstrategia(Object.assign({}, cfg, {mensal})).valorLiquido;
  if (val(0) >= alvo) return 0;
  let lo = 0, hi = Math.max(50, alvo / 12);
  for (let i = 0; i < 50 && val(hi) < alvo; i++) hi *= 2;
  for (let i = 0; i < 60; i++){ const mid = (lo + hi) / 2; if (val(mid) < alvo) lo = mid; else hi = mid; }
  return (lo + hi) / 2;
}

/* Renda mensal que um capital sustenta pela regra dos 4% ao ano. */
const rendaSustentavel = (capital) => Math.max(0, parseNum(capital)) * 0.04 / 12;

/* Meta (€) de cada objetivo, e a decomposição que a explica. */
function metaObjetivo(e){
  const o = OBJETIVOS_ESTRATEGIA[e.objetivo] || {};
  if (o.casa){ const c = custosCompraCasa(e.precoCasa, e.ltv, e.jovemImt); return {meta:c.total, casa:c}; }
  if (o.auto) return {meta: Math.max(0, parseNum(e.precoAuto))};
  if (o.emergencia){ const desp = planoMes(MES).desp; return {meta: Math.max(0, parseNum(e.mesesEmerg)) * desp, despMensal:desp}; }
  return {meta: 0};
}

/* Configuração de simulação a partir do estado, com instrumento opcional. */
function cfgEstrategia(e, mensal, instrumento){
  const o = OBJETIVOS_ESTRATEGIA[e.objetivo] || OBJETIVOS_ESTRATEGIA.reforma;
  let inst = instrumento || e.instrumento;
  if (o.instrumentos.indexOf(inst) < 0) inst = o.instrumentos[0];
  return {
    inicial: parseNum(e.inicial),
    mensal: mensal != null ? mensal : parseNum(e.mensal),
    crescAnual: parseNum(e.crescAnual),
    anos: parseNum(e.anos),
    retornoBruto: classeDe(inst).ret,
    inflacao: parseNum(e.inflacao),
    modoFiscal: modoFiscalEstrategia(inst),
    idade: parseNum(e.idade),
    instrumento: inst,
  };
}

      '</tbody></table></div>';

  const sims = o.instrumentos.map(k => ({k, sim: simularEstrategia(cfgEstrategia(e, null, k))}))
    .sort((a,b) => b.sim.valorLiquido - a.sim.valorLiquido);

        esc(classeDe(x.k).lbl)+(sel ? ' ◄' : '')+'</span>'+

      '<span class="v">'+esc(eur0(x.sim.valorLiquido))+'</span>';

  const linhas = sims.map(x => {
    const k = x.k, sel = k === cfg.instrumento;
    return '<tr'+(sel ? ' style="background:rgba(125,138,168,.12)"' : '')+'>'+
      '<td><span class="tag"><span class="dot" style="background:'+esc(classeDe(k).cor)+'"></span>'+esc(classeDe(k).lbl)+(sel ? ' ◄' : '')+'</span></td>'+

    '<tbody>'+linhas+'</tbody></table></div>'+

    'Retornos são estimativas de longo prazo, não garantias.</div>';

  const tf = tratamentoFiscal(cfg.instrumento);
  const notaFiscal = '<div class="note" style="margin-top:12px"><strong>'+esc(classeDe(cfg.instrumento).lbl)+' — tratamento fiscal:</strong> '+esc(tf.longo)+'</div>';

/* ------------------------------- Investimentos ------------------------------- */

/** Comando de deslizador com leitura ao vivo. */
/* ---------------------------------------------------------------
   Escalas de dinheiro

   Um teto de 3 000 000 € com passo linear daria passos de milhares
   no intervalo onde a maioria dos orçamentos vive: cada pixel de
   arrasto valeria dez mil euros. Estas escalas são progressivas —
   passo fino em baixo, grosso em cima — e o deslizador passa a
   mover-se em posições, com o valor em euros derivado delas.
   Cada tramo é [de, até, passo].
   --------------------------------------------------------------- */
const ESCALAS = {
  // Capital acumulado: poupanças, carteiras, PPR já constituído
  capital: [[0, 10000, 100], [10000, 100000, 1000], [100000, 1000000, 10000], [1000000, 3000000, 25000]],
  // Entregas mensais: poupança, reforço de PPR, amortização extra
  mensal:  [[0, 2000, 10], [2000, 20000, 100], [20000, 50000, 500]],
  // Habitação
  casa:    [[50000, 300000, 5000], [300000, 1000000, 25000], [1000000, 3000000, 50000]],
  // Automóvel
  auto:    [[3000, 100000, 1000], [100000, 500000, 5000]],
};

/** Quantas posições tem a escala. */
function escalaPassos(esc){
  return esc.reduce((n, [de, ate, passo]) => n + Math.round((ate - de) / passo), 0);
}
/** Posição → euros. */
function escalaValor(esc, pos){
  let p = Math.max(0, Math.round(parseNum(pos)));
  for (const [de, ate, passo] of esc){
    const n = Math.round((ate - de) / passo);
    if (p <= n) return de + p * passo;
    p -= n;
  }
  return esc[esc.length - 1][1];
}
/** Euros → posição mais próxima (o valor guardado manda, mesmo se vier de fora). */
function escalaPos(esc, valor){
  const v = parseNum(valor);
  let acc = 0;
  for (const [de, ate, passo] of esc){
    const n = Math.round((ate - de) / passo);
    if (v <= ate) return acc + Math.max(0, Math.round((v - de) / passo));
    acc += n;
  }
  return acc;
}

function slider(id, rotulo, valor, min, max, passo, sufixo, escala){
  const tramos = escala ? ESCALAS[escala] : null;
  const v = Number.isFinite(valor) ? valor : (tramos ? tramos[0][0] : min);
  // Com escala, o comando move-se em posições e o valor real vai no
  // aria-valuetext — senão um leitor de ecrã anunciava «237», não «24 000 €».
  const rMin = tramos ? 0 : min, rMax = tramos ? escalaPassos(tramos) : max;
  const rPasso = tramos ? 1 : passo, rValor = tramos ? escalaPos(tramos, v) : v;
  return '<div class="ctrl"><div class="top"><span class="lbl">'+esc(rotulo)+'</span>'+
    '<output id="'+esc(id)+'Out" for="'+esc(id)+'">'+esc(fmtSlider(v, sufixo))+'</output></div>'+
    '<input type="range" id="'+esc(id)+'" data-slider="'+esc(id)+'" data-sufixo="'+esc(sufixo || "")+'" '+
    (escala ? 'data-escala="'+esc(escala)+'" aria-valuetext="'+esc(fmtSlider(v, sufixo))+'" ' : '')+
    'min="'+rMin+'" max="'+rMax+'" step="'+rPasso+'" value="'+esc(rValor)+'" aria-label="'+esc(rotulo)+'"></div>';
}
const fmtSlider = (v, sufixo) =>
  (Math.round(v*10)/10).toLocaleString("pt-PT",{maximumFractionDigits:1}) + (sufixo || "");

/**
 * Resultado da projeção — KPIs, gráfico e tabela de cenários.
 * Isolado dos comandos para poder ser recalculado sem interromper o arrasto.
 */
function projecaoOut(){
  const pr = S.projecao;
  const anos = Math.max(1, Math.min(40, Math.round(parseNum(pr.anos) || 15)));
  const atual = totalCarteira();
  const retEsp = retornoCarteira(S.fiscal.contarIRS !== false);

  const series = {
    base:       projetarCarteira(anos, {ajuste: CENARIOS.base.aj}),
    otimista:   projetarCarteira(anos, {ajuste: CENARIOS.otimista.aj}),
    pessimista: projetarCarteira(anos, {ajuste: CENARIOS.pessimista.aj}),
  };
  const serieCorr = pr.aplicarCorrecao
    ? projetarCarteira(anos, {ajuste: CENARIOS.base.aj,
        correcao:{pct: parseNum(pr.correcaoPct), ano: Math.min(anos, parseNum(pr.correcaoAno))}})
    : null;

  const fimBase = series.base[series.base.length-1];
  const aportadoTotal = atual + fimBase.aportado;
  const rendimento = fimBase.valor - aportadoTotal;

  const cenarioLinhas = Object.entries(CENARIOS).map(([k,c]) => {
    const s = series[k];
    const fim = s[s.length-1];
    return '<tr><td><span class="tag"><span class="dot" style="background:'+c.cor+'"></span>'+esc(c.lbl)+'</span></td>'+
      '<td class="r num">'+esc(pct(retEsp + c.aj))+'</td>'+
      '<td class="r num"><strong>'+esc(eur(fim.valor))+'</strong></td>'+
      '<td class="r num muted">'+esc(eur(fim.real))+'</td>'+
      '<td class="r num '+(fim.valor - aportadoTotal >= 0 ? "pos" : "neg")+'">'+esc(eur(fim.valor - aportadoTotal))+'</td></tr>';
  }).join("") + (serieCorr
    ? (function(){
        const fim = serieCorr[serieCorr.length-1];
        const dif = fim.valor - fimBase.valor;
        return '<tr><td><span class="tag"><span class="dot" style="background:var(--warn)"></span>Base com correção</span></td>'+
          '<td class="r num">'+esc(pct(retEsp))+'</td>'+
          '<td class="r num"><strong>'+esc(eur(fim.valor))+'</strong></td>'+
          '<td class="r num muted">'+esc(eur(fim.real))+'</td>'+
          '<td class="r num neg">'+esc(eur(dif))+' vs. base</td></tr>';
      })()
    : "");

  return '<div class="grid g4" style="margin-bottom:16px">'+
      kpi("Daqui a "+anos+" anos", eur(fimBase.valor), "Cenário base, valor nominal", "accent")+
      kpi("A preços de hoje", eur(fimBase.real), "Descontada a inflação de "+pct(parseNum(pr.inflacao)))+
      kpi("Terá aportado", eur(aportadoTotal), "Atual + "+eur(fimBase.aportado)+" de reforços")+
      kpi("Rendimento gerado", eur(rendimento),
          aportadoTotal > 0 ? pct(rendimento/aportadoTotal*100)+" sobre o aportado" : "", rendimento >= 0 ? "good" : "bad")+
    '</div>'+
    '<div class="tblwrap">'+areaProjecao(series, serieCorr)+'</div>'+
    '<div class="tblwrap" style="margin-top:14px"><table><thead><tr><th>Cenário</th><th class="r">Retorno</th>'+
    '<th class="r">Valor final</th><th class="r">A preços de hoje</th><th class="r">Rendimento</th></tr></thead>'+
    '<tbody>'+cenarioLinhas+'</tbody></table></div>'+
    (serieCorr
      ? '<div class="note" style="margin-top:12px">A correção simulada aplica '+esc(pct(parseNum(pr.correcaoPct)))+
        ' da queda típica de cada classe daqui a '+esc(Math.min(anos, parseNum(pr.correcaoAno)))+' ano(s). '+
        'Com reforços regulares e tempo para recuperar, o efeito de uma queda esbate-se — é esse o argumento a favor de investir com regularidade.</div>'
      : "")+
    '<div class="note" style="margin-top:12px"><strong>Aviso:</strong> projeções são aritmética, não previsões. '+
    'Retornos passados não garantem retornos futuros, e o cálculo não considera impostos, comissões nem a sequência real dos retornos.</div>';
}

          '<input id="ptContrib" inputmode="decimal" placeholder="0,00" value="'+valEur(f.contribuicao)+'"></div>'
        : "")+
    '</div>'+
    // O resto vive dobrado: quem precisa, abre.
    '<details id="ptMais" style="margin-top:9px"'+(temAvancado ? " open" : "")+'>'+
      '<summary style="cursor:pointer;font-size:13px;color:var(--accent)">Mais opções — '+
        (financeiro ? "cotação, retorno, reinvestimento…" : eImovel ? "VPT, arrendamento, valorização…" : eVeiculo ? "IUC, depreciação…" : "valorização, valor atual…")+
      '</summary>'+
      '<div class="row" style="margin-top:9px">'+
        '<div style="flex:0 0 175px"><label class="field" for="ptValorizacao">Retorno / valorização (%/ano)</label>'+
          '<input id="ptValorizacao" inputmode="decimal" placeholder="'+esc(String(cl.ret).replace(".",","))+' (classe)" '+
          'value="'+valDec(f.valorizacao)+'"></div>'+
        '<div style="flex:0 0 165px"><label class="field" for="ptAtual">Valor atual (€) <span class="muted">(opc.)</span></label>'+
          '<input id="ptAtual" inputmode="decimal" placeholder="usa a estimativa" value="'+valEur(f.atual)+'"></div>'+
        (financeiro
          ? '<div style="flex:0 0 115px"><label class="field" for="ptQtd">Unidades</label>'+
            '<input id="ptQtd" inputmode="decimal" placeholder="0" value="'+valDec(f.quantidade)+'"></div>'+
            '<div style="flex:0 0 125px"><label class="field" for="ptCotacao">Cotação (€)</label>'+
            '<input id="ptCotacao" inputmode="decimal" placeholder="0,00" value="'+valDec(f.cotacao)+'"></div>'+
            '<div style="flex:0 0 175px"><label class="field" for="ptCresc">Contribuição cresce (%/ano)</label>'+
            '<input id="ptCresc" inputmode="decimal" placeholder="0" value="'+valDec(f.crescContrib)+'"></div>'+
            '<div style="flex:0 0 155px"><label class="field" for="ptReinv">Reinvestimento (%)</label>'+
            '<input id="ptReinv" inputmode="decimal" placeholder="100" value="'+
            (f.reinvestimento != null && f.reinvestimento !== "" ? esc(String(f.reinvestimento).replace(".",",")) : "")+'"></div>'
          : "")+
        (eImovel
          ? '<div style="flex:0 0 165px"><label class="field" for="ptVpt">VPT (€) <span class="muted">para o IMI</span></label>'+
            '<input id="ptVpt" inputmode="decimal" placeholder="0,00" value="'+valEur(f.vpt)+'"></div>'+
            '<div style="flex:0 0 230px"><label class="field" for="ptContrato">Arrendamento <span class="muted">categoria F</span></label>'+
            '<select id="ptContrato">'+opcContrato+'</select></div>'
          : "")+
        (eVeiculo
          ? '<div style="flex:0 0 150px"><label class="field" for="ptIuc">IUC (€/ano)</label>'+
            '<input id="ptIuc" inputmode="decimal" placeholder="0,00" value="'+valEur(f.iuc)+'"></div>'
          : "")+
        '<div style="flex:0 0 200px"><label class="field" for="ptEncargos">Encargos típicos</label>'+
          '<select id="ptEncargos"><option value="1"'+(f._encargos==="1"?" selected":"")+'>Sugerir os da classe</option>'+
          '<option value="0"'+(f._encargos==="0"?" selected":"")+'>Começar sem encargos</option></select></div>'+
      '</div>'+
    '</details>'+
    '<div class="actions">'+
      '<button class="btn primary" data-act="patSalvar">'+(ed ? "Guardar alterações" : "Adicionar ativo")+'</button>'+
      (ed ? '<button class="btn ghost" data-act="cancelarEd" data-k="pat">Cancelar</button>' : "")+
    '</div>'+
    '<div class="note" style="margin-top:11px">O valor usado é, por esta ordem: <strong>unidades × cotação</strong>, '+
    '<strong>valor atual indicado</strong>, ou a <strong>estimativa</strong> pelo capital aplicado e pela taxa '+
    '(automóveis depreciam por omissão '+esc(pct(-CLASSES.automovel.ret))+' ao ano). '+
    (eImovel ? 'O <strong>VPT</strong> serve para calcular o IMI, que entra no orçamento. ' : "")+
    (eVeiculo ? 'O <strong>IUC</strong> é o valor anual do imposto, que entra no orçamento. ' : "")+
    'Os encargos de posse e os rendimentos acrescentam-se depois em cada ativo; os créditos associam-se no separador Créditos.</div>'+
    '</div>';

  const b = balanco();

  const kpis = '<div class="grid g4" style="margin-bottom:16px">'+
    kpi("Património líquido", eur(b.liquido), "Ativos menos dívida", b.liquido >= 0 ? "good" : "bad")+
    kpi("Ativos totais", eur(b.ativos), eur(b.carteira)+" financeiros + "+eur(b.bens)+" reais", "accent")+
    kpi("Liquidez imediata", eur(totalLiquidez()),
        (function(){
          const p = planoMes(MES);
          const meses = p.desp > 0 ? totalLiquidez()/p.desp : 0;
          return meses > 0 ? meses.toLocaleString("pt-PT",{maximumFractionDigits:1})+" meses de despesa" : "Contas à ordem e poupança";
        })(),
        (function(){ const p = planoMes(MES); const m = p.desp > 0 ? totalLiquidez()/p.desp : 0;
          return m >= 6 ? "good" : m >= 3 ? "warnb" : "bad"; })())+
    kpi("Grau de endividamento", pct(b.ativos > 0 ? b.divida/b.ativos*100 : 0),
        eur(b.divida)+" de dívida",
        b.ativos > 0 && b.divida/b.ativos > 0.6 ? "warnb" : "")+
  '</div>';

  if (!S.ativos.length){
    return '<div class="card"><div class="card-head"><div class="t"><h2>Ativos</h2>'+
      '<div class="sub">Imóveis, automóveis, obras de arte e outros bens — cada um com o seu valor, '+
      'encargos, rendimentos e créditos.</div></div></div>'+
      form+vazioIlustrado("Ainda não há ativos registados","Contas, poupanças, PPR, ETFs, casa, carro — tudo o que tem valor, no mesmo sítio. As poupanças são ativos como os outros.",DESENHOS.ativos)+'</div>'+
      (b.ativos > 0 || b.divida > 0 ? '<div style="height:16px"></div>'+kpis : "");
  }

  const colsPat = {
    nome:    (x) => x.nome || "",
    tipo:    (x) => classeDe(x.classe).lbl,
    aq:      (x) => parseNum(x.aquisicao),
    taxa:    (x) => retornoAtivo(x),
    valor:   (x) => valorAtivo(x),
    obtido:  (x) => { const r = retornoObtido(x); return r ? r.taxa : -999; },
    divida:  (x) => dividaDoAtivo(x),
    liquido: (x) => capitalProprio(x),
    fluxo:   (x) => fluxoAtivo(x).liquido,
  };
  const linhas = ordenado(S.ativos, "pat", colsPat, {col:"valor", dir:-1})
    .map(a => {
      const t = classeDe(a.classe);
      const aq = parseNum(a.aquisicao);
      const val = valorAtivo(a);
      const dividaA = dividaDoAtivo(a);
      const fx = fluxoAtivo(a);
      const obtido = retornoObtido(a);
      const rl = retornoLiquido(a), rb = retornoAtivo(a);
      return '<tr>'+
        '<td><strong>'+esc(a.nome || "—")+'</strong>'+
          (a.dataAquisicao ? '<br><span class="muted" style="font-size:11.5px">desde '+esc(mesLabel(mesDoDia(a.dataAquisicao)))+'</span>' : "")+'</td>'+
        '<td data-lbl="Classe"><span class="tag"><span class="dot" style="background:'+esc(t.cor)+'"></span>'+esc(t.lbl)+'</span></td>'+
        '<td class="r num" data-lbl="Aplicado">'+esc(eur(aq))+'</td>'+
        '<td class="r num" data-lbl="Esperado">'+esc(pct(rb))+
          (Math.abs(rl - rb) > 0.05 ? '<br><span class="muted" style="font-size:11.5px">'+esc(pct(rl))+' líq.</span>' : "")+'</td>'+
        '<td class="r num" data-lbl="Valor"><strong>'+esc(eur(val))+'</strong>'+
          '<br><span class="muted" style="font-size:11.5px">'+esc(origemValor(a))+'</span></td>'+
        '<td class="r num" data-lbl="Obtido">'+(obtido
            ? '<span class="'+(obtido.taxa >= 0 ? "pos" : "neg")+'">'+esc(pct(obtido.taxa))+'</span>'+
              '<br><span class="'+(obtido.parcial ? "warn-txt" : "muted")+'" style="font-size:11.5px"'+
              (obtido.parcial
                ? tipData("TIR sobre aportes incompletos", [
                    ["Aportes registados", eur(obtido.somaAportes)],
                    ["Capital aplicado", eur(parseNum(a.aquisicao))],
                    ["Cobertura", pct(obtido.cobertura*100)],
                  ])
                : "")+'>'+
              esc(obtido.metodo)+(obtido.parcial ? " parcial" : "")+'</span>'
            : '<span class="muted">—</span>')+'</td>'+
        '<td class="r num" data-lbl="Dívida">'+(dividaA > 0 ? '<span class="neg">'+esc(eur(dividaA))+'</span>' : '<span class="muted">—</span>')+'</td>'+
        '<td class="r num" data-lbl="Capital próprio"><strong>'+esc(eur(val - dividaA))+'</strong></td>'+
        '<td class="r num '+(fx.liquido >= 0 ? "pos" : "neg")+'" data-lbl="Fluxo/mês">'+(fx.liquido >= 0 ? "+" : "")+esc(eur(fx.liquido))+'</td>'+
        '<td class="r no-print" style="white-space:nowrap">'+
          '<button class="btn sm ghost" data-act="patAdotar" data-id="'+esc(a.id)+'" title="Atualizar valor">↻</button> '+
          '<button class="btn sm ghost" data-act="patDuplicar" data-id="'+esc(a.id)+'" title="Duplicar">⧉</button> '+'<button class="btn sm ghost" data-act="patEditar" data-id="'+esc(a.id)+'">✎</button> '+
          '<button class="btn sm ghost" data-act="patApagar" data-id="'+esc(a.id)+'">✕</button></td>'+
      '</tr>';
    }).join("");

  const totAq = S.ativos.reduce((s,x) => s + parseNum(x.aquisicao), 0);
  const totVal = S.ativos.reduce((s,x) => s + valorAtivo(x), 0);
  const totDiv = S.ativos.reduce((s,x) => s + dividaDoAtivo(x), 0);
  const totFluxo = S.ativos.reduce((s,x) => s + fluxoAtivo(x).liquido, 0);

  const tabela = '<div class="card"><div class="card-head"><div class="t"><h2>Resumo dos ativos</h2>'+
    '<div class="sub">O valor considerado é o indicado por si; se não indicar, é a estimativa pela taxa de valorização '+
    '(o botão ↻ adota a estimativa). O fluxo mensal é rendimentos menos encargos e serviço da dívida.</div></div></div>'+
    '<div class="tblwrap tblcards"><table><thead><tr>'+
      th("pat","nome","Ativo")+th("pat","tipo","Classe")+th("pat","aq","Aplicado","r")+
      th("pat","taxa","Esperado","r")+th("pat","valor","Valor","r")+
      th("pat","obtido","Obtido","r")+th("pat","divida","Dívida","r")+th("pat","liquido","Capital próprio","r")+
      th("pat","fluxo","Fluxo/mês","r")+
    '<th class="no-print"></th></tr></thead><tbody>'+linhas+'</tbody>'+
    '<tfoot><tr><td colspan="2">Total</td><td class="r num">'+esc(eur(totAq))+'</td><td></td>'+
    '<td class="r num">'+esc(eur(totVal))+'</td><td></td>'+
    '<td class="r num">'+esc(eur(totDiv))+'</td>'+
    '<td class="r num">'+esc(eur(totVal - totDiv))+'</td>'+
    '<td class="r num '+(totFluxo >= 0 ? "pos" : "neg")+'">'+esc(eur(totFluxo))+'</td>'+
    '<td class="no-print"></td></tr></tfoot></table></div>'+
    '<div class="note" style="margin-top:12px">A coluna <strong>Obtido</strong> usa a '+
    '<strong>TIR</strong> quando o ativo tem aportes datados — desconta cada entrada à sua própria data, '+
    'pelo que um reforço feito ontem não inflaciona o resultado. Sem aportes registados, cai para o '+
    '<strong>CAGR</strong> sobre a entrada única. Registe os aportes na ficha de cada ativo.</div></div>';

  /* Uma ficha por ativo, com encargos, rendimentos e créditos */
  const fichas = ordenado(S.ativos, "pat", colsPat, {col:"valor", dir:-1})
    .map(fichaAtivo).join('<div style="height:16px"></div>');

  /* Composição do património, por grupo de ativo */
  const porGrupoV = {};
  S.ativos.forEach(x => {
    const g = classeDe(x.classe).grupo;
    porGrupoV[g] = (porGrupoV[g] || 0) + valorAtivo(x);
  });
  const comp = Object.entries(porGrupoV)
    .sort((a,b2) => (GRUPOS_ATIVO[a[0]]||{}).ordem - (GRUPOS_ATIVO[b2[0]]||{}).ordem)
    .map(([k,v]) => ({nome: (GRUPOS_ATIVO[k]||{}).lbl || k, cor: (GRUPOS_ATIVO[k]||{}).cor || "#8892a6", valor: v}));

  const composicao = '<div class="card"><div class="card-head"><div class="t"><h2>Composição dos ativos</h2>'+
    '<div class="sub">Por grupo, antes de deduzir a dívida. Clique numa fatia para a isolar.</div></div></div>'+
    donut(comp, b.ativos, 99, "patComposicao")+
    '<div class="tblwrap" style="margin-top:14px"><table><thead><tr><th>Grupo</th><th class="r">Valor</th>'+
    '<th class="r">Peso</th><th class="r">Retorno esperado</th></tr></thead><tbody>'+
    Object.entries(porGrupoV).sort((a,b2) => (GRUPOS_ATIVO[a[0]]||{}).ordem - (GRUPOS_ATIVO[b2[0]]||{}).ordem)
      .map(([g,v]) => {
        const lista = porGrupoAtivo(g);
        const r = v > 0 ? lista.reduce((s,x) => s + valorAtivo(x)*retornoLiquido(x), 0)/v : 0;
        const meta = GRUPOS_ATIVO[g] || {};
        return '<tr><td><span class="tag"><span class="dot" style="background:'+esc(meta.cor)+'"></span>'+
          esc(meta.lbl)+'</span><br><span class="muted" style="font-size:11.5px">'+esc(meta.desc || "")+'</span></td>'+
          '<td class="r num">'+esc(eur(v))+'</td>'+
          '<td class="r num">'+esc(pct(b.ativos > 0 ? v/b.ativos*100 : 0))+'</td>'+
          '<td class="r num">'+esc(pct(r))+'</td></tr>';
      }).join("")+
    '</tbody></table></div></div>';

  /* Balanço */
  const encargosTot = S.ativos.reduce((s,a) => s + encargosMensais(a), 0);
  const rendasTot = S.ativos.reduce((s,a) => s + rendimentosMensais(a), 0);
  const servicoTot = S.ativos.reduce((s,a) => s + servicoDivida(a), 0);

  const balancoCard = '<div class="card"><div class="card-head"><div class="t"><h2>Balanço patrimonial</h2>'+
    '<div class="sub">Posição em '+esc(mesLabel(MES))+'.</div></div></div>'+
    '<div class="tblwrap"><table><tbody>'+
      '<tr><td>Carteira de investimentos</td><td class="r num">'+esc(eur(b.carteira))+'</td></tr>'+
      '<tr><td>Ativos patrimoniais</td><td class="r num">'+esc(eur(b.bens))+'</td></tr>'+
      '<tr><td><strong>Total de ativos</strong></td><td class="r num"><strong>'+esc(eur(b.ativos))+'</strong></td></tr>'+
      '<tr><td>Capital em dívida</td><td class="r num neg">−'+esc(eur(b.divida))+'</td></tr>'+
    '</tbody><tfoot><tr><td>Património líquido</td>'+
      '<td class="r num '+(b.liquido >= 0 ? "pos" : "neg")+'">'+esc(eur(b.liquido))+'</td></tr></tfoot></table></div>'+
    secao('Fluxo mensal dos ativos')+
    '<div class="tblwrap"><table><tbody>'+
      '<tr><td>Rendimentos (rendas)</td><td class="r num pos">+'+esc(eur(rendasTot))+'</td></tr>'+
      '<tr><td>Encargos de posse</td><td class="r num neg">−'+esc(eur(encargosTot))+'</td></tr>'+
      '<tr><td>Serviço da dívida</td><td class="r num neg">−'+esc(eur(servicoTot))+'</td></tr>'+
    '</tbody><tfoot><tr><td>Fluxo líquido</td>'+
      '<td class="r num '+(rendasTot - encargosTot - servicoTot >= 0 ? "pos" : "neg")+'">'+
      esc(eur(rendasTot - encargosTot - servicoTot))+'</td></tr></tfoot></table></div>'+
    '<div class="note" style="margin-top:12px">Todos estes valores já estão distribuídos pelas categorias do orçamento — '+
    'os juros em <em>Juros de crédito</em>, a amortização em <em>Amortização de capital</em>, e cada encargo na categoria que lhe atribuiu. '+
    'Não estão incluídos saldos de contas à ordem; para os contar, registe-os na carteira como <em>Depósitos a prazo</em> com retorno 0%.</div>'+
    '</div>';

  return '<div class="card"><div class="card-head"><div class="t"><h2>Ativos</h2>'+
    '<div class="sub">Cada ativo é uma entidade: valor e valorização, encargos de posse, rendimentos que gera '+
    'e créditos que o financiam — tudo ligado às categorias do orçamento.</div></div></div>'+
    form+'</div><div style="height:16px"></div>'+
    kpis + tabela + '<div style="height:16px"></div>' +
    '<div class="grid g2">'+composicao+balancoCard+'</div>'+
    (financeiros().length ? '<div style="height:16px"></div>'+testeResistencia() : "")+
    (financeiros().length ? '<div style="height:16px"></div>'+projecaoGlobal() : "")+
    '<div style="height:16px"></div>'+fichas;
}

/**
 * Teste de resistência da componente financeira: aplica a cada classe a
 * queda típica de um mercado em baixa. Não é uma previsão — é para saber
 * a frio, e com antecedência, se aguentaria ver esse número.
 */
function testeResistencia(){
  const atual = totalCarteira();
  const apos = carteiraAposCorrecao();
  const aplicado = totalInvestido();
  const perda = atual - apos;

  const porClasse = {};
  financeiros().forEach(a => {
    const k = CLASSES[a.classe] ? a.classe : "outros";
    porClasse[k] = (porClasse[k] || 0) + valorAtivo(a);
  });

  return '<div class="card"'+aj("Teste de resistência",
      "Não é uma previsão: é um exercício de resistência. Aplica a cada classe a queda típica de um mercado em baixa e mostra onde a carteira ficaria. Serve para decidir a alocação a frio, e não no meio de uma queda.",
      "Valor × (1 − queda da classe)")+
    '><div class="card-head"><div class="t"><h2>Se houver uma correção severa</h2>'+
    '<div class="sub">A liquidez e os certificados não se movem; o que oscila é o que está em mercado.</div></div></div>'+
    '<div class="grid g3" style="margin-bottom:14px">'+
      kpi("Carteira depois", eur(apos), "Valor após a correção", "bad")+
      kpi("Perda potencial", eur(-perda), pct(atual > 0 ? -perda/atual*100 : 0), "bad")+
      kpi("Ainda acima do aplicado?", apos >= aplicado ? "Sim" : "Não",
          apos >= aplicado ? "Mesmo assim ficaria em ganho" : "Ficaria "+eur(apos - aplicado)+" abaixo",
          apos >= aplicado ? "good" : "warnb")+
    '</div>'+
    Object.entries(porClasse).sort((a,b) => b[1] - a[1]).map(([k,v]) => {
      const cl = classeDe(k);
      return '<div style="margin-bottom:10px">'+
        '<div class="barlbl"><span><strong style="color:var(--text)">'+esc(cl.lbl)+'</strong> · queda típica '+esc(pct(cl.queda))+
        '</span><span class="num">'+esc(eur(v))+' → '+esc(eur(v*(1-cl.queda/100)))+'</span></div>'+
        '<div class="bar"'+tipData(cl.lbl, [
          ["Hoje", eur(v)], ["Depois da queda", eur(v*(1-cl.queda/100))],
          ["Queda típica", pct(cl.queda)], ["Risco", cl.risco],
        ])+'><span style="width:'+(100-cl.queda).toFixed(1)+'%;background:'+esc(cl.cor)+'"></span></div></div>';
    }).join("")+
  '</div>';
}

/** Projeção agregada de todos os ativos financeiros. */
function projecaoGlobal(){
  const pr = S.projecao;
  return '<div class="card"><div class="card-head"><div class="t"><h2>Projeção do conjunto financeiro</h2>'+
    '<div class="sub">Todas as poupanças, PPR e carteira somados, com as contribuições de cada um. '+
    'Cada ativo tem também o seu simulador individual, mais abaixo.</div></div></div>'+
    '<div class="grid g4 no-print" style="margin-bottom:16px">'+
      slider("prAnos", "Horizonte", parseNum(pr.anos), 1, 40, 1, " anos")+
      slider("prInfl", "Inflação", parseNum(pr.inflacao), 0, 8, 0.1, "%/ano")+
      '<div class="ctrl"><div class="top"><span class="lbl">Simular uma correção</span></div>'+
        '<div class="seg" style="margin-top:2px">'+
          '<button data-act="prCorr" data-v="0" aria-pressed="'+(!pr.aplicarCorrecao)+'">Não</button>'+
          '<button data-act="prCorr" data-v="1" aria-pressed="'+(!!pr.aplicarCorrecao)+'">Sim</button>'+
        '</div></div>'+
      (pr.aplicarCorrecao
        ? slider("prCorrPct", "Severidade da queda", parseNum(pr.correcaoPct), 10, 150, 5, "%") +
          slider("prCorrAno", "Ocorre daqui a", parseNum(pr.correcaoAno), 1, 30, 1, " anos")
        : "")+
    '</div><div id="projOut">'+projecaoOut()+'</div></div>';
}

/**
 * Ficha de um ativo: indicadores, créditos associados e as tabelas
 * editáveis de encargos e rendimentos, cada linha ligada a uma categoria.
 */
function fichaAtivo(a){
  const t = classeDe(a.classe);
  const val = valorAtivo(a);
  const divida = dividaDoAtivo(a);
  const fx = fluxoAtivo(a);
  const rend = rendibilidade(a);
  const creditos = creditosDoAtivo(a);
  const aq = parseNum(a.aquisicao);
  const alavancagem = val > 0 ? divida/val*100 : 0;
  const obtido = retornoObtido(a);
  const imp = impostoAtivo(a);

  /* Créditos que financiam o ativo, com a decomposição deste mês */
  const blocoCredito = creditos.length
    ? secao('Créditos associados')+
      '<div class="tblwrap"><table><thead><tr><th>Crédito</th><th>Taxa</th><th class="r">Prestação</th>'+
      '<th class="r">Juros</th><th class="r">Capital</th><th class="r">Seguros</th><th class="r">Em dívida</th>'+
      '<th class="no-print"></th></tr></thead><tbody>'+
      creditos.map(c => {
        const p = parcelaMes(c, MES);
        const sd = saldoDevedorMes(c, MES);
        return '<tr><td>'+esc(c.nome || "Crédito")+'</td>'+
          '<td>'+etiquetaTaxa(c)+'</td>'+
          '<td class="r num">'+esc(eur(p ? p.total : 0))+'</td>'+
          '<td class="r num neg">'+esc(eur(p ? p.juros : 0))+'</td>'+
          '<td class="r num pos">'+esc(eur(p ? p.capital : 0))+'</td>'+
          '<td class="r num">'+esc(eur(p ? p.seguro : 0))+'</td>'+
          '<td class="r num">'+esc(eur(sd))+'</td>'+
          '<td class="r no-print"><button class="btn sm ghost" data-act="crEditar" data-id="'+esc(c.id)+'">✎</button></td></tr>';
      }).join("")+
      '</tbody></table></div>'
    : '<div class="note" style="margin-top:14px">Sem crédito associado. Para ligar um, crie-o ou edite-o no separador '+
      '<strong>Créditos</strong> e escolha este ativo.</div>';

  /* Tabelas de encargos e rendimentos */
  const fluxos = (tipo) => {
    const lista = (tipo === "encargo" ? a.encargos : a.rendimentos) || [];
    const emEdicao = editando.fluxo && editando.fluxo.ativoId === a.id && editando.fluxo.tipo === tipo;
    const titulo = tipo === "encargo" ? "Encargos de posse" : "Rendimentos gerados";
    const total = lista.reduce((s,x) => s + parseNum(x.valor) * freqFator(x.frequencia), 0);
    const corpo = lista.length
      ? '<div class="tblwrap"><table><thead><tr><th>Designação</th><th>Categoria</th><th>Periodicidade</th>'+
        '<th class="r">Valor</th><th class="r">Equiv./mês</th><th class="no-print"></th></tr></thead><tbody>'+
        lista.map(x =>
          '<tr><td>'+esc(x.nome || "—")+'</td>'+
          '<td><span class="tag"><span class="dot" style="background:'+esc(catCor(x.categoriaId))+'"></span>'+
            esc(catRotulo(x.categoriaId))+'</span></td>'+
          '<td>'+esc((FREQ[x.frequencia] || FREQ.mensal).lbl)+'</td>'+
          '<td class="r num">'+esc(eur(parseNum(x.valor)))+'</td>'+
          '<td class="r num"><strong>'+esc(eur(parseNum(x.valor) * freqFator(x.frequencia)))+'</strong></td>'+
          '<td class="r no-print" style="white-space:nowrap">'+
            '<button class="btn sm ghost" data-act="fluxoEditar" data-ativo="'+esc(a.id)+'" data-tipo="'+tipo+'" data-id="'+esc(x.id)+'">✎</button> '+
            '<button class="btn sm ghost" data-act="fluxoApagar" data-ativo="'+esc(a.id)+'" data-tipo="'+tipo+'" data-id="'+esc(x.id)+'">✕</button></td></tr>'
        ).join("")+
        '</tbody><tfoot><tr><td colspan="4">Total mensal</td>'+
        '<td class="r num">'+esc(eur(total))+'</td><td class="no-print"></td></tr></tfoot></table></div>'
      : '<div class="empty" style="padding:14px">Sem '+(tipo === "encargo" ? "encargos" : "rendimentos")+' registados.</div>';

    return '<div style="margin-top:16px">'+
      '<div class="card-head" style="margin-bottom:8px"><div class="t">'+
        secao(titulo)+'</div>'+
        '<button class="btn sm no-print" data-act="fluxoNovo" data-ativo="'+esc(a.id)+'" data-tipo="'+tipo+'">+ '+
          (tipo === "encargo" ? "Encargo" : "Rendimento")+'</button></div>'+
      (emEdicao ? formFluxo(a, tipo) : "")+corpo+'</div>';
  };

  const rendibilidadeCard = fx.receita > 0
    ? '<div class="tblwrap" style="margin-top:14px"><table><thead><tr><th>Rendibilidade anual</th>'+
      '<th class="r">Taxa</th><th>Sobre o quê</th></tr></thead><tbody>'+
      '<tr><td>Bruta</td><td class="r num">'+esc(pct(rend.bruta))+'</td>'+
        '<td class="muted">Rendas sobre o valor do ativo</td></tr>'+
      '<tr><td>Líquida</td><td class="r num">'+esc(pct(rend.liquida))+'</td>'+
        '<td class="muted">Descontados encargos e impostos, não o crédito</td></tr>'+
      (rend.propria != null
        ? '<tr><td><strong>Sobre capital próprio</strong> <span class="muted">(cash-on-cash)</span></td>'+
          '<td class="r num '+(rend.propria >= 0 ? "pos" : "neg")+'"><strong>'+esc(pct(rend.propria))+'</strong></td>'+
          '<td class="muted">Fluxo de caixa de '+esc(eur(rend.fluxoAnual))+'/ano sobre '+esc(eur(rend.capitalProprio))+' investidos</td></tr>'
        : '<tr><td>Sobre capital próprio</td><td class="r muted">—</td>'+
          '<td class="muted">Sem capital próprio positivo</td></tr>')+
      '</tbody></table></div>'+
      '<div class="note" style="margin-top:10px">A <strong>líquida</strong> mede o mérito do ativo, independentemente de como foi pago. '+
      'A <strong>cash-on-cash</strong> mede o que o seu dinheiro está a render, já com a alavancagem — '+
      'é maior quando o crédito é barato e menor quando é caro.</div>'
    : "";

  /* Aportes datados, base da TIR */
  const aportes = (a.aportes || []).slice().sort((x,y) => (x.data||"").localeCompare(y.data||""));
  const blocoAportes = classeDe(a.classe).nat === "financeiro"
    ? '<div style="margin-top:16px">'+
      '<div class="card-head" style="margin-bottom:8px"><div class="t">'+
        secao("Aportes registados")+'</div>'+
        '<button class="btn sm no-print" data-act="aporteNovo" data-id="'+esc(a.id)+'">+ Aporte</button></div>'+
      (editando.aporte === a.id ? formAporte(a) : "")+
      (aportes.length
        ? (function(){
            const soma = aportes.reduce((s,x) => s + parseNum(x.valor), 0);
            const aplicado = parseNum(a.aquisicao);
            const desvio = aplicado > 0 ? soma - aplicado : 0;
            return '<div class="tblwrap"><table><thead><tr><th>Data</th><th class="r">Valor</th><th class="no-print"></th></tr></thead><tbody>'+
              aportes.map(x => '<tr><td class="num">'+esc((x.data||"").split("-").reverse().join("/"))+'</td>'+
                '<td class="r num">'+esc(eur(parseNum(x.valor)))+'</td>'+
                '<td class="r no-print"><button class="btn sm ghost" data-act="aporteApagar" data-id="'+esc(a.id)+
                  '" data-ap="'+esc(x.id)+'">✕</button></td></tr>').join("")+
              '</tbody><tfoot><tr><td>Total aportado</td><td class="r num">'+esc(eur(soma))+
              '</td><td class="no-print"></td></tr></tfoot></table></div>'+
              (Math.abs(desvio) > Math.max(1, aplicado*0.02)
                ? '<div class="note" style="margin-top:10px;border-left-color:var(--warn)">'+
                  'Os aportes registados somam '+esc(eur(soma))+', mas o capital aplicado é '+esc(eur(aplicado))+
                  ' — uma diferença de '+esc(eur(Math.abs(desvio)))+'. A TIR está a ser calculada só sobre os aportes registados, '+
                  'pelo que <strong>não reflete toda a história</strong>. Acrescente os que faltam, ou corrija o capital aplicado.</div>'
                : "");
          })()
        : '<div class="note">Sem aportes datados. O retorno obtido está a ser calculado por CAGR sobre a entrada única — '+
          'registe os aportes para passar a TIR, que desconta cada entrada à sua data.</div>')+
      '</div>'
    : "";

  const rendaMes = rendimentosMensais(a);
  const blocoImposto =
    (imp.anual > 0
      ? '<div class="note" style="margin-top:14px"><strong>'+esc(imp.nome)+':</strong> '+esc(eur(imp.anual))+
        '/ano ('+esc(eur(imp.anual/12))+'/mês), já incluído nos encargos e no orçamento.'+
        (imp.estimado ? ' <span class="neg">Estimado sobre o valor de mercado</span> — indique o VPT da caderneta predial para o cálculo correto, que dará bastante menos.' : "")+'</div>'
      : "")+
    (rendaMes > 0 && classeDe(a.classe).fiscal === "imovel"
      ? '<div class="note" style="margin-top:10px"><strong>Categoria F:</strong> '+esc(regimeRenda(a))+
        ', tributado a '+esc(pct(taxaRenda(a)))+' — '+esc(eur(rendaMes * taxaRenda(a) / 100))+
        '/mês sobre '+esc(eur(rendaMes))+' de renda. Contratos mais longos têm taxas mais baixas.</div>'+
        // A renda moderada tem um teto: marcar a opção não basta se a renda o exceder.
        (a.contratoModerada && !elegivelRendaModerada(a)
          ? '<div class="note" style="margin-top:10px;border-left-color:var(--neg)">'+
            '<strong>A renda moderada não se aplica aqui.</strong> A renda de '+esc(eur(rendaMes))+
            '/mês excede o teto de '+esc(eur(parseNum(S.fiscal.limiteRendaModerada)))+
            ' da Lei n.º 9-A/2026, pelo que se aplica a taxa da duração do contrato. '+
            'Escolha o regime correspondente à duração real.</div>'
          : "")+
        (elegivelRendaModerada(a)
          ? '<div class="note" style="margin-top:10px">A taxa de '+esc(pct(parseNum(S.fiscal.rendaModerada)))+
            ' da Lei n.º 9-A/2026 exige contrato de habitação com pelo menos três anos e renda até '+
            esc(eur(parseNum(S.fiscal.limiteRendaModerada)))+'/mês, e vigora até 31 de dezembro de 2029.</div>'
          : "")
      : "");

  /* Com poucos ativos a ficha abre logo; com muitos, abrir tudo daria uma
     parede de cartões com um gráfico cada — e uma repintura lenta. O que
     está fechado não é construído, não só escondido.
     O critério é o número de simuladores, que é o que custa: cada um faz
     três projeções a 240 meses. */
  const chave = "at-" + a.id;
  const comSimulador = S.ativos.filter(x => temSimulador(x.classe)).length;
  const abertoAgora = ui.abertos[chave] != null ? ui.abertos[chave] : comSimulador <= 10;

  return '<div class="card">'+
    '<div class="card-head">'+
      '<button class="btn ghost sm no-print" data-act="alternar" data-id="'+esc(chave)+'" '+
        'aria-expanded="'+abertoAgora+'" title="Mostrar ou esconder o detalhe">'+(abertoAgora ? "▾" : "▸")+'</button>'+
      '<div class="t"><h2>'+esc(a.nome || "Ativo")+'</h2>'+
      '<div class="sub"><span class="tag"><span class="dot" style="background:'+esc(t.cor)+'"></span>'+esc(t.lbl)+'</span> '+
      (a.dataAquisicao ? ' · desde '+esc(mesLabel(mesDoDia(a.dataAquisicao))) : "")+
      ' · '+esc(eur(aq))+' aplicados · esperado '+esc(pct(retornoAtivo(a)))+
      (Math.abs(retornoLiquido(a) - retornoAtivo(a)) > 0.05 ? ' ('+esc(pct(retornoLiquido(a)))+' líquido de imposto)' : "")+
      '</div></div>'+
      '<div class="no-print" style="white-space:nowrap">'+
        '<button class="btn sm ghost" data-act="patAdotar" data-id="'+esc(a.id)+'" title="Atualizar valor">↻</button> '+
        '<button class="btn sm ghost" data-act="patDuplicar" data-id="'+esc(a.id)+'" title="Duplicar">⧉</button> '+'<button class="btn sm ghost" data-act="patEditar" data-id="'+esc(a.id)+'">✎</button> '+
        '<button class="btn sm ghost" data-act="patApagar" data-id="'+esc(a.id)+'">✕</button></div></div>'+
    '<div class="grid g4">'+
      kpi("Valor atual", eur(val), "Valor "+origemValor(a), "accent")+
      kpi("Retorno obtido", obtido ? pct(obtido.taxa) : "—",
          obtido ? (obtido.metodo === "TIR" ? "TIR sobre "+obtido.n+" aporte(s)" : "CAGR sobre a entrada única") : "Sem histórico suficiente",
          obtido ? (obtido.taxa >= retornoAtivo(a) ? "good" : "warnb") : "")+
      kpi("Capital próprio", eur(val - divida),
          divida > 0 ? pct(alavancagem)+" financiado" : "Sem crédito", val - divida >= 0 ? "good" : "bad")+
      kpi("Fluxo mensal", eur(fx.liquido),
          fx.receita > 0 ? "Rendas menos encargos e crédito" : "Só encargos",
          fx.liquido >= 0 ? "good" : "warnb")+
    '</div>'+
    (abertoAgora
      ? rendibilidadeCard + blocoImposto +
        (temSimulador(a.classe) ? simuladorAtivo(a) : "")+
        blocoCredito + blocoAportes + fluxos("encargo") + fluxos("rendimento")
      : '<div class="note no-print" style="margin-top:14px">Clique em ▸ para ver rendibilidade, '+
        (temSimulador(a.classe) ? "simulador de crescimento, " : "")+'créditos, encargos e rendimentos.</div>')+
  '</div>';
}

  return '<div class="form no-print"><h3>Novo aporte</h3>'+
    '<div class="row">'+
      '<div style="flex:0 0 165px"><label class="field" for="apData">Data</label>'+
        '<input type="date" id="apData" value="'+esc(isoDia(hoje()))+'"></div>'+
      '<div style="flex:0 0 150px"><label class="field" for="apValor">Valor (€)</label>'+
        '<input id="apValor" inputmode="decimal" placeholder="0,00"></div>'+
      '<div style="flex:1 1 auto"></div>'+
    '</div>'+
    '<div class="actions">'+
      '<button class="btn primary" data-act="aporteSalvar" data-id="'+esc(a.id)+'">Adicionar</button>'+
      '<button class="btn ghost" data-act="aporteCancelar">Cancelar</button>'+
    '</div>'+
    '<div class="note" style="margin-top:11px">Registe cada entrada de dinheiro com a sua data — '+

/**
 * Painel de simulação de um ativo financeiro: deslizadores de contribuição,
 * crescimento da contribuição, retorno e reinvestimento, com projeção ao vivo.
 * É a mesma ferramenta para PPR, ETF, conta poupança ou certificados — só
 * muda a linguagem e os valores de partida.
 */
function simuladorAtivo(a){
  const p = paramsSimulador(a);
  const cl = classeDe(a.classe);
  const nome = cl.grupo === "reforma" ? "reforma"
             : cl.grupo === "mercado" ? "carteira" : "poupança";
  return '<div style="margin-top:18px;border-top:1px solid var(--border);padding-top:16px">'+
    '<div class="card-head" style="margin-bottom:10px"><div class="t">'+
      '<h3 style="font-size:14px">Simulador de crescimento</h3>'+
      '<div class="sub">Arraste para ver como cada decisão altera o resultado desta '+esc(nome)+'. '+
      'A simulação não altera os dados do ativo.</div></div>'+
    '</div>'+
    '<div class="grid g3 no-print" style="margin-bottom:14px">'+
      slider("simA_contrib", "Contribuição mensal", p.contrib, 0, 50000, 25, " €", "mensal")+
      slider("simA_cresc",   "Cresce por ano",      p.cresc,   0, 15,   0.5, "%")+
      slider("simA_taxa",    "Retorno anual",       p.taxa,   -2, 15,   0.25, "%")+
      slider("simA_reinv",   "Reinvestimento",      p.reinv,   0, 100,  5,   "%")+
      slider("simA_anos",    "Horizonte",           p.anos,    1, 40,   1,   " anos")+
    '</div>'+
    '<div id="simAtivoOut" data-ativo="'+esc(a.id)+'">'+simuladorAtivoOut(a)+'</div>'+
  '</div>';
}

/** Resultado do simulador de um ativo — recalculado ao vivo. */
function simuladorAtivoOut(a){
  const p = paramsSimulador(a);
  const anos = Math.max(1, Math.min(40, Math.round(p.anos)));
  const base = projetarAtivo(a, anos, {contrib: parseNum(a.contribuicao), cresc: parseNum(a.crescContrib),
                                       taxa: retornoLiquido(a), reinv: parseNum(a.reinvestimento)});
  const sim  = projetarAtivo(a, anos, p);
  const cl = classeDe(a.classe);

  const series = {
    base:       sim.serie,
    otimista:   projetarAtivo(a, anos, Object.assign({}, p, {taxa: parseNum(p.taxa) + 2})).serie,
    pessimista: projetarAtivo(a, anos, Object.assign({}, p, {taxa: parseNum(p.taxa) - 3})).serie,
  };
  const dif = sim.fim.valor - base.fim.valor;

  // Benefício fiscal, quando é PPR
  const f = S.fiscal;
  const beneficio = a.classe === "ppr"
    ? Math.min(parseNum(p.contrib) * 12 * parseNum(f.pprBeneficio)/100, parseNum(f.pprLimiteAno))
    : 0;

  // Os botões vivem aqui dentro, e não no cabeçalho, para aparecerem assim
  // que um comando é mexido — o cabeçalho não é repintado a cada arrasto.
  const emSimulacao = ui.simAtivo && ui.simAtivo.id === a.id;
  const acoes = emSimulacao
    ? '<div class="row no-print" style="margin-bottom:14px">'+
      '<div class="shrink"><button class="btn sm primary" data-act="simAplicar" data-id="'+esc(a.id)+'">Aplicar ao ativo</button></div>'+
      '<div class="shrink"><button class="btn sm ghost" data-act="simRepor" data-id="'+esc(a.id)+'">Repor valores do ativo</button></div>'+
      '<div style="flex:1 1 auto;align-self:center;font-size:12.5px;color:var(--muted)">'+
        'Simulação em curso — os dados do ativo continuam intactos.</div>'+
      '</div>'
    : "";

  return acoes +
    '<div class="grid g4" style="margin-bottom:14px">'+
      kpi("Daqui a "+anos+" anos", eur(sim.fim.valor),
          Math.abs(dif) > 1 ? (dif > 0 ? "+" : "")+eur(dif)+" face ao atual" : "Cenário simulado", "accent")+
      kpi("A preços de hoje", eur(sim.fim.real), "Descontada a inflação de "+pct(parseNum(S.projecao.inflacao)))+
      kpi("Terá contribuído", eur(sim.fim.aportado),
          parseNum(p.cresc) > 0 ? "Última contribuição "+eur(sim.contribFinal)+"/mês" : "A "+eur(p.contrib)+"/mês")+
      kpi("Rendimento gerado", eur(sim.rendimentoGerado),
          parseNum(p.reinv) < 100 ? eur(sim.fim.distribuido)+" distribuídos" : "Tudo reinvestido", "good")+
    '</div>'+
    '<div class="tblwrap">'+areaProjecao(series, null)+'</div>'+
    (beneficio > 0
      ? '<div class="note" style="margin-top:12px"><strong>Benefício fiscal do PPR:</strong> '+esc(eur(beneficio))+
        '/ano de dedução à coleta ('+esc(pct(parseNum(f.pprBeneficio)))+' das entregas, até '+
        esc(eur(parseNum(f.pprLimiteAno)))+'). Ao longo de '+anos+' anos são '+esc(eur(beneficio*anos))+
        ' — que não estão incluídos no valor projetado acima. À saída, cumpridas as condições, aplica-se '+
        esc(pct(parseNum(f.pprSaida)))+'.</div>'
      : "")+
    (parseNum(p.reinv) < 100
      ? '<div class="note" style="margin-top:10px">Com '+esc(pct(parseNum(p.reinv)))+' de reinvestimento, '+
        esc(eur(sim.fim.distribuido))+' saem como distribuição ao longo do período em vez de capitalizarem. '+
        'Um ETF de acumulação corresponde a 100%; um de distribuição, ao que reinvestir de facto.</div>'
      : "")+
    (cl.fiscal === "capitais" && retornoAtivo(a) > 0
      ? '<div class="note" style="margin-top:10px">A projeção usa o retorno <strong>líquido de imposto</strong> ('+
        esc(pct(retornoLiquido(a)))+', depois dos '+esc(pct(parseNum(f.capitais)))+' sobre rendimentos de capitais). '+
        'Se a sua conta for tributada só no resgate, use o retorno bruto e desconte no fim.</div>'
      : "");
}

/** Formulário inline para acrescentar ou editar um encargo/rendimento. */
function formFluxo(a, tipo){
  const st = editando.fluxo;
  const lista = (tipo === "encargo" ? a.encargos : a.rendimentos) || [];
  const x = st.id ? lista.find(y => y.id === st.id) : null;
  const f = x || {frequencia:"mensal"};
  const catTipo = tipo === "encargo" ? "despesa" : "rendimento";
  return '<div class="form no-print">'+
    '<h3>'+(x ? "Editar" : "Novo")+' '+(tipo === "encargo" ? "encargo" : "rendimento")+'</h3>'+
    '<div class="row">'+
      '<div style="flex:2 1 180px"><label class="field" for="flNome">Designação</label>'+
        '<input id="flNome" placeholder="'+(tipo === "encargo" ? "Ex.: IMI" : "Ex.: Renda mensal")+
        '" value="'+esc(f.nome || "")+'"></div>'+
      '<div style="flex:1 1 175px"><label class="field" for="flCat">Categoria</label>'+
        selectCategorias("flCat", f.categoriaId, catTipo)+'</div>'+
      '<div style="flex:0 0 120px"><label class="field" for="flValor">Valor (€)</label>'+
        '<input id="flValor" inputmode="decimal" placeholder="0,00" value="'+(x ? esc(fmtNum.format(parseNum(f.valor))) : "")+'"></div>'+
      '<div style="flex:0 0 165px"><label class="field" for="flFreq">Periodicidade</label>'+
        '<select id="flFreq">'+Object.entries(FREQ).map(([k,v]) =>
          '<option value="'+k+'"'+(f.frequencia===k?" selected":"")+'>'+esc(v.lbl)+'</option>').join("")+'</select></div>'+
    '</div>'+
    '<div class="actions">'+
      '<button class="btn primary" data-act="fluxoSalvar" data-ativo="'+esc(a.id)+'" data-tipo="'+tipo+'">'+
        (x ? "Guardar" : "Adicionar")+'</button>'+
      '<button class="btn ghost" data-act="fluxoCancelar">Cancelar</button>'+
    '</div></div>';
}

/**
 * Calculadora do subsídio parental. A remuneração de referência sai das
 * componentes mensais tributáveis da própria fonte — se a licença for de
 * quem ganha ali, o valor vem sozinho.
 */
function calculadoraParental(rd, f){
  const rr = remuneracaoReferencia(rd);
  const chave = f.modalidade || "inicial120";
  const numBebes = f.numBebes != null ? parseNum(f.numBebes) : 1;
  const internamento = f.internamento != null ? parseNum(f.internamento) : 0;
  const s = subsidioParental(rr, chave, {numBebes, internamento});
  return '<div class="row" style="margin-top:9px">'+
      '<div style="flex:1 1 280px"><label class="field" for="cpModalidade">Modalidade da licença</label>'+
        '<select id="cpModalidade">'+PARENTALIDADE.modalidades.map(m =>
          '<option value="'+m.k+'"'+(chave===m.k?" selected":"")+'>'+esc(m.lbl)+' — '+esc(pct(m.pct))+
          ' durante '+m.dias+' dias</option>').join("")+'</select></div>'+
      '<div style="flex:0 0 130px"><label class="field" for="cpNumBebes">Nº de bebés</label>'+
        '<input id="cpNumBebes" inputmode="numeric" placeholder="1" value="'+

/** Calculadora do abono de família, pelo escalão do agregado e pela idade. */
function calculadoraAbono(f){
  const idade = f.idadeMeses != null ? parseNum(f.idadeMeses) : 0;
  const mono = f.monoparental != null ? !!f.monoparental : null;
  const menos36 = f.menos36 != null ? !!f.menos36 : idade < 36;
  const deficiencia = !!f.deficiencia;
  // Conta esta criança mais as outras já marcadas como menores de 36 meses.
  const st = editando.comp;
  const numMenos36 = contarMenos36(st && st.id) + (menos36 ? 1 : 0);
  const a = abonoFamilia(idade, mono, {menos36, deficiencia, numMenos36});
  const check = (id, txt, on) =>
    '<label style="display:inline-flex;align-items:center;gap:7px;font-size:13.5px;white-space:nowrap">'+
    '<input type="checkbox" id="'+id+'"'+(on?" checked":"")+'> '+esc(txt)+'</label>';
  return '<div class="row" style="margin-top:9px">'+
      '<div style="flex:0 0 150px"><label class="field" for="cpIdadeMeses">Idade da criança</label>'+
        '<input id="cpIdadeMeses" inputmode="numeric" placeholder="meses" value="'+
        (f.idadeMeses != null ? esc(parseNum(f.idadeMeses)) : "")+'"></div>'+
      '<div style="flex:0 0 auto;align-self:flex-end">'+
        '<button class="btn sm" data-act="cpCalcAbono">Calcular</button></div>'+
    '</div>'+
    '<div class="row" style="margin-top:9px;gap:16px">'+
      '<div style="flex:0 0 auto">'+check("cpMonoparental", "Família monoparental", a.monoparental)+'</div>'+
      '<div style="flex:0 0 auto">'+check("cpMenos36", "Criança com menos de 36 meses", menos36)+'</div>'+
      '<div style="flex:0 0 auto">'+check("cpDeficiencia", "Criança com deficiência", deficiencia)+'</div>'+
    '</div>'+
    '<div class="note" style="margin-top:10px">'+
      'Rendimento de referência do agregado: <strong>'+esc(eur(a.rendimentoReferencia))+'/ano</strong> '+
      '(rendimento anual a dividir por '+(Math.max(0, Math.round(parseNum(S.fiscal.dependentes)))+1)+
      ') → <strong>'+esc(a.escalao.n)+'.º escalão</strong>.'+
      (a.semDireito
        ? ' <span class="warn-txt">Neste escalão e nesta idade não há direito a abono.</span>'
        : ' Base '+esc(eur(a.base))+'/mês'+
          (a.majMono > 0 ? ' + '+esc(eur(a.majMono))+' (monoparental)' : '')+
          (a.acrescimo36 > 0 ? ' + '+esc(eur(a.acrescimo36))+' (majoração de '+numMenos36+
            ' crianças com menos de 36 meses)' : '')+
          (a.bonusDef > 0 ? ' + '+esc(eur(a.bonusDef))+' (bonificação por deficiência)' : '')+
          ' = <strong>'+esc(eur(a.valor))+'</strong>.')+
      '</div>'+
    (menos36 && numMenos36 < 2
      ? '<div class="note" style="margin-top:8px">A majoração por crianças com menos de 36 meses só se aplica a partir '+
        'da <strong>segunda</strong>. Marque a caixa em cada criança nessa condição para a contagem ficar certa.</div>'
      : "");
}

/** Etiqueta que descreve o regime de taxa de um crédito. */

  if (cr.tipoTaxa === "variavel"){
    const ix = INDEXANTES[cr.indexante] || INDEXANTES.euribor6m;
    return '<span class="tag g-desejos">Variável</span> '+

      esc(pct(parseNum(cr.indexanteValor)))+' + '+esc(pct(parseNum(cr.spread)))+

  return '<span class="tag g-necessidades">Fixa</span> '+
    '<span class="muted" style="font-size:11.5px">'+esc(pct(parseNum(cr.taxaAnual)))+'</span>';
}

/**
 * Resumo e fichas dos créditos, sob o choque de taxa em vigor.
 * Isolado para poder ser recalculado ao vivo enquanto se arrasta o comando.
 */
function creditosOut(){
  const choque = parseNum(S.projecao.choqueTaxa) || 0;
  const p = planoMes(MES), r = realMes(MES);
  const rend = (r.rend > 0 ? r.rend : p.rend);

  const encargoCom = (c) => { const x = parcelaMes(c, MES, choque); return x ? x.total : 0; };
  const totPrest = S.creditos.reduce((s,c) => s + encargoCom(c), 0);
  const totBase  = S.creditos.reduce((s,c) => s + encargoCredito(c, MES), 0);
  const totDivida = S.creditos.reduce((s,c) => s + saldoDevedorMes(c, MES, choque), 0);
  const totJurosFut = S.creditos.reduce((s,c) => s + jurosFuturos(c, MES, choque), 0);
  const esforco = rend > 0 ? totPrest / rend * 100 : 0;
  const delta = totPrest - totBase;

  const resumo = '<div class="grid g4" style="margin-bottom:16px">'+
    kpi("Encargo total/mês", eur(totPrest),
        Math.abs(delta) > 0.005 ? (delta > 0 ? "+" : "")+eur(delta)+" face à taxa atual" : S.creditos.length+" crédito(s)",
        Math.abs(delta) > 0.005 ? "warnb" : "bad")+
    kpi("Capital em dívida", eur(totDivida), "No fim de "+mesLabel(MES))+
    kpi("Juros por pagar", eur(totJurosFut), "De "+mesLabel(MES)+" até ao fim dos prazos", "warnb")+
    kpi("Taxa de esforço", pct(esforco), rend > 0 ? "Sobre "+eur(rend)+" de rendimento" : "Defina rendimentos",
        esforco > 40 ? "bad" : esforco > 33 ? "warnb" : "good")+
  '</div>';

  const cartoes = S.creditos.map(c => {
    const n = prazoCredito(c);
    const pg = pagasAte(c, MES);
    const div = saldoDevedorMes(c, MES, choque);
    const prog = n > 0 ? Math.min(100, pg/n*100) : 0;
    const fim = mesShift(inicioCredito(c), Math.max(0, n-1));
    const anos = amortizacaoAnual(c, choque);
    const parcela = parcelaMes(c, MES, choque);
    const base = parcelaMes(c, MES);
    const jurosT = jurosTotais(c, choque);
    const ativo = c.ativoId ? S.ativos.find(a => a.id === c.ativoId) : null;
    const varia = c.tipoTaxa === "variavel";
    const dif = (parcela && base) ? parcela.total - base.total : 0;

    // Repartição da prestação deste mês
    const jm = parcela ? parcela.juros : 0, cm = parcela ? parcela.capital : 0, sm = parcela ? parcela.seguro : 0;
    const tot = jm + cm + sm;
    const reparticao = tot > 0
      ? '<div class="barlbl" style="margin-top:14px"><span>Repartição da prestação deste mês</span>'+
        '<span class="num">'+esc(eur(tot))+'</span></div>'+
        '<div class="bar" style="height:14px;display:flex">'+
          '<span style="width:'+(jm/tot*100).toFixed(1)+'%;background:var(--neg);border-radius:0" '+
            tipData("Juros", [["Valor", eur(jm)], ["Peso", pct(jm/tot*100)], ["Categoria", catNome(catCredito(c,"juros"))]])+'></span>'+
          '<span style="width:'+(cm/tot*100).toFixed(1)+'%;background:var(--pos);border-radius:0" '+
            tipData("Amortização de capital", [["Valor", eur(cm)], ["Peso", pct(cm/tot*100)], ["Categoria", catNome(catCredito(c,"capital"))]])+'></span>'+
          (sm > 0 ? '<span style="width:'+(sm/tot*100).toFixed(1)+'%;background:var(--warn);border-radius:0" '+
            tipData("Seguros", [["Valor", eur(sm)], ["Categoria", catNome(catCredito(c,"seguro"))]])+'></span>' : "")+
        '</div>'+
        '<div class="legend" style="margin-top:8px">'+
          '<div><span class="dot" style="background:var(--neg)"></span>Juros '+esc(eur(jm))+' → '+esc(catNome(catCredito(c,"juros")))+'</div>'+
          '<div><span class="dot" style="background:var(--pos)"></span>Capital '+esc(eur(cm))+' → '+esc(catNome(catCredito(c,"capital")))+'</div>'+
          (sm > 0 ? '<div><span class="dot" style="background:var(--warn)"></span>Seguros '+esc(eur(sm))+' → '+esc(catNome(catCredito(c,"seguro")))+'</div>' : "")+
        '</div>'
      : "";

    return '<div class="card">'+
      '<div class="card-head"><div class="t"><h2>'+esc(c.nome || "Crédito")+'</h2>'+
        '<div class="sub">'+etiquetaTaxa(c)+' · '+esc(eur(parseNum(c.capital)))+' · '+n+' meses · termina em '+esc(mesLabel(fim))+
        (varia ? ' · revê a cada '+revisaoCredito(c)+' meses' : "")+
        (ativo ? ' · financia <strong>'+esc(ativo.nome)+'</strong>' : "")+'</div></div>'+
        '<div class="no-print" style="white-space:nowrap">'+
          '<button class="btn sm ghost" data-act="crDuplicar" data-id="'+esc(c.id)+'" title="Duplicar">⧉</button> '+
          '<button class="btn sm ghost" data-act="crEditar" data-id="'+esc(c.id)+'">✎</button> '+
          '<button class="btn sm ghost" data-act="crApagar" data-id="'+esc(c.id)+'">✕</button></div></div>'+
      '<div class="grid g4" style="margin-bottom:13px">'+
        kpi("Encargo mensal", eur(parcela ? parcela.total : 0),
            Math.abs(dif) > 0.005 ? (dif > 0 ? "+" : "")+eur(dif)+" com o choque" :
            (parcela ? "Taxa em vigor "+pct(parcela.taxa) : "Fora do prazo"),
            Math.abs(dif) > 0.005 ? "warnb" : "accent")+
        kpi("Em dívida", eur(div), pg+" de "+n+" prestações pagas")+
        kpi("Juros do crédito", eur(jurosT),
            pct(parseNum(c.capital) > 0 ? jurosT/parseNum(c.capital)*100 : 0)+" do capital", "warnb")+
        kpi("Custo total", eur(custoTotalCredito(c, choque)), "Capital + juros + seguros")+
      '</div>'+
      '<div class="barlbl"><span>Amortizado</span><span>'+esc(pct(prog))+'</span></div>'+
      '<div class="bar"><span style="width:'+prog.toFixed(1)+'%;background:var(--accent)"></span></div>'+
      reparticao+
      '<details style="margin-top:14px"><summary style="cursor:pointer;font-size:13.5px;font-weight:600;color:var(--accent)">Mapa de amortização por ano</summary>'+
        '<div class="tblwrap" style="margin-top:9px;max-height:320px;overflow-y:auto"><table>'+
        '<thead><tr><th>Ano</th>'+(varia ? '<th class="r">Taxa</th>' : "")+
        '<th class="r">Pago</th><th class="r">Juros</th><th class="r">Capital</th><th class="r">Em dívida</th></tr></thead><tbody>'+
        anos.map(a => '<tr><td class="num">'+esc(a.ano)+'</td>'+
          (varia ? '<td class="r num">'+esc(pct(a.taxa))+'</td>' : "")+
          '<td class="r num">'+esc(eur(a.pago))+'</td>'+
          '<td class="r num neg">'+esc(eur(a.juros))+'</td>'+
          '<td class="r num pos">'+esc(eur(a.capital))+'</td>'+
          '<td class="r num">'+esc(eur(a.saldo))+'</td></tr>').join("")+
        '</tbody></table></div></details>'+
    '</div>';
  }).join('<div style="height:16px"></div>');

  return resumo + cartaoAmortizar() + cartoes;
}

/**
 * Que dívida amortizar primeiro, e o que rende reforçá-la.
 * A app já sabia a taxa, o capital em dívida e o mapa de amortização de
 * cada crédito; faltava juntar as três coisas e responder à pergunta.
 */
function cartaoAmortizar(){
  const metodo = ui.amortMetodo === "bola" ? "bola" : "avalanche";
  const ordem = ordemAmortizacao(metodo);
  if (ordem.length < 1) return "";

  const extra = ui.amortExtra != null ? ui.amortExtra : 150;
  const alvo = ordem[0];
  const sim = simularReforco(alvo.cr, extra, MES);

  const linhas = ordem.map((x, i) =>
    '<tr'+(i === 0 ? ' style="background:color-mix(in srgb,var(--accent) 9%,transparent)"' : '')+'>'+
    '<td style="width:34px"><span class="ordem'+(i === 0 ? " primeiro" : "")+'">'+(i+1)+'</span></td>'+
    '<td>'+esc(x.cr.nome || "crédito")+(i === 0 ? ' <span class="tag">reforçar este</span>' : "")+'</td>'+
    '<td class="r num">'+esc(pct(x.taxa))+'</td>'+
    '<td class="r num">'+esc(eur(x.divida))+'</td>'+
    '<td class="r num">'+esc(eur(x.prestacao))+'</td></tr>').join("");

  const explicacao = metodo === "avalanche"
    ? "Ataca primeiro a taxa mais alta: é o que poupa mais juros no total."
    : "Ataca primeiro o saldo mais pequeno: um crédito desaparece mais cedo, e isso motiva.";

  const efeito = sim && sim.mesesPoupados > 0
    ? '<div class="note" style="margin-top:12px;border-left-color:var(--pos)">'+
      'Com <strong>'+esc(eur(sim.reforco))+'/mês</strong> a mais em «'+esc(alvo.cr.nome || "crédito")+'»: '+
      'fica pago <strong>'+sim.mesesPoupados+' '+(sim.mesesPoupados === 1 ? "mês" : "meses")+'</strong> antes '+
      '('+esc(mesLabel(sim.fim, true))+' em vez de '+esc(mesLabel(mesShift(MES, sim.mesesAntes-1), true))+') '+
      'e poupa <strong>'+esc(eur(sim.jurosPoupados))+'</strong> de juros.</div>'
    : sim
    ? '<div class="note" style="margin-top:12px">Com este reforço não há ganho de prazo apreciável.</div>'
    : '<div class="note" style="margin-top:12px">Não é possível projetar este crédito com os dados atuais.</div>';

  return '<div class="card"><div class="card-head"><div class="t"><h2>Que dívida amortizar primeiro</h2>'+
    '<div class="sub">'+esc(explicacao)+'</div></div>'+
    '<div class="seg no-print">'+
      '<button data-act="amortMetodo" data-v="avalanche" aria-pressed="'+(metodo === "avalanche")+'">Mais juros</button>'+
      '<button data-act="amortMetodo" data-v="bola" aria-pressed="'+(metodo === "bola")+'">Menor saldo</button>'+
    '</div></div>'+
    '<div class="tblwrap"><table><thead><tr><th></th><th>Crédito</th><th class="r">Taxa</th>'+
    '<th class="r">Em dívida</th><th class="r">Prestação</th></tr></thead><tbody>'+linhas+'</tbody></table></div>'+
    '<div class="no-print" style="margin-top:14px">'+
      slider("amortExtra", "Reforço mensal", extra, 0, 50000, 25, " €", "mensal")+'</div>'+
    efeito+
    '<div class="note" style="margin-top:10px">A projeção usa a taxa corrente de cada crédito. Nos '+
    'indexados a taxa há de mudar, pelo que isto é uma estimativa — e não substitui confirmar com o banco '+
    'as condições de amortização antecipada, que podem ter comissão.</div>'+
    '</div><div style="height:16px"></div>';
}

/**
 * A vista dos eventos de vida. Escolhem-se eventos, afinam-se os

  const escolha = '<div class="card"><div class="card-head"><div class="t"><h2>E se…?</h2>'+
    '<div class="sub">As decisões grandes não se tomam com uma folha em branco. Escolha um acontecimento, '+

    (eventos.length ? '<button class="btn sm ghost no-print" data-act="eseLimpar">Limpar cenário</button>' : '')+
    '</div>'+
    '<div class="perfis no-print">'+Object.entries(EVENTOS_VIDA).map(([k, ev]) =>
      '<button class="perfil" data-act="eseJuntar" data-k="'+esc(k)+'">'+
        '<span class="pi" aria-hidden="true">'+esc(ev.icone)+'</span>'+

        "e cada um traz os seus números para afinar.", DESENHOS.objetivos)+'</div>';

  const cartoes = eventos.map((ev, i) => {
