/* --- Pequenos construtores de marcação, para não repetir o mesmo HTML --- */

/** Título de secção dentro de um cartão. */
const secao = (txt) => '<h3 class="sec">' + esc(txt) + '</h3>';

/** Valor de um campo monetário: formatado quando existe, vazio quando não. */
const valEur = (v) => parseNum(v) ? esc(fmtNum.format(parseNum(v))) : "";

/** Valor de um campo decimal (taxas, unidades), com vírgula decimal. */
const valDec = (v) =>
  (v === "" || v == null || !Number.isFinite(parseNum(v))) ? "" : esc(String(v).replace(".", ","));

/** Atributo de explicação, para pontos que o dicionário não cobre. */
const aj = (titulo, texto, calculo) =>
  ' data-ajuda="' + esc([titulo, texto, calculo || ""].join("§")) + '"';

/** Monta o conteúdo de uma sugestão flutuante: "título§rótulo=valor§…". */
const tipData = (titulo, linhas) =>
  ' data-tip="' + esc([titulo].concat(linhas.map(l => l[0]+"="+l[1])).join("§")) + '"';

function donut(dados, total, legendaMax, chave){
  const itens = dados.filter(d => d.valor > 0).sort((a,b) => b.valor - a.valor);
  const soma = itens.reduce((s,d) => s + d.valor, 0);
  if (soma <= 0){
    return '<div class="empty">Sem dados para representar.</div>';
  }
  const id = chave || "donut";
  const foco = (ui.donutFoco && ui.donutFoco.id === id) ? ui.donutFoco.nome : null;
  const R = 78, r = 50, cx = 95, cy = 95;
  let ang = -Math.PI/2, paths = "";
  for (const d of itens){
    const frac = d.valor / soma;
    const a2 = ang + frac * Math.PI * 2;
    const grande = frac > 0.5 ? 1 : 0;
    const on = foco === d.nome ? " on" : "";
    const tip = tipData(d.nome, [
      ["Valor", eur(d.valor)],
      ["Peso", pct(frac*100)],
    ]);
    // fatia completa (evita um traçado degenerado)
    if (frac > 0.9999){
      paths += '<circle class="slice'+on+'" cx="'+cx+'" cy="'+cy+'" r="'+((R+r)/2)+
        '" fill="none" stroke="'+esc(d.cor)+'" stroke-width="'+(R-r)+'" data-foco="'+esc(d.nome)+'"'+tip+'/>';
    } else {
      const p = (rad, a) => [cx + rad*Math.cos(a), cy + rad*Math.sin(a)];
      const [x1,y1] = p(R, ang),  [x2,y2] = p(R, a2);
      const [x3,y3] = p(r, a2),   [x4,y4] = p(r, ang);
      paths += '<path class="slice'+on+'" d="M'+x1.toFixed(2)+' '+y1.toFixed(2)+
        ' A'+R+' '+R+' 0 '+grande+' 1 '+x2.toFixed(2)+' '+y2.toFixed(2)+
        ' L'+x3.toFixed(2)+' '+y3.toFixed(2)+
        ' A'+r+' '+r+' 0 '+grande+' 0 '+x4.toFixed(2)+' '+y4.toFixed(2)+
        ' Z" fill="'+esc(d.cor)+'" data-foco="'+esc(d.nome)+'"'+tip+'></path>';
    }
    ang = a2;
  }
  // O centro mostra o total ou, com uma fatia em foco, o valor dessa fatia.
  const emFoco = foco ? itens.find(d => d.nome === foco) : null;
  const centro = emFoco ? emFoco.valor : (total != null ? total : soma);
  const rotulo = emFoco ? emFoco.nome : "Total";
  const svg =
    '<svg class="chart'+(foco ? " dim" : "")+'" data-donut="'+esc(id)+
      '" viewBox="0 0 190 190" style="max-width:230px;margin:0 auto" role="img" aria-label="Distribuição por categoria">'+
      paths+
      '<text x="95" y="88" text-anchor="middle" font-size="8.5" fill="currentColor" opacity=".6">'+
        esc(rotulo.length > 26 ? rotulo.slice(0,25)+"…" : rotulo)+'</text>'+
      '<text x="95" y="106" text-anchor="middle" font-size="15" font-weight="700" fill="currentColor">'+esc(eur0(centro))+'</text>'+
      (emFoco ? '<text x="95" y="119" text-anchor="middle" font-size="9" fill="currentColor" opacity=".6">'+
        esc(pct(emFoco.valor/soma*100))+'</text>' : "")+
    '</svg>';
  const lim = legendaMax || 99;
  const leg = itens.slice(0, lim).map(d =>
    '<div data-foco="'+esc(d.nome)+'" data-donut="'+esc(id)+'"'+(foco === d.nome ? ' class="on"' : "")+'>'+
    '<span class="dot" style="background:'+esc(d.cor)+'"></span>'+
    '<span>'+esc(d.nome)+'</span>'+
    '<span class="v">'+esc(eur(d.valor))+' · '+esc(pct(d.valor/soma*100))+'</span></div>'
  ).join("");
  const resto = itens.length > lim
    ? '<div><span class="dot" style="background:var(--muted)"></span><span>Outras ('+(itens.length-lim)+')</span></div>' : "";
  return svg + '<div class="legend">' + leg + resto + '</div>';
}

/** Barras agrupadas: rendimento vs despesa, com linha de saldo. */
function barrasEvolucao(meses){
  const W = 720, H = 240, padL = 52, padR = 12, padT = 14, padB = 30;
  const iw = W - padL - padR, ih = H - padT - padB;
  const max = Math.max(1, ...meses.map(m => Math.max(m.rend, m.desp)));
  const escY = (v) => padT + ih - (v / max) * ih;
  const step = iw / Math.max(1, meses.length);
  const bw = Math.min(20, step * 0.32);

  let grelha = "";
  for (let g = 0; g <= 4; g++){
    const v = max * g / 4, y = escY(v);
    grelha += '<line x1="'+padL+'" y1="'+y.toFixed(1)+'" x2="'+(W-padR)+'" y2="'+y.toFixed(1)+
      '" stroke="currentColor" opacity=".12"/>'+
      '<text x="'+(padL-7)+'" y="'+(y+4).toFixed(1)+'" text-anchor="end" font-size="10" fill="currentColor" opacity=".55">'+
      esc(eur0(v))+'</text>';
  }
  let barras = "", linha = "", pts = [], zonas = "";
  const rotuloCada = Math.ceil(meses.length / 14) || 1;
  meses.forEach((m, k) => {
    const x = padL + step*k + step/2;
    const y1 = escY(m.rend), y2 = escY(m.desp);
    const saldo = m.rend - m.desp;
    barras +=
      '<rect x="'+(x-bw-1.5).toFixed(1)+'" y="'+y1.toFixed(1)+'" width="'+bw+'" height="'+Math.max(0,(padT+ih-y1)).toFixed(1)+
        '" rx="2.5" fill="var(--pos)" opacity=".85"/>'+
      '<rect x="'+(x+1.5).toFixed(1)+'" y="'+y2.toFixed(1)+'" width="'+bw+'" height="'+Math.max(0,(padT+ih-y2)).toFixed(1)+
        '" rx="2.5" fill="var(--neg)" opacity=".85"/>'+
      (k % rotuloCada === 0
        ? '<text x="'+x.toFixed(1)+'" y="'+(H-9)+'" text-anchor="middle" font-size="10" fill="currentColor" opacity=".6">'+
          esc(mesLabel(m.mes, true))+'</text>' : "");
    // Zona sensível ao ponteiro, para a sugestão flutuante
    zonas += '<rect class="hit" x="'+(padL + step*k).toFixed(1)+'" y="'+padT+'" width="'+step.toFixed(1)+'" height="'+ih+'"'+
      tipData(mesLabel(m.mes), [
        ["Rendimento", eur(m.rend)],
        ["Despesa", eur(m.desp)],
        ["Saldo", eur(saldo)],
      ])+'/>';
    pts.push([x, escY(Math.max(0, saldo))]);
  });
  linha = '<polyline fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" points="'+
    pts.map(p => p[0].toFixed(1)+","+p[1].toFixed(1)).join(" ")+'"/>'+
    pts.map(p => '<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="2.6" fill="var(--accent)"/>').join("");

  // Marcos da linha do tempo: aquisições de ativos, inícios de crédito e
  // prazos de objetivos que caem dentro da janela — a narrativa dos números.
  let marcos = "";
  meses.forEach((m, k) => {
    const eventos = []
      .concat(S.ativos.filter(a => mesDoDia(a.dataAquisicao) === m.mes).map(a => "🏦 "+(a.nome || "ativo")))
      .concat(S.creditos.filter(c => mesDoDia(c.inicio) === m.mes).map(c => "💳 Início: "+(c.nome || "crédito")))
      .concat(S.objetivos.filter(o => o.prazo && mesDoDia(o.prazo) === m.mes).map(o => "🎯 Prazo: "+(o.nome || "objetivo")));
    if (!eventos.length) return;
    const x = padL + step*k + step/2;
    marcos += '<line x1="'+x.toFixed(1)+'" y1="'+padT+'" x2="'+x.toFixed(1)+'" y2="'+(padT+ih)+
        '" stroke="var(--warn)" stroke-width="1" stroke-dasharray="2 4" opacity=".6"/>'+
      '<g class="hit" data-marco="1"'+tipData("Marcos de "+mesLabel(m.mes), eventos.map(e => [e, ""]))+'>'+
      '<circle cx="'+x.toFixed(1)+'" cy="'+(padT+4)+'" r="5.5" fill="var(--warn)"/>'+
      '<text x="'+x.toFixed(1)+'" y="'+(padT+7.5)+'" text-anchor="middle" font-size="8" fill="var(--bg)" font-weight="700">'+eventos.length+'</text>'+
      '</g>';
  });

  // Camada de seleção: arrastar sobre o gráfico amplia o período escolhido
  const brush = '<rect id="brushArea" x="'+padL+'" y="'+padT+'" width="'+iw+'" height="'+ih+
    '" fill="transparent" style="cursor:ew-resize" data-brush="1" '+
    'data-l="'+padL+'" data-w="'+iw+'" data-n="'+meses.length+'"/>'+
    '<rect id="brushSel" x="0" y="'+padT+'" width="0" height="'+ih+
    '" fill="var(--accent)" opacity=".18" pointer-events="none"/>';

  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Evolução mensal">'+
    grelha + barras + linha + zonas + marcos + brush + '</svg>'+
    '<div class="legend">'+
      '<div><span class="dot" style="background:var(--pos)"></span>Rendimento</div>'+
      '<div><span class="dot" style="background:var(--neg)"></span>Despesa</div>'+
      '<div><span class="dot" style="background:var(--accent)"></span>Saldo</div>'+
    '</div>';
}

/**
 * Gráfico de projeção: banda entre cenário pessimista e otimista, linha base,
 * linha tracejada do cenário com correção e área do capital efetivamente aportado.
 */
function areaProjecao(series, correcao){
  const W = 720, H = 260, padL = 62, padR = 14, padT = 14, padB = 30;
  const iw = W - padL - padR, ih = H - padT - padB;
  const anos = series.base[series.base.length-1].ano || 1;
  const todos = [].concat(series.otimista, series.base, series.pessimista, correcao || []);
  const max = Math.max(1, ...todos.map(p => p.valor));
  const x = (a) => padL + (a / anos) * iw;
  const y = (v) => padT + ih - (v / max) * ih;
  const pontos = (s) => s.map(p => x(p.ano).toFixed(1) + "," + y(p.valor).toFixed(1)).join(" ");

  let grelha = "";
  for (let g = 0; g <= 4; g++){
    const v = max * g / 4, yy = y(v);
    grelha += '<line x1="'+padL+'" y1="'+yy.toFixed(1)+'" x2="'+(W-padR)+'" y2="'+yy.toFixed(1)+
      '" stroke="currentColor" opacity=".12"/>'+
      '<text x="'+(padL-7)+'" y="'+(yy+4).toFixed(1)+'" text-anchor="end" font-size="10" fill="currentColor" opacity=".55">'+
      esc(eur0(v))+'</text>';
  }
  // Marcas de anos (no máximo 8 rótulos)
  const passo = Math.max(1, Math.ceil(anos / 8));
  let eixoX = "";
  for (let a = 0; a <= anos; a += passo){
    eixoX += '<text x="'+x(a).toFixed(1)+'" y="'+(H-9)+'" text-anchor="middle" font-size="10" fill="currentColor" opacity=".6">'+
      (a === 0 ? "hoje" : a+"a")+'</text>';
  }

  // Banda pessimista→otimista
  const banda = '<polygon fill="var(--accent)" opacity=".13" points="'+
    pontos(series.otimista) + " " +
    series.pessimista.slice().reverse().map(p => x(p.ano).toFixed(1)+","+y(p.valor).toFixed(1)).join(" ") + '"/>';

  // Capital aportado (o que sai do bolso), como referência do que é rendimento
  const aportes = series.base.map(p => ({ano:p.ano, valor: (series.base[0].valor + p.aportado)}));
  const linhaAporte = '<polyline fill="none" stroke="currentColor" opacity=".4" stroke-width="1.5" stroke-dasharray="2 3" points="'+
    aportes.map(p => x(p.ano).toFixed(1)+","+y(p.valor).toFixed(1)).join(" ")+'"/>';

  const linhaBase = '<polyline fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" points="'+
    pontos(series.base)+'"/>';
  const linhaCorr = correcao
    ? '<polyline fill="none" stroke="var(--warn)" stroke-width="2" stroke-dasharray="6 4" stroke-linejoin="round" points="'+
      pontos(correcao)+'"/>' : "";

  const fim = series.base[series.base.length-1];
  const marca = '<circle cx="'+x(fim.ano).toFixed(1)+'" cy="'+y(fim.valor).toFixed(1)+'" r="4" fill="var(--accent)"/>';

  // Zonas sensíveis: uma por ano, com marcador vertical e sugestão flutuante.
  const larg = iw / Math.max(1, series.base.length - 1);
  let zonas = "";
  series.base.forEach((p, k) => {
    if (k === 0) return;
    const px = x(p.ano);
    const linhas = [
      ["Base", eur(p.valor)],
      ["A preços de hoje", eur(p.real)],
      ["Otimista", eur(series.otimista[k].valor)],
      ["Pessimista", eur(series.pessimista[k].valor)],
    ];
    if (correcao) linhas.push(["Com correção", eur(correcao[k].valor)]);
    linhas.push(["Aportado", eur(series.base[0].valor + p.aportado)]);
    zonas +=
      '<g>'+
        '<rect class="hit" x="'+(px - larg/2).toFixed(1)+'" y="'+padT+'" width="'+larg.toFixed(1)+'" height="'+ih+'"'+
          tipData("Daqui a "+p.ano+" ano"+(p.ano === 1 ? "" : "s"), linhas)+'/>'+
        '<g class="guia"><line x1="'+px.toFixed(1)+'" y1="'+padT+'" x2="'+px.toFixed(1)+'" y2="'+(padT+ih)+
          '" stroke="var(--accent)" stroke-width="1" stroke-dasharray="3 3" opacity=".7"/>'+
          '<circle cx="'+px.toFixed(1)+'" cy="'+y(p.valor).toFixed(1)+'" r="4" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/></g>'+
      '</g>';
  });

  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Projeção da carteira">'+
      grelha + banda + linhaAporte + linhaCorr + linhaBase + marca + eixoX + zonas +
    '</svg>'+
    '<div class="legend">'+
      '<div><span class="dot" style="background:var(--accent)"></span>Cenário base</div>'+
      '<div><span class="dot" style="background:var(--accent);opacity:.35"></span>Entre pessimista e otimista</div>'+
      (correcao ? '<div><span class="dot" style="background:var(--warn)"></span>Com correção de mercado</div>' : "")+
      '<div><span class="dot" style="background:var(--muted)"></span>Capital aportado</div>'+
    '</div>';
}

function barra(valor, limite, corOk){
  const p = limite > 0 ? Math.min(100, valor/limite*100) : (valor > 0 ? 100 : 0);
  const excedeu = limite > 0 && valor > limite;
  const perto = !excedeu && p >= 85;
  const cor = excedeu ? "var(--neg)" : perto ? "var(--warn)" : (corOk || "var(--pos)");
  return '<div class="bar"><span style="width:'+p.toFixed(1)+'%;background:'+cor+'"></span></div>';
}

/**
 * Diagrama de fluxo do dinheiro (Sankey a dois andares): do rendimento
 * bruto saem os impostos retidos; do líquido saem os três grupos de
 * despesa e o que sobra. É o gráfico que explica um orçamento num olhar.
 */
function sankeyOrcamento(rend, g, usarReal){
  const fx = fiscalTotal();
  const impostos = Math.max(0, fx.irs + fx.ss);
  const bruto = rend + impostos;
  if (bruto <= 0) return "";

  const nec = Math.max(0, g.necessidades || 0);
  const des = Math.max(0, g.desejos || 0);
  const pou = Math.max(0, g.poupanca || 0);
  const sobra = rend - nec - des - pou;
  const destinos = [
    {lbl:"IRS + Seg. Social", v: impostos, cor:"#5d6a86"},
    {lbl:"Necessidades",      v: nec,      cor:"var(--accent)"},
    {lbl:"Desejos",           v: des,      cor:"var(--warn)"},
    {lbl:"Poupança",          v: pou,      cor:"var(--pos)"},
    sobra >= 0 ? {lbl:"Por atribuir", v: sobra, cor:"#8892a6"}
               : {lbl:"Défice",       v: -sobra, cor:"var(--neg)", defice:true},
  ].filter(d => d.v > 0.005);
  if (!destinos.length) return "";

  const total = destinos.reduce((s,d) => s + d.v, 0);
  const W = 720, H = Math.max(180, 34 * destinos.length + 30), padT = 12, padB = 12;
  const alturaUtil = H - padT - padB, gap = 8;
  const escala = (alturaUtil - gap * (destinos.length - 1)) / total;

  // Barra única à esquerda; à direita, um nó por destino, com fita a ligar.
  const xEsq = 150, xDir = W - 190, larg = 12;
  const altEsq = total * escala;
  const yEsq0 = padT + (alturaUtil - altEsq) / 2;

  let y = padT, yFonte = yEsq0, fitas = "", nos = "", rotulos = "";
  destinos.forEach(d => {
    const h = d.v * escala;
    const y0 = yFonte, y1 = y;
    const xm = (xEsq + larg + xDir) / 2;
    fitas += '<path d="M'+(xEsq+larg)+' '+y0.toFixed(1)+
      ' C'+xm+' '+y0.toFixed(1)+' '+xm+' '+y1.toFixed(1)+' '+xDir+' '+y1.toFixed(1)+
      ' L'+xDir+' '+(y1+h).toFixed(1)+
      ' C'+xm+' '+(y1+h).toFixed(1)+' '+xm+' '+(y0+h).toFixed(1)+' '+(xEsq+larg)+' '+(y0+h).toFixed(1)+
      ' Z" fill="'+d.cor+'" opacity=".42"'+
      tipData(d.lbl, [["Valor", eur(d.v)], ["Peso do bruto", pct(d.v / bruto * 100)]])+
      ' class="hit"/>';
    nos += '<rect x="'+xDir+'" y="'+y1.toFixed(1)+'" width="'+larg+'" height="'+Math.max(2,h).toFixed(1)+
      '" rx="2.5" fill="'+d.cor+'"/>';
    rotulos += '<text x="'+(xDir+larg+8)+'" y="'+(y1 + h/2 + 4).toFixed(1)+'" font-size="12" fill="currentColor">'+
      esc(d.lbl)+'</text>'+
      '<text x="'+(xDir+larg+8)+'" y="'+(y1 + h/2 + 17).toFixed(1)+'" font-size="10.5" fill="currentColor" opacity=".6" class="num">'+
      esc(eur0(d.v))+(d.defice ? " ⚠" : "")+'</text>';
    yFonte += h; y += h + gap;
  });

    '<text x="'+(xEsq-8)+'" y="'+(yEsq0 + altEsq/2 + 12).toFixed(1)+'" text-anchor="end" font-size="11" fill="currentColor" opacity=".65" class="num">'+esc(eur0(bruto))+'</text>'+
    fitas + nos + rotulos + '</svg>';

  return '<div class="card"><div class="card-head"><div class="t"><h2>Para onde vai o dinheiro</h2>'+

    '<div class="tblwrap">'+svg+'</div></div>';
}

/**
 * Resumo narrado do mês anterior: a maior despesa, a categoria que mais
 * cresceu e a poupança face à média — gerado localmente a partir dos dados.
 */
function resumoMensal(){
  const mAnt = mesShift(MES, -1);
  const r = realMes(mAnt);
  if (!(r.rend > 0 || r.desp > 0)) return "";

  const movs = S.movimentos.filter(m => (m.data || "").indexOf(mAnt) === 0);
  const maior = movs.filter(m => m.tipo !== "rendimento")
    .sort((a,b) => Math.abs(parseNum(b.valor)) - Math.abs(parseNum(a.valor)))[0];

  // Categoria que mais cresceu face ao mês antes desse
  const m2 = mesShift(MES, -2);
  const r2 = realMes(m2);
  const base2 = (r2.rend > 0 || r2.desp > 0) ? r2 : planoMes(m2);
  let cresceu = null, delta = 0;
  S.categorias.filter(c => c.tipo === "despesa").forEach(c => {
    const d = (r.porCat[c.id] || 0) - (base2.porCat[c.id] || 0);
    if (d > delta){ delta = d; cresceu = c; }
  });

  // Poupança face à média dos três meses anteriores a esse
  let soma = 0, n = 0;
  for (let i = 2; i <= 4; i++){
    const m = mesShift(MES, -i);
    const rr = realMes(m);
    if (rr.rend > 0 || rr.desp > 0){ soma += rr.saldo; n++; }
  }
  const media = n ? soma / n : null;
  const taxa = r.rend > 0 ? r.saldo / r.rend * 100 : 0;

  const frases = [];
  if (maior) frases.push('A maior despesa foi <strong>'+esc(maior.descricao || "—")+'</strong> ('+
    esc(eur(Math.abs(parseNum(maior.valor))))+', '+esc(catRotulo(maior.categoriaId))+').');
  if (cresceu && delta > 1) frases.push('<strong>'+esc((cresceu.icone ? cresceu.icone+" " : "")+cresceu.nome)+
    '</strong> foi a categoria que mais cresceu: +'+esc(eur(delta))+' face a '+esc(mesLabel(m2, true))+'.');
  frases.push((r.saldo >= 0 ? 'Poupou <strong>'+esc(eur(r.saldo))+'</strong>' :
    'Gastou <strong>'+esc(eur(-r.saldo))+'</strong> acima do que entrou')+
    ' ('+esc(pct(taxa))+' do rendimento)'+
    (media != null ? ' — '+(r.saldo >= media ? 'acima' : 'abaixo')+' da média de '+esc(eur(media))+' dos meses anteriores' : "")+'.');

  return '<div class="card"><div class="card-head"><div class="t"><h2>O seu '+esc(mesLabel(mAnt))+'</h2>'+
    '<div class="sub">Resumo do mês fechado, calculado localmente a partir dos movimentos.</div></div></div>'+
    '<ul style="margin:0;padding-left:20px;font-size:14px;line-height:1.9">'+
    frases.map(f => '<li>'+f+'</li>').join("")+'</ul></div>';
}

/**
 * Mapa anual: categorias em linhas, os 12 meses do ano em colunas, a
 * despesa de cada célula em intensidade de cor. A sazonalidade — energia
 * no inverno, férias no verão — é invisível na vista mensal e óbvia aqui.
 */
function mapaAnual(){
  const ano = MES.slice(0, 4);
  const meses = [];
  for (let m = 1; m <= 12; m++) meses.push(ano + "-" + String(m).padStart(2, "0"));

  const dados = meses.map(m => {
    const r = realMes(m);
    return (r.rend > 0 || r.desp > 0) ? r : planoMes(m);
  });

  const cats = S.categorias.filter(c => c.tipo === "despesa")
    .map(c => ({cat: c, vals: dados.map(d => d.porCat[c.id] || 0)}))
    .map(x => Object.assign(x, {total: x.vals.reduce((s,v) => s + v, 0)}))
    .filter(x => x.total > 0)
    .sort((a,b) => b.total - a.total)
    .slice(0, 12);
  if (!cats.length) return "";

  const iniciais = ["J","F","M","A","M","J","J","A","S","O","N","D"];
  const hojeM = isoMes(hoje());
  let html = '<div class="mapa" style="grid-template-columns:118px repeat(12,minmax(0,1fr))">'+
    '<span></span>'+meses.map((m,i) =>
      '<span class="mh"'+(m === hojeM ? ' style="color:var(--accent)"' : '')+'>'+iniciais[i]+'</span>').join("");

  cats.forEach(x => {
    const max = Math.max(...x.vals);
    html += '<span class="mr" title="'+esc(x.cat.nome)+'">'+esc(catRotulo(x.cat.id))+'</span>';
    x.vals.forEach((v, i) => {
      const alfa = max > 0 ? 0.10 + 0.80 * (v / max) : 0;
      html += '<span class="mc'+(v > 0 ? " hit" : "")+'"'+
        (v > 0 ? ' style="background:color-mix(in srgb,'+esc(x.cat.cor)+' '+(alfa*100).toFixed(0)+'%,var(--surface-2))"'+
          tipData(mesLabel(meses[i])+" · "+x.cat.nome, [["Despesa", eur(v)], ["No ano", eur(x.total)]]) : "")+
        '></span>';
    });
  });
  html += '</div>';

  return '<div class="card"><div class="card-head"><div class="t"><h2>Mapa do ano — '+esc(ano)+'</h2>'+
    '<div class="sub">Despesa por categoria, mês a mês. Meses sem movimentos usam o plano. '+
    'Quanto mais forte a cor, maior o gasto dessa categoria nesse mês.</div></div></div>'+
    '<div class="tblwrap">'+html+'</div></div>';
}

/**
 * Projeção de tesouraria a 12 meses: o saldo acumulado mês a mês, já com
 * os encargos anuais e semestrais no mês em que caem. Mostra *quando* o
 * dinheiro aperta, não apenas se aperta.
 */
function tesourariaProjetada(meses, eventos){
  const n = meses || 12;
  // Sem lista explícita, entram as compras planeadas já marcadas: uma
  // máquina de lavar agendada para outubro é dinheiro que sai em outubro.
  const evs = eventos || eventosPlaneados();
  const serie = [];
  let acumulado = totalLiquidez();
  for (let i = 0; i < n; i++){
    const m = mesShift(MES, i);
    const p = planoMes(m);
    const r = realMes(m);
    const usa = (r.rend > 0 || r.desp > 0) ? r : p;
    const compras = evs.filter(e => e.mes === m).reduce((s,e) => s + e.valor, 0);
    acumulado += usa.saldo - compras;
    serie.push({mes: m, saldo: usa.saldo - compras, compras, acumulado});
  }
  return serie;
}

function cartaoTesouraria(){
  if (!S.rendimentos.length && !S.recorrentes.length) return "";
  const serie = tesourariaProjetada(12);
  const minimo = serie.reduce((a,b) => b.acumulado < a.acumulado ? b : a, serie[0]);
  const fim = serie[serie.length-1];

  const W = 720, H = 200, padL = 58, padR = 14, padT = 14, padB = 28;
  const iw = W - padL - padR, ih = H - padT - padB;
  const vals = serie.map(s => s.acumulado).concat([0]);
  const max = Math.max(...vals), min = Math.min(...vals);
  const amp = (max - min) || 1;
  const x = (i) => padL + (i / Math.max(1, serie.length - 1)) * iw;
  const y = (v) => padT + ih - ((v - min) / amp) * ih;

  let grelha = "";
  for (let g = 0; g <= 3; g++){
    const v = min + amp * g / 3, yy = y(v);
    grelha += '<line x1="'+padL+'" y1="'+yy.toFixed(1)+'" x2="'+(W-padR)+'" y2="'+yy.toFixed(1)+
      '" stroke="currentColor" opacity=".12"/>'+
      '<text x="'+(padL-7)+'" y="'+(yy+4).toFixed(1)+'" text-anchor="end" font-size="10" fill="currentColor" opacity=".55">'+
      esc(eur0(v))+'</text>';
  }
  // Linha do zero, quando visível: é a fronteira que interessa
  const linhaZero = (min < 0 && max > 0)
    ? '<line x1="'+padL+'" y1="'+y(0).toFixed(1)+'" x2="'+(W-padR)+'" y2="'+y(0).toFixed(1)+
      '" stroke="var(--neg)" stroke-width="1.5" stroke-dasharray="4 3" opacity=".8"/>' : "";

  const pts = serie.map((s,i) => x(i).toFixed(1)+","+y(s.acumulado).toFixed(1)).join(" ");
  const area = '<polygon fill="var(--accent)" opacity=".14" points="'+
    padL+','+y(Math.max(min,0)).toFixed(1)+' '+pts+' '+(padL+iw).toFixed(1)+','+y(Math.max(min,0)).toFixed(1)+'"/>';
  const linha = '<polyline fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" points="'+pts+'"/>';

  let zonas = "", eixo = "";
  const passo = Math.ceil(serie.length / 8) || 1;
  serie.forEach((s,i) => {
    const linhasTip = [["Saldo do mês", eur(s.saldo)], ["Acumulado", eur(s.acumulado)]];
    if (s.compras > 0) linhasTip.push(["Compra planeada", eur(s.compras)]);
    zonas += '<rect class="hit" x="'+(x(i) - iw/serie.length/2).toFixed(1)+'" y="'+padT+'" width="'+
      (iw/serie.length).toFixed(1)+'" height="'+ih+'"'+
      tipData(mesLabel(s.mes), linhasTip)+'/>';
    // Losango no mês de uma compra planeada: o degrau tem nome
    if (s.compras > 0) zonas += '<rect x="'+(x(i)-4).toFixed(1)+'" y="'+(y(s.acumulado)-4).toFixed(1)+
      '" width="8" height="8" transform="rotate(45 '+x(i).toFixed(1)+' '+y(s.acumulado).toFixed(1)+
      ')" fill="var(--warn)" stroke="var(--surface)" stroke-width="1.5"/>';
    if (i % passo === 0) eixo += '<text x="'+x(i).toFixed(1)+'" y="'+(H-8)+'" text-anchor="middle" font-size="10" fill="currentColor" opacity=".6">'+
      esc(mesLabel(s.mes, true))+'</text>';
  });
  const marcaMin = minimo.acumulado < 0
    ? '<circle cx="'+x(serie.indexOf(minimo)).toFixed(1)+'" cy="'+y(minimo.acumulado).toFixed(1)+'" r="4.5" fill="var(--neg)"/>' : "";

  const aviso = minimo.acumulado < 0
    ? '<div class="note" style="margin-top:12px;border-left-color:var(--neg)"><strong>Atenção:</strong> a tesouraria '+
      'fica negativa em '+esc(mesLabel(minimo.mes))+' ('+esc(eur(minimo.acumulado))+'). '+
      'Antecipe uma reserva, ou desloque despesas grandes desse mês.</div>'
    : '<div class="note" style="margin-top:12px">A tesouraria mantém-se positiva nos 12 meses, com o mínimo de '+
      esc(eur(minimo.acumulado))+' em '+esc(mesLabel(minimo.mes))+'.</div>';

  const agendadas = serie.filter(s => s.compras > 0);
  const notaCompras = agendadas.length
    ? '<div class="note no-print" style="margin-top:10px">◆ Inclui '+
      (agendadas.length === 1 ? 'a compra planeada' : 'as compras planeadas')+' de '+
      esc(agendadas.map(s => mesLabel(s.mes)+' ('+eur(s.compras)+')').join(", "))+
      ' — geridas em <button class="btn sm ghost" data-act="ir" data-view="planear">Planear despesa</button>.</div>' : "";

  return '<div class="card"><div class="card-head"><div class="t"><h2>Tesouraria a 12 meses</h2>'+
    '<div class="sub">Liquidez de hoje mais o saldo de cada mês, com os encargos anuais e semestrais '+
    'no mês em que caem. Meses sem movimentos usam o plano.</div></div></div>'+
    '<div class="grid g3" style="margin-bottom:14px">'+
      kpi("Liquidez hoje", eur(totalLiquidez()), "Contas à ordem, poupança e depósitos", "accent")+
      kpi("Daqui a 12 meses", eur(fim.acumulado), "Se o plano se cumprir", fim.acumulado >= 0 ? "good" : "bad")+
      kpi("Ponto mais baixo", eur(minimo.acumulado), mesLabel(minimo.mes),
          minimo.acumulado < 0 ? "bad" : "good")+
    '</div>'+
    '<div class="tblwrap"><svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Projeção de tesouraria">'+
    grelha + area + linha + linhaZero + marcaMin + eixo + zonas + '</svg></div>'+ aviso + notaCompras + '</div>';
}

/* ===============================================================
   Arranque por perfil — em vez do ecrã em branco, um ponto de partida

/* Quem vive na casa. As despesas de habitação ficam de fora: a casa é

const PERFIS_AGREGADO = {

    membros:["Titular 1","Titular 2"],
    casa:{renda:800, prestacao:700, condominio:45, manutencao:45, seguros:60},

};

/* Onde se vive — combina-se com qualquer agregado. A casa própria abre
   ainda a pergunta que muda tudo no orçamento: está paga ou tem crédito? */
const PERFIS_HABITACAO = {
  arrendada: {lbl:"A arrendar", icone:"🔑",
    rubricas: (c) => [["Renda de casa","Habitação",c.renda]]},
  propria: {lbl:"Com casa própria", icone:"🏡",
    regimes: {
      paga: {lbl:"Paga", desc:"Sem prestação: ficam o condomínio, a manutenção e os seguros.",
        rubricas: (c) => [["Condomínio","Condomínio",c.condominio],
          ["Manutenção da casa","Manutenção e reparações",c.manutencao],
          ["Seguro multirriscos","Seguros",c.seguros]]},
      credito: {lbl:"Com empréstimo", desc:"Acrescenta a prestação e o seguro de vida.",
        rubricas: (c) => [["Prestação do crédito","Prestações de crédito",c.prestacao],
          ["Condomínio","Condomínio",c.condominio],
          ["Manutenção da casa","Manutenção e reparações",c.manutencao],
          ["Seguro de vida e multirriscos","Seguros",c.seguros]]},
    }},
};

/** As rubricas de habitação da combinação escolhida. */
function rubricasHabitacao(agregado, habitacao, regime){
  const a = PERFIS_AGREGADO[agregado], h = PERFIS_HABITACAO[habitacao];
  if (!a || !h) return [];
  if (!h.regimes) return h.rubricas(a.casa);
  const r = h.regimes[regime] || h.regimes.credito;
  return r.rubricas(a.casa);
}

/**
 * Semeia o ponto de partida: membros, despesas fixas e limites.
 * `habitacao` e `regime` são independentes do agregado — é essa a razão
 * de existirem: a casa não define quem lá vive.
 */
function aplicarPerfil(agregado, habitacao, regime){
  const a = PERFIS_AGREGADO[agregado];
  if (!a) return false;
  const hab = PERFIS_HABITACAO[habitacao] ? habitacao : "arrendada";

  a.membros.forEach(nome => {
    if (!S.membros.some(m => m.nome === nome)) S.membros.push({id: uid("mb"), nome});
  });
  const todas = a.rubricas.concat(rubricasHabitacao(agregado, hab, regime));
  todas.forEach(([nome, cat, valor]) => {
    if (S.recorrentes.some(r => r.nome === nome)) return;
    const catId = catPorNome(cat);
    S.recorrentes.push({id: uid("rec"), tipo:"despesa", nome, categoriaId: catId,
      membroId:"", valor, frequencia:"mensal", inicio: MES+"-01", fim:"", ativo:true});
    if (!(parseNum(S.limites[catId]) > 0)) S.limites[catId] = valor;
  });
  return true;
}

/** Escolha de ponto de partida, no ecrã de boas-vindas. */
function escolhaPerfil(){
  const p = ui.perfil || (ui.perfil = {agregado:null, habitacao:"arrendada", regime:"credito"});
  const casaPropria = p.habitacao === "propria";

  const agregados = '<div class="perfis no-print">'+Object.entries(PERFIS_AGREGADO).map(([k,a]) =>
    '<button class="perfil" data-act="perfilAgregado" data-k="'+k+'" aria-pressed="'+(p.agregado === k)+'">'+
      '<span class="pi" aria-hidden="true">'+a.icone+'</span>'+
      '<span class="pl">'+esc(a.lbl)+'</span>'+
      '<span class="pd">'+esc(a.desc)+'</span>'+
    '</button>').join("")+'</div>';

  const habitacao = '<div class="seg no-print" style="margin-top:11px">'+
    Object.entries(PERFIS_HABITACAO).map(([k,h]) =>
      '<button data-act="perfilHabitacao" data-k="'+k+'" aria-pressed="'+(p.habitacao === k)+'">'+
      h.icone+' '+esc(h.lbl)+'</button>').join("")+'</div>';

  const regimes = casaPropria
    ? '<div class="seg no-print" style="margin-top:8px">'+
      Object.entries(PERFIS_HABITACAO.propria.regimes).map(([k,r]) =>
        '<button data-act="perfilRegime" data-k="'+k+'" aria-pressed="'+(p.regime === k)+'">'+
        esc(r.lbl)+'</button>').join("")+'</div>'+
      '<div class="muted" style="font-size:12px;margin-top:5px">'+
      esc(PERFIS_HABITACAO.propria.regimes[p.regime === "paga" ? "paga" : "credito"].desc)+
      (p.regime !== "paga"
        ? ' A prestação entra como rubrica; para ver os juros separados do capital, acrescente o empréstimo em <strong>Créditos</strong>.'
        : "")+'</div>'
    : "";

  // Pré-visualização do que vai ser criado, para não ser uma caixa fechada
  const previa = p.agregado
    ? (function(){
        const a = PERFIS_AGREGADO[p.agregado];
        const rs = a.rubricas.concat(rubricasHabitacao(p.agregado, p.habitacao, p.regime));
        const total = rs.reduce((s,r) => s + r[2], 0);
        return '<div class="note" style="margin-top:11px">Vai criar <strong>'+a.membros.length+
          ' membro(s)</strong> e <strong>'+rs.length+' despesa(s) fixa(s)</strong>, '+
          eur(total)+'/mês no total — valores de exemplo, para ajustar.</div>'+
          '<div class="actions"><button class="btn primary" data-act="perfilAplicar">Começar assim</button></div>';
      })()
    : '<div class="muted" style="font-size:12px;margin-top:9px">Escolha o agregado para continuar.</div>';

  return agregados + habitacao + regimes + previa;
}

/* ===============================================================
   Antecipação — o que a ferramenta já sabe, mas nunca disse

   Tudo aqui se calcula a partir dos dados do próprio agregado: não
   há datas legais assumidas nem prazos inventados. Cada alerta sabe
   dizer para onde levar quem o clica.
   =============================================================== */

/**
 * Mês da próxima revisão da taxa de um crédito indexado, ou null.
 * Inclusiva no mês corrente: uma revisão que cai já este mês é a que mais
 * interessa avisar, não a seguinte.
 */
function proximaRevisao(cr, mes){
  const passo = revisaoCredito(cr);
  if (!passo || !cr.inicio) return null;
  const ini = mesDoDia(cr.inicio);
  const decorridos = mesDiff(ini, mes || MES);
  if (decorridos <= 0) return ini;
  return mesShift(ini, Math.ceil(decorridos / passo) * passo);
}

/**
 * Tudo o que pede atenção, por ordem de urgência.
 * grau: 2 = urgente (vermelho), 1 = a vigiar (âmbar), 0 = arrumação (azul).
 */
function alertas(){
  const out = [];
  const r = realMes(MES), p = planoMes(MES);
  const usarReal = r.rend > 0 || r.desp > 0;

  // Limites de categoria ultrapassados ou quase
  S.categorias.filter(c => c.tipo === "despesa").forEach(c => {
    const lim = parseNum(S.limites[c.id]);
    if (lim <= 0) return;
    const gasto = r.porCat[c.id] || 0;
    if (gasto <= 0) return;
    const uso = gasto / lim * 100;
    if (uso >= 100){
      out.push({grau:2, icone:"⚠", titulo:(c.icone ? c.icone+" " : "")+c.nome+" passou o limite",
        detalhe: eur(gasto)+" de "+eur(lim)+" · "+diasQueFaltam()+" dias até ao fim do mês",
        vista:"orcamento"});
    } else if (uso >= 85){
      out.push({grau:1, icone:"◔", titulo:(c.icone ? c.icone+" " : "")+c.nome+" perto do limite",
        detalhe: pct(uso)+" usado · restam "+eur(lim - gasto), vista:"orcamento"});
    }
  });

  // Saldo negativo no mês
  const saldo = usarReal ? r.saldo : p.saldo;
  if (saldo < 0){
    out.push({grau:2, icone:"⚠", titulo:"O mês fecha em défice",
      detalhe:"Faltam "+eur(-saldo)+" para cobrir as despesas de "+mesLabel(MES), vista:"despesas"});
  }

  // Categorias fora do habitual, já com a sazonalidade descontada
  anomaliasMes(MES).slice(0, 4).forEach(a => {
    out.push({grau: a.acima ? 1 : 0, icone: a.acima ? "⚡" : "🌱",
      titulo: (a.cat.icone ? a.cat.icone+" " : "")+a.cat.nome+" "+
        pct(Math.abs(a.pct))+(a.acima ? " acima" : " abaixo")+" do habitual",
      detalhe: eur(a.gasto)+" contra "+eur(a.esperado)+" esperados, "+
        BASE_ANOMALIA[a.base]+" ("+a.n+" observações)",
      vista:"movimentos"});
  });

  // Compras planeadas: chegou o mês marcado
  S.planeadas.filter(p => !p.feitaEm && mesValido(p.mes) && p.mes === MES).forEach(p => {
    out.push({grau:1, icone:"🛒", titulo:'Mês marcado para «'+p.nome+'»',
      detalhe: eur(parseNum(p.valor))+" — registe a compra quando a fizer, ou remarque",
      vista:"planear"});
  });

  // Créditos com revisão de taxa próxima
  S.creditos.filter(c => creditoAtivo(c, MES)).forEach(c => {
    const prox = proximaRevisao(c, MES);
    if (!prox) return;
    const faltam = mesDiff(MES, prox);
    if (faltam >= 0 && faltam <= 3){
      out.push({grau:1, icone:"↻", titulo:"«"+(c.nome || "crédito")+"» revê a taxa em "+mesLabel(prox, true),
        detalhe:(INDEXANTES[c.indexante] || {}).lbl ? (INDEXANTES[c.indexante].lbl+" + "+pct(parseNum(c.spread))+" · a prestação pode mudar")
          : "A prestação pode mudar", vista:"creditos"});
    }
  });

  // Taxa de esforço alta
  const prest = S.creditos.reduce((s,c) => s + encargoCredito(c, MES), 0);
  const rend = usarReal ? r.rend : p.rend;
  if (rend > 0 && prest / rend > 0.4){
    out.push({grau:2, icone:"⚠", titulo:"Taxa de esforço acima de 40%",
      detalhe: pct(prest/rend*100)+" do rendimento vai para prestações", vista:"creditos"});
  }

  // Objetivos fora de ritmo
  S.objetivos.forEach(o => {
    const falta = Math.max(0, parseNum(o.alvo) - poupadoObjetivo(o));
    if (falta <= 0 || !o.prazo) return;
    const meses = mesDiff(MES, mesDoDia(o.prazo));
    if (meses < 0){
      out.push({grau:2, icone:"⚠", titulo:"«"+(o.nome || "objetivo")+"» passou do prazo",
        detalhe:"Faltam "+eur(falta)+" e o prazo era "+mesLabel(mesDoDia(o.prazo), true), vista:"objetivos"});
    } else if (meses > 0 && p.saldo > 0 && falta / meses > p.saldo){
      out.push({grau:1, icone:"◔", titulo:"«"+(o.nome || "objetivo")+"» fora de ritmo",
        detalhe:"Exigia "+eur(falta/meses)+"/mês e o saldo previsto é "+eur(p.saldo), vista:"objetivos"});
    }
  });

  // Fundo de emergência curto
  const desp = usarReal ? r.desp : p.desp;
  if (desp > 0 && S.ativos.length){
    const meses = totalLiquidez() / desp;
    if (meses < 3){
      out.push({grau:1, icone:"◔", titulo:"Liquidez abaixo de 3 meses de despesa",
        detalhe: meses.toLocaleString("pt-PT",{maximumFractionDigits:1})+" meses cobertos · referência: 3 a 6",
        vista:"ativos"});
    }
  }

  // Arrumação: movimentos por categorizar
  const semCat = S.movimentos.filter(m => !m.categoriaId).length;
  if (semCat){
    out.push({grau:0, icone:"🏷", titulo:semCat+" movimento(s) sem categoria",
      detalhe:"Sem categoria não entram na regra 50/30/20 nem nos limites", vista:"movimentos"});
  }

  // Arrumação: ativos com valor por confirmar há muito
  const desatualizados = S.ativos.filter(a =>
    origemValor(a) === "estimado" && a.dataAquisicao && anosDesde(a.dataAquisicao) >= 1).length;
  if (desatualizados){
    out.push({grau:0, icone:"↻", titulo:desatualizados+" ativo(s) com valor estimado há mais de um ano",
      detalhe:"O balanço usa a estimativa pela taxa da classe — confirme o valor real", vista:"ativos"});
  }

  return out.sort((a,b) => b.grau - a.grau);
}

/** Dias que faltam até ao fim do mês em análise (o próprio incluído). */
function diasQueFaltam(){
  const [a, m] = MES.split("-").map(Number);
  const ultimo = new Date(a, m, 0).getDate();
  const hojeMes = isoMes(hoje());
  if (MES !== hojeMes) return ultimo;
  return Math.max(0, ultimo - hoje().getDate());
}

/**
 * A conta por trás de um número. Os explicadores dizem a fórmula; isto
 * mostra as parcelas com que ela foi feita, este mês.
 */
const DERIVACOES = {
  "Rendimento": () => {
    const fx = fiscalTotal();
    return {titulo:"Rendimento", linhas:[
      ["Bruto de todas as fontes", fx.bruto],
      ["— Segurança Social", -fx.ss],
      ["— Retenção de IRS", -fx.irs],
      ["— Tributação autónoma", -fx.autonomo],

  },
  "Despesa": () => {
    const r = realMes(MES), p = planoMes(MES);
    const usa = (r.rend > 0 || r.desp > 0) ? r : p;
    const porGrupo = {necessidades:0, desejos:0, poupanca:0};
    S.categorias.filter(c => c.tipo === "despesa").forEach(c => {
      porGrupo[c.grupo || "desejos"] += usa.porCat[c.id] || 0;
    });
    return {titulo:"Despesa", linhas:[
      ["Necessidades", porGrupo.necessidades],
      ["Desejos", porGrupo.desejos],
      ["Poupança e amortização", porGrupo.poupanca],
    ], total:["Total", usa.desp]};
  },
  "Saldo do mês": () => {
    const r = realMes(MES), p = planoMes(MES);
    const usa = (r.rend > 0 || r.desp > 0) ? r : p;
    return {titulo:"Saldo do mês", linhas:[
      ["Rendimento", usa.rend],
      ["— Despesa", -usa.desp],
    ], total:["Saldo", usa.saldo]};
  },
  "Património líquido": () => {
    const b = balanco();
    return {titulo:"Património líquido", linhas:[
      ["Ativos financeiros", b.carteira],
      ["Ativos reais", b.bens],
      ["— Capital em dívida", -b.divida],
    ], total:["Líquido", b.liquido]};
  },
};

function mostrarDerivacao(rotulo){
  const fn = DERIVACOES[rotulo];
  if (!fn) return false;
  const d = emPasse(fn);
  $("#modalHost").innerHTML =
    '<div class="overlay"><div class="dialog" role="dialog" aria-modal="true" style="max-width:460px">'+
    '<h3>'+esc(d.titulo)+' — de onde vem</h3>'+

      esc(eur(l[1]))+'</td></tr>').join("")+
    '</tbody><tfoot><tr><td><strong>'+esc(d.total[0])+'</strong></td>'+
    '<td class="r num"><strong>'+esc(eur(d.total[1]))+'</strong></td></tr></tfoot></table></div>'+
    '<div class="actions"><button class="btn" data-dlg="no">Fechar</button></div>'+
    '</div></div>';
  const host = $("#modalHost");

  host.querySelector('[data-dlg="no"]').onclick = fechar;
  host.querySelector(".overlay").onclick = (e) => { if (e.target === e.currentTarget) fechar(); };
  return true;
}

/* Clicar num indicador com derivação conhecida mostra a conta. */
document.addEventListener("click", (e) => {

/* ---------------------------------------------------------------
   Saúde dos dados — o que está por preencher ou por ligar
   --------------------------------------------------------------- */
function saudeDados(){
  const itens = [];
  const semCat = S.movimentos.filter(m => !m.categoriaId).length;
  if (semCat) itens.push({txt: semCat+" movimento(s) sem categoria", vista:"movimentos", btn:"Ver movimentos"});

  const estimados = S.ativos.filter(a => origemValor(a) === "estimado" && a.dataAquisicao && anosDesde(a.dataAquisicao) >= 1);
  if (estimados.length) itens.push({txt: estimados.length+" ativo(s) com valor estimado há mais de um ano", vista:"ativos", btn:"Ver ativos"});

  const semAtivo = S.creditos.filter(c => !c.ativoId).length;
  if (semAtivo) itens.push({txt: semAtivo+" crédito(s) sem ativo associado", vista:"creditos", btn:"Ver créditos"});

  const imoveisSemVpt = S.ativos.filter(a => classeDe(a.classe).fiscal === "imovel" && !(parseNum(a.vpt) > 0)).length;
  if (imoveisSemVpt) itens.push({txt: imoveisSemVpt+" imóvel(is) sem VPT — o IMI fica por estimativa", vista:"ativos", btn:"Ver ativos"});

  const veiculosSemIuc = S.ativos.filter(a => classeDe(a.classe).fiscal === "automovel" && !(parseNum(a.iuc) > 0)).length;
  if (veiculosSemIuc) itens.push({txt: veiculosSemIuc+" veículo(s) sem IUC preenchido", vista:"ativos", btn:"Ver ativos"});

  const catsComGasto = S.categorias.filter(c => c.tipo === "despesa" &&
    ((planoMes(MES).porCat[c.id] || 0) > 0) && !(parseNum(S.limites[c.id]) > 0)).length;
  if (catsComGasto) itens.push({txt: catsComGasto+" categoria(s) com plano mas sem limite definido", vista:"orcamento", btn:"Definir limites"});

  const rdSemComp = S.rendimentos.filter(rd => !(rd.componentes || []).length).length;
  if (rdSemComp) itens.push({txt: rdSemComp+" fonte(s) de rendimento sem componentes", vista:"rendimentos", btn:"Ver rendimentos"});

  // Dois objetivos a seguir o mesmo ativo contam o dinheiro duas vezes
  const porAtivo = {};
  S.objetivos.filter(o => o.ativoId).forEach(o => { porAtivo[o.ativoId] = (porAtivo[o.ativoId] || 0) + 1; });
  const repetidos = Object.keys(porAtivo).filter(k => porAtivo[k] > 1).length;
  if (repetidos) itens.push({txt: repetidos+" ativo(s) a financiar mais do que um objetivo — o mesmo dinheiro conta duas vezes",
    vista:"objetivos", btn:"Ver objetivos"});

  const objOrfaos = S.objetivos.filter(o => o.ativoId && !S.ativos.some(a => a.id === o.ativoId)).length;
  if (objOrfaos) itens.push({txt: objOrfaos+" objetivo(s) ligados a um ativo que já não existe",
    vista:"objetivos", btn:"Ver objetivos"});

  return itens;
}

function cartaoSaudeDados(){

/* ---------------------------------------------------------------
   Recorrências — despesas que se repetem e ainda não estão no plano
   --------------------------------------------------------------- */

/** Chave de agrupamento de um movimento pela descrição normalizada. */
function chaveRecorrencia(desc){
  return semAcento(desc).replace(/[0-9]+/g, "").replace(/[^a-z ]+/g, " ").replace(/\s+/g, " ").trim();
}

/**
 * Descrições que aparecem em três ou mais meses distintos com valor
 * semelhante — candidatas a rubrica do plano. Ignora as que já lá estão.
 */
function detetarRecorrencias(){
  const grupos = new Map();
  S.movimentos.filter(m => m.tipo !== "rendimento" && m.data).forEach(m => {
    const k = chaveRecorrencia(m.descricao);
    if (k.length < 4) return;
    if (!grupos.has(k)) grupos.set(k, []);
    grupos.get(k).push(m);
  });
  const jaNoPlano = new Set(S.recorrentes.map(r => chaveRecorrencia(r.nome)));
  const out = [];
  grupos.forEach((movs, k) => {
    if (jaNoPlano.has(k)) return;
    const meses = new Set(movs.map(m => m.data.slice(0, 7)));
    if (meses.size < 3) return;
    const valores = movs.map(m => Math.abs(parseNum(m.valor)));
    const media = valores.reduce((s,v) => s + v, 0) / valores.length;
    if (media <= 0) return;
    // Valores próximos: o maior desvio não passa de 20% da média
    const desvio = Math.max(...valores.map(v => Math.abs(v - media))) / media;
    if (desvio > 0.2) return;
    out.push({chave:k, nome: movs[movs.length-1].descricao || k, valor: media,
      meses: meses.size, categoriaId: (movs.find(m => m.categoriaId) || {}).categoriaId || ""});
  });
  return out.sort((a,b) => b.valor - a.valor);
}

function viewPainel(){
  const p = planoMes(MES), r = realMes(MES);
  const usarReal = r.rend > 0 || r.desp > 0;
  const rend = usarReal ? r.rend : p.rend;
  const desp = usarReal ? r.desp : p.desp;
  const saldo = rend - desp;
  const taxaPoup = rend > 0 ? saldo / rend * 100 : 0;

  const prestacoesMes = S.creditos.reduce((s,c) => s + encargoCredito(c, MES), 0);
  const esforco = rend > 0 ? prestacoesMes / rend * 100 : 0;

  if (!temDados()){
    return '<div class="card"><h2>Bem-vindo 👋</h2>'+
      '<p class="sub">Ainda não há dados. Comece por definir o <strong>Plano mensal</strong> '+

      '<div class="row"><div class="shrink"><button class="btn primary" data-act="ir" data-view="rendimentos">Definir rendimentos</button></div>'+
      '<div class="shrink"><button class="btn" data-act="ir" data-view="despesas">Despesas</button></div>'+
      '<div class="shrink"><button class="btn" data-act="ir" data-view="ativos">Ativos</button></div>'+
      '<div class="shrink"><button class="btn ghost" data-act="exemplo">Carregar exemplo</button></div>'+
      '<div class="shrink"><button class="btn ghost" data-act="tutorialIniciar">🎓 Visita guiada</button></div></div>'+
      '<div style="margin-top:18px"><label class="field">Ou comece por um ponto de partida</label>'+
      escolhaPerfil()+
      '<div class="muted" style="font-size:12px;margin-top:7px">Semeia membros, despesas fixas típicas e limites — '+
      'valores de exemplo, para ajustar. Os rendimentos ficam por sua conta.</div></div>'+
      '<div style="margin-top:14px" class="note"><strong>Três coisas, e só três:</strong> '+
      '<em>Rendimentos</em> (cada fonte decomposta em vencimento, subsídios, prémios — com IRS e Segurança Social), '+
      '<em>Despesas</em> (fixas, movimentos e limites) e <em>Ativos</em> — onde cabe tudo o que tem valor, '+
      'da conta à ordem ao PPR, dos ETFs ao apartamento. As poupanças são ativos como os outros.</div>'+

      'e a prestação divide-se em juros, amortização e seguros; os impostos sobre rendimentos e ativos entram nas categorias respetivas. '+
      'No fim, tudo fecha no <em>património líquido</em>.</div></div>';
  }

  // KPIs, com a variação face ao mês anterior e o traço dos últimos 6 meses.
  // Com a comparação homóloga ligada, a legenda passa a mostrar o mesmo mês
  // do ano anterior — plano ou real, conforme o que existir nesse mês.
  const sRend  = serieMensal((m) => valorMes("rend", m), 6);
  const sDesp  = serieMensal((m) => valorMes("desp", m), 6);
  const sSaldo = serieMensal((m) => valorMes("saldo", m), 6);
  const mesH = mesShift(MES, -12);

    const h = valorMes(campo, mesH);

/**
 * Quanto está poupado para um objetivo.
 * Quando o objetivo está ligado a um ativo, o valor vem de lá e deixa de
 * se escrever à mão — o progresso passa a acompanhar a conta que o
 * financia. Sem ligação, vale o número introduzido.
 */
function poupadoObjetivo(o){
  if (o && o.ativoId){
    const a = S.ativos.find(x => x.id === o.ativoId);
    if (a) return valorAtivo(a);
  }
  return parseNum(o && o.atual);
}

/**
 * «Posso pagar isto?» — uma decisão pontual, respondida com o que a
 * ferramenta já sabe: o que sobra em liquidez, o que isso faz aos
 * objetivos, e o que ainda está marcado para sair este mês.
 */
function avaliarCompra(valor, prestacoes){
  const v = Math.max(0, parseNum(valor));
  const n = Math.max(1, Math.round(parseNum(prestacoes) || 1));
  if (v <= 0) return null;
  const mensal = v / n;

  const liquidez = totalLiquidez();
  const p = planoMes(MES), r = realMes(MES);
  const desp = (r.rend > 0 || r.desp > 0) ? r.desp : p.desp;
  const saldo = (r.rend > 0 || r.desp > 0) ? r.saldo : p.saldo;

  const pontos = [];

  // 1. Cabe na liquidez?
  const sobra = liquidez - (n === 1 ? v : mensal);
  const mesesCobertos = desp > 0 ? sobra / desp : Infinity;
  if (sobra < 0){
    pontos.push({grau:2, txt:"Não cabe na liquidez",
      det:"Faltam "+eur(-sobra)+" — teria de vender ou financiar."});
  } else if (mesesCobertos < 3){
    pontos.push({grau:1, txt:"Cabe, mas deixa a reserva curta",
      det:"Ficam "+eur(sobra)+" · "+mesesCobertos.toLocaleString("pt-PT",{maximumFractionDigits:1})+
          " meses de despesa (a referência são 3 a 6)"});
  } else {
    pontos.push({grau:0, txt:"Cabe na liquidez",
      det:"Ficam "+eur(sobra)+" · ainda "+mesesCobertos.toLocaleString("pt-PT",{maximumFractionDigits:1})+
          " meses de despesa"});
  }

  // 2. Cabe no saldo do mês?
  if (mensal > saldo){
    pontos.push({grau:1, txt:(n > 1 ? "A prestação " : "O valor ")+"excede o saldo do mês",
      det: eur(mensal)+(n > 1 ? "/mês" : "")+" contra um saldo de "+eur(saldo)});
  }

  // 3. O que faz aos objetivos com prazo
  S.objetivos.forEach(o => {
    const falta = Math.max(0, parseNum(o.alvo) - poupadoObjetivo(o));
    if (falta <= 0 || !o.prazo) return;
    const meses = mesDiff(MES, mesDoDia(o.prazo));
    if (meses <= 0) return;
    const esforco = falta / meses;
    const novoEsforco = (falta + v) / meses;
    if (saldo > 0 && esforco <= saldo && novoEsforco > saldo){
      pontos.push({grau:1, txt:"Compromete «"+(o.nome || "objetivo")+"»",
        det:"O esforço passaria de "+eur(esforco)+" para "+eur(novoEsforco)+"/mês"});
    } else if (esforco > 0){
      const atraso = Math.ceil(v / esforco);
      if (atraso >= 1) pontos.push({grau:0, txt:"Atrasa «"+(o.nome || "objetivo")+"»",
        det:"Cerca de "+atraso+" "+(atraso === 1 ? "mês" : "meses")+", ao ritmo atual"});
    }
  });

  // 4. O que já está marcado para sair este mês
  const porSair = S.recorrentes.filter(x => recAtiva(x, MES) && x.frequencia !== "mensal")
    .reduce((s,x) => s + recMensal(x), 0);
  if (porSair > 0){
    pontos.push({grau:0, txt:"Este mês tem encargos não mensais",
      det: eur(porSair)+" equivalentes a mês em rubricas anuais ou semestrais"});
  }

  return {valor: v, prestacoes: n, mensal, liquidez, sobra, pontos: pontos.sort((a,b) => b.grau - a.grau)};
}

function cartaoPodePagar(){
  const valor = ui.compraValor != null ? ui.compraValor : 0;

/**
 * Dois meses lado a lado, categoria a categoria. Ver o desvio de um mês
 * face ao plano é uma coisa; ver junho ao lado de julho é outra, e é a
 * que responde a «onde é que isto mudou?».
 */
function cartaoComparar(){
  const a = ui.compararA || mesShift(MES, -1), b = ui.compararB || MES;
  const fonte = (m) => { const r = realMes(m); return (r.rend > 0 || r.desp > 0) ? r : planoMes(m); };
  const fa = fonte(a), fb = fonte(b);

  const linhas = S.categorias.filter(c => c.tipo === "despesa")
    .map(c => ({c, va: fa.porCat[c.id] || 0, vb: fb.porCat[c.id] || 0}))
    .filter(x => x.va > 0 || x.vb > 0)
    .map(x => Object.assign(x, {dif: x.vb - x.va}))
    .sort((x, y) => Math.abs(y.dif) - Math.abs(x.dif));

  const opc = (sel) => { const o = []; for (let i = -13; i <= 1; i++){ const m = mesShift(MES, i);
    o.push('<option value="'+m+'"'+(m === sel ? " selected" : "")+'>'+esc(mesLabel(m))+'</option>'); } return o.join(""); };

  const totalDif = fb.desp - fa.desp;
  // As notas dos dois meses ao lado da comparação: é aqui que a explicação
  // de um desvio grande faz mais falta.
  const notaDe = (m) => (S.notas && S.notas[m]) || "";
  const notas = (notaDe(a) || notaDe(b))
    ? '<div class="note" style="margin-top:10px">'+
      (notaDe(a) ? '<div>✎ <strong>'+esc(mesLabel(a))+':</strong> '+esc(notaDe(a))+'</div>' : "")+
      (notaDe(b) ? '<div>✎ <strong>'+esc(mesLabel(b))+':</strong> '+esc(notaDe(b))+'</div>' : "")+
      '</div>' : "";
  return '<div class="card"><div class="card-head"><div class="t"><h2>Comparar dois meses</h2>'+
    '<div class="sub">Onde é que a despesa mudou, categoria a categoria. Meses sem movimentos usam o plano.</div></div></div>'+
    '<div class="row no-print" style="margin-bottom:12px">'+
      '<div style="flex:1 1 150px"><label class="field" for="cmpA">De</label>'+
        '<select id="cmpA">'+opc(a)+'</select></div>'+
      '<div style="flex:1 1 150px"><label class="field" for="cmpB">Para</label>'+
        '<select id="cmpB">'+opc(b)+'</select></div>'+
    '</div>'+
    (linhas.length
      ? '<div class="tblwrap"><table><thead><tr><th>Categoria</th>'+
        '<th class="r">'+esc(mesLabel(a, true))+'</th><th class="r">'+esc(mesLabel(b, true))+'</th>'+
        '<th class="r">Diferença</th></tr></thead><tbody>'+
        linhas.map(x =>
          '<tr><td><span class="tag"><span class="dot" style="background:'+esc(x.c.cor)+'"></span>'+
            esc(catRotulo(x.c.id))+'</span></td>'+
          '<td class="r num">'+esc(eur(x.va))+'</td><td class="r num">'+esc(eur(x.vb))+'</td>'+
          '<td class="r num '+(Math.abs(x.dif) < 0.005 ? "muted" : x.dif > 0 ? "neg" : "pos")+'">'+
            (x.dif > 0 ? "+" : "")+esc(eur(x.dif))+'</td></tr>').join("")+
        '</tbody><tfoot><tr><td>Total da despesa</td>'+
        '<td class="r num">'+esc(eur(fa.desp))+'</td><td class="r num">'+esc(eur(fb.desp))+'</td>'+
        '<td class="r num '+(totalDif > 0 ? "neg" : "pos")+'">'+(totalDif > 0 ? "+" : "")+esc(eur(totalDif))+
        '</td></tr></tfoot></table></div>'
      : '<div class="empty">Sem despesa nos dois meses escolhidos.</div>')+
    notas +
    '</div>';
}

/* ===============================================================
   Eventos de vida — o orçamento noutra vida

   As grandes decisões não se tomam com uma folha de cálculo em branco:
   tomam-se a perguntar «e se?». Um filho, mudar de casa, passar a 80%,
   ficar sem emprego. Cada evento é um conjunto de mexidas no plano —
   rubricas que nascem, rendimentos que mudam, capital que sai — e
   aplica-se *por cima* dos dados reais, sem lhes tocar: o que se vê é
   o mesmo orçamento noutra vida.

   Um evento tem parâmetros (quantos filhos, que renda, que corte no
   rendimento) e uma data de início. Vários podem coexistir — um filho
   em setembro e a mudança de casa em janeiro seguinte.
   =============================================================== */

/* Cada mexida é uma de quatro coisas: uma rubrica de despesa nova, uma

/** Parâmetros por omissão de um evento. */
function paramsEvento(chave){
  const ev = EVENTOS_VIDA[chave];
  const out = {};
  if (ev) ev.params.forEach(p => { out[p.k] = p.valor; });
  return out;
}

/**
 * O plano de um mês *dentro* de um cenário: parte do plano real e aplica
 * as mexidas dos eventos ativos nesse mês. Não toca em `S` — recebe o
 * plano verdadeiro e devolve outro.
 */
function planoComEventos(mes, eventos){
  const base = planoMes(mes);
  if (!eventos || !eventos.length) return Object.assign({}, base, {pontual: 0});

  let rend = base.rend, desp = base.desp, pontual = 0;
  const detalhe = [];

  eventos.forEach(ev => {
    const def = EVENTOS_VIDA[ev.tipo];
    if (!def) return;
    const mexidas = def.montar(ev.params || paramsEvento(ev.tipo), ev.mes);
    mexidas.forEach(mx => {
      const dentro = (!mx.desde || mes >= mx.desde) && (!mx.ate || mes <= mx.ate);
      if (mx.tipo === "pontual"){
        if (mx.mes === mes){
          pontual += parseNum(mx.valor);
          // Marcado como pontual: na tabela dos efeitos não se confunde com
          // uma despesa que passa a existir todos os meses.
          detalhe.push({nome:mx.nome, valor:-parseNum(mx.valor), umaVez:true});
        }
        return;
      }
      if (!dentro) return;
      if (mx.tipo === "despesa"){
        desp += parseNum(mx.valor);
        detalhe.push({nome:mx.nome, valor:-parseNum(mx.valor)});
      } else if (mx.tipo === "rendimentoFixo"){
        rend += parseNum(mx.valor);
        detalhe.push({nome:mx.nome, valor: parseNum(mx.valor)});
      } else if (mx.tipo === "rendimento"){
        // Fator sobre o rendimento do trabalho: o que se perde é a diferença
        const perda = base.rend * (1 - parseNum(mx.fator));
        rend -= perda;
        detalhe.push({nome:mx.nome, valor:-perda});
      } else if (mx.tipo === "fim"){
        const r = S.recorrentes.find(x => x.id === mx.id);
        if (r && recAtiva(r, mes)){
          desp -= recMensal(r);
          detalhe.push({nome:"Fim de «"+mx.nome+"»", valor: recMensal(r)});
        }
      }
    });
  });

  return {rend, desp, saldo: rend - desp, pontual, detalhe, porCat: base.porCat};
}

/**
 * Tesouraria do cenário: como a real, mas com o plano dos eventos e com
 * os encargos pontuais no mês em que caem.
 */
function tesourariaCenario(meses, eventos){
  const n = meses || 24;
  const serie = [];
  let acumulado = totalLiquidez();
  const evs = eventosPlaneados();
  for (let i = 0; i < n; i++){
    const m = mesShift(MES, i);
    const p = planoComEventos(m, eventos);
    const compras = evs.filter(e => e.mes === m).reduce((s,e) => s + e.valor, 0);
    const saldo = p.saldo - compras - p.pontual;
    acumulado += saldo;
    serie.push({mes: m, saldo, acumulado, pontual: p.pontual, rend: p.rend, desp: p.desp});
  }
  return serie;
}

/** O retrato de um cenário, com o real ao lado para comparar. */
function compararCenario(eventos, meses){
  const n = meses || 24;
  const real = tesourariaProjetada(n);
  const cen  = tesourariaCenario(n, eventos);

  /* Os indicadores mostram o mês em que o cenário está *em pleno* — o mais
     tardio dos inícios — e não o mês corrente. Um filho que nasce em
     setembro não muda a despesa de julho, e mostrar julho dava a impressão
     errada de que o cenário não fazia diferença nenhuma. */
  const inicios = (eventos || []).map(e => e.mes).filter(mesValido);
  const mesRegime = inicios.length ? inicios.sort()[inicios.length-1] : MES;
  const p0 = planoComEventos(mesRegime, eventos);
  const base = planoMes(mesRegime);

  // O primeiro mês em que o cenário fica negativo, se ficar
  const rutura = cen.find(x => x.acumulado < 0) || null;
  const ruturaReal = real.find(x => x.acumulado < 0) || null;

  // Efeito no regime de cruzeiro: o mês 12, já com os pontuais passados
  const cruz = cen[Math.min(11, cen.length-1)];
  const cruzReal = real[Math.min(11, real.length-1)];

  return {
    real, cen, meses: n, mesRegime,
    saldoAntes: base.saldo, saldoDepois: p0.saldo,
    rendAntes: base.rend, rendDepois: p0.rend,
    despAntes: base.desp, despDepois: p0.desp,
    detalhe: p0.detalhe || [],
    pontualTotal: cen.reduce((s,x) => s + x.pontual, 0),
    fimReal: real[real.length-1].acumulado,
    fimCen: cen[cen.length-1].acumulado,
    rutura, ruturaReal,
    diferencaAos12: cruz.acumulado - cruzReal.acumulado,
  };
}

/* ===============================================================
   Provisões — o dinheiro que devia estar de lado

   O plano converte o seguro anual em equivalente mensal e faz bem:
   é assim que a despesa se distribui. Mas provisionar no papel não é
   provisionar a sério, e ninguém vê se o dinheiro existe mesmo. Isto
   responde a «para as contas grandes que aí vêm, quanto devia ter hoje
   de parte?» — e compara com a liquidez real.
   =============================================================== */

/** O mês em que uma rubrica não mensal cai a seguir, a partir de `mes`. */
function proximaOcorrencia(rec, mes){
  const f = freqFator(rec.frequencia);
  if (f >= 1) return mes;                     // mensal ou mais frequente
  const passo = Math.round(1 / f);            // 2, 3, 6 ou 12 meses
  // A âncora é o início da rubrica; sem início, conta-se a partir de janeiro
  const ancora = rec.inicio ? mesDoDia(rec.inicio) : (mes.slice(0,4) + "-01");
  const decorridos = mesDiff(ancora, mes);
  if (decorridos < 0) return ancora;
  const falta = (passo - (decorridos % passo)) % passo;
  return mesShift(mes, falta);
}

/**
 * Provisões por rubrica não mensal: quanto já devia estar guardado hoje.
 * Uma rubrica anual de 600 € que sai daqui a quatro meses tem oito meses
 * de provisão feitos — 400 €. É essa a soma que se compara com a liquidez.
 */
function provisoes(mes){
  const m = mes || MES;
  const linhas = S.recorrentes
    .filter(r => r.tipo !== "rendimento" && recAtiva(r, m) && freqFator(r.frequencia) < 1
                 && parseNum(r.valor) > 0)
    .map(r => {
      const f = freqFator(r.frequencia);
      const passo = Math.round(1 / f);
      const proximo = proximaOcorrencia(r, m);
      const faltam = Math.max(0, mesDiff(m, proximo));
      // Meses já acumulados no ciclo atual: o ciclo tem `passo` meses e
      // faltam `faltam` para a próxima saída.
      const acumulados = Math.min(passo, passo - faltam);
      const total = parseNum(r.valor);
      return {rec: r, total, passo, proximo, faltam,
              porMes: total / passo,
              devia: Math.max(0, total * acumulados / passo)};
    })
    .sort((a,b) => a.faltam - b.faltam);

  const devia = linhas.reduce((s,x) => s + x.devia, 0);
  const porMes = linhas.reduce((s,x) => s + x.porMes, 0);
  const liquidez = totalLiquidez();
  // A reserva de emergência não serve para pagar o seguro do carro: o que
  // conta como cobertura é a liquidez que sobra depois dela.
  const objEmerg = S.objetivos.filter(o => /emerg/i.test(o.nome || ""))
    .reduce((s,o) => s + poupadoObjetivo(o), 0);
  const disponivel = Math.max(0, liquidez - objEmerg);
  return {linhas, devia, porMes, liquidez, objEmerg, disponivel,
          coberto: devia <= 0 ? true : disponivel >= devia,
          falta: Math.max(0, devia - disponivel),
          doze: linhas.reduce((s,x) => s + x.total * (12 / x.passo), 0)};
}

function cartaoProvisoes(){
  const p = provisoes(MES);
  if (!p.linhas.length) return "";
  return '<div class="card"><div class="card-head"><div class="t"><h2>Provisões</h2>'+
    '<div class="sub">As despesas que não são mensais — seguros, IUC, IMI — distribuídas pelo ciclo. '+
    'Quanto já devia estar de parte hoje, e se a liquidez chega.</div></div>'+
    '<span class="tag">'+p.linhas.length+' rubrica(s)</span></div>'+
    '<div class="grid g3" style="margin-bottom:12px">'+
      kpi("Devia ter de parte", eur(p.devia), "Acumulado do ciclo em curso", p.coberto ? "good" : "bad")+
      kpi("Disponível", eur(p.disponivel),
          p.objEmerg > 0 ? "Liquidez menos o fundo de emergência" : "Liquidez atual")+
      kpi("A provisionar", eur(p.porMes)+"/mês", "Para chegar a cada saída a tempo", "warnb")+
    '</div>'+
    (p.coberto

/* ===============================================================
   Saúde financeira — uma leitura só, em vez de cinco cartões

   Cada componente é algo que a aplicação já sabe calcular. O valor da
   pontuação não está no número: está em dizer qual é o degrau que mais
   a sobe, que é a pergunta a que ninguém responde sozinho.
   =============================================================== */
const COMPONENTES_SAUDE = [
  {
    k:"reserva", lbl:"Reserva de emergência", peso:25,
    medir(){
      const p = planoMes(MES), r = realMes(MES);
      const desp = (r.rend > 0 || r.desp > 0) ? r.desp : p.desp;
      if (desp <= 0) return {valor:0, nota:0, txt:"Sem despesa conhecida"};
      const meses = totalLiquidez() / desp;
      // 6 meses vale a nota máxima; abaixo disso, proporcional
      const nota = Math.max(0, Math.min(1, meses / 6));
      return {valor: meses, nota,
              txt: meses.toLocaleString("pt-PT",{maximumFractionDigits:1})+" meses de despesa cobertos",
              alvo: "6 meses"};
    },
    comoSubir(m){ return m.valor < 6
      ? "Juntar mais "+eur((6 - m.valor) * (realMes(MES).desp || planoMes(MES).desp))+" em liquidez"
      : null; },
  },
  {
    k:"poupanca", lbl:"Taxa de poupança", peso:25,
    medir(){
      const p = planoMes(MES), r = realMes(MES);
      const usa = (r.rend > 0 || r.desp > 0) ? r : p;
      if (usa.rend <= 0) return {valor:0, nota:0, txt:"Sem rendimento registado"};
      const taxa = usa.saldo / usa.rend * 100;
      const nota = Math.max(0, Math.min(1, taxa / 20));   // 20% é o alvo da regra
      return {valor: taxa, nota, txt: pct(taxa)+" do rendimento", alvo:"20%"};
    },
    comoSubir(m){ return m.valor < 20 ? "Subir a poupança para 20% do rendimento" : null; },
  },
  {
    k:"esforco", lbl:"Peso dos créditos", peso:20,
    medir(){
      const p = planoMes(MES), r = realMes(MES);
      const rend = (r.rend > 0 || r.desp > 0) ? r.rend : p.rend;
      if (!S.creditos.length) return {valor:0, nota:1, txt:"Sem créditos", alvo:"até 33%"};
      if (rend <= 0) return {valor:0, nota:0, txt:"Sem rendimento registado"};
      const enc = S.creditos.reduce((s,c) => s + encargoCredito(c, MES), 0);
      const esf = enc / rend * 100;
      /* Até 20% não há nada a apontar — a nota é cheia. Daí desce até zero
         aos 50%, passando pelos 33% (o limiar prudente que o cartão dos
         créditos usa) com nota ainda razoável. Uma curva que penalizasse
         desde 0% dava meia nota a quem tem um crédito perfeitamente são. */
      const nota = esf <= 20 ? 1 : Math.max(0, Math.min(1, (50 - esf) / 30));
      return {valor: esf, nota, txt: pct(esf)+" do rendimento em prestações", alvo:"até 33%"};
    },
    comoSubir(m){ return m.valor > 33 ? "Baixar a taxa de esforço abaixo de 33%" : null; },
  },
  {
    k:"provisoes", lbl:"Provisões em dia", peso:15,
    medir(){
      const pr = provisoes(MES);
      if (!pr.linhas.length) return {valor:100, nota:1, txt:"Sem despesas não mensais", alvo:"cobertas"};
      const cob = pr.devia > 0 ? Math.min(1, pr.disponivel / pr.devia) : 1;
      return {valor: cob * 100, nota: cob,
              txt: pct(cob*100)+" do que devia estar de parte", alvo:"100%"};
    },
    comoSubir(m){ return m.valor < 100 ? "Cobrir as provisões das despesas anuais" : null; },
  },
  {
    k:"dados", lbl:"Orçamento cuidado", peso:15,
    medir(){
      // Três hábitos: limites definidos, movimentos categorizados, meses fechados
      const cats = S.categorias.filter(c => c.tipo === "despesa");
      const comGasto = cats.filter(c => (planoMes(MES).porCat[c.id] || 0) > 0);
      const comLimite = comGasto.filter(c => parseNum(S.limites[c.id]) > 0);
      const fracLim = comGasto.length ? comLimite.length / comGasto.length : 1;
      const movs = S.movimentos.filter(x => mesDoDia(x.data) === MES);
      const fracCat = movs.length ? movs.filter(x => x.categoriaId).length / movs.length : 1;
      let fechados = 0;
      for (let i = 1; i <= 3; i++) if (S.fechados && S.fechados[mesShift(MES, -i)]) fechados++;
      const fracFecho = fechados / 3;
      const nota = fracLim * 0.4 + fracCat * 0.4 + fracFecho * 0.2;
      return {valor: nota * 100, nota,
              txt: comLimite.length+"/"+comGasto.length+" limites · "+
                   pct(fracCat*100)+" categorizado · "+fechados+"/3 meses fechados",
              alvo:"tudo em dia",
              detalhe:{fracLim, fracCat, fracFecho}};
    },
    comoSubir(m){
      const d = m.detalhe || {};
      if (d.fracLim < 1) return "Definir limites nas categorias que ainda não têm";
      if (d.fracCat < 1) return "Categorizar os movimentos que ficaram soltos";
      if (d.fracFecho < 1) return "Fechar os meses que ficaram por arrumar";
      return null;
    },
  },
];

function saudeFinanceira(){
  const partes = COMPONENTES_SAUDE.map(c => {
    let m;
    try { m = c.medir(); } catch(e){ m = {valor:0, nota:0, txt:"—"}; }
    const nota = Number.isFinite(m.nota) ? Math.max(0, Math.min(1, m.nota)) : 0;
    return Object.assign({}, m, {k: c.k, lbl: c.lbl, peso: c.peso, nota,
      pontos: nota * c.peso,
      // Quanto sobe a pontuação total se este componente chegar ao máximo
      ganho: (1 - nota) * c.peso,
      sugestao: c.comoSubir ? c.comoSubir(m) : null});
  });
  const total = partes.reduce((s,x) => s + x.pontos, 0);
  const melhor = partes.filter(x => x.sugestao && x.ganho >= 1)
    .sort((a,b) => b.ganho - a.ganho)[0] || null;
  const nivel = total >= 80 ? {lbl:"Sólida", cor:"var(--pos)"}
              : total >= 60 ? {lbl:"Razoável", cor:"var(--accent)"}
              : total >= 40 ? {lbl:"Frágil", cor:"var(--warn)"}
              : {lbl:"Em risco", cor:"var(--neg)"};
  return {total: Math.round(total), partes, melhor, nivel};
}

/* ===============================================================
   Resolver o défice — do diagnóstico ao tratamento

   A previsão diz que o mês fecha em vermelho. Falta a parte seguinte:
   que alavancas existem, e quanto vale cada uma. Todas as respostas
   saem de coisas que já estão nos dados.
   =============================================================== */
function alavancasDefice(){
  const f = preverFechoMes();
  const p = planoMes(MES), r = realMes(MES);
  const saldo = f ? f.saldoPrev : ((r.rend > 0 || r.desp > 0) ? r.saldo : p.saldo);
  if (saldo >= 0) return null;
  const falta = -saldo;
  const out = [];

  // 1. Adiar compras planeadas marcadas para este mês
  (S.planeadas || []).filter(x => !x.feitaEm && x.mes === MES && parseNum(x.valor) > 0)
    .forEach(x => out.push({
      k:"adiar", id:x.id, valor: parseNum(x.valor),
      txt:"Adiar «"+x.nome+"»",
      det:"Sai do mês e volta a procurar a melhor altura",
      act:"deficeAdiar"}));

  // 2. Cortar nas categorias com folga — reaproveita o plano de corte
  const corte = planoDeCorte(falta);
  if (corte && corte.conseguido > 0){
    out.push({k:"cortar", valor: corte.conseguido,
      txt:"Cortar "+eur(corte.conseguido)+" em "+corte.linhas.length+" categoria(s)",
      det: corte.linhas.slice(0,3).map(x => x.cat.nome).join(", ")+
           (corte.linhas.length > 3 ? " e mais "+(corte.linhas.length-3) : "")+
           (corte.soDesejos ? " — só desejos" : " — desejos e necessidades"),
      act:"deficeCortar"});
  }

  // 3. Usar liquidez, dizendo o que isso custa em meses de reserva
  const liq = totalLiquidez();
  if (liq > 0){
    const desp = (r.rend > 0 || r.desp > 0) ? r.desp : p.desp;
    const antes = desp > 0 ? liq / desp : Infinity;
    const depois = desp > 0 ? (liq - falta) / desp : Infinity;
    out.push({k:"liquidez", valor: Math.min(falta, liq),
      txt:"Usar "+eur(Math.min(falta, liq))+" da reserva",
      det: Number.isFinite(antes)
        ? "A reserva passa de "+antes.toLocaleString("pt-PT",{maximumFractionDigits:1})+
          " para "+Math.max(0,depois).toLocaleString("pt-PT",{maximumFractionDigits:1})+" meses"
        : "Sem despesa de referência",
      aviso: depois < 3});
  }

  // 4. Suspender reforços de poupança deste mês
  const poupancas = S.recorrentes.filter(x => recAtiva(x, MES) && x.tipo !== "rendimento" &&
    x.frequencia === "mensal" && (cat(x.categoriaId) || {}).grupo === "poupanca");
  const totalPoup = poupancas.reduce((s,x) => s + recMensal(x), 0);
  if (totalPoup > 0){
    out.push({k:"poupanca", valor: totalPoup,
      txt:"Suspender "+eur(totalPoup)+" de reforços este mês",
      det: poupancas.map(x => x.nome).slice(0,3).join(", ")+
           " — adia o objetivo, não resolve o défice",
      aviso: true});
  }

  return {falta, saldo, alavancas: out.sort((a,b) => b.valor - a.valor),
          cobrem: out.reduce((s,x) => s + x.valor, 0) >= falta};
}

function cartaoDefice(){
  const d = alavancasDefice();
  if (!d) return "";
  return '<div class="card" style="border-color:color-mix(in srgb,var(--neg) 40%,var(--border))">'+
    '<div class="card-head"><div class="t"><h2>Resolver o défice</h2>'+
    '<div class="sub">O mês aponta para fechar '+esc(eur(d.saldo))+'. Estas são as alavancas que existe, '+
    'e quanto vale cada uma.</div></div>'+
    '<span class="tag" style="background:var(--neg);color:#fff">faltam '+esc(eur(d.falta))+'</span></div>'+
    '<div class="alertas">'+d.alavancas.map(a =>
      '<div class="alerta" style="cursor:default">'+
        '<span class="ai" style="color:'+(a.aviso ? "var(--warn)" : "var(--accent)")+'" aria-hidden="true">'+
          (a.aviso ? "⚠" : "→")+'</span>'+
        '<span class="at"><span class="t1">'+esc(a.txt)+'</span>'+
        '<span class="t2">'+esc(a.det)+'</span></span>'+
        (a.act ? '<button class="btn sm no-print" data-act="'+esc(a.act)+'"'+
          (a.id ? ' data-id="'+esc(a.id)+'"' : '')+'>Fazer</button>' : '')+
      '</div>').join("")+'</div>'+
    (d.cobrem
      ? '<div class="note" style="margin-top:11px">Juntas, estas alavancas cobrem o défice. '+
        'As de aviso (⚠) resolvem o mês à custa do futuro.</div>'
      : '<div class="note" style="margin-top:11px;border-left-color:var(--neg)">Mesmo juntas, estas alavancas '+
        'não chegam ao que falta. O défice é estrutural: exige mexer no que é fixo — habitação, crédito, '+
        'seguros — ou aumentar o rendimento.</div>')+

/* ===============================================================
   Rituais — arrumar, medir a constância, ver o stock crescer
   =============================================================== */

/**
 * Sequências: a constância tornada visível. Não há pontos nem troféus —
 * só a contagem do que se tem mantido, que é o que sustenta um orçamento
 * ao longo de anos. Conta-se para trás a partir do último mês fechado com
 * dados, e para no primeiro mês que quebra a regra.
 */
function sequencias(){
  const hojeM = isoMes(hoje());
  const out = [];

  /* Conta meses consecutivos, do mais recente para trás, enquanto a
     condição se mantiver. Só olha para meses com movimentos: um mês sem
     dados não confirma nem quebra nada — interrompe a contagem. */
  const contar = (cond) => {
    let n = 0;
    for (let i = 1; i <= 36; i++){
      const m = mesShift(hojeM, -i);
      const r = realMes(m);
      if (r.rend <= 0 && r.desp <= 0) break;
      if (!cond(m, r)) break;
      n++;
    }
    return n;
  };

  const saldos = contar((m, r) => r.saldo > 0);
  if (saldos >= 2) out.push({icone:"📈", n: saldos, unidade:"meses",
    txt:"meses seguidos com saldo positivo", vista:"painel"});

  // Limites respeitados: só conta nas categorias que têm limite definido
  const comLimite = S.categorias.filter(c => c.tipo === "despesa" && parseNum(S.limites[c.id]) > 0);
  comLimite.forEach(c => {
    const lim = parseNum(S.limites[c.id]);
    const n = contar((m, r) => (r.porCat[c.id] || 0) <= lim);
    if (n >= 3) out.push({icone: c.icone || "🎯", n, unidade:"meses",
      txt:"meses dentro do limite de "+c.nome, vista:"orcamento"});
  });

  // Meses fechados de seguida: o hábito de arrumar
  let fechados = 0;
  for (let i = 1; i <= 36; i++){
    if (S.fechados && S.fechados[mesShift(hojeM, -i)]) fechados++; else break;
  }
  if (fechados >= 2) out.push({icone:"✓", n: fechados, unidade:"meses",
    txt:"meses fechados sem falhar", vista:"painel"});

  // Objetivos: meses seguidos com a reserva a crescer, e metas atingidas
  const concluidos = S.objetivos.filter(o => parseNum(o.alvo) > 0 && poupadoObjetivo(o) >= parseNum(o.alvo)).length;
  if (concluidos >= 1) out.push({icone:"🎯", n: concluidos, unidade: concluidos === 1 ? "objetivo" : "objetivos",
    txt: concluidos === 1 ? "objetivo já atingido" : "objetivos já atingidos", vista:"objetivos"});

  // Estratégias em curso: rubricas de poupança criadas pela execução
  const aPoupar = S.recorrentes.filter(r => recAtiva(r, hojeM) &&
    /poupan|reforço|ppr|aforro|investir/i.test(r.nome || "")).length;
  if (aPoupar >= 1) out.push({icone:"🏦", n: aPoupar, unidade: aPoupar === 1 ? "estratégia" : "estratégias",
    txt: aPoupar === 1 ? "estratégia a entregar todos os meses" : "estratégias a entregar todos os meses",
    vista:"estrategias"});

  // Património líquido a crescer, instantâneo a instantâneo
  const hist = S.patrimonioHist || [];
  let subidas = 0;
  for (let i = hist.length - 1; i > 0; i--){
    if (hist[i].liquido > hist[i-1].liquido) subidas++; else break;
  }
  if (subidas >= 2) out.push({icone:"🏛", n: subidas, unidade:"meses",
    txt:"meses seguidos com o património a crescer", vista:"ativos"});

  return out.sort((a,b) => b.n - a.n);
}

/**
 * Fecho do mês. A arrumação de um mês é sempre a mesma coisa — categorizar
 * o que ficou solto, olhar os desvios, ajustar limites, escrever a nota —
 * e feita avulso esquece-se metade. Aqui é uma lista de passos com estado,
 * cada um a dizer o que falta e a levar ao sítio onde se faz.
 */
function passosFecho(mes){
  const m = mes || mesShift(isoMes(hoje()), -1);
  const r = realMes(m);
  const p = planoMes(m);
  const semCat = S.movimentos.filter(x => mesDoDia(x.data) === m && !x.categoriaId).length;
  const desvio = p.desp > 0 ? Math.abs(r.desp - p.desp) / p.desp * 100 : 0;
  const anomalias = anomaliasMes(m);
  const semLimite = S.categorias.filter(c => c.tipo === "despesa" &&
    (r.porCat[c.id] || 0) > 0 && !(parseNum(S.limites[c.id]) > 0)).length;
  const nota = (S.notas && S.notas[m]) || "";
  const temDados = r.rend > 0 || r.desp > 0;

  return {mes: m, temDados, passos: [
    {k:"categorias", feito: semCat === 0,
     t:"Categorizar o que ficou solto",
     d: semCat === 0 ? "Todos os movimentos de "+mesLabel(m)+" têm categoria."
        : semCat+" movimento(s) sem categoria — sem elas, os totais por categoria mentem.",
     vista:"movimentos", btn:"Ver movimentos"},
    {k:"desvios", feito: desvio <= 10,
     t:"Olhar os desvios face ao plano",
     d: "Despesa real "+eur(r.desp)+" contra "+eur(p.desp)+" previstos ("+
        (r.desp >= p.desp ? "+" : "")+pct(p.desp > 0 ? (r.desp-p.desp)/p.desp*100 : 0)+")."+
        (anomalias.length ? " "+anomalias.length+" categoria(s) fora do habitual." : ""),
     vista:"painel", btn:"Ver painel"},
    {k:"limites", feito: semLimite === 0,
     t:"Fechar limites em falta",
     d: semLimite === 0 ? "Todas as categorias com gasto têm limite."
        : semLimite+" categoria(s) com gasto e sem limite definido.",
     vista:"orcamento", btn:"Definir limites"},
    {k:"nota", feito: !!nota,
     t:"Escrever a nota do mês",
     d: nota ? "«"+nota+"»" : "Uma linha a explicar o mês poupa dúvidas daqui a seis meses.",
     vista:"painel", btn:"Escrever nota"},
  ]};
}

function cartaoFechoMes(){
  const anterior = mesShift(isoMes(hoje()), -1);
  // Só se oferece quando o mês anterior tem dados, ainda não está fechado, e
  // não foi dispensado nesta sessão
  if (S.fechados && S.fechados[anterior]) return "";
  if (ui.fechoDispensado === anterior) return "";
  const f = passosFecho(anterior);
  if (!f.temDados) return "";
  const feitos = f.passos.filter(x => x.feito).length;

  return '<div class="card"><div class="card-head"><div class="t"><h2>Fechar '+esc(mesLabel(anterior))+'</h2>'+
    '<div class="sub">Cinco minutos a arrumar o mês que passou. Nenhum passo é obrigatório — '+
    'o selo serve para saber onde ficou.</div></div>'+
    '<span class="tag">'+feitos+' de '+f.passos.length+'</span></div>'+
    '<div class="passos">'+f.passos.map((x, i) =>
