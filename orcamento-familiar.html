/**
 * Instantâneo do património no mês. A evolução mostra fluxos — o que
 * entrou e saiu; falta a linha do *stock*, que é a que mede o progresso.
 * Guarda-se um por mês, e o mais recente substitui o do mesmo mês.
 */
function registarPatrimonio(mes){
  const m = mes || isoMes(hoje());
  const b = balanco();
  if (!S.patrimonioHist) S.patrimonioHist = [];
  const existente = S.patrimonioHist.find(x => x.mes === m);
  // `balanco()` chama-lhe `ativos` (carteira + bens); aqui guarda-se como
  // `ativo`, que é o nome da série no gráfico.
  const dados = {mes: m, ativo: b.ativos, divida: b.divida, liquido: b.liquido};
  if (existente) Object.assign(existente, dados);
  else {
    S.patrimonioHist.push(dados);
    S.patrimonioHist.sort((a,b2) => a.mes.localeCompare(b2.mes));
  }
  return dados;
}

function cartaoPatrimonioTempo(){
  const hist = (S.patrimonioHist || []).slice(-24);
  const b = balanco();
  const agora = isoMes(hoje());
  // O mês corrente entra sempre, calculado ao vivo, mesmo sem instantâneo
  const serie = hist.filter(x => x.mes !== agora).concat([{mes: agora, ativo: b.ativos, divida: b.divida, liquido: b.liquido}]);
  if (serie.length < 2){
    return '<div class="card"><div class="card-head"><div class="t"><h2>Património ao longo do tempo</h2>'+
      '<div class="sub">A linha do que é seu, mês a mês.</div></div></div>'+
      vazioIlustrado("Ainda só há um ponto",
        "Uma linha precisa de dois. Guarde um instantâneo por mês e o progresso passa a ver-se — "+
        "o fecho do mês faz isso sozinho, todos os meses.",
        DESENHOS.patrimonio,
        '<button class="btn primary" data-act="patInstantaneo">Guardar instantâneo de '+
        esc(mesLabel(agora))+'</button>')+'</div>';
  }

  const W = 720, H = 200, padL = 62, padR = 14, padT = 14, padB = 28;
  const iw = W - padL - padR, ih = H - padT - padB;
  // Guarda contra um instantâneo estragado: um único valor não finito punha
  // NaN em toda a grelha do SVG, e o gráfico desaparecia sem dizer porquê.
  const vals = serie.map(s => s.liquido).concat(serie.map(s => s.ativo))
    .map(v => parseNum(v)).filter(v => Number.isFinite(v)).concat([0]);
  const max = Math.max(...vals), min = Math.min(...vals);
  const amp = (max - min) || 1;
  const x = (i) => padL + (i / Math.max(1, serie.length - 1)) * iw;
  const y = (v) => {
    const n = parseNum(v);
    return Number.isFinite(n) ? padT + ih - ((n - min) / amp) * ih : padT + ih;
  };

  let grelha = "";
  for (let g = 0; g <= 3; g++){
    const v = min + amp * g / 3, yy = y(v);
    grelha += '<line x1="'+padL+'" y1="'+yy.toFixed(1)+'" x2="'+(W-padR)+'" y2="'+yy.toFixed(1)+
      '" stroke="currentColor" opacity=".12"/>'+
      '<text x="'+(padL-7)+'" y="'+(yy+4).toFixed(1)+'" text-anchor="end" font-size="10" fill="currentColor" opacity=".55">'+
      esc(eur0(v))+'</text>';
  }
  const linha = (chave, cor, largura) => '<polyline fill="none" stroke="'+cor+'" stroke-width="'+largura+
    '" stroke-linejoin="round" points="'+serie.map((s,i) => x(i).toFixed(1)+","+y(s[chave]).toFixed(1)).join(" ")+'"/>';
  const area = '<polygon fill="var(--accent)" opacity=".13" points="'+
    padL+','+y(Math.max(min,0)).toFixed(1)+' '+
    serie.map((s,i) => x(i).toFixed(1)+","+y(s.liquido).toFixed(1)).join(" ")+' '+
    (padL+iw).toFixed(1)+','+y(Math.max(min,0)).toFixed(1)+'"/>';

  let zonas = "", eixo = "";
  const passo = Math.ceil(serie.length / 8) || 1;
  serie.forEach((s,i) => {
    zonas += '<rect class="hit" x="'+(x(i) - iw/serie.length/2).toFixed(1)+'" y="'+padT+'" width="'+
      (iw/serie.length).toFixed(1)+'" height="'+ih+'"'+
      tipData(mesLabel(s.mes), [["Ativo", eur(s.ativo)], ["Dívida", eur(s.divida)],
        ["Património líquido", eur(s.liquido)]])+'/>';
    if (i % passo === 0) eixo += '<text x="'+x(i).toFixed(1)+'" y="'+(H-8)+
      '" text-anchor="middle" font-size="10" fill="currentColor" opacity=".6">'+
      esc(mesLabel(s.mes, true))+'</text>';
  });

  const primeiro = serie[0], ultimo = serie[serie.length-1];
  const dif = ultimo.liquido - primeiro.liquido;
  const meses = serie.length - 1;

  return '<div class="card"><div class="card-head"><div class="t"><h2>Património ao longo do tempo</h2>'+
    '<div class="sub">A linha do <em>stock</em>: o que é seu, mês a mês. A evolução mostra fluxos; '+
    'esta mostra o resultado deles.</div></div>'+
    '<button class="btn sm no-print" data-act="patInstantaneo">Guardar instantâneo</button></div>'+
    '<div class="grid g3" style="margin-bottom:14px">'+
      kpi("Património líquido", eur(ultimo.liquido), "Hoje", ultimo.liquido >= 0 ? "accent" : "bad")+
      kpi("Variação no período", (dif >= 0 ? "+" : "")+eur(dif),
          meses+" "+(meses === 1 ? "mês" : "meses")+" · "+esc(eur(dif/Math.max(1,meses)))+"/mês",
          dif >= 0 ? "good" : "bad")+
      kpi("Instantâneos", String(serie.length), "O mês corrente é calculado ao vivo")+
    '</div>'+
    '<div class="tblwrap"><svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" '+
      'aria-label="Património líquido ao longo do tempo">'+
      grelha + area + linha("ativo", "var(--muted)", 1.5) + linha("liquido", "var(--accent)", 2.5) +
      eixo + zonas + '</svg></div>'+
    '<div class="legend">'+
      '<div><span class="dot" style="background:var(--accent)"></span><span>Património líquido</span></div>'+
      '<div><span class="dot" style="background:var(--muted)"></span><span>Ativo total</span></div>'+
    '</div></div>';
}

/* ===============================================================
   Insight — o que os números dizem sem ninguém perguntar
   =============================================================== */

/** Mediana de uma lista de números (lista vazia → 0). */
function mediana(vals){
  const v = vals.filter(x => Number.isFinite(x)).slice().sort((a,b) => a - b);
  if (!v.length) return 0;
  const meio = Math.floor(v.length / 2);
  return v.length % 2 ? v[meio] : (v[meio-1] + v[meio]) / 2;
}

/**
 * Quanto se espera gastar numa categoria neste mês — com sazonalidade.
 *
 * A eletricidade em janeiro não se compara com a de julho, e as férias em
 * agosto não são uma anomalia: são agosto. Por isso a referência é, por
 * ordem de preferência:
 *   1. os mesmos meses do calendário em anos anteriores (≥ 2 observações)
 *      — capta o padrão sazonal da própria pessoa;
 *   2. a mediana dos últimos seis meses, quando não há anos anteriores.
 * A mediana (e não a média) ignora um mês atípico isolado.
 */
function esperadoCategoria(catId, mes){
  const m = mes || MES;
  const [ano, mm] = m.split("-").map(Number);

  // 1. o mesmo mês do calendário, nos anos anteriores
  const homologos = [];
  for (let k = 1; k <= 3; k++){
    const mAnt = (ano - k) + "-" + String(mm).padStart(2, "0");
    const r = realMes(mAnt);
    if (r.rend > 0 || r.desp > 0) homologos.push(r.porCat[catId] || 0);
  }
  if (homologos.length >= 2)
    return {esperado: mediana(homologos), base: "sazonal", n: homologos.length};

  // 2. os últimos seis meses
  const recentes = [];
  for (let i = 1; i <= 6; i++){
    const mAnt = mesShift(m, -i);
    const r = realMes(mAnt);
    if (r.rend > 0 || r.desp > 0) recentes.push(r.porCat[catId] || 0);
  }
  // Com um único homólogo, vale mais do que nada: entra na mistura
  if (homologos.length === 1 && recentes.length >= 2)
    return {esperado: mediana(recentes.concat(homologos)), base: "misto", n: recentes.length + 1};
  if (recentes.length >= 2)
    return {esperado: mediana(recentes), base: "recente", n: recentes.length};
  return null;
}

const ANOMALIA_PCT = 25;    // desvio relativo mínimo
const ANOMALIA_EUR = 15;    // e desvio absoluto mínimo, para não alarmar cêntimos

/**
 * Categorias fora do habitual neste mês. Dupla fasquia de propósito: 40%
 * de desvio em 3 € não é notícia, e 15 € num orçamento grande também não —
 * só entra o que passa as duas.
 */
function anomaliasMes(mes){
  const m = mes || MES;
  const r = realMes(m);
  if (r.rend <= 0 && r.desp <= 0) return [];
  const out = [];
  S.categorias.filter(c => c.tipo === "despesa").forEach(c => {
    const gasto = r.porCat[c.id] || 0;
    const ref = esperadoCategoria(c.id, m);
    if (!ref || ref.esperado <= 0) return;
    const dif = gasto - ref.esperado;
    const pctDif = ref.esperado > 0 ? dif / ref.esperado * 100 : 0;
    if (Math.abs(pctDif) < ANOMALIA_PCT || Math.abs(dif) < ANOMALIA_EUR) return;
    out.push({cat: c, gasto, esperado: ref.esperado, dif, pct: pctDif,
              base: ref.base, n: ref.n, acima: dif > 0});
  });
  return out.sort((a,b) => Math.abs(b.dif) - Math.abs(a.dif));
}

/* Como se descreve a referência de uma anomalia, em palavras. */
const BASE_ANOMALIA = {

/**
 * Inflação pessoal: o seu cabaz, não o do INE. Compara o custo das mesmas
 * categorias entre este mês e o mês homólogo do ano anterior, ponderado
 * pelo peso de cada categoria no orçamento. Sem mês homólogo com dados,
 * não há número — e é melhor não haver do que inventar.
 */
function inflacaoPessoal(mes){
  const m = mes || MES;
  const [ano, mm] = m.split("-").map(Number);
  const mAnt = (ano - 1) + "-" + String(mm).padStart(2, "0");
  const rHoje = realMes(m), rAntes = realMes(mAnt);
  if (rHoje.desp <= 0 || (rAntes.rend <= 0 && rAntes.desp <= 0)) return null;

  const linhas = [];
  let pesoTotal = 0, somaPonderada = 0;
  S.categorias.filter(c => c.tipo === "despesa").forEach(c => {
    const a = rAntes.porCat[c.id] || 0;
    const b = rHoje.porCat[c.id] || 0;
    if (a <= 0 || b <= 0) return;           // sem os dois pontos não há variação
    const var_ = (b - a) / a * 100;
    const peso = b;                          // o peso é o que se gasta hoje
    linhas.push({cat: c, antes: a, agora: b, variacao: var_, peso});
    pesoTotal += peso;
    somaPonderada += var_ * peso;
  });
  if (!linhas.length || pesoTotal <= 0) return null;
  return {mes: m, mesAnterior: mAnt, taxa: somaPonderada / pesoTotal,
          linhas: linhas.sort((x,y) => Math.abs(y.variacao * y.peso) - Math.abs(x.variacao * x.peso)),
          nCategorias: linhas.length, cobertura: pesoTotal / rHoje.desp * 100};
}

  const inf = inflacaoPessoal(MES);

/* ===============================================================
   O mês por dentro

   A tesouraria a 12 meses responde a «em que mês é que aperta».
   Faltava a pergunta de dentro do mês: «e até ao dia 31, quando?».
   Duas peças: a linha do mês, que põe os pagamentos nos dias em que
   caem, e a previsão de fecho, que projeta o saldo final ao ritmo
   observado, com uma banda tirada da variabilidade dos meses anteriores.
   =============================================================== */

/** Os dias do mês em que sai (ou entra) dinheiro previsto, agrupados. */
function eventosDoMes(mes){
  const m = mes || MES;
  const [ano, mm] = m.split("-").map(Number);
  const ultimo = new Date(ano, mm, 0).getDate();
  const porDia = {};
  const juntar = (dia, nome, valor, tipo, cor) => {
    if (!dia) return;
    const d = Math.min(Math.max(1, dia), ultimo);
    if (!porDia[d]) porDia[d] = {dia: d, itens: [], despesa: 0, rendimento: 0};
    porDia[d].itens.push({nome, valor, tipo, cor});
    if (tipo === "rendimento") porDia[d].rendimento += valor; else porDia[d].despesa += valor;
  };

  // Rubricas do plano com dia marcado — as sem dia ficam de fora de propósito:
  // inventar-lhes o dia 1 dava uma linha do mês falsamente precisa.
  S.recorrentes.filter(r => recAtiva(r, m) && r.dia && r.frequencia === "mensal")
    .forEach(r => juntar(diaNoMes(r.dia, m), r.nome, recMensal(r),
      r.tipo === "rendimento" ? "rendimento" : "despesa", catCor(r.categoriaId)));

  // Compras planeadas marcadas para este mês, no fim do mês (não têm dia)
  (S.planeadas || []).filter(p => !p.feitaEm && p.mes === m && parseNum(p.valor) > 0)
    .forEach(p => juntar(ultimo, "🛒 "+p.nome, parseNum(p.valor), "despesa", catCor(p.categoriaId)));

  const dias = Object.keys(porDia).map(Number).sort((a,b) => a - b).map(d => porDia[d]);
  return {mes: m, ultimo, dias,
          totalDespesa: dias.reduce((s,d) => s + d.despesa, 0),
          totalRendimento: dias.reduce((s,d) => s + d.rendimento, 0)};
}

/** O próximo pagamento a partir de hoje, quando o mês em análise é o corrente. */
function proximoPagamento(){
  const ev = eventosDoMes(MES);
  if (MES !== isoMes(hoje())) return null;
  const hj = hoje().getDate();
  const d = ev.dias.find(x => x.dia >= hj && x.despesa > 0);
  if (!d) return null;
  return {dia: d.dia, faltam: d.dia - hj, valor: d.despesa,
          nomes: d.itens.filter(i => i.tipo !== "rendimento").map(i => i.nome)};
}

function cartaoLinhaMes(){
  const ev = eventosDoMes(MES);
  if (!ev.dias.length){
    // Um vazio que explica é um convite; um vazio em branco é um beco.
    const mensais = S.recorrentes.filter(r => recAtiva(r, MES) && r.frequencia === "mensal" &&
      r.tipo !== "rendimento").length;
    if (!mensais) return "";
    return '<div class="card"><div class="card-head"><div class="t"><h2>Linha do mês</h2>'+
      '<div class="sub">Os dias em que o dinheiro sai.</div></div></div>'+
      vazioIlustrado("Ainda sem dias marcados",
        mensais+" rubrica(s) mensais não têm dia. Indique o dia em que cada uma sai da conta e esta "+
        "linha enche-se — e a previsão de fecho fica mais certeira.",
        DESENHOS.linhaMes,
        '<button class="btn primary" data-act="ir" data-view="plano">Marcar os dias</button>')+'</div>';
  }
  const hj = MES === isoMes(hoje()) ? hoje().getDate() : 0;
  const maxDia = Math.max(...ev.dias.map(d => d.despesa + d.rendimento));

  // Uma coluna por dia do mês; as colunas com movimento ganham barra e balão.
  let celulas = "";
  for (let d = 1; d <= ev.ultimo; d++){
    const e = ev.dias.find(x => x.dia === d);
    const total = e ? e.despesa + e.rendimento : 0;
    const h = total > 0 && maxDia > 0 ? Math.max(4, Math.round(total / maxDia * 30)) : 0;
    const cor = e && e.rendimento > e.despesa ? "var(--pos)" : "var(--neg)";
    const passado = hj > 0 && d < hj;
    celulas += '<div class="ldCol'+(d === hj ? " hoje" : "")+'"'+
      (e ? tipData("Dia "+d+" de "+mesLabel(MES),
            e.itens.map(i => [i.nome, (i.tipo === "rendimento" ? "+" : "−")+eur(i.valor)])
              .concat([["Total do dia", eur(total)]])) : "")+'>'+
      '<div class="ldBarra">'+(h ? '<span style="height:'+h+'px;background:'+cor+
        ';opacity:'+(passado ? .45 : 1)+'"></span>' : "")+'</div>'+
      '<div class="ldDia">'+(d === hj ? "<strong>"+d+"</strong>" : (d % 5 === 0 || d === 1 ? d : "")) +'</div>'+
    '</div>';
  }

  const prox = proximoPagamento();
  const aviso = prox
    ? '<div class="note" style="margin-top:11px">Próximo pagamento: <strong>'+
      (prox.faltam === 0 ? "hoje" : prox.faltam === 1 ? "amanhã" : "dentro de "+prox.faltam+" dias")+
      '</strong> (dia '+prox.dia+'), '+esc(eur(prox.valor))+' — '+esc(prox.nomes.slice(0,3).join(", "))+
      (prox.nomes.length > 3 ? " e mais "+(prox.nomes.length-3) : "")+'.</div>'
    : (MES === isoMes(hoje())
      ? '<div class="note" style="margin-top:11px">Sem mais pagamentos marcados até ao fim do mês.</div>'
      : "");

  const semDia = S.recorrentes.filter(r => recAtiva(r, MES) && r.frequencia === "mensal" && !r.dia).length;
  const convite = semDia
    ? '<div class="note no-print" style="margin-top:9px">'+semDia+' rubrica(s) mensais sem dia marcado não aparecem aqui. '+
      'Indique o <strong>dia do mês</strong> em <button class="btn sm ghost" data-act="ir" data-view="plano">Despesas fixas</button>.</div>'
    : "";

  return '<div class="card"><div class="card-head"><div class="t"><h2>Linha do mês</h2>'+
    '<div class="sub">Os dias em que o dinheiro sai, em '+esc(mesLabel(MES))+'. '+
    'A altura é o valor do dia; o traço marca hoje.</div></div>'+
    '<span class="tag">'+esc(eur(ev.totalDespesa))+' em '+ev.dias.length+' dia(s)</span></div>'+
    '<div class="linhaMes">'+celulas+'</div>'+ aviso + convite +'</div>';
}

/**
 * Rubricas mensais que já têm movimento correspondente neste mês.
 *
 * «Lançar plano deste mês» cria um movimento por rubrica; sem esta ligação,
 * a previsão somava a rubrica outra vez ao que ela própria já gerou, e ainda
 * tomava esse movimento por despesa variável — inflando o ritmo diário. O
 * critério de igualdade é o mesmo que a cópia do mês anterior usa: descrição
 * sem acentos e valor. Cada movimento casa com uma rubrica só.
 */
function rubricasLancadas(mes){
  const m = mes || MES;
  const doMes = S.movimentos.filter(x => mesDoDia(x.data) === m);
  const usados = new Set();
  const lancadas = new Map();     // id da rubrica -> valor do movimento
  S.recorrentes.filter(x => recAtiva(x, m) && x.frequencia === "mensal").forEach(rec => {
    const chave = semAcento(rec.nome || "");
    const alvo = Math.abs(recMensal(rec)).toFixed(2);
    const mv = doMes.find(x => !usados.has(x.id) &&
      semAcento(x.descricao || "") === chave &&
      Math.abs(parseNum(x.valor)).toFixed(2) === alvo);
    if (mv){ usados.add(mv.id); lancadas.set(rec.id, Math.abs(parseNum(mv.valor))); }
  });
  return lancadas;
}

/**
 * Previsão de fecho do mês. O que já aconteceu é real; o que falta são as
 * rubricas mensais ainda por pagar (essas sabem-se ao cêntimo), as compras
 * planeadas marcadas e a despesa variável ao ritmo diário observado. A banda
 * vem da dispersão dos últimos três meses — sem histórico, não se inventa
 * banda nenhuma.
 */
function preverFechoMes(){
  const m = MES;
  if (m !== isoMes(hoje())) return null;      // só o mês a decorrer se prevê
  const r = realMes(m), p = planoMes(m);
  const [ano, mm] = m.split("-").map(Number);
  const ultimo = new Date(ano, mm, 0).getDate();
  const hj = hoje().getDate();
  const decorrido = hj / ultimo;
  if (r.rend <= 0 && r.desp <= 0) return null; // sem movimentos, nada a prever

  const lancadas = rubricasLancadas(m);
  const mensais = S.recorrentes.filter(x => recAtiva(x, m) && x.frequencia === "mensal");

  /* Por pagar é o que ainda não tem movimento — tenha dia marcado ou não.
     Uma rubrica sem dia continua a ser dinheiro que vai sair; ignorá-la
     deixava a previsão curta para quem ainda não preencheu os dias. */
  /* O que falta sair nunca é negativo. Uma rubrica com valor negativo — só
     chega assim de um ficheiro editado à mão, porque o formulário guarda o
     valor absoluto — punha a previsão a fechar o mês abaixo do que já se
     tinha gasto, o que não é previsão nenhuma. */
  const porPagar = mensais.filter(x => !lancadas.has(x.id));
  const fixasPorSair  = porPagar.reduce((s,x) =>
    s + (x.tipo === "rendimento" ? 0 : Math.max(0, recMensal(x))), 0);
  const rendPorEntrar = porPagar.reduce((s,x) =>
    s + (x.tipo === "rendimento" ? Math.max(0, recMensal(x)) : 0), 0);

  // Compras planeadas marcadas para este mês e ainda não realizadas
  const comprasPorFazer = (S.planeadas || [])
    .filter(x => !x.feitaEm && x.mes === m)
    .reduce((s,x) => s + Math.max(0, parseNum(x.valor)), 0);

  /* Variável é o que sobra depois de tirar as rubricas já lançadas — e são
     as lançadas que se tiram, não as que «já deviam ter saído»: é o
     movimento que conta, não o calendário. */
  let fixasJaLancadas = 0;
  mensais.forEach(x => {
    if (x.tipo === "rendimento") return;
    if (lancadas.has(x.id)) fixasJaLancadas += lancadas.get(x.id);
  });
  const variavelAteHoje = Math.max(0, r.desp - fixasJaLancadas);
  const ritmoDia = hj > 0 ? variavelAteHoje / hj : 0;
  const variavelPorVir = ritmoDia * (ultimo - hj);

  const despPrev = r.desp + fixasPorSair + comprasPorFazer + variavelPorVir;
  const rendPrev = Math.max(r.rend + rendPorEntrar, r.rend > 0 ? r.rend : p.rend);
  const saldoPrev = rendPrev - despPrev;

  // Banda: desvio absoluto médio do saldo dos três meses anteriores face à
  // sua média. Com menos de dois meses de histórico não há banda.
  const anteriores = [];
  for (let i = 1; i <= 3; i++){
    const mm2 = mesShift(m, -i);
    const rr = realMes(mm2);
    if (rr.rend > 0 || rr.desp > 0) anteriores.push(rr.saldo);
  }
  let margem = 0;
  if (anteriores.length >= 2){
    const media = anteriores.reduce((s,v) => s + v, 0) / anteriores.length;
    margem = anteriores.reduce((s,v) => s + Math.abs(v - media), 0) / anteriores.length;
    margem *= (1 - decorrido);      // quanto mais perto do fim, menor a incerteza
  }

  return {decorrido, dia: hj, ultimo, despPrev, rendPrev, saldoPrev, margem,
          fixasPorSair, comprasPorFazer, variavelPorVir, ritmoDia,
          mesesHistorico: anteriores.length,
          saldoReal: r.saldo, saldoPlano: p.saldo};
}

function cartaoPrevisao(){
  const f = preverFechoMes();
  if (!f) return "";
  const cor = f.saldoPrev >= 0 ? "good" : "bad";
  const banda = f.margem > 0
    ? "entre "+eur(f.saldoPrev - f.margem)+" e "+eur(f.saldoPrev + f.margem)
    : "sem histórico para estimar a margem";
  const veredicto = f.saldoPrev >= 0
    ? (f.margem > 0 && f.saldoPrev - f.margem < 0
       ? "Deve fechar positivo, mas a margem toca o vermelho"
       : "A caminho de fechar positivo")
    : "A caminho de fechar em défice — corte "+eur(-f.saldoPrev)+" até ao fim do mês";

  return '<div class="card"><div class="card-head"><div class="t"><h2>Como vai fechar o mês</h2>'+
    '<div class="sub">Dia '+f.dia+' de '+f.ultimo+' ('+esc(pct(f.decorrido*100))+' do mês). '+
    'O que já aconteceu é real; o resto é o ritmo observado mais as rubricas que ainda faltam.</div></div></div>'+
    '<div class="grid g3" style="margin-bottom:12px">'+
      kpi("Saldo previsto", eur(f.saldoPrev), banda, cor)+
      kpi("Despesa prevista", eur(f.despPrev),
          "Já "+eur(f.despPrev - f.fixasPorSair - f.comprasPorFazer - f.variavelPorVir)+" gastos", "bad")+
      kpi("Ritmo diário", eur(f.ritmoDia), "Despesa variável por dia", "warnb")+
    '</div>'+
    '<div style="font-size:13px;color:'+(f.saldoPrev >= 0 ? "var(--pos)" : "var(--neg)")+'">'+esc(veredicto)+'</div>'+
    '<div class="note" style="margin-top:11px">Falta sair: '+esc(eur(f.fixasPorSair))+' de rubricas com dia marcado'+
      (f.comprasPorFazer > 0 ? ', '+esc(eur(f.comprasPorFazer))+' de compras planeadas' : '')+
      ' e '+esc(eur(f.variavelPorVir))+' de despesa variável ao ritmo atual'+
      (f.mesesHistorico >= 2 ? ' · margem tirada dos últimos '+f.mesesHistorico+' meses' : '')+'.</div>'+
    '</div>';
}

/**
 * Nota do mês. Um número fora do comum quase sempre tem uma história —
 * férias, um jantar de empresa, o mês em que a caldeira se avariou — e sem
 * onde a guardar, seis meses depois ninguém se lembra porque é que agosto
 * foi caro. Guarda-se por mês, e aparece na fita, no relatório e na
 * comparação de meses.
 */
function cartaoNota(){
  const nota = (S.notas && S.notas[MES]) || "";
  return '<div class="card"><div class="card-head"><div class="t"><h2>Nota de '+esc(mesLabel(MES))+'</h2>'+
    '<div class="sub">O que explica os números deste mês. Aparece na fita, no relatório e na comparação.</div></div>'+
    (nota ? '<span class="tag">✎ escrita</span>' : "")+'</div>'+
    '<textarea id="notaMes" rows="2" maxlength="'+NOTA_MAX+'" placeholder="Ex.: férias no Algarve + revisão do carro" '+
      'style="width:100%;resize:vertical">'+esc(nota)+'</textarea>'+
    '<div class="actions no-print" style="margin-top:9px">'+
      '<button class="btn sm primary" data-act="notaGuardar">Guardar nota</button>'+
      (nota ? ' <button class="btn sm ghost" data-act="notaApagar">Apagar</button>' : "")+
    '</div></div>';
}

/** Resumo dos créditos no painel: encargo, dívida e taxa de esforço. */
function cartaoCreditosResumo(){
  if (!S.creditos.length) return "";
  const p = planoMes(MES), r = realMes(MES);
  const rend = (r.rend > 0 || r.desp > 0) ? r.rend : p.rend;
  const prestacoesMes = S.creditos.reduce((s,c) => s + encargoCredito(c, MES), 0);
  const esforco = rend > 0 ? prestacoesMes / rend * 100 : 0;
  const emDivida = S.creditos.reduce((s,c) => s + saldoDevedorMes(c, MES), 0);
  return '<div class="card"><div class="card-head"><div class="t"><h2>Créditos</h2>'+
    '<div class="sub">Encargo mensal e taxa de esforço.</div></div>'+
    '<button class="btn sm no-print" data-act="ir" data-view="creditos">Ver detalhe</button></div>'+
    '<div class="grid g3">'+
      kpi("Prestações/mês", eur(prestacoesMes), S.creditos.length+" crédito(s) ativo(s)")+
      kpi("Capital em dívida", eur(emDivida), "No fim de "+mesLabel(MES))+
      kpi("Taxa de esforço", pct(esforco),
          esforco > 40 ? "Acima do limiar prudente (40%)" : esforco > 33 ? "Zona de atenção" : "Dentro do razoável",
          esforco > 40 ? "bad" : esforco > 33 ? "warnb" : "good")+
    '</div></div>';
}

/** Resumo dos objetivos no painel: barra de progresso de cada meta. */
function cartaoObjetivosResumo(){
  if (!S.objetivos.length) return "";
  return '<div class="card"><div class="card-head"><div class="t"><h2>Objetivos de poupança</h2></div>'+
    '<button class="btn sm no-print" data-act="ir" data-view="objetivos">Gerir</button></div>'+
    S.objetivos.map(o => {
      const alvo = parseNum(o.alvo), atual = poupadoObjetivo(o);
      const p2 = alvo > 0 ? Math.min(100, atual/alvo*100) : 0;
      return '<div style="margin-bottom:11px">'+
        '<div class="barlbl"><span style="color:var(--text);font-weight:600">'+esc(o.nome)+'</span>'+
        '<span class="num">'+esc(eur(atual))+' / '+esc(eur(alvo))+' · '+esc(pct(p2))+'</span></div>'+
        '<div class="bar"><span style="width:'+p2.toFixed(1)+'%;background:'+esc(o.cor || "var(--pos)")+'"></span></div>'+
      '</div>';
    }).join("")+
    '</div>';
}

/* ---------------------------------------------------------------
   Cartões do painel — o que se vê, e por que ordem

   O painel cresceu por acumulação: cada funcionalidade nova trouxe o
   seu cartão. Em vez de escolher por todos, escolhe-se um padrão curto
   e deixa-se ligar o resto. `largo` diz quais ocupam a linha toda; os
   estreitos emparelham dois a dois, sem perder a ordem escolhida.
   --------------------------------------------------------------- */
const CARTOES_PAINEL = {
  atencao:     {lbl:"Precisa da sua atenção",   padrao:true,  largo:false},
  defice:      {lbl:"Resolver o défice",        padrao:true,  largo:true},
  fecho:       {lbl:"Fechar o mês passado",     padrao:true,  largo:true},
  previsao:    {lbl:"Como vai fechar o mês",    padrao:true,  largo:false},
  saude:       {lbl:"Saúde financeira",         padrao:false, largo:false},
  provisoes:   {lbl:"Provisões",                padrao:false, largo:true},
  linhaMes:    {lbl:"Linha do mês",             padrao:true,  largo:true},
  digest:      {lbl:"Resumo do mês fechado",    padrao:true,  largo:false},
  comparativo: {lbl:"Previsto vs. real",        padrao:true,  largo:false},
  grafico:     {lbl:"Despesa por categoria",    padrao:true,  largo:false},
  regra:       {lbl:"Regra 50 / 30 / 20",       padrao:true,  largo:false},
  marcos:      {lbl:"Sequências e marcos",      padrao:false, largo:false},
  nota:        {lbl:"Nota do mês",              padrao:false, largo:false},
  subscricoes: {lbl:"Subscrições ao ano",       padrao:false, largo:false},
  inflacao:    {lbl:"A sua inflação",           padrao:false, largo:false},
  comparar:    {lbl:"Comparar dois meses",      padrao:false, largo:true},
  podePagar:   {lbl:"Posso pagar isto?",        padrao:false, largo:false},
  sankey:      {lbl:"Para onde vai o dinheiro", padrao:false, largo:true},
  tesouraria:  {lbl:"Tesouraria a 12 meses",    padrao:false, largo:true},
  mapa:        {lbl:"Mapa do ano",              padrao:false, largo:true},
  evolucao:    {lbl:"Evolução",                 padrao:false, largo:false},
  patrimonioTempo:{lbl:"Património ao longo do tempo", padrao:false, largo:true},
  creditos:    {lbl:"Créditos",                 padrao:false, largo:false},
  objetivos:   {lbl:"Objetivos de poupança",    padrao:false, largo:false},
  patrimonio:  {lbl:"Património líquido",       padrao:false, largo:false},
  simulador:   {lbl:"Simulador «e se…»",        padrao:false, largo:false},
};
/* No modo essencial mostra-se o indispensável, sem mexer na configuração. */
const CARTOES_ESSENCIAIS = ["atencao", "comparativo"];

/**
 * Cartões ocultos. Enquanto ninguém configurar nada (`null`), valem os que
 * não são de padrão — é isto que mantém o painel curto de origem.
 */
function painelOcultos(){
  const cfg = S.painel || {};
  return Array.isArray(cfg.ocultos) ? cfg.ocultos
       : Object.keys(CARTOES_PAINEL).filter(k => !CARTOES_PAINEL[k].padrao);
}

/** As chaves visíveis, pela ordem escolhida. */
function cartoesPainel(){
  const cfg = S.painel || {};
  if (ui.essencial) return CARTOES_ESSENCIAIS.filter(k => CARTOES_PAINEL[k]);
  const ocultos = painelOcultos();
  const todas = Object.keys(CARTOES_PAINEL);
  const ordem = (Array.isArray(cfg.ordem) ? cfg.ordem : []).filter(k => CARTOES_PAINEL[k]);
  const restantes = todas.filter(k => ordem.indexOf(k) < 0);
  return ordem.concat(restantes).filter(k => ocultos.indexOf(k) < 0);
}
const cartaoFechado = (k) => ((S.painel || {}).fechados || []).indexOf(k) >= 0;

/**
 * Junta os cartões visíveis: os largos sozinhos, os estreitos aos pares.
 * Um cartão fechado mostra só a barra de título — e não é construído.
 */
function montarPainel(produtores){
  const chaves = cartoesPainel();
  const partes = [];
  let par = [];
  const fecharPar = () => {
    if (!par.length) return;
    partes.push('<div class="grid g2">'+par.join("")+'</div>');
    par = [];
  };

  chaves.forEach(k => {
    const meta = CARTOES_PAINEL[k];
    const fechado = cartaoFechado(k);
    const html = fechado ? "" : (produtores[k] ? produtores[k]() : "");
    if (!fechado && !html) return;             // sem conteúdo, sem cartão
    const bloco = envolverCartao(k, meta, html, fechado);
    if (meta.largo){ fecharPar(); partes.push(bloco); }
    else {
      par.push(bloco);
      if (par.length === 2) fecharPar();
    }
  });
  fecharPar();
  return partes.join('<div style="height:16px"></div>');
}

/** Acrescenta a um cartão a barra de colapso, sem lhe tocar no conteúdo. */
function envolverCartao(chave, meta, html, fechado){
  const barra = '<div class="cabPainel no-print">'+
    '<button data-act="painelColapsar" data-k="'+esc(chave)+'" aria-expanded="'+(!fechado)+'" '+
      'aria-label="'+(fechado ? "Abrir" : "Fechar")+' '+esc(meta.lbl)+'">'+(fechado ? "▸" : "▾")+'</button>'+
    (fechado ? '<span class="tt">'+esc(meta.lbl)+'</span>' : "")+
    '</div>';
  if (fechado) return '<div class="card cartaoFechado">'+barra+'</div>';
  return '<div class="comCab">'+barra+html+'</div>';
}

/**
 * Simulador do painel: efeito de um reforço adicional de poupança sobre a
 * carteira e sobre o património líquido, ao fim de N anos.
 */
function simuladorOut(){
  const anos = Math.max(1, Math.min(40, Math.round(ui.simAnos)));
  const extra = Math.max(0, ui.simExtra);
  const meses = anos * 12;

  // Retorno de referência: o da carteira, ou 4% se ainda não houver carteira.
  const rAnual = financeiros().length ? retornoCarteira(true) : 4;
  const rMes = Math.pow(1 + Math.max(-0.99, rAnual/100), 1/12) - 1;

  const serie = projetarCarteira(anos, {ajuste: 0});
  const carteiraBase = serie[serie.length-1].valor;
  // Valor futuro do reforço adicional (série de pagamentos no fim de cada mês)
  const fvExtra = rMes === 0 ? extra * meses : extra * ((Math.pow(1+rMes, meses) - 1) / rMes);
  const carteiraCom = carteiraBase + fvExtra;

  // Bens valorizados e dívida amortizada ao fim do horizonte
  // Idem: a projeção da carteira já cobre os financeiros.
  const bensFuturos = reais().reduce((s,a) => s + valorAtivoFuturo(a, anos), 0);
  const dividaFutura = S.creditos.reduce((s,c) => s + saldoDevedorMes(c, mesShift(MES, meses)), 0);

  const liquidoBase = carteiraBase + bensFuturos - dividaFutura;
  const liquidoCom  = carteiraCom  + bensFuturos - dividaFutura;
  const aportado = extra * meses;
  const jurosGanhos = fvExtra - aportado;

  return '<div class="grid g2" style="margin-bottom:14px">'+
      kpi("Património líquido daqui a "+anos+" anos", eur(liquidoCom),
          extra > 0 ? "+"+eur(liquidoCom - liquidoBase)+" face a não reforçar" : "Sem reforço adicional",
          extra > 0 ? "good" : "accent")+
      kpi("Carteira daqui a "+anos+" anos", eur(carteiraCom),
          "A "+pct(rAnual)+" ao ano")+
    '</div>'+
    (extra > 0
      ? '<div class="tblwrap"><table><tbody>'+
        '<tr><td>Reforço adicional acumulado</td><td class="r num">'+esc(eur(aportado))+'</td></tr>'+
        '<tr><td>Rendimento que esse reforço gera</td><td class="r num pos">+'+esc(eur(jurosGanhos))+'</td></tr>'+
        '</tbody><tfoot><tr><td>Valor acrescentado à carteira</td>'+
        '<td class="r num pos">'+esc(eur(fvExtra))+'</td></tr></tfoot></table></div>'+
        '<div class="note" style="margin-top:12px">Poupar mais '+esc(eur(extra))+' por mês durante '+anos+
        ' anos acrescenta <strong>'+esc(eur(fvExtra))+'</strong> à carteira — dos quais '+esc(eur(jurosGanhos))+
        ' vêm do juro composto, não do seu bolso.</div>'

/* Série mensal dos últimos n meses (o próprio incluído), para as tendências. */
function serieMensal(fn, n){
  const out = [];
  for (let i = n - 1; i >= 0; i--) out.push(fn(mesShift(MES, -i)));
  return out;
}
/** Valor do mês: o real quando há movimentos registados, senão o plano. */
function valorMes(campo, mes){
  const r = realMes(mes);
  return (r.rend > 0 || r.desp > 0) ? r[campo] : planoMes(mes)[campo];
}

/** Despesa de uma categoria nos últimos n meses. */
function serieCategoria(catId, n){
  const out = [];
  for (let i = n - 1; i >= 0; i--){
    const m = mesShift(MES, -i);
    const r = realMes(m), p = planoMes(m);
    const f = (r.rend > 0 || r.desp > 0) ? r : p;
    out.push(f.porCat[catId] || 0);
  }
  return out;
}

/**
 * Minigráfico de barras para dentro de uma célula de tabela: a linha
 * passa a dizer direção, não só o valor deste mês.
 */
function minigrafico(serie, cor){
  if (!serie || !serie.length) return "";
  const max = Math.max(...serie);
  if (max <= 0) return '<span class="muted" style="font-size:11px">—</span>';
  const W = 70, H = 20, lar = W / serie.length;
  const barras = serie.map((v, i) =>
    '<rect x="'+(i*lar+0.6).toFixed(1)+'" y="'+(H - Math.max(1.5, v/max*H)).toFixed(1)+
    '" width="'+(lar-1.2).toFixed(1)+'" height="'+Math.max(1.5, v/max*H).toFixed(1)+
    '" rx="1" fill="'+esc(cor || "var(--accent)")+'" opacity="'+(i === serie.length-1 ? .95 : .4)+'"/>').join("");
  return '<svg class="mini" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Últimos '+serie.length+' meses">'+
    barras+'</svg>';
}

/** Linha de tendência minimalista, para dentro de um KPI. */
function sparkline(serie){
  const W = 200, H = 26, pad = 3;
  const min = Math.min(...serie), max = Math.max(...serie);
  const amp = (max - min) || 1;
  const x = (i) => pad + i * (W - 2*pad) / Math.max(1, serie.length - 1);
  const y = (v) => H - pad - (v - min) / amp * (H - 2*pad);
  const pts = serie.map((v,i) => x(i).toFixed(1)+","+y(v).toFixed(1)).join(" ");
  const fx = x(serie.length - 1).toFixed(1), fy = y(serie[serie.length-1]).toFixed(1);
  return '<svg class="spark" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" aria-hidden="true">'+
    '<polyline fill="none" stroke="currentColor" stroke-width="1.8" opacity=".55" points="'+pts+'"/>'+
    '<circle cx="'+fx+'" cy="'+fy+'" r="2.6" fill="currentColor"/></svg>';
}

/**
 * KPI com tendência: variação face ao mês anterior e traço dos últimos meses.
 * `maiorMelhor` decide a cor do delta (numa despesa, subir é mau).
 */
function kpiTend(lbl, val, hint, tipo, serie, maiorMelhor){
  const n = serie.length;
  const atual = serie[n-1], anterior = n > 1 ? serie[n-2] : 0;
  let chip = "";
  if (Math.abs(anterior) > 0.005){
    const d = (atual - anterior) / Math.abs(anterior) * 100;
    if (Math.abs(d) >= 0.05){
      const bom = maiorMelhor ? d >= 0 : d <= 0;
      chip = '<span class="delta '+(bom ? "pos" : "neg")+'">'+(d > 0 ? "+" : "−")+
        esc(Math.abs(d).toLocaleString("pt-PT",{maximumFractionDigits:1}))+'% vs. '+
        esc(mesLabel(mesShift(MES,-1), true))+'</span>';
    }
  }
  const varia = serie.some(v => Math.abs(v - serie[0]) > 0.005);
  return '<div class="kpi '+(tipo || "")+'"><div class="lbl">'+esc(lbl)+'</div>'+
    '<div class="val">'+esc(val)+chip+'</div>'+
    (hint ? '<div class="hint">'+esc(hint)+'</div>' : "")+
    (varia ? sparkline(serie) : "")+'</div>';
}

/** Os movimentos do mês depois dos filtros em vigor — a lista que se vê. */
function movimentosFiltrados(){
  let lista = S.movimentos.filter(m => mesDoDia(m.data) === MES);
  if (filtros.texto){
    const q = filtros.texto.toLowerCase();
    lista = lista.filter(m => (m.descricao || "").toLowerCase().includes(q) ||
                              catNome(m.categoriaId).toLowerCase().includes(q));
  }
  if (filtros.categoria) lista = lista.filter(m => m.categoriaId === filtros.categoria);
  if (filtros.membro)    lista = lista.filter(m => m.membroId === filtros.membro);
  if (filtros.tipo)      lista = lista.filter(m => m.tipo === filtros.tipo);
  return lista;
}

/**
 * Termo mais longo comum a várias descrições — serve para propor uma regra
 * («CONTINENTE») a partir dos movimentos que se acabaram de categorizar.
 */
function termoComum(descricoes){
  const listas = descricoes.filter(Boolean).map(d =>
    semAcento(d).split(/[^a-z0-9]+/).filter(t => t.length >= 4));
  if (listas.length < 2) return "";
  let comuns = listas[0].slice();
  for (let i = 1; i < listas.length; i++) comuns = comuns.filter(t => listas[i].indexOf(t) >= 0);
  if (!comuns.length) return "";
  const escolhido = comuns.sort((a,b) => b.length - a.length)[0];
  // Devolver com a grafia original da primeira descrição que o contenha
  for (const d of descricoes){
    if (!d) continue;
    const idx = semAcento(d).indexOf(escolhido);
    if (idx >= 0) return d.substr(idx, escolhido.length);
  }
  return escolhido;
}

/**
 * Calendário do mês com a despesa de cada dia em intensidade de cor —
 * os padrões («os sábados custam-me 80 €») saltam à vista.
 */
function calendarioCalor(){
  const doMes = S.movimentos.filter(m => (m.data || "").indexOf(MES) === 0);
  if (!doMes.length) return "";
  const porDia = {};
  doMes.forEach(m => {
    const d = parseInt((m.data || "").slice(8), 10);
    if (!d) return;
    if (!porDia[d]) porDia[d] = {desp:0, rend:0};
    porDia[d][m.tipo === "rendimento" ? "rend" : "desp"] += Math.abs(parseNum(m.valor));
  });
  const maxDesp = Math.max(1, ...Object.values(porDia).map(x => x.desp));
  const [ano, mm] = MES.split("-").map(Number);
  const nDias = new Date(ano, mm, 0).getDate();
  const off = (new Date(ano, mm - 1, 1).getDay() + 6) % 7;   // segunda-feira primeiro

  let celulas = ["S","T","Q","Q","S","S","D"].map(d =>
    '<div class="hdia" aria-hidden="true">'+d+'</div>').join("");
  for (let i = 0; i < off; i++) celulas += '<div></div>';
  for (let d = 1; d <= nDias; d++){
    const x = porDia[d];
    const alfa = x ? 0.12 + 0.78 * (x.desp / maxDesp) : 0;
    const dd = String(d).padStart(2, "0");
    celulas += '<div class="hcel'+(x ? " hit" : "")+'" style="'+
      (x && x.desp > 0 ? 'background:color-mix(in srgb,var(--neg) '+(alfa*100).toFixed(0)+'%,var(--surface-2));' : "")+
      (x && x.desp === 0 && x.rend > 0 ? 'background:color-mix(in srgb,var(--pos) 25%,var(--surface-2));' : "")+'"'+
      (x ? tipData(dd+"/"+String(mm).padStart(2,"0"), [["Despesa", eur(x.desp)], ["Rendimento", eur(x.rend)]]) : "")+
      '>'+d+'</div>';
  }
  return '<div class="hmap-wrap"><div class="barlbl"><span><strong style="color:var(--text)">Calendário do mês</strong>'+
    ' · quanto mais escuro, maior a despesa do dia</span></div>'+
    '<div class="hmap">'+celulas+'</div></div>';
}

    '<div class="note" style="margin-top:11px">Uma fonte agrupa tudo o que vem do mesmo sítio. '+
    'Dentro dela acrescenta as componentes — vencimento base, subsídios de férias e Natal, subsídio de alimentação, '+
    'trabalho suplementar, prémios, comissões — cada uma com a sua periodicidade e tratamento fiscal.</div>'+
    '</div>';

  const tot = fiscalTotal();

  const kpis = '<div class="grid g4" style="margin-bottom:16px">'+
    kpi("Rendimento bruto", eur(tot.bruto), "Soma de todas as componentes, por mês", "accent")+
    kpi("Segurança Social", eur(tot.ss),
        (function(){
          // Com regimes diferentes entre fontes, uma taxa única seria mentira:
          // mostra-se a taxa efetiva sobre o conjunto das bases contributivas.
          // Só contam as fontes que têm base contributiva: uma fonte isenta
          // não faz do conjunto um caso de "regimes diferentes".
          const regimes = new Set(S.rendimentos
            .filter(r => r.ativo !== false && fiscalRendimento(r).baseSS > 0)
            .map(r => r.regime || "dependente"));
          if (regimes.size === 0) return "Sem base contributiva";
          if (regimes.size === 1){
            const r = Array.from(regimes)[0];
            return pct(taxaSS({regime:r}))+" sobre a base contributiva";
          }
          return tot.baseSS > 0
            ? pct(tot.ss/tot.baseSS*100)+" efetivos — regimes diferentes entre fontes"
            : "Sem base contributiva";
        })(), "bad")+
    kpi("IRS retido", eur(tot.irs), pct(parseNum(S.fiscal.irsEfetivo))+" de taxa efetiva", "bad")+
    kpi("Rendimento líquido", eur(tot.liquido),
        "Carga fiscal de "+pct(tot.taxaEfetiva), tot.taxaEfetiva > 35 ? "warnb" : "good")+
  '</div>';

  if (!S.rendimentos.length){
    return '<div class="card"><div class="card-head"><div class="t"><h2>Rendimentos</h2>'+
      '<div class="sub">Cada fonte com as suas componentes e o respetivo tratamento fiscal.</div></div></div>'+
      form+vazioIlustrado("Ainda não há fontes de rendimento","Cada fonte — um vencimento, uma pensão — decompõe-se em componentes, e a ferramenta trata do IRS e da Segurança Social de cada uma.",DESENHOS.rendimentos)+'</div>';
  }

  const fichas = S.rendimentos.map(fichaRendimento).join('<div style="height:16px"></div>');

  /* Repartição por espécie, para ver o peso do que é fixo e do que é variável */
  const porEspecie = {};
  S.rendimentos.forEach(rd => {
    if (rd.ativo === false) return;
    (rd.componentes || []).forEach(c => {
      const k = ESPECIES[c.especie] ? c.especie : "outro";
      porEspecie[k] = (porEspecie[k] || 0) + compMensal(c);
    });
  });
  const dados = Object.entries(porEspecie).map(([k,v]) =>
    ({nome: especieDe(k).lbl, cor: especieDe(k).cor, valor: v}));

  const composicao = '<div class="card"><div class="card-head"><div class="t"><h2>Composição do rendimento</h2>'+
    '<div class="sub">Peso de cada espécie no bruto mensal. Clique numa fatia para a isolar.</div></div></div>'+
    donut(dados, tot.bruto, 99, "rendEspecies")+'</div>';

  /* Onde vai o rendimento bruto */
  const cascata = '<div class="card"'+aj("Do bruto ao líquido",
      "O caminho que o rendimento faz entre o que o empregador paga e o que chega à conta. As componentes isentas — subsídio de alimentação dentro do limite, ajudas de custo, abonos — não entram em nenhuma das bases de incidência.",
      "Líquido = bruto − SS − IRS")+
    '><div class="card-head"><div class="t"><h2>Do bruto ao líquido</h2>'+
    '<div class="sub">Valores mensais, com as taxas definidas em Definições → Fiscalidade.</div></div></div>'+
    '<div class="tblwrap"><table><tbody>'+
      '<tr><td>Rendimento bruto</td><td class="r num">'+esc(eur(tot.bruto))+'</td></tr>'+
      (tot.social > 0
        ? '<tr><td class="muted">— do qual prestações sociais (abonos e subsídios)</td>'+
          '<td class="r num muted">'+esc(eur(tot.social))+'</td></tr>' : "")+
      '<tr><td class="muted">— do qual isento de IRS e SS</td><td class="r num muted">'+esc(eur(tot.isento))+'</td></tr>'+
      '<tr><td>Segurança Social</td><td class="r num neg">−'+esc(eur(tot.ss))+'</td></tr>'+
      '<tr><td>Retenção de IRS</td><td class="r num neg">−'+esc(eur(tot.irs))+'</td></tr>'+
      (tot.autonomo > 0
        ? '<tr><td>Tributação autónoma (rendas, capitais)</td><td class="r num neg">−'+esc(eur(tot.autonomo))+'</td></tr>' : "")+
    '</tbody><tfoot><tr><td>Rendimento líquido</td>'+
      '<td class="r num pos">'+esc(eur(tot.liquido))+'</td></tr></tfoot></table></div>'+
    '<div class="barlbl" style="margin-top:14px"><span>Carga fiscal</span><span class="num">'+esc(pct(tot.taxaEfetiva))+'</span></div>'+
    '<div class="bar" style="height:14px;display:flex">'+
      '<span style="width:'+(tot.bruto > 0 ? tot.liquido/tot.bruto*100 : 0).toFixed(1)+'%;background:var(--pos);border-radius:0"'+
        tipData("Líquido", [["Valor", eur(tot.liquido)]])+'></span>'+
      '<span style="width:'+(tot.bruto > 0 ? tot.ss/tot.bruto*100 : 0).toFixed(1)+'%;background:var(--warn);border-radius:0"'+
        tipData("Segurança Social", [["Valor", eur(tot.ss)]])+'></span>'+
      '<span style="width:'+(tot.bruto > 0 ? (tot.irs+tot.autonomo)/tot.bruto*100 : 0).toFixed(1)+'%;background:var(--neg);border-radius:0"'+
        tipData("IRS e tributação autónoma", [["Valor", eur(tot.irs+tot.autonomo)]])+'></span>'+
    '</div>'+
    '<div class="legend" style="margin-top:8px">'+
      '<div><span class="dot" style="background:var(--pos)"></span>Líquido</div>'+
      '<div><span class="dot" style="background:var(--warn)"></span>Segurança Social</div>'+
      '<div><span class="dot" style="background:var(--neg)"></span>IRS</div>'+
    '</div>'+
    '<div class="note" style="margin-top:12px">A taxa de IRS é a <strong>taxa efetiva média</strong> que indicar, não a tabela de retenção. '+
    'Encontra a sua no recibo de vencimento ou na última liquidação. As componentes isentas '+
    '(subsídio de alimentação até ao limite, ajudas de custo, abonos) não entram nas bases de incidência.</div>'+
    '</div>';

  return '<div class="card"><div class="card-head"><div class="t"><h2>Rendimentos</h2>'+
    '<div class="sub">Cada fonte com as suas componentes e o respetivo tratamento fiscal.</div></div></div>'+
    form+'</div><div style="height:16px"></div>'+
    kpis+
    '<div class="grid g2">'+composicao+cascata+'</div>'+
    '<div style="height:16px"></div>'+fichas;
}

/** Ficha de uma fonte de rendimento, com as componentes colapsáveis. */
function fichaRendimento(rd){
  const fx = fiscalRendimento(rd);
  const abertoAgora = aberto("rd-" + rd.id);
  const emEdicao = editando.comp && editando.comp.rdId === rd.id;
  const comps = rd.componentes || [];

  const linhas = comps.map(c => {
    const esp = especieDe(c.especie);
    const v = compMensal(c);
    const ss = sujeitoSS(c), irs = sujeitoIRS(c);
    const marcas = esp.aut
      ? '<span class="tag g-desejos">autónoma '+esc(pct(parseNum(S.fiscal[esp.aut] || 0)))+'</span>'
      : (ss || irs
          ? (ss ? '<span class="tag g-necessidades">SS</span> ' : "") + (irs ? '<span class="tag g-necessidades">IRS</span>' : "")
          : '<span class="tag g-poupanca">isento</span>');
    // Nas prestações sociais mostra-se de onde veio o valor, para não
    // ficar um número solto sem rasto.
    let origem = "";
    if (c.especie === "parentalidade" && c.modalidade){
      const m = modalidadeParental(c.modalidade);
      origem = m.lbl + " · " + pct(m.pct) +
               (parseNum(c.numBebes) > 1 ? " · " + parseNum(c.numBebes) + " bebés" : "") +
               (parseNum(c.internamento) > 0 ? " · internamento " + parseNum(c.internamento) + "d" : "");
    } else if (c.especie === "abonoFamilia"){
      const a = abonoFamilia(c.idadeMeses, c.monoparental,
        {menos36: c.menos36, deficiencia: c.deficiencia, numMenos36: contarMenos36()});
      origem = a.escalao.n + ".º escalão · " + parseNum(c.idadeMeses) + " meses" +
               (a.monoparental ? " · monoparental" : "") +
               (c.menos36 ? " · <36m" : "") +
               (c.deficiencia ? " · deficiência" : "");
    } else if (c.especie === "abonoPrenatal"){
      const a = abonoPrenatal(c.numBebes, c.monoparental);
      origem = "Pré-natal · " + a.escalao.n + ".º escalão" +
               (parseNum(c.numBebes) > 1 ? " · " + parseNum(c.numBebes) + " bebés" : "") +
               (a.monoparental ? " · monoparental" : "");
    } else if (c.especie === "riscoGravidez"){
      origem = pct(PARENTALIDADE.riscoPct) + " da remuneração de referência";
    }

    return '<tr>'+
      '<td><strong>'+esc(c.nome || esp.lbl)+'</strong>'+
        '<br><span class="muted" style="font-size:11.5px">'+esc(origem || esp.lbl)+'</span></td>'+
      '<td>'+marcas+'</td>'+
      '<td><span class="tag"><span class="dot" style="background:'+esc(catCor(c.categoriaId))+'"></span>'+
        esc(catRotulo(c.categoriaId))+'</span></td>'+
      '<td>'+esc((FREQ[c.frequencia] || FREQ.mensal).lbl)+'</td>'+
      '<td class="r num">'+esc(eur(parseNum(c.valor)))+'</td>'+
      '<td class="r num"><strong>'+esc(eur(v))+'</strong></td>'+
      '<td class="r no-print" style="white-space:nowrap">'+
        '<button class="btn sm ghost" data-act="compEditar" data-rd="'+esc(rd.id)+'" data-id="'+esc(c.id)+'">✎</button> '+
        '<button class="btn sm ghost" data-act="compApagar" data-rd="'+esc(rd.id)+'" data-id="'+esc(c.id)+'">✕</button></td>'+
    '</tr>';
  }).join("");

  const corpo = comps.length
    ? '<div class="tblwrap"><table><thead><tr><th>Componente</th><th>Incidência</th><th>Categoria</th>'+
      '<th>Periodicidade</th><th class="r">Valor</th><th class="r">Equiv./mês</th><th class="no-print"></th></tr></thead>'+
      '<tbody>'+linhas+'</tbody>'+
      '<tfoot><tr><td colspan="5">Bruto mensal</td><td class="r num">'+esc(eur(fx.bruto))+'</td>'+
      '<td class="no-print"></td></tr></tfoot></table></div>'
    : '<div class="empty" style="padding:14px">Sem componentes. Acrescente pelo menos o vencimento base.</div>';

  return '<div class="card">'+
    '<div class="card-head">'+
      '<button class="btn ghost sm no-print" data-act="alternar" data-id="rd-'+esc(rd.id)+'" '+
        'aria-expanded="'+abertoAgora+'" title="Mostrar ou esconder as componentes">'+(abertoAgora ? "▾" : "▸")+'</button>'+
      '<div class="t"><h2>'+esc(rd.nome || "Fonte de rendimento")+
        (rd.ativo === false ? ' <span class="tag">inativa</span>' : "")+'</h2>'+
        '<div class="sub">'+(rd.membroId ? esc(membroRotulo(rd.membroId))+' · ' : "")+
        esc((REGIMES_SS[rd.regime] || REGIMES_SS.dependente).lbl)+' · '+
        comps.length+' componente(s) · bruto '+esc(eur(fx.bruto))+' · líquido <strong>'+esc(eur(fx.liquido))+'</strong>'+
        ' · carga '+esc(pct(fx.taxaEfetiva))+'</div></div>'+
      '<div class="no-print" style="white-space:nowrap">'+
        '<button class="btn sm" data-act="compNovo" data-rd="'+esc(rd.id)+'">+ Componente</button> '+
        '<button class="btn sm ghost" data-act="rdToggle" data-id="'+esc(rd.id)+'" title="Ativar ou desativar">'+(rd.ativo === false ? "○" : "●")+'</button> '+
        '<button class="btn sm ghost" data-act="rdEditar" data-id="'+esc(rd.id)+'">✎</button> '+
        '<button class="btn sm ghost" data-act="rdApagar" data-id="'+esc(rd.id)+'">✕</button></div></div>'+
    (abertoAgora || emEdicao
      ? (emEdicao ? formComponente(rd) : "") + corpo +
        '<div class="grid g4" style="margin-top:14px">'+
          kpi("Bruto", eur(fx.bruto), "Por mês")+
          kpi("Segurança Social", eur(fx.ss), pct(fx.taxaContrib)+" sobre "+eur(fx.baseSS), "bad")+
          kpi("IRS", eur(fx.irs),
              fx.rf && fx.rf.usaTabela
                ? fx.rf.tabela.nome+" · "+pct(fx.taxaIRS)+" efetivos"
                : pct(parseNum(S.fiscal.irsEfetivo))+" sobre "+eur(fx.baseIRS), "bad")+
          kpi("Líquido", eur(fx.liquido), pct(fx.taxaEfetiva)+" de carga", "good")+
        '</div>'+
        (fx.isento > 0
          ? '<div class="note" style="margin-top:12px">'+esc(eur(fx.isento))+
            '/mês não entram nas bases de incidência (subsídio de alimentação dentro do limite, ajudas de custo, abonos).</div>' : "")+
        blocoRetencao(rd, fx)+
        avisoDuplicacao(rd)
      : '<div class="note no-print">Clique em ▸ para ver e editar as componentes.</div>')+
  '</div>';
}

/**
 * Detalhe da retenção na fonte: que tabela, que escalão, e quanto sai de
 * cada pagamento. É a parte que permite conferir contra o recibo.
 */
function blocoRetencao(rd, fx){
  const rf = fx.rf;
  if (!rf || !rf.usaTabela){
    const cat = categoriaRF(rd);
    if (!cat && S.fiscal.modoIRS === "tabela"){
      return '<div class="note" style="margin-top:12px">O regime desta fonte '+
        '('+esc((REGIMES_SS[rd.regime] || REGIMES_SS.dependente).lbl)+') não usa as tabelas de retenção '+
        'do trabalho dependente nem das pensões. A retenção, havendo, segue as regras próprias do regime — '+
        'aqui aplica-se a taxa efetiva definida em Definições.</div>';
    }
    return "";
  }

  const esc0 = rf.escalao;
  const parcela = Array.isArray(esc0.p)
    ? esc0.p[0]*esc0.p[1]*(esc0.p[2] - rf.mensal)
    : parseNum(esc0.p);
  const porDep = (rf.tabela.dep === "dep" ? parseNum(esc0.d) : 0) * rf.dependentes;

  const linhas = rf.detalhe.filter(d => d.base > 0).map(d =>
    '<tr><td>'+esc(d.rotulo)+(d.fator !== 1
        ? ' <span class="muted" style="font-size:11.5px">· '+esc((d.fator*12).toLocaleString("pt-PT",{maximumFractionDigits:2}))+
          '× por ano</span>' : "")+'</td>'+
    '<td class="r num">'+esc(eur(d.base))+'</td>'+
    '<td class="r num">'+esc(pct(d.base > 0 ? d.retencao/d.base*100 : 0))+'</td>'+
    '<td class="r num">'+esc(eur(d.retencao))+'</td>'+
    '<td class="r num">'+esc(eur(d.retencao * d.fator))+'</td></tr>').join("");

  return '<div style="margin-top:16px">'+
    secao(''+
      'Retenção na fonte — '+esc(rf.tabela.nome)+', '+esc(TABELAS_RF.regioes[rf.regiao].lbl)+'')+
    '<div class="note" style="margin-bottom:10px">'+esc(rf.tabela.situacao)+
      (rf.dependentes > 0 && rf.tabela.dep === "dep"
        ? ' · '+rf.dependentes+' dependente(s), '+esc(eur(porDep))+' a abater por pagamento' : "")+
      ' · escalão '+(esc0.sup ? 'superior a ' : 'até ')+esc(eur(esc0.a))+
      ', taxa marginal '+esc(pct(parseNum(esc0.t)*100))+'</div>'+
    '<div class="tblwrap"><table><thead><tr><th>Pagamento</th><th class="r">Valor</th>'+
      '<th class="r">Taxa efetiva</th><th class="r">Retenção</th><th class="r">Equiv./mês</th></tr></thead>'+
      '<tbody>'+linhas+'</tbody>'+
      '<tfoot><tr><td colspan="4">Retenção mensalizada</td>'+
      '<td class="r num">'+esc(eur(rf.retencao))+'</td></tr></tfoot></table></div>'+
    '<div class="note" style="margin-top:10px">Cálculo do escalão: '+
      esc(eur(rf.mensal))+' × '+esc(pct(parseNum(esc0.t)*100))+' − '+esc(eur(parcela))+
      (porDep > 0 ? ' − '+esc(eur(porDep))+' (dependentes)' : "")+
      ' = '+esc(eur(Math.max(0, rf.mensal*parseNum(esc0.t) - parcela - porDep)))+'. '+
      (Array.isArray(esc0.p)
        ? 'Neste escalão a parcela a abater é '+esc(String(esc0.p[0]).replace(".",","))+' × '+
          esc(String(esc0.p[1]).replace(".",","))+' × ('+esc(eur(esc0.p[2]))+' − remuneração).'
        : '')+
      '</div>'+
    '<div class="row no-print" style="margin-top:10px">'+
      '<div style="flex:0 0 auto"><label style="display:inline-flex;align-items:center;gap:7px;font-size:13.5px">'+
        '<input type="checkbox" data-act="rdDeficiencia" data-id="'+esc(rd.id)+'"'+(rd.deficiencia?" checked":"")+'> '+
        'Titular com deficiência (tabela própria)</label></div>'+
    '</div>'+
  '</div>';
}

/**
 * Deteta a dupla contagem mais fácil de cometer: pôr o vencimento a
 * «14× por ano» — que já embute os subsídios — e ainda acrescentar
 * componentes de férias e de Natal. A ferramenta não pode adivinhar
 * qual das duas o utilizador quis, mas pode dizer-lhe que escolha uma.
 */
function avisoDuplicacao(rd){
  const comps = rd.componentes || [];
  const catorze = comps.filter(c => c.frequencia === "catorze" &&
                                    (c.especie === "base" || c.especie === "pensao"));
  const subsidios = comps.filter(c => c.especie === "ferias" || c.especie === "natal");
  if (!catorze.length || !subsidios.length) return "";
  const excesso = subsidios.reduce((s,c) => s + compMensal(c), 0);
  return '<div class="note" style="margin-top:12px;border-left-color:var(--neg)">'+
    '<strong>Possível dupla contagem.</strong> «'+esc(catorze[0].nome || "Vencimento")+
    '» está a <em>14× por ano</em>, o que já inclui os subsídios de férias e de Natal, '+
    'e existem ainda '+subsidios.length+' componente(s) de subsídio à parte — '+
    esc(eur(excesso))+'/mês contados duas vezes. '+
    'Ou põe o vencimento a <em>mensal</em> e mantém os subsídios separados (dá mais controlo), '+
    'ou deixa-o a 14× e elimina-os.</div>';
}

/* Guarda o que já estava escrito quando a espécie ou um parâmetro da
   calculadora muda e o formulário tem de ser repintado. */
let rascunhoComponente = null;

/* Campos das calculadoras que, ao mudar, obrigam a repintar o formulário. */
const CAMPOS_CALC_COMPONENTE = [
  "cpModalidade", "cpNumBebes", "cpInternamento",
  "cpIdadeMeses", "cpMonoparental", "cpMenos36", "cpDeficiencia",
];

/** Lê o estado atual do formulário de componente, para o preservar num repintar. */
function capturarComponente(){
  const v = (id, prop) => { const el = $("#"+id); return el ? (prop === "checked" ? el.checked : el.value) : undefined; };
  const num = (id) => { const el = $("#"+id); return el ? parseNum(el.value) : undefined; };
  return {
    especie: v("cpEspecie"),
    nome: v("cpNome") || "",
    valor: num("cpValor"),
    frequencia: v("cpFreq"),
    categoriaId: v("cpCat"),
    ss: v("cpSS", "checked"), irs: v("cpIRS", "checked"),
    modalidade: v("cpModalidade"),
    numBebes: num("cpNumBebes"),
    internamento: num("cpInternamento"),
    idadeMeses: num("cpIdadeMeses"),
    monoparental: v("cpMonoparental", "checked"),
    menos36: v("cpMenos36", "checked"),
    deficiencia: v("cpDeficiencia", "checked"),
  };
}

/**
 * Seletor de espécies, agrupado em subcategorias. As prestações sociais —
 * abonos e subsídios pagos pela Segurança Social — ficam num grupo próprio,
 * distinto dos rendimentos de trabalho e dos rendimentos de capital.
 */
function seletorEspecies(selecionada){
  const grupos = [
    ["Rendimentos do trabalho", ["base","ferias","natal","alimentacao","extraordinario","premio","comissao","ajudas"]],
    ["Prestações sociais",      ["parentalidade","riscoGravidez","abonoFamilia","abonoPrenatal","abono"]],
    ["Pensões e outros",        ["pensao","renda","capitais","outro"]],
  ];
  const opt = (k) => ESPECIES[k]
    ? '<option value="'+k+'"'+(selecionada===k?" selected":"")+'>'+esc(ESPECIES[k].lbl)+'</option>' : "";
  return grupos.map(([titulo, ks]) =>
    '<optgroup label="'+esc(titulo)+'">'+ks.map(opt).join("")+'</optgroup>').join("");
}

/** Formulário inline de uma componente de rendimento. */
function formComponente(rd){
  const st = editando.comp;
  const c = st.id ? (rd.componentes || []).find(x => x.id === st.id) : null;
  const f = rascunhoComponente || c || {especie:"base", frequencia:"mensal"};
  const esp = especieDe(f.especie);
  const ssAtual  = f.ss  == null ? esp.ss  : !!f.ss;
  const irsAtual = f.irs == null ? esp.irs : !!f.irs;

  return '<div class="form no-print"><h3>'+(c ? "Editar componente" : "Nova componente")+'</h3>'+
    '<div class="row">'+
      '<div style="flex:0 0 200px"><label class="field" for="cpEspecie">Espécie</label>'+
        '<select id="cpEspecie">'+seletorEspecies(f.especie)+'</select></div>'+
      '<div style="flex:2 1 180px"><label class="field" for="cpNome">Designação</label>'+
        '<input id="cpNome" placeholder="'+esc(esp.lbl)+'" value="'+esc(f.nome || "")+'"></div>'+
      '<div style="flex:0 0 120px"><label class="field" for="cpValor">Valor (€)</label>'+
        '<input id="cpValor" inputmode="decimal" placeholder="0,00" value="'+valEur(f.valor)+'"></div>'+

/* ------------------------------- Limites ------------------------------- */
/**
 * Fração do mês já decorrida (0 a 1). Num mês passado ou futuro é 1 —
 * o mês está fechado, e o ritmo deixa de fazer sentido.
 */
function fracaoDoMes(){
  const [a, m] = MES.split("-").map(Number);
  const ultimo = new Date(a, m, 0).getDate();
  if (MES !== isoMes(hoje())) return 1;
  return Math.min(1, hoje().getDate() / ultimo);
}

/** Barra de utilização com a marca de onde se devia estar hoje. */
function barraRitmo(gasto, limite, cor){
  if (!(limite > 0)) return barra(gasto, limite, cor);
  const uso = Math.min(100, gasto / limite * 100);
  const excede = gasto > limite;
  const f = fracaoDoMes() * 100;
  const marca = (f < 99.5)
    ? '<span class="marcaRitmo" style="left:'+f.toFixed(1)+'%" title="Onde devia estar hoje"></span>' : "";
  return '<div class="bar comRitmo" style="height:14px">'+
    '<span style="width:'+uso.toFixed(1)+'%;background:'+esc(excede ? "var(--neg)" : (cor || "var(--accent)"))+'"></span>'+
    marca+'</div>';
}

/** Leitura em palavras do ritmo: quanto resta e quanto dá por dia. */
function textoRitmo(gasto, limite){
  if (!(limite > 0)) return "—";
  const resta = limite - gasto;
  if (resta < 0) return "excedeu " + eur(-resta);
  const dias = diasQueFaltam();
  if (MES !== isoMes(hoje()) || dias <= 0) return "—";
  const esperado = limite * fracaoDoMes();
  const ritmo = gasto <= esperado ? "no ritmo" : "acima do ritmo";
  return ritmo + " · " + eur(resta / dias) + "/dia";
}

/**
 * Mediana do que se gastou numa categoria nos últimos N meses com dados.
 * O plano diz o que devia ser; isto diz o que é. Ambos servem de ponto de
 * partida para um limite, e a mediana tem a vantagem de ignorar o mês em
 * que se comprou o frigorífico.
 */
function medianaCategoria(catId, meses){
  const n = meses || 6;
  const vals = [];
  for (let i = 1; i <= n; i++){
    const m = mesShift(MES, -i);
    const r = realMes(m);
    if (r.rend > 0 || r.desp > 0) vals.push(r.porCat[catId] || 0);
  }
  return vals.length >= 2 ? {valor: mediana(vals), n: vals.length} : null;
}

/* ===============================================================
   Plano de corte

   Entre «gasto demasiado» e «limites concretos» falta sempre a mesma
   ponte: onde cortar. Aqui indica-se quanto se quer poupar por mês e a
   ferramenta reparte o corte pelas categorias onde há folga — desejos
   primeiro, e dentro deles as que estão mais acima da própria mediana,
   porque é aí que o corte se sente menos.
   =============================================================== */
/* Categorias que não se cortam por decisão: são contrato, lei ou o próprio
   destino do dinheiro que se quer libertar. Cortar a amortização do crédito
   para «poupar» é circular — o capital amortizado já é património; e os juros,
   os impostos e a retenção na fonte não obedecem a uma decisão de consumo. */
const CATS_NAO_CORTAVEIS = [
  "Juros de crédito", "Prestações de crédito", "Seguros de crédito",
  "Impostos", "IRS e Segurança Social",
];
const CORTE_MAX_FRACAO = 0.5;   // nunca deixar uma categoria a menos de metade

function planoDeCorte(alvo){
  const meta = Math.max(0, parseNum(alvo));
  if (meta <= 0) return null;
  const r = realMes(MES), p = planoMes(MES);
  const usarReal = r.rend > 0 || r.desp > 0;
  const naoCortaveis = new Set(CATS_NAO_CORTAVEIS);

  const candidata = (c) => {
    const gasto = usarReal ? (r.porCat[c.id] || 0) : (p.porCat[c.id] || 0);
    if (gasto <= 0) return null;
    if (naoCortaveis.has(c.nome)) return null;
    if ((c.grupo || "desejos") === "poupanca") return null;
    const med = medianaCategoria(c.id, 6);
    const base = med ? med.valor : gasto;
    // A folga é o que está acima do próprio hábito, mais uma fatia do que
    // se gasta — é aí que o corte se sente menos.
    const acima = Math.max(0, gasto - base);
    return {cat: c, gasto, mediana: base, temMediana: !!med,
            acima, folga: acima * 2 + gasto * 0.25, teto: gasto * CORTE_MAX_FRACAO};
  };

  const todas = S.categorias.filter(c => c.tipo === "despesa").map(candidata).filter(Boolean);
  // Duas bolsas por ordem de preferência: primeiro os desejos, e só se não
  // bastarem se toca nas necessidades — que é a conversa difícil.
  const bolsas = [
    {nome:"desejos", itens: todas.filter(x => (x.cat.grupo || "desejos") === "desejos")},
    {nome:"necessidades", itens: todas.filter(x => (x.cat.grupo || "desejos") === "necessidades")},
  ];
  if (!bolsas.some(b => b.itens.length)) return null;

  /* Reparte proporcionalmente à folga dentro da bolsa, respeitando o teto de
     cada categoria e voltando a repartir o que sobrar por causa dos tetos. */
  const repartir = (itens, quanto) => {
    const corte = new Map(itens.map(x => [x.cat.id, 0]));
    let restante = quanto;
    for (let volta = 0; volta < 6 && restante > 0.01; volta++){
      const abertas = itens.filter(x => corte.get(x.cat.id) < x.teto - 0.01);
      if (!abertas.length) break;
      const folgaTotal = abertas.reduce((s,x) => s + x.folga, 0);
      if (folgaTotal <= 0) break;
      let distribuido = 0;
      abertas.forEach(x => {
        const quota = restante * (x.folga / folgaTotal);
        const atual = corte.get(x.cat.id);
        const novo = Math.min(x.teto, atual + quota);
        distribuido += novo - atual;
        corte.set(x.cat.id, novo);
      });
      if (distribuido <= 0.01) break;
      restante -= distribuido;
    }
    return {corte, restante};
  };

  const linhas = [];
  let porCobrir = meta;
  const usadas = [];
  bolsas.forEach(b => {
    if (porCobrir <= 0.01 || !b.itens.length) return;
    const {corte, restante} = repartir(b.itens, porCobrir);
    let somaBolsa = 0;
    b.itens.forEach(x => {
      const v = Math.round(corte.get(x.cat.id) * 100) / 100;
      if (v >= 1){ linhas.push(Object.assign({}, x, {corte: v, bolsa: b.nome})); somaBolsa += v; }
    });
    if (somaBolsa > 0) usadas.push(b.nome);
    porCobrir = restante;
  });

  const conseguido = linhas.reduce((s,x) => s + x.corte, 0);
  return {meta, linhas: linhas.slice(0, 10), conseguido,
          atingivel: conseguido >= meta - 0.5,
          bolsasUsadas: usadas,
          soDesejos: usadas.length === 1 && usadas[0] === "desejos",
          fonte: usarReal ? "movimentos deste mês" : "plano mensal"};
}

    corpo = '<div class="tblwrap"><table><thead><tr><th>Categoria</th><th>Grupo</th>'+

          '<td class="r num">'+esc(eur(x.gasto))+'</td>'+
          '<td class="r num" style="color:var(--muted)">'+esc(eur(x.mediana))+

              esc(eur(corte))+'</div></td>'+
          '<td class="r num"><strong id="corteFica-'+esc(x.cat.id)+'">'+esc(eur(x.gasto - corte))+'</strong></td>'+
        '</tr>';
      }).join("")+
      '</tbody><tfoot><tr><td colspan="4">Corte total</td>'+
      '<td class="r num" id="corteTotal" data-meta="'+plano.meta.toFixed(2)+'">'+
        '<span class="'+(total >= plano.meta - 0.5 ? "pos" : "neg")+'">'+esc(eur(total))+'</span></td>'+
      '<td class="r num">de '+esc(eur(plano.meta))+'</td></tr></tfoot></table></div>'+
      (plano.atingivel
        ? '<div class="note" style="margin-top:10px">'+
          (plano.soDesejos
            ? 'A meta cabe só nos <strong>desejos</strong> — nenhuma necessidade foi tocada.'
            : 'Os desejos não bastaram, por isso entram também <strong>necessidades</strong>. '+
              'Essas exigem mudar de hábito ou de fornecedor, não só de vontade.')+
          ' Base: '+esc(plano.fonte)+'. Poupança, juros, prestações e impostos ficam de fora: '+
          'cortar amortização para poupar é circular, e juros não obedecem a decisões. '+
          'As linhas com * ainda não têm seis meses de histórico.</div>'
        : '<div class="note" style="margin-top:10px;border-left-color:var(--warn)"><strong>Não chega:</strong> '+
          'as sugestões somam '+esc(eur(plano.conseguido))+' de '+esc(eur(plano.meta))+

function viewOrcamento(){
  const r = realMes(MES), p = planoMes(MES);
  const cats = S.categorias.filter(c => c.tipo === "despesa");

  const linhas = cats.map(c => {
    const lim = parseNum(S.limites[c.id]);
    const gasto = r.porCat[c.id] || 0;
    const prev = p.porCat[c.id] || 0;
    const efetivo = lim > 0 ? lim : prev;
    const disp = efetivo - gasto;
    if (!lim && !gasto && !prev) return "";
    return '<tr>'+
      '<td><span class="tag"><span class="dot" style="background:'+esc(c.cor)+'"></span>'+esc(catRotulo(c.id))+'</span></td>'+
      '<td><span class="tag g-'+esc(c.grupo || "desejos")+'">'+esc((GRUPOS[c.grupo] || GRUPOS.desejos).lbl)+'</span></td>'+
      '<td style="min-width:130px"><input class="limIn" data-id="'+esc(c.id)+'" inputmode="decimal" '+
        'placeholder="'+esc(prev > 0 ? fmtNum.format(prev)+" (plano)" : "sem limite")+'" '+
        'value="'+(lim > 0 ? esc(fmtNum.format(lim)) : "")+'" style="text-align:right"></td>'+
      '<td class="r num">'+esc(eur(gasto))+'</td>'+
      '<td class="r num '+(disp < 0 ? "neg" : "")+'">'+(efetivo > 0 ? esc(eur(disp)) : "—")+'</td>'+
      '<td style="width:170px">'+barraRitmo(gasto, efetivo, c.cor)+'</td>'+
      '<td style="width:78px">'+minigrafico(serieCategoria(c.id, 6), c.cor)+'</td>'+
      '<td class="r" style="white-space:nowrap;font-size:12px">'+esc(textoRitmo(gasto, efetivo))+'</td>'+
    '</tr>';
  }).join("");

  const totLim = cats.reduce((s,c) => s + (parseNum(S.limites[c.id]) || (p.porCat[c.id] || 0)), 0);
  const totGasto = r.desp;

  const semNada = !linhas.trim();

  /* Mesada: o que resta nos limites, repartido pelos dias que faltam.
     É a pergunta prática do meio do mês — «quanto posso gastar hoje?» */
  const dias = diasQueFaltam();
  const restaTotal = Math.max(0, totLim - totGasto);
  const mesada = (MES === isoMes(hoje()) && dias > 0 && totLim > 0)
    ? '<div class="grid g3" style="margin-bottom:16px">'+
      kpi("Resta nos limites", eur(restaTotal), "De "+eur(totLim)+" definidos", restaTotal > 0 ? "good" : "bad")+
      kpi("Mesada diária", eur(restaTotal / dias), dias+" dia(s) até ao fim do mês", "accent")+
      kpi("Ritmo até agora", eur(totGasto / Math.max(1, new Date().getDate())),
          "Por dia, desde o início do mês",
          (totGasto / Math.max(1, new Date().getDate())) > (restaTotal / dias) ? "warnb" : "good")+
      '</div>'
    : "";

  return '<div class="card"><div class="card-head"><div class="t"><h2>Limites por categoria — '+esc(mesLabel(MES))+'</h2>'+
    '<div class="sub">Defina um teto mensal por categoria. Sem limite definido, usa-se o valor do plano.</div></div>'+
    '<button class="btn sm no-print" data-act="limDoPlano">Preencher com o plano</button> '+
    '<button class="btn sm no-print" data-act="limDoHistorico">Sugerir pelo histórico</button></div>'+
    mesada + cartaoCorte() +
    (semNada
      ? '<div class="empty">Ainda não há categorias com plano, limite ou gastos. Comece pelo plano mensal.</div>'
      : '<div class="tblwrap"><table><thead><tr><th>Categoria</th><th>Grupo</th><th class="r">Limite/mês</th>'+
        '<th class="r">Gasto</th><th class="r">Disponível</th><th>Utilização</th><th>6 meses</th>'+
        '<th class="r">Ritmo</th></tr></thead>'+
        '<tbody>'+linhas+'</tbody>'+
        '<tfoot><tr><td colspan="2">Total</td><td class="r num">'+esc(eur(totLim))+'</td>'+
        '<td class="r num">'+esc(eur(totGasto))+'</td>'+
        '<td class="r num '+(totLim - totGasto < 0 ? "neg" : "")+'">'+esc(eur(totLim - totGasto))+'</td>'+
        '<td>'+barraRitmo(totGasto, totLim)+'</td><td></td>'+
        '<td class="r" style="font-size:12px">'+esc(textoRitmo(totGasto, totLim))+'</td></tr></tfoot></table></div>')+
    '<div class="note no-print" style="margin-top:12px">Os limites aplicam-se a todos os meses. '+
    'Escreva o valor e prima <kbd>Tab</kbd> ou clique fora para guardar.</div>'+
  '</div>';
}

/* ------------------------------- Despesas ------------------------------- */
/** Reúne plano, movimentos e limites num único separador. */
/* ===============================================================
   Planear despesa — compras grandes com a data pensada

   Um frigorífico que morre escolhe a data; um sofá, um portátil ou
   um carro não têm de escolher. A pergunta certa não é «posso pagar
   isto?» (essa já existe) mas «QUANDO é que isto cabe melhor?» — e
   a resposta vem da projeção de tesouraria que a ferramenta já faz:
   para cada mês do horizonte, simula-se a compra nesse mês e mede-se
   a folga mínima daí até ao fim. Meses de subsídio ajudam, meses de
   seguros anuais pesam, e tudo isso já está na projeção.
   =============================================================== */
const HORIZONTES_PLANEIO = [3, 6, 12, 24];

/* Ordens de grandeza típicas em Portugal (2026) — pontos de partida
   para ajustar, não tabelas de preços. */
const PRESETS_PLANEIO = [
  {icone:"🧊", nome:"Frigorífico",       valor:700,   cat:"Manutenção e reparações"},
  {icone:"🫧", nome:"Máquina de lavar",  valor:500,   cat:"Manutenção e reparações"},
  {icone:"💻", nome:"Portátil",          valor:900,   cat:"Telecom e internet"},
  {icone:"📱", nome:"Telemóvel",         valor:400,   cat:"Telecom e internet"},
  {icone:"🛋️", nome:"Sofá",              valor:800,   cat:"Manutenção e reparações"},
  {icone:"🛏️", nome:"Mobília de quarto", valor:1200,  cat:"Manutenção e reparações"},
  {icone:"🏍️", nome:"Mota",              valor:3500,  cat:"Transportes"},
  {icone:"🚗", nome:"Carro usado",       valor:15000, cat:"Transportes"},
];

/** Compras marcadas e ainda por realizar, como eventos de tesouraria. */
function eventosPlaneados(exceto){
  return (S.planeadas || [])
    .filter(p => !p.feitaEm && mesValido(p.mes) && p.id !== exceto && parseNum(p.valor) > 0)
    .map(p => ({mes: p.mes, valor: parseNum(p.valor), nome: p.nome}));
}

/**
 * A melhor altura para uma compra, mês a mês e por trimestre.
 * Comprar no mês i deixa o acumulado de i em diante com −valor: a folga
 * que interessa é o mínimo desse troço, não a do próprio mês — um mês
 * bom seguido de um dezembro apertado não é um mês bom. As outras
 * compras já marcadas entram na base, para não gastarem o mesmo dinheiro
 * duas vezes.
 */
function analisarPlaneada(valor, horizonte, exceto){
  const v = Math.max(0, parseNum(valor));
  const H = HORIZONTES_PLANEIO.indexOf(parseInt(horizonte, 10)) >= 0 ? parseInt(horizonte, 10) : 12;
  if (v <= 0) return null;

  const serie = tesourariaProjetada(H, eventosPlaneados(exceto));
  // A mesma referência do «Posso pagar isto?»: meses de despesa cobertos.
  const p = planoMes(MES), r = realMes(MES);
  const desp = (r.rend > 0 || r.desp > 0) ? r.desp : p.desp;

  const minSufixo = new Array(serie.length);
  let mn = Infinity;
  for (let j = serie.length - 1; j >= 0; j--){
    mn = Math.min(mn, serie[j].acumulado);
    minSufixo[j] = mn;
  }

  const meses = serie.map((s, i) => {
    const folga = minSufixo[i] - v;
    const cobertura = desp > 0 ? folga / desp : (folga >= 0 ? Infinity : -Infinity);
    const grau = folga < 0 ? 2 : cobertura < 3 ? 1 : 0;
    return {mes: s.mes, folga, cobertura, grau};
  });

  // O melhor mês é o primeiro verde — esperar mais não acrescenta nada.
  // Sem verdes, o primeiro amarelo; sem amarelos, não há melhor altura.
  const melhor = meses.find(x => x.grau === 0) || meses.find(x => x.grau === 1) || null;

  const trimestres = [];
  for (let i = 0; i < meses.length; i += 3){
    const bloco = meses.slice(i, i + 3);
    const top = bloco.reduce((a, b) => b.grau < a.grau ? b : a, bloco[0]);
    trimestres.push({de: bloco[0].mes, ate: bloco[bloco.length - 1].mes, meses: bloco, melhor: top, grau: top.grau});
  }

  return {valor: v, horizonte: H, desp, meses, trimestres, melhor,
          jaCabe: meses[0].grau === 0};
}

/** Reserva mensal implícita: o valor a dividir pelos meses até à data. */
function reservaMensalPlaneada(p, mesAlvo){
  const alvo = mesAlvo || p.mes;
  // Sem data — ou com uma data que não é mês nenhum — não há esforço a
  // repartir. Sem esta guarda, mesDiff devolvia NaN e ele chegava ao ecrã.
  if (!mesValido(alvo)) return 0;
  const n = Math.max(1, mesDiff(MES, alvo));
  const obj = p.objetivoId ? S.objetivos.find(o => o.id === p.objetivoId) : null;
  const falta = Math.max(0, parseNum(p.valor) - (obj ? poupadoObjetivo(obj) : 0));
  return falta / n;
}

/** A frase que responde: quando, e com que folga. */
function veredictoPlaneada(an){
  const cob = (x) => Number.isFinite(x.cobertura)
    ? x.cobertura.toLocaleString("pt-PT", {maximumFractionDigits: 1}) + " meses de despesa"
    : "sem despesa de referência";
  if (an.jaCabe)
    return {grau: 0, txt: "Já cabe hoje — depois da compra ficam " + eur(an.meses[0].folga) +
      " de folga (" + cob(an.meses[0]) + ")."};
  if (an.melhor && an.melhor.grau === 0)
    return {grau: 0, txt: "Melhor altura: " + mesLabel(an.melhor.mes) + " — o saldo acumulado chega lá, e depois da compra ficam " +
      eur(an.melhor.folga) + " (" + cob(an.melhor) + ")."};
  if (an.melhor)
    return {grau: 1, txt: "Possível a partir de " + mesLabel(an.melhor.mes) + ", mas deixa a reserva curta: " +
      eur(an.melhor.folga) + " (" + cob(an.melhor) + "; a referência são 3)."};
  return {grau: 2, txt: "Não cabe nos próximos " + an.horizonte + " meses sem mexer no plano — reserve verba mensal, reduza o valor ou alargue o horizonte."};
}

function viewPlanear(){

    '</div>'+
    '<div class="actions">'+
      '<button class="btn primary" data-act="planSalvar">'+(ed ? "Guardar alterações" : "Analisar a melhor altura")+'</button>'+

    '</div></div>';

  const pendentes = S.planeadas.filter(p => !p.feitaEm);

  const cartoes = pendentes.map(p => {
    // Uma data que não seja mês nenhum lê-se como «por marcar», em vez de
    // pintar «Marcada para —» e uma reserva mensal impossível de calcular.
    const mesP = mesValido(p.mes) ? p.mes : "";
    const an = analisarPlaneada(p.valor, p.horizonte, p.id);
    const obj = p.objetivoId ? S.objetivos.find(o => o.id === p.objetivoId) : null;
    const ver = an ? veredictoPlaneada(an) : null;
    const corG = (g) => g === 2 ? "var(--neg)" : g === 1 ? "var(--warn)" : "var(--pos)";

    // Faixa de trimestres: cada célula é o melhor mês desse trimestre,
    // clicável para marcar a compra para lá.
    const faixa = an ? '<div class="planTri no-print">'+an.trimestres.map(t => {
      const marcado = !!mesP && mesP >= t.de && mesP <= t.ate;
      return '<button data-act="planMarcar" data-id="'+esc(p.id)+'" data-mes="'+esc(marcado ? mesP : t.melhor.mes)+'"'+
        ' aria-pressed="'+marcado+'" style="--planCor:'+corG(t.grau)+'"'+
        tipData(mesLabel(t.de, true)+" – "+mesLabel(t.ate, true), [
          ["Melhor mês", mesLabel(t.melhor.mes)],
          ["Folga depois da compra", eur(t.melhor.folga)],
          [marcado ? "Marcada para" : "Tocar para marcar", marcado ? mesLabel(mesP) : mesLabel(t.melhor.mes)],
        ])+'>'+
        '<span class="pq">'+esc(mesLabel(t.de, true))+' – '+esc(mesLabel(t.ate, true))+'</span>'+
