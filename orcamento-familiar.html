<!doctype html>
<html lang="pt" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orçamento Familiar</title>
<meta name="description" content="Ferramenta de cálculo e gestão do orçamento familiar — rendimentos, despesas, poupança, objetivos e créditos.">
<!-- A cor da barra do sistema acompanha a paleta escolhida: `aplicarTema` reescreve
     este conteúdo. O valor aqui é o do arranque, antes de haver preferências lidas. -->
<meta name="theme-color" content="#2f5fd0">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💶</text></svg>">
<!-- Instalação no iPhone e no iPad: o Safari não lê o manifesto para isto.
     O ícone com que fica no ecrã principal é desenhado em tempo de execução
     (o Safari só aceita PNG aqui, e a aplicação não tem ficheiros de imagem). -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Orçamento">
<style>
/* ============================================================
   Paleta e temas
   ============================================================ */
:root{
  --bg:#f4f6fa; --surface:#ffffff; --surface-2:#eef1f7; --surface-3:#e3e8f0;
  --border:#d8dee9; --text:#131a26; --muted:#5c6a80;
  --accent:#2f5fd0; --accent-soft:#e3ebfd;
  --pos:#0f7a4d; --pos-soft:#dff3e8;
  --neg:#c0392b;
  /* Âmbar escurecido: a #b5730a dava 3,87 sobre branco e 3,62 sobre o creme
     da paleta Areia — abaixo dos 4,5 que a norma pede para texto corrido, e
     o aviso é justamente o que tem de se ler. A #996200 dá 5,12 e 4,79. */
  --warn:#996200; --warn-soft:#fdf0d8;
  --shadow:0 1px 2px rgba(15,23,42,.06),0 8px 24px rgba(15,23,42,.07);
  --radius:14px;
}
html[data-theme="dark"]{
  --bg:#0c1119; --surface:#141b26; --surface-2:#1b2431; --surface-3:#243044;
  --border:#2a3547; --text:#e8edf5; --muted:#95a3b8;
  --accent:#7aa2ff; --accent-soft:#1c2942;
  --pos:#4ade9b; --pos-soft:#12301f;
  --neg:#ff8a7a;
  --warn:#f0b64b; --warn-soft:#33270e;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);
}
@media (prefers-color-scheme:dark){
  html[data-theme="auto"]{
    --bg:#0c1119; --surface:#141b26; --surface-2:#1b2431; --surface-3:#243044;
    --border:#2a3547; --text:#e8edf5; --muted:#95a3b8;
    --accent:#7aa2ff; --accent-soft:#1c2942;
    --pos:#4ade9b; --pos-soft:#12301f;
    --neg:#ff8a7a;
    --warn:#f0b64b; --warn-soft:#33270e;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);
  }
}

/* ============================================================
   Paletas de cor — variações sobre o modo claro/escuro.
   Mudam o acento e a temperatura das superfícies; as cores
   semânticas (positivo, negativo, aviso) não mudam.
   ============================================================ */
/* Claro */
html[data-paleta="oceano"]{--accent:#0d7f91;--accent-soft:#dbf1f4;--bg:#f1f7f8}
html[data-paleta="floresta"]{--accent:#2c7d44;--accent-soft:#e1f2e6;--bg:#f2f7f3}
html[data-paleta="poente"]{--accent:#c05621;--accent-soft:#fbeadd;--bg:#faf6f1}
html[data-paleta="ameixa"]{--accent:#7a3fc4;--accent-soft:#efe6fa;--bg:#f7f4fa}
html[data-paleta="grafite"]{--accent:#44546c;--accent-soft:#e7ebf1;--bg:#f5f6f8}
/* Areia — bege quente até nas superfícies e no texto */
html[data-paleta="areia"]{--bg:#f4eee1;--surface:#fbf7ee;--surface-2:#f1e9d8;--surface-3:#e7dcc4;
  --border:#d8ccb2;--text:#2b241a;--muted:#7c6f59;--accent:#8a6134;--accent-soft:#f0e2ca}
/* Pastel — tons suaves e rosados */
html[data-paleta="pastel"]{--bg:#faf4f7;--surface:#fffdfe;--surface-2:#f7ecf2;--surface-3:#efdfe8;
  /* Acento um tom abaixo do rosa original: a #c26a96 dava 3,58 sobre a
     superfície, e o acento é cor de texto em ligações e números. Continua
     rosa; passa a ler-se. */
  --border:#e4cfda;--muted:#7c6a75;--accent:#ad527f;--accent-soft:#fae5ef}
/* Escuro forçado */
html[data-theme="dark"][data-paleta="oceano"]{--bg:#091417;--surface:#101d21;--surface-2:#162629;--surface-3:#1f3237;--border:#2b444b;--accent:#4fc8dc;--accent-soft:#123037}
html[data-theme="dark"][data-paleta="floresta"]{--bg:#0b130d;--surface:#121c14;--surface-2:#18261b;--surface-3:#213225;--border:#2f4433;--accent:#6fd08c;--accent-soft:#143120}
html[data-theme="dark"][data-paleta="poente"]{--bg:#151009;--surface:#1e1710;--surface-2:#281f15;--surface-3:#34291c;--border:#463829;--accent:#ffa268;--accent-soft:#33210f}
html[data-theme="dark"][data-paleta="ameixa"]{--bg:#110d19;--surface:#191323;--surface-2:#211a2e;--surface-3:#2b233c;--border:#3b3152;--accent:#b78bff;--accent-soft:#251639}
/* A Grafite declarava só o acento, e ficava com o `--bg` claro da sua própria
   regra de modo claro: fundo #f5f6f8 com texto #e8edf5, razão de contraste
   1,09 — texto branco em papel branco. Das oito paletas era a única sem fundo
   escuro declarado. É cinzento neutro, sem a tinta azul do modo escuro base. */
html[data-theme="dark"][data-paleta="grafite"]{--bg:#0f1115;--surface:#171a20;
  --surface-2:#1f232b;--surface-3:#282d36;--border:#3a414d;--accent:#9db0ca;--accent-soft:#222b38}
html[data-theme="dark"][data-paleta="areia"]{--bg:#171208;--surface:#211a0e;--surface-2:#2b2314;--surface-3:#382e1b;--border:#4b3f28;--text:#efe7d6;--muted:#b5a88c;--accent:#d9a75f;--accent-soft:#33270f}
html[data-theme="dark"][data-paleta="pastel"]{--bg:#171219;--surface:#211a23;--surface-2:#2b222e;--surface-3:#372c3b;--border:#4b3d4f;--muted:#b39fad;--accent:#e8a7c6;--accent-soft:#33202b}
/* Escuro por preferência do sistema */
@media (prefers-color-scheme:dark){
  html[data-theme="auto"][data-paleta="oceano"]{--bg:#091417;--surface:#101d21;--surface-2:#162629;--surface-3:#1f3237;--border:#2b444b;--accent:#4fc8dc;--accent-soft:#123037}
  html[data-theme="auto"][data-paleta="floresta"]{--bg:#0b130d;--surface:#121c14;--surface-2:#18261b;--surface-3:#213225;--border:#2f4433;--accent:#6fd08c;--accent-soft:#143120}
  html[data-theme="auto"][data-paleta="poente"]{--bg:#151009;--surface:#1e1710;--surface-2:#281f15;--surface-3:#34291c;--border:#463829;--accent:#ffa268;--accent-soft:#33210f}
  html[data-theme="auto"][data-paleta="ameixa"]{--bg:#110d19;--surface:#191323;--surface-2:#211a2e;--surface-3:#2b233c;--border:#3b3152;--accent:#b78bff;--accent-soft:#251639}
  html[data-theme="auto"][data-paleta="grafite"]{--bg:#0f1115;--surface:#171a20;
    --surface-2:#1f232b;--surface-3:#282d36;--border:#3a414d;--accent:#9db0ca;--accent-soft:#222b38}
  html[data-theme="auto"][data-paleta="areia"]{--bg:#171208;--surface:#211a0e;--surface-2:#2b2314;--surface-3:#382e1b;--border:#4b3f28;--text:#efe7d6;--muted:#b5a88c;--accent:#d9a75f;--accent-soft:#33270f}
  html[data-theme="auto"][data-paleta="pastel"]{--bg:#171219;--surface:#211a23;--surface-2:#2b222e;--surface-3:#372c3b;--border:#4b3d4f;--muted:#b39fad;--accent:#e8a7c6;--accent-soft:#33202b}
}

/* ============================================================
   Base
   ============================================================ */
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--text);
  /* `system-ui` à frente, para que cada aparelho use o seu próprio tipo de
     letra de interface — Segoe UI no Windows, San Francisco no iPhone e no
     iPad, Roboto no Android. A ordem antiga punha «Avenir Next» antes, e
     como o macOS traz esse tipo instalado sem ser o da interface, todo o
     Apple ficava com um tipo decorativo, de algarismos piores em tabelas,
     onde devia estar o do sistema. Os nomes que se seguem são recurso para
     navegadores sem `system-ui`, e os de emoji existem porque os ícones da
     aplicação são emoji: sem eles, há Linux onde saem quadrados. */
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,
    sans-serif,"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji";
  font-size:15px; line-height:1.5; -webkit-text-size-adjust:100%;
}
h1,h2,h3,h4{margin:0;font-weight:650;letter-spacing:-.01em}
button{font:inherit;color:inherit}
a{color:var(--accent)}
.num{font-variant-numeric:tabular-nums}
.pos{color:var(--pos)} .neg{color:var(--neg)} .muted{color:var(--muted)}
.warn-txt{color:var(--warn);font-weight:600}
.hidden{display:none !important}

/* ============================================================
   Cabeçalho
   ============================================================ */
header{
  position:sticky; top:0; z-index:40;
  background:var(--surface); border-bottom:1px solid var(--border);
}
.topbar{
  display:flex; align-items:center; gap:12px; flex-wrap:wrap;
  padding:10px 16px; max-width:1240px; margin:0 auto;
}
.brand{display:flex;align-items:center;gap:9px;margin-right:auto;min-width:0}
.brand .logo{font-size:22px;line-height:1}
.brand h1{font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{display:block;font-size:11px;color:var(--muted);font-weight:400}
.topbar .grp{display:flex;align-items:center;gap:6px}

.btn{
  display:inline-flex;align-items:center;gap:6px;
  border:1px solid var(--border); background:var(--surface-2);
  border-radius:9px; padding:7px 12px; cursor:pointer;
  font-size:13.5px; font-weight:550; white-space:nowrap;
  transition:background .12s,border-color .12s,transform .06s;
}
.btn:hover{background:var(--surface-3)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--neg);border-color:var(--neg)}
.btn.sm{padding:4px 9px;font-size:12.5px;border-radius:7px}
.btn.icon{padding:7px 9px}
.btn[disabled]{opacity:.45;cursor:not-allowed}

input,select,textarea{
  font:inherit; color:var(--text); background:var(--surface);
  border:1px solid var(--border); border-radius:9px; padding:7px 10px; width:100%;
}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
input[type=checkbox]{width:auto}
/* Coluna de seleção das tabelas. A largura estava no HTML, em `style`, e a
   26 px espremia a caixa de 22 para 19 e deixava-a um retângulo em vez de um
   quadrado. Estando em CSS, pode alargar ao dedo — e a etiqueta faz da
   célula inteira um alvo, que é o que se quer acertar a correr. */
.colSel{width:26px;padding-left:3px;padding-right:3px}
.celSel{display:flex;align-items:center;justify-content:center;cursor:pointer}
label.field{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:3px}

/* Separadores */
nav.tabs{border-bottom:1px solid var(--border);background:var(--surface);overflow-x:auto}
nav.tabs .inner{display:flex;gap:2px;max-width:1240px;margin:0 auto;padding:0 12px}
nav.tabs button{
  background:none;border:0;border-bottom:2.5px solid transparent;
  padding:10px 13px;cursor:pointer;font-size:14px;font-weight:550;color:var(--muted);
  white-space:nowrap;
}
nav.tabs button:hover{color:var(--text)}
nav.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}

main{max-width:1240px;margin:0 auto;padding:18px 16px 80px}

/* ============================================================
   Cartões e grelhas
   ============================================================ */
.card{
  background:var(--surface); border:1px solid var(--border);
  border-radius:var(--radius); box-shadow:var(--shadow); padding:16px;
}
.card + .card{margin-top:16px}
.card h2{font-size:15px;margin-bottom:2px}
.card .sub{font-size:12.5px;color:var(--muted);margin-bottom:12px}
.card-head{display:flex;align-items:flex-start;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.card-head .t{margin-right:auto;min-width:0}
/* Título de secção dentro de um cartão */
h3.sec{
  font-size:13px;margin:18px 0 8px;color:var(--muted);
  text-transform:uppercase;letter-spacing:.04em;font-weight:650;
}
h3.sec:first-child{margin-top:0}
.card-head h3.sec{margin:0}

.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.row > *{flex:1 1 150px;min-width:0}
.row > .shrink{flex:0 0 auto}

/* KPIs */
.kpi{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:13px 15px;box-shadow:var(--shadow);
}
.kpi .lbl{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:650}
.kpi .val{font-size:24px;font-weight:700;margin-top:3px;font-variant-numeric:tabular-nums}
.kpi .hint{font-size:12px;color:var(--muted);margin-top:2px}
.kpi.accent{border-left:4px solid var(--accent)}
.kpi.good{border-left:4px solid var(--pos)}
.kpi.bad{border-left:4px solid var(--neg)}
.kpi.warnb{border-left:4px solid var(--warn)}

/* Tabelas */
.tblwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--border);vertical-align:middle}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:650;white-space:nowrap}
td.r,th.r{text-align:right}
.num,td.num,output{font-variant-numeric:tabular-nums}
tbody tr:nth-child(even){background:rgba(148,163,184,.055)}
tbody tr:hover{background:var(--surface-2)}
tfoot td{font-weight:700;border-top:2px solid var(--border);border-bottom:0}
.empty{padding:26px;text-align:center;color:var(--muted);font-size:14px}

/* Cabeçalhos ordenáveis */
th.sortable{cursor:pointer;user-select:none;transition:color .12s}
th.sortable:hover{color:var(--accent)}
th.sortable.on{color:var(--accent)}
th.sortable .seta{font-size:9px;letter-spacing:0}
th.sortable:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}

/* Comandos com deslizador */
.ctrl{display:flex;flex-direction:column;gap:3px}
.ctrl .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.ctrl .lbl{font-size:12px;font-weight:600;color:var(--muted)}
.ctrl output{font-size:13.5px;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums}
input[type=range]{
  -webkit-appearance:none;appearance:none;width:100%;height:22px;
  background:transparent;border:0;padding:0;cursor:pointer;
}
input[type=range]::-webkit-slider-runnable-track{height:5px;border-radius:999px;background:var(--surface-3)}
input[type=range]::-moz-range-track{height:5px;border-radius:999px;background:var(--surface-3)}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;appearance:none;width:16px;height:16px;border-radius:50%;
  background:var(--accent);border:2px solid var(--surface);margin-top:-6px;
  box-shadow:0 1px 4px rgba(0,0,0,.25);transition:transform .1s;
}
input[type=range]::-moz-range-thumb{
  width:16px;height:16px;border-radius:50%;background:var(--accent);
  border:2px solid var(--surface);box-shadow:0 1px 4px rgba(0,0,0,.25);
}
input[type=range]:active::-webkit-slider-thumb{transform:scale(1.2)}
input[type=range]:focus-visible{outline:2px solid var(--accent);outline-offset:4px;border-radius:4px}

/* Interruptor de segmentos */
.seg{display:inline-flex;border:1px solid var(--border);border-radius:9px;overflow:hidden;background:var(--surface-2)}
.seg button{
  background:none;border:0;padding:5px 11px;cursor:pointer;font-size:12.5px;font-weight:600;
  color:var(--muted);border-right:1px solid var(--border);
}
.seg button:last-child{border-right:0}
.seg button:hover{background:var(--surface-3);color:var(--text)}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}

/* Sugestão flutuante dos gráficos */
#tip{
  position:fixed;z-index:70;pointer-events:none;opacity:0;transition:opacity .12s;
  background:var(--surface);border:1px solid var(--border);border-radius:9px;
  box-shadow:var(--shadow);padding:8px 11px;font-size:12.5px;max-width:250px;
}
#tip.show{opacity:1}
#tip.prosa{max-width:330px;padding:11px 13px}
#tip .tt{font-weight:700;margin-bottom:3px;font-size:13px}
#tip .tr{display:flex;justify-content:space-between;gap:14px;font-variant-numeric:tabular-nums}
#tip .tr span:first-child{color:var(--muted)}
#tip .txt{color:var(--muted);line-height:1.45}
#tip .calc{
  margin-top:7px;padding-top:6px;border-top:1px solid var(--border);
  font-variant-numeric:tabular-nums;color:var(--text);
}
#tip .calc span{
  color:var(--accent);font-weight:650;font-size:10.5px;
  text-transform:uppercase;letter-spacing:.05em;margin-right:6px;
}

/* Assinala o que tem explicação, sem poluir a interface */
.temAjuda{cursor:help}
label.field.temAjuda{text-decoration:underline dotted var(--border) 1px;text-underline-offset:3px}
label.field.temAjuda:hover{text-decoration-color:var(--accent)}
.kpi.temAjuda:hover{border-color:var(--accent)}
@media (hover:none){.temAjuda{cursor:default}}

/* Gráficos interativos */
.chart [data-tip]{cursor:pointer}
.chart .slice{transition:opacity .15s,transform .15s;transform-origin:center}
.chart.dim .slice{opacity:.32}
.chart.dim .slice.on{opacity:1}
.chart .hit{fill:transparent}
.chart .hit:hover{fill:currentColor;fill-opacity:.05}
.chart .guia{opacity:0;transition:opacity .1s}
.chart .hit:hover ~ .guia{opacity:1}
.legend div[data-foco]{cursor:pointer;border-radius:6px;padding:1px 5px;margin:-1px -5px;transition:background .12s}
.legend div[data-foco]:hover{background:var(--surface-2)}
.legend div[data-foco].on{background:var(--accent-soft)}

/* Etiquetas */
.tag{
  display:inline-flex;align-items:center;gap:5px;
  padding:2px 8px;border-radius:999px;font-size:11.5px;font-weight:600;
  background:var(--surface-3);white-space:nowrap;
}
.dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto;display:inline-block}
.tag.g-necessidades{background:var(--accent-soft);color:var(--accent)}
.tag.g-desejos{background:var(--warn-soft);color:var(--warn)}
.tag.g-poupanca{background:var(--pos-soft);color:var(--pos)}

/* Barras de progresso */
.bar{height:9px;border-radius:999px;background:var(--surface-3);overflow:hidden;min-width:70px}
.bar > span{display:block;height:100%;border-radius:999px;transition:width .3s}
.barlbl{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:3px}

/* Formulários embutidos */
.form{background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:13px;margin-bottom:14px}
.form h3{font-size:13.5px;margin-bottom:10px}
.form .actions{display:flex;gap:8px;margin-top:11px;flex-wrap:wrap}

/* Notificação */
#toast{
  position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);
  background:var(--text);color:var(--bg);padding:9px 16px;border-radius:999px;
  font-size:13.5px;font-weight:600;opacity:0;pointer-events:none;transition:.22s;z-index:99;
  box-shadow:var(--shadow);max-width:90vw;text-align:center;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* Diálogo */
.overlay{
  position:fixed;inset:0;background:rgba(9,14,22,.55);z-index:80;
  display:flex;align-items:center;justify-content:center;padding:16px;
}
.dialog{
  background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);
  max-width:440px;width:100%;padding:20px;border:1px solid var(--border);
  /* Um diálogo mais alto do que o ecrã — num telemóvel deitado sobram 375 px
     de altura — ficaria cortado nas duas pontas, botões incluídos, sem gesto
     que lá chegasse. Desloca-se por dentro, e o gesto não passa para a
     página que está por trás. */
  max-height:calc(100vh - 32px);overflow:auto;overscroll-behavior:contain;
}
.dialog h3{font-size:16px;margin-bottom:8px}
.dialog p{margin:0 0 16px;color:var(--muted);font-size:14px}
.dialog .actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}

/* Gráficos */
.chart{width:100%;height:auto;display:block;overflow:visible}
/* Os rótulos de um gráfico são quase todos números, e empilham-se uns por
   cima dos outros num eixo: com algarismos de larguras diferentes, a coluna
   sai desalinhada. É a mesma regra do resto da aplicação. */
svg text{font-variant-numeric:tabular-nums}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:12px;font-size:13px}
.legend div{display:flex;align-items:center;gap:6px}
.legend .v{color:var(--muted);font-variant-numeric:tabular-nums}

/* Nota informativa */
.note{
  background:var(--surface-2);border:1px solid var(--border);border-left:3px solid var(--accent);
  border-radius:9px;padding:10px 13px;font-size:13px;color:var(--muted);
}
.note strong{color:var(--text)}

/* Micro-movimento — discreto, e desligado com prefers-reduced-motion */
@keyframes encherBarra{from{transform:scaleX(0)}}
.bar > span{transform-origin:left;animation:encherBarra .45s ease-out}
@keyframes surgirOverlay{from{opacity:0}}
@keyframes poparDialogo{from{opacity:0;transform:translateY(8px) scale(.98)}}
.overlay{animation:surgirOverlay .16s ease-out}
.dialog{animation:poparDialogo .18s ease-out}
@keyframes desenharAnel{from{stroke-dashoffset:var(--anel-c)}}
.anel-prog{animation:desenharAnel .6s ease-out}
@keyframes cairConfete{to{transform:translateY(105vh) rotate(680deg)}}
.confete{position:fixed;top:-14px;width:8px;height:12px;z-index:120;pointer-events:none;
  animation:cairConfete 2.3s ease-in forwards}

/* Ícones dos separadores */
nav.tabs .ticon{font-size:14px;margin-right:6px;opacity:.85}

/* Validação em linha */
input.invalido,select.invalido{border-color:var(--neg) !important;outline:1px solid var(--neg)}
.fielderr{color:var(--neg);font-size:12px;margin-top:3px}

/* Anel de progresso dos objetivos */
.anel{flex:0 0 auto}   /* os algarismos vêm da regra geral de `svg text` */

/* Tendência nos KPIs */
.kpi .delta{display:inline-block;font-size:11.5px;font-weight:650;padding:1px 8px;border-radius:999px;
  margin-left:8px;vertical-align:2px;font-variant-numeric:tabular-nums}
.kpi .delta.pos{color:var(--pos);background:color-mix(in srgb,var(--pos) 14%,transparent)}
.kpi .delta.neg{color:var(--neg);background:color-mix(in srgb,var(--neg) 14%,transparent)}
.kpi .spark{width:100%;height:26px;margin-top:6px;display:block;opacity:.9}

/* Barras de comparação das estratégias */
.cbar{display:grid;grid-template-columns:minmax(90px,150px) minmax(0,1fr) 90px;gap:7px 10px;
  align-items:center;font-size:13px}
.cbar .trilho{background:var(--surface-3);border-radius:5px;height:14px;overflow:hidden}
.cbar .trilho > span{display:block;height:100%;border-radius:5px;transform-origin:left;animation:encherBarra .45s ease-out}
.cbar .v{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}

/* Dica do próximo passo */
.dica{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;
  background:color-mix(in srgb,var(--accent) 8%,var(--surface));border:1px solid var(--border);
  border-left:3px solid var(--accent);border-radius:var(--radius);padding:11px 14px;margin-bottom:16px;font-size:13.5px}

/* Botão de anulação no toast */
#toast button{background:none;border:0;color:var(--accent-2,#9db9ff);color:var(--bg);
  text-decoration:underline;font-weight:700;font-size:13.5px;cursor:pointer;margin-left:10px;padding:0}
#toast.show{pointer-events:auto}

/* Navegação inferior (móvel) */
#tabsMovel{display:none}

/* Paleta de comandos */
#paleta .overlay{align-items:flex-start;padding-top:12vh}
#paleta .caixa{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  box-shadow:var(--shadow);width:100%;max-width:520px;overflow:hidden}
#paleta input{width:100%;border:0;border-bottom:1px solid var(--border);border-radius:0;
  background:transparent;padding:13px 16px;font-size:15px}
#paleta ul{list-style:none;margin:0;padding:6px;max-height:46vh;overflow-y:auto}
#paleta li{padding:9px 12px;border-radius:8px;font-size:14px;cursor:pointer;display:flex;gap:10px;align-items:center}
#paleta li .ticon{opacity:.8}
#paleta li[aria-selected="true"]{background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--text)}
#paleta .tipo{margin-left:auto;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}

/* Botão de transbordo do cabeçalho: só existe em ecrã estreito */
#btnMaisAcoes{display:none}
/* Folha de ações secundárias */
#folhaAcoes{position:fixed;left:8px;right:8px;top:60px;z-index:75;background:var(--surface);
  border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);
  padding:8px;display:none;max-width:420px;margin:0 auto}
#folhaAcoes.aberta{display:block}
#folhaAcoes button{display:flex;align-items:center;gap:11px;width:100%;text-align:left;
  background:none;border:0;color:var(--text);border-radius:9px;padding:12px 12px;
  font-size:14px;cursor:pointer;min-height:48px}
#folhaAcoes button:hover{background:var(--surface-2)}
#folhaAcoes button .ic{font-size:18px;width:24px;text-align:center;flex:0 0 auto}
#folhaAcoes button .st{margin-left:auto;font-size:12px;color:var(--muted)}

/* Ordenação das tabelas quando estão em modo cartão: o cabeçalho da
   tabela desaparece aí, e com ele os cabeçalhos ordenáveis. */
.ordenarCartoes{display:none}
@media (max-width:480px){
  .ordenarCartoes{display:flex;gap:8px;align-items:center;margin-bottom:9px}
  .ordenarCartoes select{flex:1 1 auto}
  .ordenarCartoes .field{flex:0 0 auto}
}

/* Grupos de botões no cabeçalho de um cartão, que têm de poder quebrar */
.acoesCabecalho{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end;min-width:0}

/* Minigráficos nas células */
svg.mini{width:70px;height:20px;display:block}

/* Ordem na lista de amortização */
.ordem{display:inline-flex;align-items:center;justify-content:center;width:21px;height:21px;
  border-radius:50%;background:var(--surface-3);color:var(--muted);font-size:11.5px;font-weight:650}
.ordem.primeiro{background:var(--accent);color:#fff}

/* Fita de meses no cabeçalho */
#fitaMeses{display:flex;gap:3px;align-items:flex-end}
#fitaMeses button{background:none;border:0;cursor:pointer;padding:2px 1px;border-radius:6px;
  display:flex;flex-direction:column;align-items:center;gap:2px;width:26px}
#fitaMeses button:hover{background:var(--surface-2)}
#fitaMeses button:focus-visible{outline:2px solid var(--accent)}
#fitaMeses button[aria-current="true"]{background:var(--accent-soft)}
#fitaMeses .cx{height:26px;display:flex;align-items:flex-end;width:100%}
#fitaMeses .bx{width:100%;border-radius:2px;display:block}
#fitaMeses .lx{font-size:9.5px;color:var(--muted);line-height:1;display:flex;align-items:center;gap:1px}
#fitaMeses button[aria-current="true"] .lx{color:var(--accent);font-weight:650}
#fitaMeses .selo{font-size:8px;opacity:.75}
/* Em ecrãs médios a fita passa para a sua própria linha, em vez de
   desaparecer: é a forma mais rápida de saltar de mês em qualquer
   largura, e escondê-la deixava uma faixa sem ela. */
@media (max-width:900px){
  .topbar .grp{flex-wrap:wrap}
  #fitaMeses{order:9;flex:1 1 100%;justify-content:space-between}
  #fitaMeses button{width:auto;flex:1 1 0}
}

/* Cartões do painel: barra de colapso discreta, no canto */
.comCab{position:relative}
.comCab > .card{margin:0}
.cabPainel{position:absolute;top:9px;right:11px;z-index:2;display:flex;align-items:center;gap:7px}
.cabPainel button{background:none;border:0;color:var(--muted);cursor:pointer;font-size:13px;
  line-height:1;padding:3px 5px;border-radius:6px}
.cabPainel button:hover{background:var(--surface-2);color:var(--text)}
.cabPainel button:focus-visible{outline:2px solid var(--accent)}
.card.cartaoFechado{display:flex;align-items:center;gap:9px;padding:11px 14px;position:relative}
.card.cartaoFechado .cabPainel{position:static;flex:1 1 auto}
.card.cartaoFechado .tt{font-size:13.5px;font-weight:600;color:var(--muted)}

/* Indicador de gravação */
#estadoGuardado{font-size:11.5px;white-space:nowrap;min-width:0}
@media (max-width:640px){ #estadoGuardado{display:none} }

/* Relatório mensal */
.relatorio .capa{border-bottom:2px solid var(--border);padding-bottom:14px;margin-bottom:4px}
.relatorio .capa h1{font-size:22px;letter-spacing:-.02em}
.relatorio .capa .mes{font-size:16px;color:var(--accent);font-weight:650;margin-top:2px}
.relatorio .capa .sub{font-size:12.5px;color:var(--muted);margin-top:3px}
.relatorio .notaRel{margin-top:8px;padding:7px 10px;border-left:3px solid var(--accent);
  background:var(--surface-2);border-radius:0 var(--radius) var(--radius) 0;font-size:13px;font-style:italic}
.relatorio .card{break-inside:avoid;page-break-inside:avoid;margin-bottom:14px}
.relatorio .card h2{font-size:15px;margin-bottom:9px}

/* Arranque por perfil */
.perfis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:9px;margin-top:6px}
.perfil{display:flex;flex-direction:column;gap:3px;text-align:left;cursor:pointer;
  background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius);
  padding:12px 13px;transition:border-color .12s,background .12s}
.perfil:hover{border-color:var(--accent);background:var(--surface-3)}
.perfil:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.perfil[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.perfil[aria-pressed="true"] .pl{color:var(--accent)}
.perfil .pi{font-size:22px}
.perfil .pl{font-size:13.5px;font-weight:650}
/* Sequências: a contagem em destaque, o resto pequeno. Sem troféus. */
.marcos{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:9px}
.marco{display:flex;align-items:center;gap:9px;text-align:left;cursor:pointer;
  background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius);
  padding:10px 12px;transition:border-color .12s,background .12s}
.marco:hover{border-color:var(--accent);background:var(--surface-3)}
.marco:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.marco .mi{font-size:19px;flex:0 0 auto}
.marco .mn{font-size:20px;font-weight:700;color:var(--accent);flex:0 0 auto;line-height:1}
.marco .mt{font-size:11.5px;color:var(--muted);line-height:1.25}
/* Fecho do mês: os passos em lista, o feito com visto */
.passos{display:flex;flex-direction:column;gap:8px;margin:4px 0 2px}
.passo{display:flex;align-items:flex-start;gap:10px;padding:9px 11px;border-radius:var(--radius);
  background:var(--surface-2);border:1px solid var(--border)}
.passo.feito{background:color-mix(in srgb,var(--pos) 8%,var(--surface-2));border-color:color-mix(in srgb,var(--pos) 30%,transparent)}
.passo .pn{flex:0 0 22px;height:22px;border-radius:999px;display:flex;align-items:center;justify-content:center;
  font-size:11.5px;font-weight:700;background:var(--surface-3);color:var(--muted)}
.passo.feito .pn{background:var(--pos);color:#fff}
.passo .pc{flex:1 1 auto;min-width:0}
.passo .pt{font-size:13.5px;font-weight:600}
.passo .pd{font-size:12px;color:var(--muted);margin-top:2px}
/* Linha do mês: uma coluna por dia, barra nos dias com movimento */
.linhaMes{display:flex;gap:2px;align-items:flex-end;overflow-x:auto;padding:4px 0 0}
.ldCol{flex:1 1 0;min-width:9px;display:flex;flex-direction:column;align-items:center;gap:3px;
  border-radius:4px;padding:2px 0}
.ldCol.hoje{background:var(--accent-soft);box-shadow:inset 0 -2px 0 var(--accent)}
.ldBarra{height:34px;display:flex;align-items:flex-end;width:100%;justify-content:center}
.ldBarra span{width:70%;min-width:4px;border-radius:2px 2px 0 0;display:block}
.ldDia{font-size:9px;color:var(--muted);line-height:1;height:10px}
.ldCol.hoje .ldDia{color:var(--accent)}
/* Aura da paleta: um gradiente muito ténue no topo, que dá identidade a
   cada tema sem tocar na legibilidade nem nas cores semânticas. */
header{position:relative}
header::before{content:"";position:absolute;inset:0 0 auto 0;height:100%;pointer-events:none;
  background:radial-gradient(120% 180% at 12% -40%,
    color-mix(in srgb,var(--accent) 16%,transparent), transparent 62%);
  opacity:.9}
header > *{position:relative;z-index:1}
@media (prefers-reduced-motion:no-preference){
  header::before{transition:background .3s ease}
}
[data-contraste="alto"] header::before{display:none}

/* Carimbo do fecho do mês: o ✓ bate como um carimbo, uma vez */
@keyframes carimbar{
  0%   {transform:scale(2.4) rotate(-14deg);opacity:0}
  55%  {transform:scale(.86) rotate(3deg);opacity:1}
  75%  {transform:scale(1.08) rotate(-1deg)}
  100% {transform:scale(1) rotate(0);opacity:1}
}
.carimbo{display:inline-block;animation:carimbar .34s cubic-bezier(.2,.9,.3,1.2) both}
@media (prefers-reduced-motion:reduce){ .carimbo{animation:none} }

/* Movimentos agrupados por dia: um cabeçalho fixo com o subtotal do dia */
tr.diaCabec td{background:var(--surface-2);border-top:1px solid var(--border);
  padding:5px 10px;font-size:12px;position:sticky;top:0;z-index:1}
tr.diaCabec .dd{font-weight:650;text-transform:capitalize}
tr.diaCabec .dv{float:right;font-variant-numeric:tabular-nums}
/* Registo em dois toques: o botão que está sempre lá, e a folha que abre.
   O custo de registar é o que decide se os movimentos se mantêm em dia. */
#botaoRapido{position:fixed;right:18px;bottom:18px;z-index:60;width:54px;height:54px;
  border-radius:999px;border:0;cursor:pointer;font-size:27px;line-height:1;
  background:var(--accent);color:#fff;box-shadow:0 6px 20px rgba(0,0,0,.28);
  transition:transform .14s ease,box-shadow .14s ease}
#botaoRapido:hover{transform:translateY(-2px);box-shadow:0 9px 26px rgba(0,0,0,.34)}
#botaoRapido:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
#botaoRapido:active{transform:scale(.94)}
.rapidoGrelha{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:7px;margin:10px 0 4px}
.rapidoCat{display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;
  background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius);
  padding:9px 6px;font-size:11.5px;min-height:60px;justify-content:center;text-align:center}
.rapidoCat:hover{background:var(--surface-3);border-color:var(--accent)}
.rapidoCat[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent)}
.rapidoCat .ri{font-size:19px}
#rapidoValor{font-size:26px;text-align:center;font-weight:700;letter-spacing:-.01em}
/* Linha do tempo do desfazer */
.listaHist{display:flex;flex-direction:column;gap:5px;max-height:44vh;overflow-y:auto}
.passoHist{display:flex;align-items:center;gap:9px;text-align:left;cursor:pointer;width:100%;
  background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius);padding:8px 11px}
.passoHist:hover{background:var(--surface-3);border-color:var(--accent)}
.passoHist:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.passoHist .hn{font-size:14px;color:var(--muted);flex:0 0 auto}
.passoHist .ht{flex:1 1 auto;font-size:13px;min-width:0}
.passoHist .hq{font-size:11px;color:var(--muted);flex:0 0 auto}
/* Emblema de pendências no separador: um ponto pequeno com o número */
nav.tabs .inner button, #tabsMovel button, #folhaMais button{position:relative}
.emblema{position:absolute;top:3px;right:4px;min-width:15px;height:15px;padding:0 3px;
  border-radius:999px;background:var(--neg);color:#fff;font-size:9.5px;font-weight:700;
  line-height:15px;text-align:center;pointer-events:none;box-shadow:0 0 0 2px var(--surface)}
#tabsMovel .emblema{top:2px;right:calc(50% - 22px)}
#folhaMais .emblema{position:static;display:inline-block;margin-left:6px;box-shadow:none}
/* Rosto de um membro: emoji, nome e a cor da pessoa numa pastilha */
.rosto{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;white-space:nowrap;
  padding:2px 8px 2px 3px;border-radius:999px;background:var(--surface-3);
  border:1px solid color-mix(in srgb,var(--rc) 35%,transparent)}
.rosto .ri{display:inline-flex;align-items:center;justify-content:center;width:19px;height:19px;
  border-radius:999px;background:color-mix(in srgb,var(--rc) 22%,var(--surface));font-size:11.5px}
/* Planear despesa: a faixa de trimestres, cada célula com o melhor mês */
.planTri{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:8px;margin-top:11px}
.planTri button{display:flex;flex-direction:column;gap:2px;align-items:flex-start;cursor:pointer;
  background:var(--surface-2);border:1px solid var(--border);border-left:3px solid var(--planCor,var(--border));
  border-radius:var(--radius);padding:8px 10px;transition:border-color .12s,background .12s;text-align:left}
.planTri button:hover{background:var(--surface-3);border-color:var(--planCor,var(--accent))}
.planTri button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.planTri button[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);border-left-color:var(--accent)}
.planTri .pq{font-size:10.5px;color:var(--muted)}
.planTri .pm{font-size:13px;font-weight:650}
.planTri .pf{font-size:11.5px;color:var(--planCor,var(--muted))}
.perfil .pd{font-size:11.5px;color:var(--muted);line-height:1.4}

/* Estados vazios ilustrados */
.vazio{text-align:center;padding:26px 18px;color:var(--muted)}
.vazio .ilu{width:100%;max-width:250px;height:auto;margin-bottom:12px;color:var(--muted)}
.vazio h3{font-size:15px;color:var(--text);margin-bottom:5px}
.vazio p{font-size:13px;max-width:430px;margin:0 auto 13px;line-height:1.55}

/* Seleção múltipla e ações em lote */
tr.selecionada > td{background:color-mix(in srgb,var(--accent) 11%,transparent)}
tr[data-mov]:focus{outline:2px solid var(--accent);outline-offset:-2px}
.lote{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:11px;
  background:var(--accent-soft);border:1px solid var(--border);border-radius:var(--radius);padding:9px 12px}
.lote .n{font-size:13.5px;font-weight:650;color:var(--accent);white-space:nowrap}
.lote select{flex:1 1 160px;min-width:0}
td[data-edit]{cursor:text}
td[data-edit]:hover{background:var(--surface-2)}
td[data-edit] input,td[data-edit] select{width:100%;padding:3px 6px;font-size:13.5px}

/* Barra com marca de ritmo */
.bar.comRitmo{position:relative;overflow:visible}
.bar.comRitmo > span{border-radius:999px}
.marcaRitmo{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--text);
  opacity:.5;border-radius:1px}

/* Mapa anual: categorias × meses */
.mapa{display:grid;gap:3px;font-size:10.5px;min-width:430px}
.mapa .mh{text-align:center;color:var(--muted);font-weight:650}
.mapa .mr{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;padding-right:6px;display:flex;align-items:center}
.mapa .mc{height:19px;border-radius:3px;background:var(--surface-3)}
.mapa .mc.hit{cursor:default}

/* Alertas e saúde dos dados */
.alertas{display:flex;flex-direction:column;gap:2px}
.alerta{display:flex;align-items:center;gap:11px;width:100%;text-align:left;
  background:none;border:0;border-radius:9px;padding:9px 10px;cursor:pointer;
  border-bottom:1px solid var(--border);transition:background .12s}
.alerta:last-child{border-bottom:0}
.alerta:hover{background:var(--surface-2)}
.alerta:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.alerta .ai{font-size:16px;flex:0 0 auto;width:18px;text-align:center}
.alerta .at{display:flex;flex-direction:column;gap:1px;min-width:0;flex:1 1 auto}
.alerta .t1{font-size:13.5px;font-weight:550}
.alerta .t2{font-size:12px;color:var(--muted)}
.alerta .av{color:var(--muted);font-size:12px;flex:0 0 auto;white-space:nowrap}

/* Teclas, pegas de arrasto */
kbd{background:var(--surface-3);border:1px solid var(--border);border-bottom-width:2px;
  border-radius:5px;padding:1px 6px;font-size:12px;font-family:inherit}
.pega{cursor:grab;color:var(--muted);user-select:none;font-size:13px}
tr.arrastando{opacity:.4}
tr.alvo-drop td{border-top:2px solid var(--accent)}

/* Calendário-mapa de calor dos movimentos */
.hmap-wrap{margin:4px 0 14px}
.hmap{display:grid;grid-template-columns:repeat(7,minmax(30px,44px));gap:4px}
.hmap .hdia{font-size:10.5px;text-transform:uppercase;color:var(--muted);text-align:center;font-weight:650}
.hmap .hcel{background:var(--surface-2);border:1px solid var(--border);border-radius:7px;
  min-height:30px;display:flex;align-items:center;justify-content:center;
  font-size:12px;font-variant-numeric:tabular-nums;color:var(--text)}
.hmap .hcel.hit{cursor:default}

/* Modo privacidade — os valores desfocam-se; as formas mantêm-se */
body.privado .num,body.privado .kpi .val,body.privado output,
body.privado .chart text,body.privado .cbar .v,body.privado .anel text,
body.privado .barlbl,body.privado .legend .v,body.privado #brandSub{
  filter:blur(5px);user-select:none}
body.privado .kpi .delta{filter:blur(5px)}

/* Tamanho do texto — escala tudo o que usa rem/em e o corpo */
html[data-texto="grande"] body{font-size:16.5px}
html[data-texto="grande"] th,html[data-texto="grande"] td{font-size:14.5px}
html[data-texto="grande"] .kpi .val{font-size:26px}
html[data-texto="maior"] body{font-size:18px}
html[data-texto="maior"] th,html[data-texto="maior"] td{font-size:16px}
html[data-texto="maior"] .kpi .val{font-size:28px}
html[data-texto="maior"] .kpi .lbl,html[data-texto="grande"] .kpi .lbl{font-size:12.5px}

/* Alto contraste — bordas e texto mais firmes, sem sombras a diluir */
html[data-contraste="alto"]{--border:#000;--muted:#3a3a3a;--shadow:none}
html[data-contraste="alto"][data-theme="dark"],
html[data-contraste="alto"] body{--shadow:none}
html[data-contraste="alto"] .card,html[data-contraste="alto"] .kpi,
html[data-contraste="alto"] .form,html[data-contraste="alto"] .note{border-width:2px}
html[data-contraste="alto"] th,html[data-contraste="alto"] td{border-bottom-color:var(--border)}
html[data-contraste="alto"] .btn{border-width:2px;font-weight:650}
html[data-contraste="alto"] tbody tr:nth-child(even){background:transparent}
html[data-contraste="alto"] .muted,html[data-contraste="alto"] .kpi .hint{color:var(--muted)}
@media (prefers-color-scheme:dark){
  html[data-contraste="alto"][data-theme="auto"]{--border:#fff;--muted:#d6d6d6}
}
html[data-contraste="alto"][data-theme="dark"]{--border:#fff;--muted:#d6d6d6}

/* Densidade compacta — mais linhas por ecrã */
html[data-densidade="compacta"] body{font-size:14px}
html[data-densidade="compacta"] th,html[data-densidade="compacta"] td{padding:5px 7px;font-size:13px}
html[data-densidade="compacta"] .card{padding:12px}
html[data-densidade="compacta"] .kpi{padding:9px 12px}
html[data-densidade="compacta"] .kpi .val{font-size:20px}
html[data-densidade="compacta"] .form{padding:10px}
html[data-densidade="compacta"] main{padding-top:12px}
html[data-densidade="compacta"] .card-head{margin-bottom:8px}

/* Amostras de paleta (Definições → Aparência) */
.paletas{display:flex;flex-wrap:wrap;gap:8px}
.amostra{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--border);
  background:var(--surface-2);border-radius:999px;padding:7px 14px 7px 9px;cursor:pointer;
  font-size:13px;font-weight:550;transition:border-color .12s,background .12s}
.amostra:hover{background:var(--surface-3)}
.amostra[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);
  background:var(--accent-soft)}
.amostra .pinta{width:16px;height:16px;border-radius:50%;flex:0 0 auto;
  box-shadow:inset 0 0 0 2px rgba(255,255,255,.25)}
.amostra:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Visita guiada */
#tutFundo{position:fixed;inset:0;background:rgba(9,14,22,.62);z-index:90;animation:surgirOverlay .16s ease-out}
.tut-alvo{position:relative;z-index:91;outline:3px solid var(--accent);outline-offset:4px;
  border-radius:8px;pointer-events:none}
/* «É aqui» — mostra onde fica um comando sem o tirar do alcance, ao
   contrário do realce da visita, que é para ver e não para tocar. */
@keyframes apontar{0%,100%{box-shadow:0 0 0 0 rgba(0,0,0,0)}50%{box-shadow:0 0 0 6px var(--accent-soft)}}
.aponta{outline:2px solid var(--accent);outline-offset:3px;border-radius:8px;
  animation:apontar 1.1s ease-in-out 3}
@media (prefers-reduced-motion:reduce){.aponta{animation:none}}
@keyframes poparTutorial{from{opacity:0;transform:translate(-50%,8px) scale(.98)}}
#tutorial .tutcard{position:fixed;left:50%;transform:translateX(-50%);bottom:26px;z-index:95;
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  box-shadow:var(--shadow);max-width:500px;width:calc(100vw - 28px);padding:15px 18px;
  animation:poparTutorial .18s ease-out}
#tutorial h3{font-size:16px;margin:8px 0 6px}
#tutorial p{font-size:13.5px;color:var(--muted);margin:0 0 12px;line-height:1.55}
#tutorial p strong{color:var(--text)}
#tutorial .tutacts{display:flex;gap:8px;align-items:center}
#tutorial .tutacts .esp{flex:1 1 auto}
.tutprog{height:4px;border-radius:99px;background:var(--surface-3);overflow:hidden}
.tutprog > span{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .25s}

/* ============================================================
   Toque — ponteiro grosso

   A regra é o ponteiro, não a largura: um tablet grande continua a
   ser tocado com o dedo. Alvos de 44 px, que é a medida a que um
   dedo acerta sem pensar.
   ============================================================ */
/* Com rato os botões de subir/descer são redundantes — há o arrasto.
   Declarado antes da media query, para que esta possa revertê-lo. */
.ordenar{display:none}

/* A largura entra como rede: nem todos os navegadores reportam o
   ponteiro com fiabilidade, e um ecrã de 640 px é um telemóvel. */
/* Os alvos de toque dependiam de `pointer:coarse` e da largura. Nenhum dos
   dois é fiável sozinho: há aparelhos de toque que dizem ter ponteiro fino,
   e um telemóvel deitado tem 812 px de largura. A classe do aparelho, que
   se mede pelo lado menor, é o sinal honesto — e junta-se aos outros dois. */
[data-dispositivo="telemovel"] .btn,
[data-dispositivo="tablet"] .btn{min-height:44px;padding:10px 14px}
[data-dispositivo="telemovel"] .btn.sm,
[data-dispositivo="tablet"] .btn.sm{min-height:40px;padding:8px 12px;font-size:13px}
[data-dispositivo="telemovel"] .btn.icon,
[data-dispositivo="tablet"] .btn.icon{min-width:44px;min-height:44px;padding:10px}
[data-dispositivo="telemovel"] input,
[data-dispositivo="telemovel"] select,
[data-dispositivo="telemovel"] textarea,
[data-dispositivo="tablet"] input,
[data-dispositivo="tablet"] select,
[data-dispositivo="tablet"] textarea{min-height:44px}
[data-dispositivo="telemovel"] .seg button,
[data-dispositivo="tablet"] .seg button{min-height:42px;padding:9px 14px}
/* 44 px é o alvo que a Apple e a Google recomendam, e estes botões estão no
   canto do cartão — o sítio onde o polegar chega pior. De pé há altura para
   os dar; deitado não há, e aí a regra de baixo encolhe-os. O sinal ▾ não
   cresce: o que cresce é a área transparente à volta dele. */
[data-dispositivo="telemovel"] .cabPainel button,
[data-dispositivo="tablet"] .cabPainel button{min-width:44px;min-height:44px;
  display:inline-flex;align-items:center;justify-content:center;padding:0}
/* A coluna de seleção pelo atributo de aparelho, e não só pela media query:
   um telemóvel deitado tem 844 px de largura e há aparelhos de toque que
   declaram ponteiro fino — em qualquer desses casos a media query não
   dispara, e a caixa ficava com 20 px de alvo. */
[data-dispositivo="telemovel"] .colSel,
[data-dispositivo="tablet"] .colSel{width:44px;padding-left:0;padding-right:0}
[data-dispositivo="telemovel"] .celSel,
[data-dispositivo="tablet"] .celSel{min-width:44px;min-height:44px}
[data-dispositivo="telemovel"] input[type=checkbox],
[data-dispositivo="telemovel"] input[type=radio],
[data-dispositivo="tablet"] input[type=checkbox],
[data-dispositivo="tablet"] input[type=radio]{width:22px;height:22px;min-height:0}
/* A fita de meses é um mini-mapa: as colunas são estreitas de propósito, para
   caberem doze. Ao dedo, 26 px não se acerta — alarga-se o suficiente sem
   deixar de caber o ano, e é a fita que rola se não couber. */
[data-dispositivo="telemovel"] #fitaMeses button,
[data-dispositivo="tablet"] #fitaMeses button{width:34px;padding:4px 2px}
[data-dispositivo="telemovel"] #fitaMeses,
[data-dispositivo="tablet"] #fitaMeses{overflow-x:auto;scrollbar-width:none}
[data-dispositivo="telemovel"] .pega,
[data-dispositivo="tablet"] .pega{display:none}
[data-dispositivo="telemovel"] .ordenar,
[data-dispositivo="tablet"] .ordenar{display:inline-flex;gap:4px}
/* Deitado a altura é preciosa, mas o dedo continua do mesmo tamanho: os
   botões pequenos encolhem no que é horizontal, nunca abaixo do alcançável. */
[data-deitado="telemovel"] .btn{min-height:40px;padding:8px 12px}
[data-deitado="telemovel"] .btn.sm{min-height:36px;padding:6px 10px}
[data-deitado="telemovel"] input,
[data-deitado="telemovel"] select,
[data-deitado="telemovel"] textarea{min-height:40px}
[data-deitado="telemovel"] .seg button{min-height:38px;padding:7px 12px}
[data-deitado="telemovel"] .cabPainel button{min-width:38px;min-height:38px}
/* Deitado escasseia a altura, não a largura: o alvo encolhe só na vertical. */
[data-deitado="telemovel"] .celSel{min-height:38px}

@media (pointer:coarse), (max-width:640px){
  .btn{min-height:44px;padding:10px 14px}
  .btn.sm{min-height:40px;padding:8px 12px;font-size:13px}
  .btn.icon{min-width:44px;min-height:44px;padding:10px}
  input,select,textarea{min-height:44px}
  /* `min-height:0` porque a regra dos campos acima estica a caixa para 44 de
     altura e deixa-a 22 de largura: um retângulo onde devia estar um quadrado. */
  input[type=checkbox],input[type=radio]{width:22px;height:22px;min-height:0}
  .colSel{width:44px;padding-left:0;padding-right:0}
  .celSel{min-width:44px;min-height:44px}
  .seg button{min-height:42px;padding:9px 14px}
  th.sortable{padding-top:12px;padding-bottom:12px}
  .alerta{padding:12px 10px}
  .amostra{min-height:44px}
  #paleta li{padding:13px 12px}
  .perfil{min-height:76px}
  /* Abrir e fechar um cartão do painel tinha 19 px de alvo — um chevron
     desenhado para o ponteiro. Ao dedo, cresce sem crescer o desenho:
     o botão fica transparente à volta do sinal. */
  .cabPainel button{min-width:38px;min-height:38px;display:inline-flex;
    align-items:center;justify-content:center;padding:0}
  /* A pega de arrasto dá lugar aos botões de subir e descer */
  .pega{display:none}
  .ordenar{display:inline-flex;gap:4px}
  /* Uma célula editável mostra que o é, já que não há duplo toque */
  td[data-edit]{position:relative}
  td[data-edit]::after{content:"✎";position:absolute;right:4px;top:50%;transform:translateY(-50%);
    font-size:11px;opacity:.35}
}

@media (max-width:640px){
  .topbar{padding:9px 12px;gap:8px}
  .brand h1{font-size:15px}
  .brand small{display:none}
  main{padding:14px 11px 84px}
  /* O cabeçalho tinha 17 botões e 151 px. Os secundários passam para
     uma folha, e ficam à vista os que se usam a toda a hora. */
  header .secundario{display:none}
  #btnMaisAcoes{display:inline-flex}
  #mesSel{width:132px}
  /* Sem isto a fita não consegue passar para a linha de baixo, e o
     seu flex-basis de 100% empurra o cabeçalho para fora do ecrã. */
  .topbar .grp{flex-wrap:wrap}
  /* As setas ‹ › tornam-se redundantes: há a fita e o deslizar. Sai
     também o subtítulo. O cabeçalho é fixo — cada linha custa ecrã. */
  #mesPrev,#mesNext{display:none}
  .topbar{padding:7px 12px;gap:6px}
  header .brand .logo{font-size:19px}
  #fitaMeses{padding-top:0}
  #fitaMeses button{min-height:40px}
  #fitaMeses .cx{height:18px}
  /* O cabeçalho ocupa 190 px de um ecrã de 812. Recolhe ao descer e
     volta ao subir — o gesto de voltar atrás traz sempre o comando. */
  header{transition:transform .22s ease}
  header.recolhido{transform:translateY(-100%)}
  /* A fita de meses é boa no telemóvel — é toque em vez de setas.
     Passa para uma linha própria, com espaço para o dedo. */
  #fitaMeses{display:flex;order:9;flex:1 1 100%;justify-content:space-between;
    padding-top:2px;gap:2px}
  #fitaMeses button{width:auto;flex:1 1 0;min-height:44px;padding:4px 0}
  #fitaMeses .cx{height:22px}
  .card{padding:13px}
  .kpi .val{font-size:21px}
  th,td{padding:7px 8px;font-size:13.5px}
  nav.tabs{display:none}
  #tabsMovel{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:70;
    background:var(--surface);border-top:1px solid var(--border);
    padding:4px max(6px,env(safe-area-inset-left)) max(6px,env(safe-area-inset-bottom))}
  #tabsMovel button{flex:1 1 0;background:none;border:0;color:var(--muted);font-size:11px;
    display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:9px;cursor:pointer}
  #tabsMovel button .ticon{font-size:19px}
  #tabsMovel button[aria-selected="true"]{color:var(--accent)}
  /* O botão de registo sobe acima da navegação inferior: pousado em cima
     dela, tapava o último separador — e a navegação vem primeiro. */
  #botaoRapido{bottom:calc(72px + env(safe-area-inset-bottom));width:50px;height:50px;font-size:25px}
  #tabsMovel button:focus-visible{outline:2px solid var(--accent)}
  /* `:not([hidden])` não é enfeite: o `display:none` que o atributo `hidden`
     traz vem da folha do navegador e perde para qualquer regra de autor com
     um `id`. Sem isto, a folha «Mais» ficava aberta para sempre — o JS punha
     `hidden`, e o CSS mandava mostrar à mesma. */
  #folhaMais:not([hidden]){position:fixed;left:8px;right:8px;bottom:64px;z-index:71;
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    box-shadow:var(--shadow);display:flex;flex-wrap:wrap;gap:4px;padding:8px}
  #folhaMais button{flex:1 1 40%;background:var(--surface-2);border:1px solid var(--border);
    border-radius:9px;color:var(--text);padding:10px;font-size:13px;cursor:pointer}
  #folhaMais button[aria-selected="true"]{border-color:var(--accent);color:var(--accent)}
  #tutorial .tutcard{bottom:84px}
}

/* ---------------------------------------------------------------
   Telemóvel deitado

   O caso que a largura sozinha não via: 812 px de largo, 375 de alto.
   Pelo critério antigo era «ecrã grande» e recebia o desenho de
   computador — cabeçalho de 156 px, separadores no topo, fita de meses
   numa linha só sua — dentro de 375 px de altura. Sobravam 219.

   Aqui a altura é que é escassa e a largura é que sobra, e o desenho
   troca em conformidade: tudo o que é vertical encolhe, e o que ganha
   com a largura espalha-se.
   --------------------------------------------------------------- */
[data-deitado="telemovel"] header .brand h1,
[data-deitado="telemovel"] header .brand small{display:none}
[data-deitado="telemovel"] .topbar{padding:4px 10px;gap:5px}
/* A fita sai: há o seletor de mês, as setas e o deslizar */
[data-deitado="telemovel"] #fitaMeses{display:none}
[data-deitado="telemovel"] #mesPrev,
[data-deitado="telemovel"] #mesNext{display:inline-flex}
[data-deitado="telemovel"] header .secundario{display:none}
[data-deitado="telemovel"] #btnMaisAcoes{display:inline-flex}
[data-deitado="telemovel"] header{transition:transform .22s ease}
[data-deitado="telemovel"] header.recolhido{transform:translateY(-100%)}

/* A navegação vai para baixo, como em retrato: no topo roubaria mais uma
   faixa de altura, e em baixo o polegar alcança-a com o aparelho deitado. */
[data-deitado="telemovel"] nav.tabs{display:none}
[data-deitado="telemovel"] #tabsMovel{display:flex;position:fixed;left:0;right:0;bottom:0;
  z-index:70;background:var(--surface);border-top:1px solid var(--border);
  padding:2px max(6px,env(safe-area-inset-left)) max(2px,env(safe-area-inset-bottom))}
/* Deitado, o ícone e o texto cabem lado a lado — poupa uma linha inteira */
[data-deitado="telemovel"] #tabsMovel button{flex:1 1 0;background:none;border:0;
  color:var(--muted);font-size:10px;display:flex;flex-direction:row;align-items:center;
  justify-content:center;gap:5px;padding:5px 2px;border-radius:9px;cursor:pointer;min-height:38px}
[data-deitado="telemovel"] #tabsMovel button .ticon{font-size:15px}
[data-deitado="telemovel"] #tabsMovel button[aria-selected="true"]{color:var(--accent)}
[data-deitado="telemovel"] #folhaMais:not([hidden]){position:fixed;left:8px;right:8px;bottom:46px;
  z-index:71;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  box-shadow:var(--shadow);display:flex;flex-wrap:wrap;gap:4px;padding:6px}
[data-deitado="telemovel"] #folhaMais button{flex:1 1 30%;background:var(--surface-2);
  border:1px solid var(--border);border-radius:9px;color:var(--text);padding:8px;
  font-size:12.5px;cursor:pointer}
[data-deitado="telemovel"] #botaoRapido{bottom:calc(50px + env(safe-area-inset-bottom));
  right:12px;width:44px;height:44px;font-size:22px}
[data-deitado="telemovel"] #tutorial .tutcard{bottom:56px}

/* Menos ar na vertical, em todo o lado */
[data-deitado="telemovel"] main{padding:8px 12px 56px}
[data-deitado="telemovel"] .card{padding:10px 13px}
[data-deitado="telemovel"] .card-head{margin-bottom:7px}
[data-deitado="telemovel"] .kpi{padding:8px 10px}
[data-deitado="telemovel"] .kpi .val{font-size:18px}
[data-deitado="telemovel"] h2{font-size:14.5px}
[data-deitado="telemovel"] th,
[data-deitado="telemovel"] td{padding:5px 8px}

/* A largura é que sobra: os indicadores espalham-se em vez de empilhar */
[data-deitado="telemovel"] .grid.g2,
[data-deitado="telemovel"] .grid.g3,
[data-deitado="telemovel"] .grid.g4{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}

/* ---------------------------------------------------------------
   Tablet — de pé e deitado

   Um tablet tem espaço a sério nas duas orientações; o que muda é o
   formato. De pé, um cartão largo lê-se melhor do que dois estreitos;
   deitado, emparelham à vontade.
   --------------------------------------------------------------- */
[data-dispositivo="tablet"][data-orientacao="retrato"] .grid.g4,
[data-dispositivo="tablet"][data-orientacao="retrato"] .grid.g3{
  grid-template-columns:repeat(2,minmax(0,1fr))}
[data-dispositivo="tablet"][data-orientacao="retrato"] .grid.g2{
  grid-template-columns:minmax(0,1fr)}
[data-dispositivo="tablet"][data-orientacao="paisagem"] main{padding:16px 20px}
[data-dispositivo="tablet"][data-orientacao="paisagem"] .grid.g4{
  grid-template-columns:repeat(4,minmax(0,1fr))}

/* Tabelas em cartões, nos ecrãs estreitos */
@media (max-width:480px){
  .tblcards table,.tblcards tbody,.tblcards tr,.tblcards td{display:block}
  .tblcards thead{display:none}
  .tblcards tbody tr{border:1px solid var(--border);border-radius:11px;margin-bottom:9px;
    padding:9px 11px;background:var(--surface-2)}
  .tblcards tbody tr:nth-child(even){background:var(--surface-2)}
  .tblcards td{border-bottom:0;padding:2.5px 0;display:flex;justify-content:space-between;
    align-items:center;gap:10px;text-align:right}
  .tblcards td.r{text-align:right}
  .tblcards td[data-lbl]::before{content:attr(data-lbl);font-size:11px;text-transform:uppercase;
    letter-spacing:.04em;color:var(--muted);font-weight:650;text-align:left;flex:0 0 auto}
  .tblcards td:not([data-lbl]){justify-content:flex-end}
  .tblcards tfoot td{border-top:0}
}

@media print{
  /* Tudo o que flutua por cima da página fica de fora do papel. O diálogo e a
     bolha do explicador estavam a faltar: quem tivesse o ponteiro pousado num
     indicador ao carregar em imprimir levava a bolha para a folha, e um
     diálogo aberto punha o seu véu cinzento por cima de tudo. */
  header,nav.tabs,.no-print,#toast,#tabsMovel,#folhaMais,#paleta,#tutorial,#tutFundo,
  #modalHost,#tip{display:none !important}
  body{background:#fff;color:#000;font-size:11.5pt}
  .card{box-shadow:none;border:1px solid #bbb;break-inside:avoid;page-break-inside:avoid}
  main{max-width:none;padding:0}
}

<script>
"use strict";
/* ================================================================
   Orçamento Familiar — aplicação de ficheiro único
   Sem dependências externas. Dados guardados no navegador
   (localStorage) e exportáveis para JSON/CSV.
   ================================================================ */

const STORE_KEY = "orcamento-familiar-v1";
const APP_VERSION = 1;
/* Tecto da nota do mês: é uma nota, não um diário — e o estado inteiro passa
   pelo histórico de desfazer a cada alteração. Fica aqui, com as outras
   constantes de topo, porque os explicadores citam-no antes de tudo o mais. */
const NOTA_MAX = 280;

/* ---------------------------------------------------------------
   Utilitários
   --------------------------------------------------------------- */
const $  = (sel, root) => (root || document).querySelector(sel);
const $$ = (sel, root) => Array.from((root || document).querySelectorAll(sel));

const uid = (p) => p + "-" + Math.random().toString(36).slice(2, 9);

/** Escapa texto para interpolação segura em HTML. */
function esc(v){
  return String(v == null ? "" : v)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}

const fmtEUR = new Intl.NumberFormat("pt-PT",{style:"currency",currency:"EUR"});
const fmtEUR0 = new Intl.NumberFormat("pt-PT",{style:"currency",currency:"EUR",maximumFractionDigits:0});
const fmtNum = new Intl.NumberFormat("pt-PT",{minimumFractionDigits:2,maximumFractionDigits:2});

const eur  = (n) => fmtEUR.format(Number.isFinite(n) ? n : 0);
const eur0 = (n) => fmtEUR0.format(Number.isFinite(n) ? n : 0);
const pct  = (n) => (Number.isFinite(n) ? n : 0).toLocaleString("pt-PT",{maximumFractionDigits:1}) + "%";

/**
 * Aceita "1.234,56", "1234.56", "20.000" e "20,5".
 * Com vírgula presente, o ponto é separador de milhares. Sem vírgula, só se
 * tratam os pontos como milhares quando o padrão é inequívoco (grupos de três).
 */
function parseNum(v){
  if (typeof v === "number") return Number.isFinite(v) ? v : 0;
  if (v == null) return 0;
  let s = String(v).trim().replace(/[\s €]/g,"");
  if (!s) return 0;
  const neg = s.charAt(0) === "-";
  s = s.replace(/^[+-]/,"");
  if (s.includes(",")){
    s = s.replace(/\./g,"").replace(",",".");
  } else if (/^\d{1,3}(\.\d{3})+$/.test(s)){
    s = s.replace(/\./g,"");
  }
  const n = parseFloat(s);
  return Number.isFinite(n) ? (neg ? -n : n) : 0;
}

const hoje = () => new Date();
const isoDia = (d) => {
  const dt = d instanceof Date ? d : new Date(d);
  return dt.getFullYear() + "-" + String(dt.getMonth()+1).padStart(2,"0") + "-" + String(dt.getDate()).padStart(2,"0");
};
const isoMes = (d) => isoDia(d).slice(0,7);
const mesDoDia = (dia) => String(dia || "").slice(0,7);

/* «YYYY-MM» com mês mesmo existente. A forma sozinha não chega: um
   «2026-13» passa no molde e depois atravessa a aplicação inteira como
   um mês que nunca chega — invisível em qualquer vista mensal. */
function mesValido(m){
  if (!/^\d{4}-\d{2}$/.test(String(m || ""))) return false;
  const mm = Number(String(m).slice(5, 7));
  return mm >= 1 && mm <= 12;
}

const MESES = ["janeiro","fevereiro","março","abril","maio","junho",
               "julho","agosto","setembro","outubro","novembro","dezembro"];

function mesLabel(m, curto){
  if (!m || m.length < 7) return "—";
  const [a,mm] = m.split("-").map(Number);
  const nome = MESES[mm-1] || "";
  return curto ? (nome.slice(0,3) + "/" + String(a).slice(2)) : (nome + " de " + a);
}
/* Dia por extenso, para os cabeçalhos de agrupamento dos movimentos.
   «Hoje» e «Ontem» dizem mais do que a data, quando é o caso. */
const DIAS_SEMANA = ["domingo","segunda","terça","quarta","quinta","sexta","sábado"];
function diaExtenso(iso){
  if (!iso || iso.length < 10) return "—";
  const [a, m, d] = iso.split("-").map(Number);
  const dt = new Date(a, m-1, d);
  if (isNaN(dt.getTime())) return iso;
  const hj = hoje();
  const mesmo = (x, y) => x.getFullYear() === y.getFullYear() && x.getMonth() === y.getMonth()
    && x.getDate() === y.getDate();
  const ontem = new Date(hj.getFullYear(), hj.getMonth(), hj.getDate() - 1);
  if (mesmo(dt, hj)) return "hoje, "+d+" de "+MESES[m-1];
  if (mesmo(dt, ontem)) return "ontem, "+d+" de "+MESES[m-1];
  return DIAS_SEMANA[dt.getDay()]+", "+d+" de "+MESES[m-1];
}

/** Desloca um mês "YYYY-MM" em n meses. */
function mesShift(m, n){
  const [a,mm] = m.split("-").map(Number);
  const d = new Date(a, mm - 1 + n, 1);
  return isoMes(d);
}
/** Número de meses entre dois "YYYY-MM" (b - a). */
function mesDiff(a, b){
  const [a1,m1] = a.split("-").map(Number);
  const [a2,m2] = b.split("-").map(Number);
  return (a2-a1)*12 + (m2-m1);
}

/* Frequências das rubricas recorrentes → fator mensal */
const FREQ = {

  anual:      {lbl:"Anual",               f:1/12},
  catorze:    {lbl:"14× por ano",         f:14/12},
};
const freqFator = (k) => (FREQ[k] ? FREQ[k].f : 1);

const GRUPOS = {

const CLASSES = {

  deposito:   {lbl:"Depósito a prazo",          nat:"financeiro", grupo:"liquidez", ret:2.0,  queda:0,  risco:"Muito baixo",  fiscal:"capitais", cor:"#5b7fbd"},
  /* Poupança de capital garantido */

  /* Reforma */
  ppr:        {lbl:"PPR",                       nat:"financeiro", grupo:"reforma",  ret:4.0,  queda:18, risco:"Médio",        fiscal:"ppr",      cor:"#7d8aa8"},
  /* Mercado de capitais */
  etf:        {lbl:"ETF / fundo de índice",     nat:"financeiro", grupo:"mercado",  ret:7.0,  queda:35, risco:"Médio-alto",   fiscal:"capitais", cor:"#8a6fe0"},
  fundos:     {lbl:"Fundos de investimento",    nat:"financeiro", grupo:"mercado",  ret:6.0,  queda:32, risco:"Médio-alto",   fiscal:"capitais", cor:"#9a7fe8"},
  acoes:      {lbl:"Ações",                     nat:"financeiro", grupo:"mercado",  ret:8.0,  queda:45, risco:"Alto",         fiscal:"capitais", cor:"#a07ae8"},
  reits:      {lbl:"Imobiliário cotado (REIT)", nat:"financeiro", grupo:"mercado",  ret:5.5,  queda:32, risco:"Médio-alto",   fiscal:"capitais", cor:"#d05f8c"},
  ouro:       {lbl:"Ouro e matérias-primas",    nat:"financeiro", grupo:"mercado",  ret:4.0,  queda:25, risco:"Médio",        fiscal:"capitais", cor:"#e0913f"},
  cripto:     {lbl:"Criptomoedas",              nat:"financeiro", grupo:"mercado",  ret:12.0, queda:70, risco:"Muito alto",   fiscal:"capitais", cor:"#e8a95e"},
  outros:     {lbl:"Outros financeiros",        nat:"financeiro", grupo:"mercado",  ret:3.0,  queda:20, risco:"—",            fiscal:"capitais", cor:"#8892a6"},
  /* Ativos reais — `ret` é a valorização anual, negativa nos que depreciam */
  imovel:     {lbl:"Imóvel",                    nat:"real", grupo:"real", ret: 2.0,  queda:25, risco:"Médio", fiscal:"imovel",    cor:"#2f5fd0"},
  terreno:    {lbl:"Terreno",                   nat:"real", grupo:"real", ret: 1.5,  queda:25, risco:"Médio", fiscal:"imovel",    cor:"#4a75db"},
  automovel:  {lbl:"Automóvel",                 nat:"real", grupo:"real", ret:-15.0, queda:0,  risco:"—",     fiscal:"automovel", cor:"#c0392b"},
  mota:       {lbl:"Mota / caravana",           nat:"real", grupo:"real", ret:-10.0, queda:0,  risco:"—",     fiscal:"automovel", cor:"#d9793a"},
  arte:       {lbl:"Obra de arte",              nat:"real", grupo:"real", ret: 3.0,  queda:30, risco:"Alto",  fiscal:"nenhum",    cor:"#a07ae8"},
  joias:      {lbl:"Joias e relógios",          nat:"real", grupo:"real", ret: 2.0,  queda:25, risco:"Médio", fiscal:"nenhum",    cor:"#c96fb0"},
  colecao:    {lbl:"Coleções e outros",         nat:"real", grupo:"real", ret: 1.0,  queda:25, risco:"Médio", fiscal:"nenhum",    cor:"#8892a6"},
};
const classeDe = (k) => CLASSES[k] || CLASSES.outros;

/* Agrupamento das classes, para leitura e para o donut de alocação. */
const GRUPOS_ATIVO = {
  liquidez: {lbl:"Liquidez",            desc:"Disponível de imediato",           cor:"#6b8ec9", ordem:1},
  poupanca: {lbl:"Poupança",            desc:"Capital garantido",                cor:"#3a97d4", ordem:2},
  reforma:  {lbl:"Reforma",             desc:"PPR e planos de longo prazo",      cor:"#7d8aa8", ordem:3},
  mercado:  {lbl:"Mercado de capitais", desc:"Sujeito a oscilações",             cor:"#8a6fe0", ordem:4},
  real:     {lbl:"Ativos reais",        desc:"Imóveis, veículos e outros bens",  cor:"#2f5fd0", ordem:5},
};
/* Classes que ganham painel de simulação própria na ficha do ativo. */
const temSimulador = (k) => classeDe(k).nat === "financeiro" && k !== "corrente";

/* ---------------------------------------------------------------
   Rendimentos — espécies e o seu tratamento fiscal por omissão
   ss  — sujeito a contribuições para a Segurança Social
   irs — sujeito a retenção na fonte de IRS (categoria A/H)
   aut — tributação autónoma noutra categoria (rendas, capitais)
   --------------------------------------------------------------- */
const ESPECIES = {
  base:           {lbl:"Vencimento base",         ss:true,  irs:true,  freq:"mensal", cor:"#2f9e6d"},
  ferias:         {lbl:"Subsídio de férias",      ss:true,  irs:true,  freq:"anual",  cor:"#3fb98a"},
  natal:          {lbl:"Subsídio de Natal",       ss:true,  irs:true,  freq:"anual",  cor:"#4ec49a"},
  alimentacao:    {lbl:"Subsídio de alimentação", ss:false, irs:false, freq:"mensal", cor:"#57c9a3", isento:true},
  extraordinario: {lbl:"Trabalho suplementar",    ss:true,  irs:true,  freq:"mensal", cor:"#6fd3b3"},
  premio:         {lbl:"Prémios e gratificações", ss:true,  irs:true,  freq:"anual",  cor:"#7ad6bb"},
  comissao:       {lbl:"Comissões",               ss:true,  irs:true,  freq:"mensal", cor:"#8adcc4"},
  ajudas:         {lbl:"Ajudas de custo",         ss:false, irs:false, freq:"mensal", cor:"#9ae2ce", isento:true},
  abono:          {lbl:"Abonos e apoios sociais", ss:false, irs:false, freq:"mensal", cor:"#a8e7d7", isento:true},
  /* Prestações sociais substitutivas de rendimento, pagas pela Segurança
     Social. Não são rendimento da categoria A: não pagam IRS nem TSU. */

  riscoGravidez:  {lbl:"Risco clínico na gravidez", ss:false, irs:false, freq:"mensal", cor:"#5fcf9a", isento:true, social:true},
  abonoFamilia:   {lbl:"Abono de família",        ss:false, irs:false, freq:"mensal", cor:"#70d9a8", isento:true, social:true},
  abonoPrenatal:  {lbl:"Abono pré-natal",         ss:false, irs:false, freq:"mensal", cor:"#82dfb4", isento:true, social:true},
  pensao:         {lbl:"Pensão",                  ss:false, irs:true,  freq:"mensal", cor:"#68b0c9"},
  renda:          {lbl:"Renda recebida",          ss:false, irs:false, freq:"mensal", cor:"#5b93c9", aut:"rendas"},
  capitais:       {lbl:"Juros e dividendos",      ss:false, irs:false, freq:"anual",  cor:"#4a7fc0", aut:"capitais"},
  outro:          {lbl:"Outro rendimento",        ss:false, irs:true,  freq:"mensal", cor:"#8892a6"},
};
const especieDe = (k) => ESPECIES[k] || ESPECIES.outro;

/* ---------------------------------------------------------------
   Fiscalidade portuguesa

   ANO DE REFERÊNCIA DOS VALORES: 2026.

   As taxas abaixo são as do regime português, com a redação em vigor
   à data indicada. Não são a lei — são valores de partida editáveis.
   Duas ressalvas que importam:

     · O Orçamento do Estado altera valores todos os anos. Confirme os
       limites do subsídio de alimentação e do PPR para o ano corrente.
     · Várias taxas dependem de circunstâncias que a ferramenta não
       conhece (município, duração do contrato de arrendamento, idade,
       situação familiar). Onde isso acontece, a interface diz qual é
       o intervalo legal e o que faz variar.

   Referências: CIRS art.º 71.º (taxas liberatórias) e 72.º (autónomas),
   CIMI art.º 112.º (IMI), EBF art.º 21.º (PPR), Código Contributivo
   art.º 53.º (TSU), Lei n.º 56/2023 e n.º 9-A/2026 (arrendamento),
   Ofício Circulado 40129/2026 (IMT).
   --------------------------------------------------------------- */

/* Regimes de Segurança Social, por tipo de rendimento do trabalho. */

};

   Base de 25% na habitação (Lei n.º 56/2023), com reduções por duração do

   taxa de 10% para arrendamento habitacional de renda moderada. */

  {lbl:"Não habitacional",                 anos:-1, taxa:28},
];

const LIMITES_PPR = [
  {ate:35,  limite:400},
  {ate:50,  limite:350},
  {ate:999, limite:300},
];
const limitePPR = (idade) => {
  const i = parseNum(idade);
  if (i <= 0) return 400;
  return (LIMITES_PPR.find(l => i <= l.ate) || LIMITES_PPR[2]).limite;
};

/* Intervalos legais, para validar e para informar. */
const LIMITES_LEGAIS = {
  imiTaxa: {min:0.3,  max:0.45, nota:"prédios urbanos; cada município fixa a sua dentro deste intervalo"},
  capitais:{min:0,    max:28,   nota:"taxa liberatória do art.º 71.º do CIRS"},
  ssTrabalhador:{min:0, max:34.75, nota:"11% no trabalho dependente, 21,4% nos independentes"},

/* ---------------------------------------------------------------
   Tabelas oficiais de retenção na fonte de IRS

   Fonte: Tabelas_RF_Continente_2026.xlsx — tabelas de retenção na
   fonte para o CONTINENTE, entre 1 de janeiro e 31 de dezembro de 2026.

   Estrutura de cada escalão:

   média dos primeiros seis dos últimos oito meses de remunerações,
   sem subsídios de férias e de Natal, dividida por 180 — ou seja,
   um valor diário.

   Fonte: guias práticos da Segurança Social e portal gov.pt.
   --------------------------------------------------------------- */

    {k:"alargado",       lbl:"Alargado, 3 meses",                        dias:90,  pct:30,  alargado:true},

  ],
  /* Risco clínico durante a gravidez: 100% da remuneração de referência,
     por todo o período de afastamento prescrito. */
  riscoPct: 100,
  /* Parto múltiplo: cada bebé além do primeiro acrescenta 30 dias à licença. */
  diasPorBebeExtra: 30,
  /* Prematuridade (até 33 semanas) e internamento: a licença é acrescida de
     todo o período de internamento e de mais 30 dias após a alta, a 100%. */
  diasAposAltaInternamento: 30,
};
const modalidadeParental = (k) =>
  PARENTALIDADE.modalidades.find(m => m.k === k) || PARENTALIDADE.modalidades[0];

/* ---------------------------------------------------------------
   Abono de família para crianças e jovens — 2026

   O escalão sai do rendimento de referência do agregado, que é o
   rendimento anual a dividir pelo número de titulares com direito
   mais um. O valor depende ainda da idade da criança.
   --------------------------------------------------------------- */
const ABONO_FAMILIA = {
  escaloes: [
    {n:1, ate:3759.91,       ate36:190.98, ate72:75.13, mais72:75.13},
    {n:2, ate:7519.82,       ate36:161.65, ate72:75.13, mais72:75.13},
    {n:3, ate:12783.69,      ate36:132.07, ate72:59.33, mais72:54.35},
    {n:4, ate:18799.55,      ate36:88.43,  ate72:44.77, mais72:0},
    {n:5, ate:Infinity,      ate36:0,      ate72:0,     mais72:0},
  ],
  majoracaoMonoparental: 50,          // % de acréscimo, famílias monoparentais
  majoracaoPrenatalMonoparental: 35,  // % de acréscimo no abono pré-natal
  /* Acréscimo mensal por criança com menos de 36 meses, quando o agregado
     tem duas ou mais nessa condição. Índices por escalão (1.º a 5.º). */
  menos36: {
    duas:     [64.96,  57.64, 54.35, 39.28, 0],
    maisDuas: [106.96, 92.32, 85.76, 55.70, 0],
  },
  /* Bonificação por deficiência: acréscimo mensal por faixa etária (anos). */
  deficiencia: [
    {ateAnos:14, valor:74.19},
    {ateAnos:18, valor:108.06},
    {ateAnos:24, valor:144.63},
  ],
};

/** Escalão do abono a partir do rendimento de referência anual. */
const escalaoAbono = (rendimentoReferencia) =>
  ABONO_FAMILIA.escaloes.find(e => parseNum(rendimentoReferencia) <= e.ate) ||
  ABONO_FAMILIA.escaloes[ABONO_FAMILIA.escaloes.length - 1];

/**
 * Acréscimo mensal por criança com menos de 36 meses, quando o agregado tem
 * duas ou mais. Só há majoração a partir da segunda; abaixo disso, zero.
 */
function acrescimoMenos36(numCriancasMenos36, escalaoN){
  const n = Math.round(parseNum(numCriancasMenos36));
  if (n < 2 || escalaoN >= 5) return 0;
  const tabela = n === 2 ? ABONO_FAMILIA.menos36.duas : ABONO_FAMILIA.menos36.maisDuas;
  return tabela[escalaoN - 1] || 0;
}

/** Bonificação por deficiência, pela idade em meses. */
function bonificacaoDeficiencia(idadeMeses, monoparental){
  const anos = parseNum(idadeMeses) / 12;
  const faixa = ABONO_FAMILIA.deficiencia.find(d => anos <= d.ateAnos);
  if (!faixa) return 0;
  const mono = monoparental ? 1 + ABONO_FAMILIA.majoracaoMonoparental/100 : 1;
  return faixa.valor * mono;
}

/* Situações familiares que determinam qual das tabelas se aplica. */
const ESTADOS_CIVIS = {
  nao_casado: {lbl:"Não casado"},
  casado_2:   {lbl:"Casado, dois titulares"},
  casado_1:   {lbl:"Casado, único titular"},
};

/** Região fiscal em vigor; o Continente é o recurso se nada estiver definido. */
const regiaoRF = () =>
  TABELAS_RF.regioes[S.fiscal && S.fiscal.regiao] ? S.fiscal.regiao : "continente";
/** Uma tabela concreta, na região em vigor. */
const tabRF = (chave, regiao) => {
  const r = TABELAS_RF.regioes[regiao || regiaoRF()];
  return r ? r.t[chave] : null;
};

/**
 * Escolhe a tabela de retenção aplicável.
 * `cat` é "A" (trabalho dependente) ou "H" (pensões).
 * As tabelas de pensões não têm parcela por dependente — a coluna que
 * existe nas tabelas X e XI é a de deficiente das Forças Armadas.
 * A escolha da tabela é igual nas três regiões: o que muda são os números.
 */
function tabelaRF(cat, estadoCivil, dependentes, deficiencia){
  const dep = Math.max(0, Math.round(parseNum(dependentes)));
  const ec = ESTADOS_CIVIS[estadoCivil] ? estadoCivil : "nao_casado";
  if (cat === "H"){
    if (deficiencia) return ec === "casado_1" ? "XI" : "X";
    return ec === "casado_1" ? "IX" : "VIII";
  }
  if (deficiencia){
    if (ec === "casado_1") return "VII";
    if (ec === "casado_2") return dep > 0 ? "VI" : "IV";
    return dep > 0 ? "V" : "IV";
  }
  if (ec === "casado_1") return "III";
  if (ec === "casado_2") return "I";
  return dep > 0 ? "II" : "I";
}

/** Escalão aplicável a uma remuneração, dentro de uma tabela. */
function escalaoRF(tab, remuneracao){
  const R = Math.max(0, parseNum(remuneracao));
  const e = tab.e;
  for (let k = 0; k < e.length; k++){
    if (!e[k].sup && R <= e[k].a) return e[k];
  }
  return e[e.length - 1];   // o «superior a»
}

/**
 * Retenção sobre um pagamento, pela tabela oficial.
 *   retenção = R × taxa − parcela a abater − (parcela por dependente × nº)
 * A parcela a abater é fixa na maioria dos escalões e, nos primeiros,
 * dada por coef × fator × (limiar − R).
 * Nunca devolve negativo: a retenção é zero, não um crédito.
 */
function retencaoRF(remuneracao, chaveTabela, dependentes, regiao){
  const tab = tabRF(chaveTabela, regiao);
  const R = Math.max(0, parseNum(remuneracao));
  if (!tab || R <= 0) return 0;
  const esc = escalaoRF(tab, R);
  const parcela = Array.isArray(esc.p)
    ? esc.p[0] * esc.p[1] * (esc.p[2] - R)
    : parseNum(esc.p);
  const porDep = (tab.dep === "dep" ? parseNum(esc.d) : 0) * Math.max(0, Math.round(parseNum(dependentes)));
  return Math.max(0, R * parseNum(esc.t) - parcela - porDep);
}
/** Taxa efetiva de retenção sobre um pagamento (%). */
const taxaRF = (remuneracao, chaveTabela, dependentes, regiao) => {
  const R = Math.max(0, parseNum(remuneracao));
  return R > 0 ? retencaoRF(R, chaveTabela, dependentes, regiao) / R * 100 : 0;
};

/** Dia do mês entre 1 e 31, ou "" quando não é dia nenhum. */
function diaDoMesValido(v){
  const n = Math.round(parseNum(v));
  return (n >= 1 && n <= 31) ? n : "";
}
/** O dia de uma rubrica ajustado ao mês: o dia 31 em fevereiro é o dia 28. */
function diaNoMes(dia, mes){
  const d = diaDoMesValido(dia);
  if (!d) return 0;
  const [a, m] = mes.split("-").map(Number);
  return Math.min(d, new Date(a, m, 0).getDate());
}
