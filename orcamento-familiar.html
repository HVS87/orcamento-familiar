/** Vizinho de uma chave numa lista ordenada, na direção pedida. */
function _vizinho(lista, id, d){
  const i = lista.indexOf(id);
  const j = i + d;
  return (i >= 0 && j >= 0 && j < lista.length) ? lista[j] : null;
}

/** Reordena os cartões do painel, arrastando um para o lugar de outro. */
function reordenarPainel(chaveArrastada, chaveAlvo){
  if (!CARTOES_PAINEL[chaveArrastada] || !CARTOES_PAINEL[chaveAlvo]) return false;
  if (chaveArrastada === chaveAlvo) return false;
  const visiveis = cartoesPainel();
  const atual = visiveis.concat(Object.keys(CARTOES_PAINEL).filter(k => visiveis.indexOf(k) < 0));
  const de = atual.indexOf(chaveArrastada), para = atual.indexOf(chaveAlvo);
  if (de < 0 || para < 0) return false;
  atual.splice(para, 0, atual.splice(de, 1)[0]);
  S.painel.ordem = atual;
  return true;
}

function reordenarCategoria(idArrastada, idAlvo){
  const de = S.categorias.findIndex(c => c.id === idArrastada);
  const para = S.categorias.findIndex(c => c.id === idAlvo);
  if (de < 0 || para < 0 || de === para) return false;
  const [c] = S.categorias.splice(de, 1);
  S.categorias.splice(para, 0, c);
  return true;
}
function reordenarRubrica(idArrastada, idAlvo){
  // A ordem manual fica gravada em cada rubrica; a partir da primeira
  // arrumação, a lista respeita-a (antes disso, ordena por valor).
  const doTipo = S.recorrentes.filter(r => r.tipo === "despesa");
  const atual = doTipo.slice().sort((a,b) =>
    (a.ordem != null && b.ordem != null) ? a.ordem - b.ordem : recMensal(b) - recMensal(a));
  const de = atual.findIndex(r => r.id === idArrastada);
  const para = atual.findIndex(r => r.id === idAlvo);
  if (de < 0 || para < 0 || de === para) return false;
  const [r] = atual.splice(de, 1);
  atual.splice(para, 0, r);
  atual.forEach((x, i) => { x.ordem = i; });
  return true;
}

/* ---------------------------------------------------------------
   Edição em linha — clique duplo numa célula e escreve-se ali.
   Enter grava, Escape desiste, sair do campo grava.
   --------------------------------------------------------------- */
function editarCelula(td){
  if (td.querySelector("input, select")) return;
  const campo = td.dataset.edit, id = td.dataset.id;
  const m = S.movimentos.find(x => x.id === id);
  if (!m) return;

  const original = td.innerHTML;
  let ed;
  if (campo === "categoriaId"){
    td.innerHTML = selectCategorias("edCel", m.categoriaId, m.tipo === "rendimento" ? "rendimento" : "despesa");
    ed = td.querySelector("select");
  } else {
    const val = campo === "valor" ? fmtNum.format(Math.abs(parseNum(m.valor))) : (m[campo] || "");
    td.innerHTML = '<input id="edCel" value="'+esc(val)+'"'+
      (campo === "valor" ? ' inputmode="decimal" style="text-align:right"' : "")+'>';
    ed = td.querySelector("input");
  }
  ed.focus();
  if (ed.select) ed.select();

  let terminado = false;
  const desistir = () => { if (terminado) return; terminado = true; td.innerHTML = original; };
  const gravar = () => {
    if (terminado) return;
    terminado = true;
    const bruto = ed.value;
    if (campo === "valor"){
      const v = Math.abs(parseNum(bruto));
      if (!(v > 0)){ td.innerHTML = original; toast("Valor inválido — nada mudou."); return; }
      alterar(() => { m.valor = v; });
    } else if (campo === "categoriaId"){
      alterar(() => { m.categoriaId = bruto; });
    } else {
      alterar(() => { m[campo] = bruto.trim(); });
    }
  };
  ed.addEventListener("keydown", (e) => {
    if (e.key === "Enter"){ e.preventDefault(); gravar(); }
    else if (e.key === "Escape"){ e.preventDefault(); desistir(); }
  });
  ed.addEventListener("blur", gravar);
  if (campo === "categoriaId") ed.addEventListener("change", gravar);
}

document.addEventListener("dblclick", (e) => {
  const td = e.target.closest && e.target.closest("td[data-edit]");
  if (td) editarCelula(td);
});

/* ---------------------------------------------------------------
   Arrastar sobre a evolução para ampliar um período.
   As coordenadas vêm em unidades do viewBox, não em pixels do ecrã:
   o SVG é responsivo, e converter à mão pelo rácio evita depender do
   tamanho a que o gráfico calhou ser desenhado.
   --------------------------------------------------------------- */
let _brush = null;
function _brushX(svg, ev){
  const r = svg.getBoundingClientRect();
  const vb = svg.viewBox.baseVal;
  return vb.x + (ev.clientX - r.left) / r.width * vb.width;
}
document.addEventListener("pointerdown", (e) => {
  const area = e.target.closest && e.target.closest("[data-brush]");
  if (!area) return;
  const svg = area.ownerSVGElement;
  _brush = {svg, area, x0: _brushX(svg, e)};
  area.setPointerCapture && area.setPointerCapture(e.pointerId);
});
document.addEventListener("pointermove", (e) => {
  if (!_brush) return;
  const x = _brushX(_brush.svg, e);
  const sel = _brush.svg.querySelector("#brushSel");
  if (!sel) return;
  sel.setAttribute("x", Math.min(_brush.x0, x).toFixed(1));
  sel.setAttribute("width", Math.abs(x - _brush.x0).toFixed(1));
});
document.addEventListener("pointerup", (e) => {
  if (!_brush) return;
  const {svg, area, x0} = _brush;
  _brush = null;
  const sel = svg.querySelector("#brushSel");
  if (sel){ sel.setAttribute("width", "0"); }
  const x1 = _brushX(svg, e);
  const padL = parseFloat(area.dataset.l), largura = parseFloat(area.dataset.w);
  const n = parseInt(area.dataset.n, 10);
  if (!n || Math.abs(x1 - x0) < largura / n * 0.8) return;   // clique, não arrasto

  // Índices dos meses tocados, contando da esquerda
  const idx = (x) => Math.max(0, Math.min(n - 1, Math.floor((x - padL) / largura * n)));
  const de = Math.min(idx(x0), idx(x1)), ate = Math.max(idx(x0), idx(x1));
  const quantos = ate - de + 1;
  if (quantos < 2 || quantos >= n) return;

  // A janela mostrada termina no mês em análise: recuar até ao fim da seleção
  const recuar = (n - 1) - ate;
  ui.evolucaoMeses = quantos;
  MES = mesShift(MES, -recuar);
  render();
  toast("Ampliado: "+quantos+" meses até "+mesLabel(MES, true)+".");
});

/* Navegação das tabelas de movimentos pelo teclado: setas percorrem,
   Enter edita a descrição, Espaço seleciona, Delete elimina. */
document.addEventListener("keydown", (e) => {
  const tr = e.target.closest && e.target.closest("tr[data-mov]");
  if (!tr) return;
  const linhas = $$("tr[data-mov]");
  const i = linhas.indexOf(tr);
  if (e.key === "ArrowDown" && i < linhas.length - 1){ e.preventDefault(); linhas[i+1].focus(); }
  else if (e.key === "ArrowUp" && i > 0){ e.preventDefault(); linhas[i-1].focus(); }
  else if (e.key === "Enter"){
    const td = tr.querySelector('td[data-edit="descricao"]');
    if (td){ e.preventDefault(); editarCelula(td); }
  }
  else if (e.key === " "){
    const chk = tr.querySelector('input[data-act="movSel"]');
    if (chk){ e.preventDefault(); chk.checked = !chk.checked; ACOES.movSel(chk); }
  }
  else if (e.key === "Delete"){
    const btn = tr.querySelector('[data-act="movApagar"]');
    if (btn){ e.preventDefault(); btn.click(); }
  }
});

let _drag = null;
document.addEventListener("dragstart", (e) => {
  const tr = e.target.closest && e.target.closest("tr[data-drag]");
  if (!tr) return;
  _drag = {tipo: tr.dataset.drag, id: tr.dataset.id};
  tr.classList.add("arrastando");
  if (e.dataTransfer){ e.dataTransfer.effectAllowed = "move"; e.dataTransfer.setData("text/plain", tr.dataset.id); }
});
document.addEventListener("dragover", (e) => {
  const tr = e.target.closest && e.target.closest("tr[data-drag]");
  if (!tr || !_drag || tr.dataset.drag !== _drag.tipo) return;
  e.preventDefault();
  $$("tr.alvo-drop").forEach(x => x.classList.remove("alvo-drop"));
  if (tr.dataset.id !== _drag.id) tr.classList.add("alvo-drop");
});
document.addEventListener("drop", (e) => {
  const tr = e.target.closest && e.target.closest("tr[data-drag]");
  if (!tr || !_drag || tr.dataset.drag !== _drag.tipo) return;
  e.preventDefault();
  const {tipo, id} = _drag;
  const alvo = tr.dataset.id;
  _drag = null;
  // A reordenação corre *dentro* do `alterar`: mutar antes deixaria o
  // histórico a comparar o estado já mudado consigo próprio, e o arrasto
  // não seria desfazível.
  let mudou = false;
  alterar(() => {
    mudou = tipo === "cat"    ? reordenarCategoria(id, alvo)
          : tipo === "painel" ? reordenarPainel(id, alvo)
                              : reordenarRubrica(id, alvo);
  }, "ordem");
  if (mudou) toast("Ordem atualizada.");
});
document.addEventListener("dragend", () => {
  _drag = null;
  $$("tr.arrastando, tr.alvo-drop").forEach(x => x.classList.remove("arrastando", "alvo-drop"));
});

     melhor do que deixar o exemplo instalado à espera de ser confundido com
     dados a sério — e é a altura certa, que é quando se acabou de ver. */
  if (concluido && S.exemploDemo){ despedidaDaVisita(); return; }
  toast(concluido ? "Visita concluída — bom orçamento! 🎉"
                  : "Visita terminada. Pode retomá-la no botão 🎓.");
}

/**
 * Fim da visita, com o exemplo ainda por tocar: apagar ou continuar a
 * explorar. Em qualquer dos casos fica explicado — e apontado — o caminho
 * para começar um orçamento novo de raiz.
 */
function despedidaDaVisita(){
  const host = $("#modalHost");
  const n = S.membros.length;
  // «Ana e Bruno», «Ana, Bruno e Carla» — e não «Ana e Bruno e Carla».
  const ns = S.membros.map(m => m.nome);
  const nomes = ns.length > 1
    ? ns.slice(0, -1).join(", ") + " e " + ns[ns.length - 1]
    : (ns[0] || "A família");
  host.innerHTML =
    '<div class="overlay"><div class="dialog" role="dialog" aria-modal="true" '+
      'aria-label="Fim da visita guiada">'+
      '<h3>Visita concluída 🎉 — e a família de exemplo?</h3>'+
      '<p>'+esc(nomes)+', e os números todos que acabou de ver, foram '+
        '<strong>gerados para a apresentação</strong>: '+n+' membros, vencimentos, '+
        'creche, crédito à habitação, um PPR e meses de movimentos inventados, '+
        'para haver com que mexer. Não é nada seu — e vive só neste navegador.</p>'+
      '<div class="note" style="margin:4px 0 12px">'+
        '<strong>Para começar o seu, em qualquer altura:</strong>'+
        '<ol style="margin:7px 0 0 18px;padding:0;line-height:1.65">'+
          '<li><strong>Dados ▾</strong>, no cabeçalho → <strong>Apagar tudo</strong></li>'+
          '<li>Volta o ecrã de boas-vindas com os <strong>pontos de partida</strong> — '+
            'sozinho/a, casal, com filhos… e casa própria ou arrendada</li>'+
          '<li><strong>Começar assim</strong> semeia membros, despesas fixas típicas '+
            'e limites, já com valores para ajustar</li>'+
        '</ol></div>'+
      '<div class="actions">'+
        '<button class="btn ghost" data-dlg="ficar">Continuar a explorar</button>'+
        '<button class="btn primary" data-dlg="apagar">Apagar e começar o meu</button>'+
      '</div>'+
    '</div></div>';
  const fechar = () => { host.innerHTML = ""; };
  host.querySelector('[data-dlg="apagar"]').onclick = () => { fechar(); ACOES.demoApagar(); };
  host.querySelector('[data-dlg="ficar"]').onclick  = () => { fechar(); ACOES.demoFicar(); };
  // Fechar pelo lado de fora é «continuar a explorar»: apagar exige dizê-lo.
  host.querySelector(".overlay").onclick = (e) => {
    if (e.target === e.currentTarget){ fechar(); ACOES.demoFicar(); }
  };
  host.querySelector('[data-dlg="ficar"]').focus();
}

/**
 * Aponta para um comando durante uns segundos — o «é ali» que uma frase
 * sozinha não dá. Não bloqueia o que aponta: quem quiser, carrega já.
 */
let _apontaT = null;
function apontarPara(sel){
  clearTimeout(_apontaT);
  $$(".aponta").forEach(e => e.classList.remove("aponta"));
  const el = typeof sel === "string" ? $(sel) : sel;
  if (!el) return false;
  el.classList.add("aponta");
  el.scrollIntoView({block:"center", behavior:"instant"});
  _apontaT = setTimeout(() => el.classList.remove("aponta"), 3600);
  return true;
}

/** Deslizadores do simulador de um ativo: o alvo depende do ativo em ecrã. */
function sliderAtivo(campo){
  return {
    set(v){
      const host = $("#simAtivoOut");
      const a = host ? S.ativos.find(x => x.id === host.dataset.ativo) : null;
      if (!a) return;
      const p = Object.assign({}, paramsSimulador(a));
      p.id = a.id; p[campo] = v;
      ui.simAtivo = p;
    },
    alvo: "#simAtivoOut",
    out(){
      const host = $("#simAtivoOut");
      const a = host ? S.ativos.find(x => x.id === host.dataset.ativo) : null;
      return a ? simuladorAtivoOut(a) : "";
    },
  };
}

document.addEventListener("input", (e) => {
  const t = e.target;

  /* Deslizadores dos eventos de vida: o cenário inteiro recalcula-se, mas
     só o bloco do resultado é repintado — a lista de eventos e os próprios
     deslizadores ficam onde estão, para o arrasto não ser interrompido. */
  if (t.dataset && t.dataset.ese != null && t.dataset.p){
    const i = parseInt(t.dataset.ese, 10);
    const ev = ((ui.cenarioVida || {}).eventos || [])[i];
    if (!ev) return;
    if (!ev.params) ev.params = paramsEvento(ev.tipo);
    const v = parseNum(t.value);
    ev.params[t.dataset.p] = v;
    const suf = t.dataset.sufixo || "";
    const leitura = suf === "%" ? pct(v) : suf === " meses" ? v + " meses" : eur(v);
    t.setAttribute("aria-valuetext", leitura);
    const out = $("#ese"+i+"_"+t.dataset.p+"Out");
    if (out) out.textContent = leitura;
    const alvo = $("#eseOut");
    if (alvo) alvo.innerHTML = emPasse(eseResultado);
    return;
  }

  /* Deslizadores do plano de corte: repintar a vista a cada pixel de arrasto
     seria desperdício, e num arrasto de 60 eventos por segundo nota-se. Só
     mudam os três números que dependem deste deslizador. */
  if (t.dataset && t.dataset.corte){
    const id = t.dataset.corte;
    const gasto = parseNum(t.dataset.gasto);
    const corte = parseNum(t.value);
    if (!ui.corteAjustes) ui.corteAjustes = {};
    ui.corteAjustes[id] = corte;
    t.setAttribute("aria-valuetext", eur(corte));
    const lbl = $("#corteVal-"+id), fica = $("#corteFica-"+id);
    if (lbl) lbl.textContent = eur(corte);
    if (fica) fica.textContent = eur(gasto - corte);
    const tot = $("#corteTotal");
    if (tot){
      let soma = 0;
      $$("[data-corte]").forEach(s => { soma += parseNum(s.value); });
      const meta = parseNum(tot.dataset.meta);
      tot.innerHTML = '<span class="'+(soma >= meta - 0.5 ? "pos" : "neg")+'">'+esc(eur(soma))+'</span>';
    }
    return;
  }

  if (t.dataset && t.dataset.slider){
    const cfg = SLIDERS[t.dataset.slider];
    if (!cfg) return;
    // Nos deslizadores com escala o comando dá a posição, não os euros.
    const tramos = t.dataset.escala ? ESCALAS[t.dataset.escala] : null;
    const v = tramos ? escalaValor(tramos, t.value) : parseFloat(t.value);
    cfg.set(v);
    const leitura = fmtSlider(v, t.dataset.sufixo);
    if (tramos) t.setAttribute("aria-valuetext", leitura);
    const out = $("#"+t.dataset.slider+"Out");
    if (out) out.textContent = leitura;
    const alvo = $(cfg.alvo);
    if (alvo) alvo.innerHTML = emPasse(cfg.out);
    if (cfg.persiste) guardarAdiado();
    return;
  }

  if (t.id === "fTexto"){
    filtros.texto = t.value;
    const pos = t.selectionStart;
    render();
    const n = $("#fTexto");
    if (n){ n.focus(); n.setSelectionRange(pos, pos); }
  }
  // O valor da compra recalcula a cada tecla; repintar mata o campo, por
  // isso devolve-se-lhe o foco e o cursor onde estavam.
  else if (t.id === "cpValorCompra"){
    ui.compraValor = parseNum(t.value);
    const texto = t.value, pos = t.selectionStart;
    render();
    const n = $("#cpValorCompra");
    if (n){ n.value = texto; n.focus(); n.setSelectionRange(pos, pos); }
  }
});

/* Ordenação de tabelas: clique alterna crescente/decrescente. */
function alternarOrdem(tabela, col){
  const o = ordem[tabela];
  ordem[tabela] = (o && o.col === col) ? {col, dir: -o.dir} : {col, dir: 1};
  render();
}
document.addEventListener("click", (e) => {
  const h = e.target.closest("th[data-sort]");
  if (h){ alternarOrdem(h.dataset.sort, h.dataset.col); return; }

  // Foco numa fatia do gráfico circular (clique alterna)
  const f = e.target.closest("[data-foco]");
  if (f){
    const host = f.hasAttribute("data-donut") ? f : f.closest("[data-donut]");
    const id = host ? host.getAttribute("data-donut") : null;
    if (id){
      const nome = f.getAttribute("data-foco");
      ui.donutFoco = (ui.donutFoco && ui.donutFoco.id === id && ui.donutFoco.nome === nome)
        ? null : {id, nome};
      render();
    }
  }
});
document.addEventListener("keydown", (e) => {
  const h = e.target.closest && e.target.closest("th[data-sort]");
  if (h && (e.key === "Enter" || e.key === " ")){
    e.preventDefault();
    alternarOrdem(h.dataset.sort, h.dataset.col);
  }
});

/** Ajuda de um KPI, pelo rótulo. Tenta exato e depois por prefixo. */
function ajudaKpi(rotulo){
  const r = String(rotulo || "").trim();
  if (AJUDAS_KPI[r]) return AJUDAS_KPI[r];
  for (const [pre, a] of AJUDAS_KPI_PREFIXO){
    if (r.indexOf(pre) === 0) return a;
  }
  return null;
}

/**
 * Ajuda aplicável a um elemento, subindo na árvore.
 * A ordem importa: o mais específico primeiro.
 */
function ajudaDe(el){
  if (!el || !el.closest) return null;

  const exp = el.closest("[data-ajuda]");
  if (exp) return exp.getAttribute("data-ajuda").split("§");

  // Nas etiquetas e nos `output`, a ajuda pertence ao campo a que se referem.
  const campo = el.closest("input,select,textarea,label.field,output,.ctrl");
  if (campo){
    const ids = [campo.getAttribute("for"), campo.id];
    if (campo.classList && campo.classList.contains("ctrl")){
      const dentro = campo.querySelector("[data-slider]");
      if (dentro) ids.push(dentro.id);
    }
    for (const id of ids) if (id && AJUDAS_CAMPO[id]) return AJUDAS_CAMPO[id];
  }

  const cab = el.closest("th[data-sort]");
  if (cab){
    const k = cab.dataset.sort + "." + cab.dataset.col;
    if (AJUDAS_COL[k]) return AJUDAS_COL[k];
  }

  const cartao = el.closest(".kpi");
  if (cartao){
    const lbl = cartao.querySelector(".lbl");
    const a = ajudaKpi(lbl ? lbl.textContent : "");
    if (a) return a;
  }

  const sep = el.closest("nav.tabs button[data-view]");
  if (sep && AJUDAS_VISTA[sep.dataset.view]) return AJUDAS_VISTA[sep.dataset.view];

  const acao = el.closest("[data-act]");
  if (acao && AJUDAS_ACAO[acao.dataset.act]) return AJUDAS_ACAO[acao.dataset.act];

  return null;
}

/** Elementos que podem ter ajuda — restringe a varredura ao que interessa. */
const SEL_AJUDAVEL = ".kpi, th[data-sort], nav.tabs button[data-view], label.field, .ctrl, [data-act], [data-ajuda]";

/**
 * Assinala visualmente o que tem explicação (cursor de ajuda) e remove o
 * `title` nativo desses elementos, para não haver duas dicas sobrepostas.
 */
function marcarAjudas(){
  if (S.ajudas === false) return;
  $$(SEL_AJUDAVEL).forEach(el => {
    if (!ajudaDe(el)) return;
    el.classList.add("temAjuda");
    if (el.hasAttribute("title")) el.removeAttribute("title");
  });
  // Os campos são marcados pelo id, porque a ajuda está associada ao input.
  // Também aqui se retira o `title` nativo: dois balões sobrepostos são pior
  // do que nenhum, e o explicador diz sempre mais.
  Object.keys(AJUDAS_CAMPO).forEach(id => {
    const n = document.getElementById(id);
    if (n){
      n.classList.add("temAjuda");
      if (n.hasAttribute("title")) n.removeAttribute("title");
      const lbl = document.querySelector('label[for="'+id+'"]');
      if (lbl){
        lbl.classList.add("temAjuda");
        if (lbl.hasAttribute("title")) lbl.removeAttribute("title");
      }
    }
  });
}

/** Desenha uma explicação em prosa na caixa flutuante. */
function mostrarAjuda(a, ev){
  const t = $("#tip");
  t.innerHTML = '<div class="tt">'+esc(a[0])+'</div>'+
    '<div class="txt">'+esc(a[1])+'</div>'+
    (a[2] ? '<div class="calc"><span>Cálculo</span> '+esc(a[2])+'</div>' : "");
  t.classList.add("show", "prosa");
  posicionarTip(ev);
}

/* Sugestão flutuante dos gráficos */
function posicionarTip(ev){
  const t = $("#tip");
  const r = t.getBoundingClientRect();
  let x = ev.clientX + 14, y = ev.clientY + 14;
  if (x + r.width > window.innerWidth - 8) x = ev.clientX - r.width - 14;
  if (y + r.height > window.innerHeight - 8) y = ev.clientY - r.height - 14;
  t.style.left = Math.max(8, x) + "px";
  t.style.top = Math.max(8, y) + "px";
}
document.addEventListener("pointermove", (e) => {
  const t = $("#tip");

  // Os valores dos gráficos têm prioridade: são mais específicos que a prosa.
  const el = e.target.closest ? e.target.closest("[data-tip]") : null;
  if (el){
    const dados = (el.getAttribute("data-tip") || "").split("§");
    t.innerHTML = '<div class="tt">'+esc(dados[0])+'</div>'+
      dados.slice(1).map(p => {
        const i = p.indexOf("=");
        return '<div class="tr"><span>'+esc(i < 0 ? p : p.slice(0,i))+'</span>'+
               '<span>'+esc(i < 0 ? "" : p.slice(i+1))+'</span></div>';
      }).join("");
    t.classList.add("show");
    t.classList.remove("prosa");
    posicionarTip(e);
    return;
  }

  if (S.ajudas !== false){
    const a = ajudaDe(e.target);
    if (a){ mostrarAjuda(a, e); return; }
  }
  t.classList.remove("show");
});
document.addEventListener("pointerleave", () => $("#tip").classList.remove("show"));
window.addEventListener("scroll", () => $("#tip").classList.remove("show"), {passive:true});
document.addEventListener("change", (e) => {
  const t = e.target;
  // Um `data-act` num select ou num seletor de cor age ao mudar de valor —
  // o clique não serve, porque escolher numa lista não é carregar num botão.
  if (t.dataset && t.dataset.act && ACOES[t.dataset.act] &&
      (t.tagName === "SELECT" || t.type === "color")){
    ACOES[t.dataset.act](t);
    return;
  }
  if (t.id === "fCat"){ filtros.categoria = t.value; render(); }
  else if (t.id === "fMembro"){ filtros.membro = t.value; render(); }
  else if (t.id === "fTipo"){ filtros.tipo = t.value; render(); }
  else if (t.id === "mvTipo" || t.id === "rcTipo" || t.id === "ctTipo"){
    // Ao mudar o tipo, recarregar as categorias compatíveis.
    const mapa = {mvTipo:"mvCat", rcTipo:"rcCat"};
    const alvo = mapa[t.id];
    if (alvo){
      const sel = $("#"+alvo);
      if (sel){
        const atual = sel.value;
        sel.innerHTML = '<option value="">— escolher —</option>' +
          S.categorias.filter(c => c.tipo === t.value)
            .map(c => '<option value="'+esc(c.id)+'">'+esc(c.nome)+'</option>').join("");
        sel.value = atual;
      }
    }
    if (t.id === "ctTipo"){
      const g = $("#ctGrupo");
      if (g) g.disabled = (t.value === "rendimento");
    }
  }
  // Ao mudar de classe/tipo, mostrar os valores típicos como sugestão
  else if (t.id === "ivClasse"){
    const cl = classeDe(t.value);
    const r = $("#ivRetorno"), q = $("#ivQueda");
    if (r) r.placeholder = String(cl.ret).replace(".",",") + " (classe)";
    if (q) q.placeholder = String(cl.queda).replace(".",",") + " (classe)";
  }
  /* Mudar a classe do ativo muda os campos aplicáveis (VPT, IUC, cotação…):
     repinta o formulário preservando o que já lá estava escrito. */
  else if (t.id === "ptTipo"){
    rascunhoAtivo = Object.assign(capturarAtivo(), {classe: t.value});
    render();
    rascunhoAtivo = null;
    const el = $("#ptTipo"); if (el) el.focus();
  }
  /* Estratégias: instrumento e opção «jovem» mudam só o resultado. Mudar o
     instrumento para/de PPR faz aparecer o controlo de idade, logo repinta. */
  else if (t.id === "estInstrumento"){
    const antes = S.estrategia.instrumento;
    S.estrategia.instrumento = t.value;
    guardarAdiado();
    if (antes === "ppr" || t.value === "ppr"){ render(); return; }
    const alvo = $("#estOut"); if (alvo) alvo.innerHTML = emPasse(estrategiaOut);
  }
  else if (t.id === "cpPrestCompra"){ ui.compraPrest = parseInt(t.value, 10); render(); }
  else if (t.id === "ordMov"){
    ordem.mov = {col: t.value, dir: (ordem.mov && ordem.mov.col === t.value) ? ordem.mov.dir : -1};
    render();
  }
  else if (t.id === "cmpA"){ ui.compararA = t.value; render(); }
  else if (t.id === "cmpB"){ ui.compararB = t.value; render(); }
  else if (t.id === "estJovem"){
    S.estrategia.jovemImt = t.checked;
    guardarAdiado();
    const alvo = $("#estOut"); if (alvo) alvo.innerHTML = emPasse(estrategiaOut);
  }
  /* A espécie muda a incidência sugerida e, nas prestações sociais, faz
     aparecer uma calculadora. Como isso altera a forma do formulário, é
     preciso repintá-lo — preservando o que já lá estava escrito. */
  /* Mudar a espécie ou um parâmetro da calculadora repinta o formulário
     (a forma muda), preservando o que já lá está. `capturarComponente` lê
     tudo o que estiver em ecrã de uma só vez. */
  else if (t.id === "cpEspecie"){
    const esp = especieDe(t.value);
    rascunhoComponente = Object.assign(capturarComponente(),
      {especie: t.value, frequencia: esp.freq, ss: esp.ss, irs: esp.irs});
    render();
    rascunhoComponente = null;
  }
  else if (CAMPOS_CALC_COMPONENTE.indexOf(t.id) >= 0){
    if (!editando.comp) return;
    rascunhoComponente = capturarComponente();
    render();
    rascunhoComponente = null;
  }
  // O regime de taxa muda os campos do formulário: repinta-o preservando o resto.
  else if (t.id === "crTipoTaxa"){
    const rascunho = {
      nome: $("#crNome").value, capital: parseNum($("#crCapital").value),
      prazoMeses: $("#crPrazo").value, inicio: $("#crInicio").value ? $("#crInicio").value+"-01" : "",
      tipoTaxa: t.value, ativoId: $("#crAtivo").value,
      seguroMensal: parseNum($("#crSeguro").value),
      indexante: $("#crIndexante") ? $("#crIndexante").value : "euribor6m",
      indexanteValor: $("#crIndexValor") ? parseNum($("#crIndexValor").value) : "",
      spread: $("#crSpread") ? parseNum($("#crSpread").value) : "",
      revisaoMeses: $("#crRevisao") ? $("#crRevisao").value : "",
      taxaAnual: $("#crTaxa") ? parseNum($("#crTaxa").value) : "",
      categoriaJurosId: $("#crCatJuros").value,
      categoriaCapitalId: $("#crCatCapital").value,
      categoriaSeguroId: $("#crCatSeguro").value,
    };
    rascunhoCredito = rascunho;
    render();
    rascunhoCredito = null;
  }
  else if (t.id === "fxEstadoCivil"){
    alterar(() => { S.fiscal.estadoCivil = t.value; });
  }
  else if (t.id === "fxRegiao"){
    alterar(() => { S.fiscal.regiao = t.value; });
  }
  else if (t.id === "crIndexante"){
    const r = $("#crRevisao");
    if (r) r.placeholder = (INDEXANTES[t.value] || INDEXANTES.euribor6m).revisao + " (indexante)";
  }
});
document.addEventListener("blur", (e) => {
  const t = e.target;
  if (t.classList && t.classList.contains("fiscalIn")){
    const k = t.dataset.k, v = parseNum(t.value);
    if (Math.abs(parseNum(S.fiscal[k]) - v) < 0.0005) return;
    alterar(() => {
      S.fiscal[k] = v;
      // O limite da dedução do PPR não é livre: deriva da idade do titular.
      if (k === "pprIdade") S.fiscal.pprLimiteAno = limitePPR(v);
    });
    return;
  }
  if (t.classList && t.classList.contains("limIn")){
    const id = t.dataset.id, v = parseNum(t.value);
    const antes = parseNum(S.limites[id]);
    if (Math.abs(antes - v) < 0.005) return;
    alterar(() => { if (v > 0) S.limites[id] = v; else delete S.limites[id]; });
  }
}, true);

/* Enter submete o formulário visível */
document.addEventListener("keydown", (e) => {
  if (e.key !== "Enter") return;
  const t = e.target;
  if (!(t.tagName === "INPUT" || t.tagName === "SELECT")) return;
  if (t.classList.contains("limIn")){ t.blur(); return; }
  const form = t.closest(".form");
  if (form){
    const btn = form.querySelector(".btn.primary[data-act]");
    if (btn){ e.preventDefault(); btn.click(); }
  } else if (t.id === "mbNome"){
    e.preventDefault(); ACOES.mbAdd();
  }
});

/* Tema — modo (auto/claro/escuro) e paleta de cor.
   As cores do quadro servem para pintar as amostras em Definições. */
const PALETAS = {
  meianoite: {lbl:"Meia-noite", claro:"#2f5fd0", escuro:"#7aa2ff"},
  oceano:    {lbl:"Oceano",     claro:"#0d7f91", escuro:"#4fc8dc"},
  floresta:  {lbl:"Floresta",   claro:"#2c7d44", escuro:"#6fd08c"},
  poente:    {lbl:"Pôr do sol", claro:"#c05621", escuro:"#ffa268"},
  ameixa:    {lbl:"Ameixa",     claro:"#7a3fc4", escuro:"#b78bff"},
  grafite:   {lbl:"Grafite",    claro:"#44546c", escuro:"#9db0ca"},
  areia:     {lbl:"Areia",      claro:"#8a6134", escuro:"#d9a75f"},
  pastel:    {lbl:"Pastel",     claro:"#c26a96", escuro:"#e8a7c6"},
};
/** O modo efetivamente em vigor, resolvendo o «auto» pela preferência do sistema. */
function modoEfetivo(){
  if (S.tema === "dark" || S.tema === "light") return S.tema;
  return (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light";
}
function aplicarTema(){
  document.documentElement.setAttribute("data-theme", S.tema || "auto");
  const p = PALETAS[S.paleta] ? S.paleta : "meianoite";
  if (p === "meianoite") document.documentElement.removeAttribute("data-paleta");
  else document.documentElement.setAttribute("data-paleta", p);
  if (S.densidade === "compacta") document.documentElement.setAttribute("data-densidade", "compacta");
  else document.documentElement.removeAttribute("data-densidade");
  if (S.texto === "grande" || S.texto === "maior") document.documentElement.setAttribute("data-texto", S.texto);
  else document.documentElement.removeAttribute("data-texto");
  if (S.contraste === "alto") document.documentElement.setAttribute("data-contraste", "alto");
  else document.documentElement.removeAttribute("data-contraste");
  const b = $("#temaBtn");
  b.textContent = S.tema === "dark" ? "☾" : S.tema === "light" ? "☀" : "◐";
  b.title = "Tema: " + (S.tema === "dark" ? "escuro" : S.tema === "light" ? "claro" : "automático");
  /* Instalada, a barra do sistema à volta da janela toma esta cor. Sem isto
     ficava um azul fixo por cima de uma aplicação verde ou bege. */
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta){
    const cor = getComputedStyle(document.documentElement).getPropertyValue("--accent").trim();
    if (cor) meta.setAttribute("content", cor);
  }
  if (typeof aplicarIconeApp === "function") aplicarIconeApp();
}
/* Interruptor dos explicadores */
function aplicarAjudas(){
  const on = S.ajudas !== false;
  const b = $("#ajudaBtn");
  b.setAttribute("aria-pressed", String(on));
  b.style.opacity = on ? "1" : ".5";
  b.title = on ? "Explicadores ligados — clique para desligar"
               : "Explicadores desligados — clique para ligar";
  if (!on){
    $("#tip").classList.remove("show");
    $$(".temAjuda").forEach(el => el.classList.remove("temAjuda"));
  } else {
    marcarAjudas();
  }
}
$("#ajudaBtn").addEventListener("click", () => {
  S.ajudas = S.ajudas === false;
  guardar();
  aplicarAjudas();
  toast(S.ajudas === false ? "Explicadores desligados." : "Explicadores ligados.");
});

$("#temaBtn").addEventListener("click", () => {
  const ordem = ["auto","light","dark"];
  S.tema = ordem[(ordem.indexOf(S.tema || "auto") + 1) % 3];
  guardar(); aplicarTema();
});

/* ---------------------------------------------------------------
   Toque longo no ↶ — a linha do tempo do desfazer

   Premir e segurar abre a lista; um toque normal continua a desfazer um
   passo. O `pointerup` cancela o temporizador, e o clique que se seguiria
   é engolido para não desfazer *também* um passo por cima da lista.
   --------------------------------------------------------------- */
let _longT = null, _longEm = 0;
document.addEventListener("pointerdown", (e) => {
  const b = e.target.closest && e.target.closest('[data-act="desfazer"]');
  if (!b || b.disabled) return;
  _longEm = 0;
  clearTimeout(_longT);
  _longT = setTimeout(() => { _longEm = Date.now(); abrirHistorico(); }, 500);
});
["pointerup","pointercancel","pointerleave"].forEach(ev =>
  document.addEventListener(ev, () => { clearTimeout(_longT); }));
/* O clique que se segue à abertura por toque longo é engolido, para não
   desfazer *também* um passo por cima da lista. Guarda-se o instante e não
   um sinalizador: com um sinalizador, um toque longo cujo clique nunca
   chegasse a acontecer — porque se largou fora do botão, ou porque se
   fechou a lista de outra maneira — deixava a marca ligada, e o clique
   seguinte no ↶ (por teclado, por exemplo) era engolido sem desfazer nada. */
document.addEventListener("click", (e) => {
  const b = e.target.closest && e.target.closest('[data-act="desfazer"]');
  if (b && _longEm && Date.now() - _longEm < 900){
    e.stopPropagation(); e.preventDefault(); _longEm = 0;
  }
}, true);

/* A sessão acompanha o que se vai fazendo, sem estorvar o que se escreve. */
document.addEventListener("input", guardarSessaoAdiado);

window.addEventListener("beforeunload", guardarSessao);
document.addEventListener("visibilitychange", () => { if (document.hidden) guardarSessao(); });

if ("serviceWorker" in navigator && location.protocol.startsWith("http")){
  // Registo opcional: só funciona se existir sw.js junto do ficheiro.
  navigator.serviceWorker.register("./sw.js").then((reg) => {
    if (!reg) return;
    /* A cache serve primeiro e atualiza por trás: quem já tinha a aplicação
       aberta continua com a versão antiga sem dar por isso. Dizer-lho é o
       mínimo — recarregar por conta própria seria pior, que se perderia o
       que estivesse a ser escrito. */
    reg.addEventListener("updatefound", () => {
      const novo = reg.installing;
      if (!novo) return;
      novo.addEventListener("statechange", () => {
        if (novo.state === "installed" && navigator.serviceWorker.controller){
          toastComBotao("Há uma versão nova da aplicação.", (() => {
            const b = document.createElement("button");
            b.type = "button"; b.textContent = "Recarregar";
            b.onclick = () => location.reload();
            return b;
          })());
        }
      });
    });
  }).catch(() => {});
}

   Guardar como aplicação — ouvintes
   --------------------------------------------------------------- */
/* O navegador oferece a instalação quando quer, e a oferta tem de ser
   guardada: perde-se se não for. Guardada, aparece o botão. */
window.addEventListener("beforeinstallprompt", (e) => {
  e.preventDefault();
  _conviteInstalar = e;
  if (VIEW === "config") render();   // o cartão passa a ter botão
});
window.addEventListener("appinstalled", () => {
  _instalada = true;
  _conviteInstalar = null;
  toast("Instalada. Passa a abrir em janela própria, com os mesmos dados.");
  if (VIEW === "config") render();
});

   aberta de disco, nenhum navegador instala, e a pergunta seria ruído. */
