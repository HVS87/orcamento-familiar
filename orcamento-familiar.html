/**
 * Diagrama de fluxo do dinheiro (Sankey a dois andares): do rendimento
 * bruto saem os impostos retidos; do líquido saem os três grupos de
 * despesa e o que sobra. É o gráfico que explica um orçamento num olhar.
 */
function sankeyOrcamento(rend, g, usarReal){
  const fx = fiscalTotal();
  const impostos = Math.max(0, fx.irs + fx.ss);
  const bruto = rend + impostos;
  if (bruto <= 0) return "";

  const nec = Math.max(0, g.necessidades || 0);
  const des = Math.max(0, g.desejos || 0);
  const pou = Math.max(0, g.poupanca || 0);
  const sobra = rend - nec - des - pou;
  const destinos = [
    {lbl:"IRS + Seg. Social", v: impostos, cor:"#5d6a86"},
    {lbl:"Necessidades",      v: nec,      cor:"var(--accent)"},
    {lbl:"Desejos",           v: des,      cor:"var(--warn)"},
    {lbl:"Poupança",          v: pou,      cor:"var(--pos)"},
    sobra >= 0 ? {lbl:"Por atribuir", v: sobra, cor:"#8892a6"}
               : {lbl:"Défice",       v: -sobra, cor:"var(--neg)", defice:true},
  ].filter(d => d.v > 0.005);
  if (!destinos.length) return "";

  const total = destinos.reduce((s,d) => s + d.v, 0);
  const W = 720, H = Math.max(180, 34 * destinos.length + 30), padT = 12, padB = 12;
  const alturaUtil = H - padT - padB, gap = 8;
  const escala = (alturaUtil - gap * (destinos.length - 1)) / total;

  // Barra única à esquerda; à direita, um nó por destino, com fita a ligar.
  const xEsq = 150, xDir = W - 190, larg = 12;
  const altEsq = total * escala;
  const yEsq0 = padT + (alturaUtil - altEsq) / 2;

  let y = padT, yFonte = yEsq0, fitas = "", nos = "", rotulos = "";
  destinos.forEach(d => {
    const h = d.v * escala;
    const y0 = yFonte, y1 = y;
    const xm = (xEsq + larg + xDir) / 2;
    fitas += '<path d="M'+(xEsq+larg)+' '+y0.toFixed(1)+
      ' C'+xm+' '+y0.toFixed(1)+' '+xm+' '+y1.toFixed(1)+' '+xDir+' '+y1.toFixed(1)+
      ' L'+xDir+' '+(y1+h).toFixed(1)+
      ' C'+xm+' '+(y1+h).toFixed(1)+' '+xm+' '+(y0+h).toFixed(1)+' '+(xEsq+larg)+' '+(y0+h).toFixed(1)+
      ' Z" fill="'+d.cor+'" opacity=".42"'+
      tipData(d.lbl, [["Valor", eur(d.v)], ["Peso do bruto", pct(d.v / bruto * 100)]])+
      ' class="hit"/>';
    nos += '<rect x="'+xDir+'" y="'+y1.toFixed(1)+'" width="'+larg+'" height="'+Math.max(2,h).toFixed(1)+
      '" rx="2.5" fill="'+d.cor+'"/>';
    rotulos += '<text x="'+(xDir+larg+8)+'" y="'+(y1 + h/2 + 4).toFixed(1)+'" font-size="12" fill="currentColor">'+
      esc(d.lbl)+'</text>'+
      '<text x="'+(xDir+larg+8)+'" y="'+(y1 + h/2 + 17).toFixed(1)+'" font-size="10.5" fill="currentColor" opacity=".6" class="num">'+
      esc(eur0(d.v))+(d.defice ? " ⚠" : "")+'</text>';
    yFonte += h; y += h + gap;
  });

  const svg = '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Fluxo do dinheiro (Sankey)">'+
    '<rect x="'+xEsq+'" y="'+yEsq0.toFixed(1)+'" width="'+larg+'" height="'+altEsq.toFixed(1)+'" rx="2.5" fill="currentColor" opacity=".75"/>'+
    '<text x="'+(xEsq-8)+'" y="'+(yEsq0 + altEsq/2 - 3).toFixed(1)+'" text-anchor="end" font-size="12.5" font-weight="650" fill="currentColor">Rendimento bruto</text>'+
    '<text x="'+(xEsq-8)+'" y="'+(yEsq0 + altEsq/2 + 12).toFixed(1)+'" text-anchor="end" font-size="11" fill="currentColor" opacity=".65" class="num">'+esc(eur0(bruto))+'</text>'+
    fitas + nos + rotulos + '</svg>';

  return '<div class="card"><div class="card-head"><div class="t"><h2>Para onde vai o dinheiro</h2>'+
    '<div class="sub">Do bruto ao destino, '+(usarReal ? "com os movimentos reais" : "segundo o plano")+' de '+esc(mesLabel(MES))+
    '. Os impostos vêm do módulo de rendimentos; os grupos, da regra 50/30/20.</div></div></div>'+
    '<div class="tblwrap">'+svg+'</div></div>';
}

/**
 * Resumo narrado do mês anterior: a maior despesa, a categoria que mais
 * cresceu e a poupança face à média — gerado localmente a partir dos dados.
 */
function resumoMensal(){
  const mAnt = mesShift(MES, -1);
  const r = realMes(mAnt);
  if (!(r.rend > 0 || r.desp > 0)) return "";

  const movs = S.movimentos.filter(m => (m.data || "").indexOf(mAnt) === 0);
  const maior = movs.filter(m => m.tipo !== "rendimento")
    .sort((a,b) => Math.abs(parseNum(b.valor)) - Math.abs(parseNum(a.valor)))[0];

  // Categoria que mais cresceu face ao mês antes desse
  const m2 = mesShift(MES, -2);
  const r2 = realMes(m2);
  const base2 = (r2.rend > 0 || r2.desp > 0) ? r2 : planoMes(m2);
  let cresceu = null, delta = 0;
  S.categorias.filter(c => c.tipo === "despesa").forEach(c => {
    const d = (r.porCat[c.id] || 0) - (base2.porCat[c.id] || 0);
    if (d > delta){ delta = d; cresceu = c; }
  });

  // Poupança face à média dos três meses anteriores a esse
  let soma = 0, n = 0;
  for (let i = 2; i <= 4; i++){
    const m = mesShift(MES, -i);
    const rr = realMes(m);
    if (rr.rend > 0 || rr.desp > 0){ soma += rr.saldo; n++; }
  }
  const media = n ? soma / n : null;
  const taxa = r.rend > 0 ? r.saldo / r.rend * 100 : 0;

  const frases = [];
  if (maior) frases.push('A maior despesa foi <strong>'+esc(maior.descricao || "—")+'</strong> ('+
    esc(eur(Math.abs(parseNum(maior.valor))))+', '+esc(catRotulo(maior.categoriaId))+').');
  if (cresceu && delta > 1) frases.push('<strong>'+esc((cresceu.icone ? cresceu.icone+" " : "")+cresceu.nome)+
    '</strong> foi a categoria que mais cresceu: +'+esc(eur(delta))+' face a '+esc(mesLabel(m2, true))+'.');
  frases.push((r.saldo >= 0 ? 'Poupou <strong>'+esc(eur(r.saldo))+'</strong>' :
    'Gastou <strong>'+esc(eur(-r.saldo))+'</strong> acima do que entrou')+
    ' ('+esc(pct(taxa))+' do rendimento)'+
    (media != null ? ' — '+(r.saldo >= media ? 'acima' : 'abaixo')+' da média de '+esc(eur(media))+' dos meses anteriores' : "")+'.');

  return '<div class="card"><div class="card-head"><div class="t"><h2>O seu '+esc(mesLabel(mAnt))+'</h2>'+
    '<div class="sub">Resumo do mês fechado, calculado localmente a partir dos movimentos.</div></div></div>'+
    '<ul style="margin:0;padding-left:20px;font-size:14px;line-height:1.9">'+
    frases.map(f => '<li>'+f+'</li>').join("")+'</ul></div>';
}

/**
 * Mapa anual: categorias em linhas, os 12 meses do ano em colunas, a
 * despesa de cada célula em intensidade de cor. A sazonalidade — energia
 * no inverno, férias no verão — é invisível na vista mensal e óbvia aqui.
 */
function mapaAnual(){
  const ano = MES.slice(0, 4);
  const meses = [];
  for (let m = 1; m <= 12; m++) meses.push(ano + "-" + String(m).padStart(2, "0"));

  const dados = meses.map(m => {
    const r = realMes(m);
    return (r.rend > 0 || r.desp > 0) ? r : planoMes(m);
  });

  const cats = S.categorias.filter(c => c.tipo === "despesa")
    .map(c => ({cat: c, vals: dados.map(d => d.porCat[c.id] || 0)}))
    .map(x => Object.assign(x, {total: x.vals.reduce((s,v) => s + v, 0)}))
    .filter(x => x.total > 0)
    .sort((a,b) => b.total - a.total)
    .slice(0, 12);
  if (!cats.length) return "";

  const iniciais = ["J","F","M","A","M","J","J","A","S","O","N","D"];
  const hojeM = isoMes(hoje());
  let html = '<div class="mapa" style="grid-template-columns:118px repeat(12,minmax(0,1fr))">'+
    '<span></span>'+meses.map((m,i) =>
      '<span class="mh"'+(m === hojeM ? ' style="color:var(--accent)"' : '')+'>'+iniciais[i]+'</span>').join("");

  cats.forEach(x => {
    const max = Math.max(...x.vals);
    html += '<span class="mr" title="'+esc(x.cat.nome)+'">'+esc(catRotulo(x.cat.id))+'</span>';
    x.vals.forEach((v, i) => {
      const alfa = max > 0 ? 0.10 + 0.80 * (v / max) : 0;
      html += '<span class="mc'+(v > 0 ? " hit" : "")+'"'+
        (v > 0 ? ' style="background:color-mix(in srgb,'+esc(x.cat.cor)+' '+(alfa*100).toFixed(0)+'%,var(--surface-2))"'+
          tipData(mesLabel(meses[i])+" · "+x.cat.nome, [["Despesa", eur(v)], ["No ano", eur(x.total)]]) : "")+
        '></span>';
    });
  });
  html += '</div>';

  return '<div class="card"><div class="card-head"><div class="t"><h2>Mapa do ano — '+esc(ano)+'</h2>'+
    '<div class="sub">Despesa por categoria, mês a mês. Meses sem movimentos usam o plano. '+
    'Quanto mais forte a cor, maior o gasto dessa categoria nesse mês.</div></div></div>'+
    '<div class="tblwrap">'+html+'</div></div>';
}

/**
 * Projeção de tesouraria a 12 meses: o saldo acumulado mês a mês, já com
 * os encargos anuais e semestrais no mês em que caem. Mostra *quando* o
 * dinheiro aperta, não apenas se aperta.
 */
function tesourariaProjetada(meses){
  const n = meses || 12;
  const serie = [];
  let acumulado = totalLiquidez();
  for (let i = 0; i < n; i++){
    const m = mesShift(MES, i);
    const p = planoMes(m);
    const r = realMes(m);
    const usa = (r.rend > 0 || r.desp > 0) ? r : p;
    acumulado += usa.saldo;
    serie.push({mes: m, saldo: usa.saldo, acumulado});
  }
  return serie;
}

function cartaoTesouraria(){
  if (!S.rendimentos.length && !S.recorrentes.length) return "";
  const serie = tesourariaProjetada(12);
  const minimo = serie.reduce((a,b) => b.acumulado < a.acumulado ? b : a, serie[0]);
  const fim = serie[serie.length-1];

  const W = 720, H = 200, padL = 58, padR = 14, padT = 14, padB = 28;
  const iw = W - padL - padR, ih = H - padT - padB;
  const vals = serie.map(s => s.acumulado).concat([0]);
  const max = Math.max(...vals), min = Math.min(...vals);
  const amp = (max - min) || 1;
  const x = (i) => padL + (i / Math.max(1, serie.length - 1)) * iw;
  const y = (v) => padT + ih - ((v - min) / amp) * ih;

  let grelha = "";
  for (let g = 0; g <= 3; g++){
    const v = min + amp * g / 3, yy = y(v);
    grelha += '<line x1="'+padL+'" y1="'+yy.toFixed(1)+'" x2="'+(W-padR)+'" y2="'+yy.toFixed(1)+
      '" stroke="currentColor" opacity=".12"/>'+
      '<text x="'+(padL-7)+'" y="'+(yy+4).toFixed(1)+'" text-anchor="end" font-size="10" fill="currentColor" opacity=".55">'+
      esc(eur0(v))+'</text>';
  }
  // Linha do zero, quando visível: é a fronteira que interessa
  const linhaZero = (min < 0 && max > 0)
    ? '<line x1="'+padL+'" y1="'+y(0).toFixed(1)+'" x2="'+(W-padR)+'" y2="'+y(0).toFixed(1)+
      '" stroke="var(--neg)" stroke-width="1.5" stroke-dasharray="4 3" opacity=".8"/>' : "";

  const pts = serie.map((s,i) => x(i).toFixed(1)+","+y(s.acumulado).toFixed(1)).join(" ");
  const area = '<polygon fill="var(--accent)" opacity=".14" points="'+
    padL+','+y(Math.max(min,0)).toFixed(1)+' '+pts+' '+(padL+iw).toFixed(1)+','+y(Math.max(min,0)).toFixed(1)+'"/>';
  const linha = '<polyline fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" points="'+pts+'"/>';

  let zonas = "", eixo = "";
  const passo = Math.ceil(serie.length / 8) || 1;
  serie.forEach((s,i) => {
    zonas += '<rect class="hit" x="'+(x(i) - iw/serie.length/2).toFixed(1)+'" y="'+padT+'" width="'+
      (iw/serie.length).toFixed(1)+'" height="'+ih+'"'+
      tipData(mesLabel(s.mes), [["Saldo do mês", eur(s.saldo)], ["Acumulado", eur(s.acumulado)]])+'/>';
    if (i % passo === 0) eixo += '<text x="'+x(i).toFixed(1)+'" y="'+(H-8)+'" text-anchor="middle" font-size="10" fill="currentColor" opacity=".6">'+
      esc(mesLabel(s.mes, true))+'</text>';
  });
  const marcaMin = minimo.acumulado < 0
    ? '<circle cx="'+x(serie.indexOf(minimo)).toFixed(1)+'" cy="'+y(minimo.acumulado).toFixed(1)+'" r="4.5" fill="var(--neg)"/>' : "";

  const aviso = minimo.acumulado < 0
    ? '<div class="note" style="margin-top:12px;border-left-color:var(--neg)"><strong>Atenção:</strong> a tesouraria '+
      'fica negativa em '+esc(mesLabel(minimo.mes))+' ('+esc(eur(minimo.acumulado))+'). '+
      'Antecipe uma reserva, ou desloque despesas grandes desse mês.</div>'
    : '<div class="note" style="margin-top:12px">A tesouraria mantém-se positiva nos 12 meses, com o mínimo de '+
      esc(eur(minimo.acumulado))+' em '+esc(mesLabel(minimo.mes))+'.</div>';

  return '<div class="card"><div class="card-head"><div class="t"><h2>Tesouraria a 12 meses</h2>'+
    '<div class="sub">Liquidez de hoje mais o saldo de cada mês, com os encargos anuais e semestrais '+
    'no mês em que caem. Meses sem movimentos usam o plano.</div></div></div>'+
    '<div class="grid g3" style="margin-bottom:14px">'+
      kpi("Liquidez hoje", eur(totalLiquidez()), "Contas à ordem, poupança e depósitos", "accent")+
      kpi("Daqui a 12 meses", eur(fim.acumulado), "Se o plano se cumprir", fim.acumulado >= 0 ? "good" : "bad")+
      kpi("Ponto mais baixo", eur(minimo.acumulado), mesLabel(minimo.mes),
          minimo.acumulado < 0 ? "bad" : "good")+
    '</div>'+
    '<div class="tblwrap"><svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Projeção de tesouraria">'+
    grelha + area + linha + linhaZero + marcaMin + eixo + zonas + '</svg></div>'+ aviso + '</div>';

/* ===============================================================
   Antecipação — o que a ferramenta já sabe, mas nunca disse

   Tudo aqui se calcula a partir dos dados do próprio agregado: não
   há datas legais assumidas nem prazos inventados. Cada alerta sabe
   dizer para onde levar quem o clica.
   =============================================================== */

/**
 * Mês da próxima revisão da taxa de um crédito indexado, ou null.
 * Inclusiva no mês corrente: uma revisão que cai já este mês é a que mais
 * interessa avisar, não a seguinte.
 */
function proximaRevisao(cr, mes){
  const passo = revisaoCredito(cr);
  if (!passo || !cr.inicio) return null;
  const ini = mesDoDia(cr.inicio);
  const decorridos = mesDiff(ini, mes || MES);
  if (decorridos <= 0) return ini;
  return mesShift(ini, Math.ceil(decorridos / passo) * passo);
}

/**
 * Tudo o que pede atenção, por ordem de urgência.
 * grau: 2 = urgente (vermelho), 1 = a vigiar (âmbar), 0 = arrumação (azul).
 */
function alertas(){
  const out = [];
  const r = realMes(MES), p = planoMes(MES);
  const usarReal = r.rend > 0 || r.desp > 0;

  // Limites de categoria ultrapassados ou quase
  S.categorias.filter(c => c.tipo === "despesa").forEach(c => {
    const lim = parseNum(S.limites[c.id]);
    if (lim <= 0) return;
    const gasto = r.porCat[c.id] || 0;
    if (gasto <= 0) return;
    const uso = gasto / lim * 100;
    if (uso >= 100){
      out.push({grau:2, icone:"⚠", titulo:(c.icone ? c.icone+" " : "")+c.nome+" passou o limite",
        detalhe: eur(gasto)+" de "+eur(lim)+" · "+diasQueFaltam()+" dias até ao fim do mês",
        vista:"orcamento"});
    } else if (uso >= 85){
      out.push({grau:1, icone:"◔", titulo:(c.icone ? c.icone+" " : "")+c.nome+" perto do limite",
        detalhe: pct(uso)+" usado · restam "+eur(lim - gasto), vista:"orcamento"});
    }
  });

  // Saldo negativo no mês
  const saldo = usarReal ? r.saldo : p.saldo;
  if (saldo < 0){
    out.push({grau:2, icone:"⚠", titulo:"O mês fecha em défice",
      detalhe:"Faltam "+eur(-saldo)+" para cobrir as despesas de "+mesLabel(MES), vista:"despesas"});
  }

  // Créditos com revisão de taxa próxima
  S.creditos.filter(c => creditoAtivo(c, MES)).forEach(c => {
    const prox = proximaRevisao(c, MES);
    if (!prox) return;
    const faltam = mesDiff(MES, prox);
    if (faltam >= 0 && faltam <= 3){
      out.push({grau:1, icone:"↻", titulo:"«"+(c.nome || "crédito")+"» revê a taxa em "+mesLabel(prox, true),
        detalhe:(INDEXANTES[c.indexante] || {}).lbl ? (INDEXANTES[c.indexante].lbl+" + "+pct(parseNum(c.spread))+" · a prestação pode mudar")
          : "A prestação pode mudar", vista:"creditos"});
    }
  });

  // Taxa de esforço alta
  const prest = S.creditos.reduce((s,c) => s + encargoCredito(c, MES), 0);
  const rend = usarReal ? r.rend : p.rend;
  if (rend > 0 && prest / rend > 0.4){
    out.push({grau:2, icone:"⚠", titulo:"Taxa de esforço acima de 40%",
      detalhe: pct(prest/rend*100)+" do rendimento vai para prestações", vista:"creditos"});
  }

  // Objetivos fora de ritmo
  S.objetivos.forEach(o => {
    const falta = Math.max(0, parseNum(o.alvo) - parseNum(o.atual));
    if (falta <= 0 || !o.prazo) return;
    const meses = mesDiff(MES, mesDoDia(o.prazo));
    if (meses < 0){
      out.push({grau:2, icone:"⚠", titulo:"«"+(o.nome || "objetivo")+"» passou do prazo",
        detalhe:"Faltam "+eur(falta)+" e o prazo era "+mesLabel(mesDoDia(o.prazo), true), vista:"objetivos"});
    } else if (meses > 0 && p.saldo > 0 && falta / meses > p.saldo){
      out.push({grau:1, icone:"◔", titulo:"«"+(o.nome || "objetivo")+"» fora de ritmo",
        detalhe:"Exigia "+eur(falta/meses)+"/mês e o saldo previsto é "+eur(p.saldo), vista:"objetivos"});
    }
  });

  // Fundo de emergência curto
  const desp = usarReal ? r.desp : p.desp;
  if (desp > 0 && S.ativos.length){
    const meses = totalLiquidez() / desp;
    if (meses < 3){
      out.push({grau:1, icone:"◔", titulo:"Liquidez abaixo de 3 meses de despesa",
        detalhe: meses.toLocaleString("pt-PT",{maximumFractionDigits:1})+" meses cobertos · referência: 3 a 6",
        vista:"ativos"});
    }
  }

  // Arrumação: movimentos por categorizar
  const semCat = S.movimentos.filter(m => !m.categoriaId).length;
  if (semCat){
    out.push({grau:0, icone:"🏷", titulo:semCat+" movimento(s) sem categoria",
      detalhe:"Sem categoria não entram na regra 50/30/20 nem nos limites", vista:"movimentos"});
  }

  // Arrumação: ativos com valor por confirmar há muito
  const desatualizados = S.ativos.filter(a =>
    origemValor(a) === "estimado" && a.dataAquisicao && anosDesde(a.dataAquisicao) >= 1).length;
  if (desatualizados){
    out.push({grau:0, icone:"↻", titulo:desatualizados+" ativo(s) com valor estimado há mais de um ano",
      detalhe:"O balanço usa a estimativa pela taxa da classe — confirme o valor real", vista:"ativos"});
  }

  return out.sort((a,b) => b.grau - a.grau);
}

/** Dias que faltam até ao fim do mês em análise (o próprio incluído). */
function diasQueFaltam(){
  const [a, m] = MES.split("-").map(Number);
  const ultimo = new Date(a, m, 0).getDate();
  const hojeMes = isoMes(hoje());
  if (MES !== hojeMes) return ultimo;
  return Math.max(0, ultimo - hoje().getDate());
}

/* ---------------------------------------------------------------
   Recorrências — despesas que se repetem e ainda não estão no plano
   --------------------------------------------------------------- */

/** Chave de agrupamento de um movimento pela descrição normalizada. */
function chaveRecorrencia(desc){
  return semAcento(desc).replace(/[0-9]+/g, "").replace(/[^a-z ]+/g, " ").replace(/\s+/g, " ").trim();
}

/**
 * Descrições que aparecem em três ou mais meses distintos com valor
 * semelhante — candidatas a rubrica do plano. Ignora as que já lá estão.
 */
function detetarRecorrencias(){
  const grupos = new Map();
  S.movimentos.filter(m => m.tipo !== "rendimento" && m.data).forEach(m => {
    const k = chaveRecorrencia(m.descricao);
    if (k.length < 4) return;
    if (!grupos.has(k)) grupos.set(k, []);
    grupos.get(k).push(m);
  });
  const jaNoPlano = new Set(S.recorrentes.map(r => chaveRecorrencia(r.nome)));
  const out = [];
  grupos.forEach((movs, k) => {
    if (jaNoPlano.has(k)) return;
    const meses = new Set(movs.map(m => m.data.slice(0, 7)));
    if (meses.size < 3) return;
    const valores = movs.map(m => Math.abs(parseNum(m.valor)));
    const media = valores.reduce((s,v) => s + v, 0) / valores.length;
    if (media <= 0) return;
    // Valores próximos: o maior desvio não passa de 20% da média
    const desvio = Math.max(...valores.map(v => Math.abs(v - media))) / media;
    if (desvio > 0.2) return;
    out.push({chave:k, nome: movs[movs.length-1].descricao || k, valor: media,
      meses: meses.size, categoriaId: (movs.find(m => m.categoriaId) || {}).categoriaId || ""});
  });
  return out.sort((a,b) => b.valor - a.valor);
}

function viewPainel(){
  const p = planoMes(MES), r = realMes(MES);
  const usarReal = r.rend > 0 || r.desp > 0;
  const rend = usarReal ? r.rend : p.rend;
  const desp = usarReal ? r.desp : p.desp;
  const saldo = rend - desp;
  const taxaPoup = rend > 0 ? saldo / rend * 100 : 0;

  const prestacoesMes = S.creditos.reduce((s,c) => s + encargoCredito(c, MES), 0);
  const esforco = rend > 0 ? prestacoesMes / rend * 100 : 0;

  if (!temDados()){
    return '<div class="card"><h2>Bem-vindo 👋</h2>'+
      '<p class="sub">Ainda não há dados. Comece por definir o <strong>Plano mensal</strong> '+
      '(rendimentos e despesas fixas) ou registe <strong>Movimentos</strong> reais do dia a dia.</p>'+
      '<div class="row"><div class="shrink"><button class="btn primary" data-act="ir" data-view="rendimentos">Definir rendimentos</button></div>'+
      '<div class="shrink"><button class="btn" data-act="ir" data-view="despesas">Despesas</button></div>'+
      '<div class="shrink"><button class="btn" data-act="ir" data-view="ativos">Ativos</button></div>'+
      '<div class="shrink"><button class="btn ghost" data-act="exemplo">Carregar exemplo</button></div>'+
      '<div class="shrink"><button class="btn ghost" data-act="tutorialIniciar">🎓 Visita guiada</button></div></div>'+
      '<div style="margin-top:18px"><label class="field">Ou comece por um ponto de partida</label>'+
      escolhaPerfil()+
      '<div class="muted" style="font-size:12px;margin-top:7px">Semeia membros, despesas fixas típicas e limites — '+
      'valores de exemplo, para ajustar. Os rendimentos ficam por sua conta.</div></div>'+
      '<div style="margin-top:14px" class="note"><strong>Três coisas, e só três:</strong> '+
      '<em>Rendimentos</em> (cada fonte decomposta em vencimento, subsídios, prémios — com IRS e Segurança Social), '+
      '<em>Despesas</em> (fixas, movimentos e limites) e <em>Ativos</em> — onde cabe tudo o que tem valor, '+
      'da conta à ordem ao PPR, dos ETFs ao apartamento. As poupanças são ativos como os outros.</div>'+
      '<div style="margin-top:10px" class="note"><strong>O resto pendura-se destes três:</strong> os créditos ligam-se ao ativo que financiam '+
      'e a prestação divide-se em juros, amortização e seguros; os impostos sobre rendimentos e ativos entram nas categorias respetivas. '+
      'No fim, tudo fecha no <em>património líquido</em>.</div></div>';
  }

  // KPIs, com a variação face ao mês anterior e o traço dos últimos 6 meses.
  // Com a comparação homóloga ligada, a legenda passa a mostrar o mesmo mês
  // do ano anterior — plano ou real, conforme o que existir nesse mês.
  const sRend  = serieMensal((m) => valorMes("rend", m), 6);
  const sDesp  = serieMensal((m) => valorMes("desp", m), 6);
  const sSaldo = serieMensal((m) => valorMes("saldo", m), 6);
  const mesH = mesShift(MES, -12);
  const homologo = (campo, atual, maiorMelhor) => {
    const h = valorMes(campo, mesH);
    if (Math.abs(h) < 0.005) return "Há 1 ano: sem dados";
    const d = (atual - h) / Math.abs(h) * 100;
    const bom = maiorMelhor ? d >= 0 : d <= 0;
    return "Há 1 ano: "+eur(h)+" · "+(d >= 0 ? "+" : "−")+
      Math.abs(d).toLocaleString("pt-PT",{maximumFractionDigits:1})+"% "+(bom ? "✓" : "▲");
  };
  const comparar = !!S.comparar;
  const botaoComparar =
    '<div class="no-print" style="display:flex;justify-content:flex-end;margin-bottom:8px">'+
    '<button class="btn sm '+(comparar ? "" : "ghost")+'" data-act="compararAlternar" aria-pressed="'+comparar+'">'+
    '⇄ vs. '+esc(mesLabel(mesH, true))+'</button></div>';
  const kpis = botaoComparar +
    '<div class="grid g4">'+
      kpiTend("Rendimento", eur(rend),
        comparar ? homologo("rend", rend, true) : (usarReal ? "Real · previsto "+eur(p.rend) : "Previsto (plano)"),
        "good", sRend, true)+
      kpiTend("Despesa", eur(desp),
        comparar ? homologo("desp", desp, false) : (usarReal ? "Real · prevista "+eur(p.desp) : "Prevista (plano)"),
        "bad", sDesp, false)+
      kpiTend("Saldo do mês", eur(saldo),
        comparar ? homologo("saldo", saldo, true) : (saldo >= 0 ? "Sobra disponível" : "Défice a cobrir"),
        saldo >= 0 ? "accent" : "bad", sSaldo, true)+
      kpi("Taxa de poupança", pct(taxaPoup),
        comparar
          ? (function(){ const hr = valorMes("rend", mesH), hs = valorMes("saldo", mesH);
              return hr > 0 ? "Há 1 ano: "+pct(hs/hr*100) : "Há 1 ano: sem dados"; })()
          : (taxaPoup >= 20 ? "Acima do alvo de 20%" : "Alvo recomendado: 20%"),
        taxaPoup >= 20 ? "good" : taxaPoup >= 10 ? "warnb" : "bad")+
    '</div>';

  // Previsto vs real
  const linhas = [
    ["Rendimentos", p.rend, r.rend, true],
    ["Despesas", p.desp, r.desp, false],
    ["Saldo", p.saldo, r.saldo, true],
  ].map(([nome, prev, real, maiorMelhor]) => {
    const dif = real - prev;
    const bom = maiorMelhor ? dif >= 0 : dif <= 0;
    return '<tr><td>'+esc(nome)+'</td>'+
      '<td class="r num">'+esc(eur(prev))+'</td>'+
      '<td class="r num">'+esc(eur(real))+'</td>'+
      '<td class="r num '+(dif === 0 ? "muted" : bom ? "pos" : "neg")+'">'+
        (dif > 0 ? "+" : "")+esc(eur(dif))+'</td></tr>';
  }).join("");

  const comparativo =
    '<div class="card"'+aj("Previsto vs. real",
      "O previsto vem do plano: despesas fixas, rendimentos declarados, prestações e encargos dos ativos. O real vem dos movimentos que registou. O desvio mostra onde a realidade se afastou do plano.",
      "Desvio = real − previsto")+
    '><div class="card-head"><div class="t"><h2>Previsto vs. real — '+esc(mesLabel(MES))+'</h2>'+
    '<div class="sub">O previsto vem do plano mensal e das prestações de crédito ativas.</div></div></div>'+
    '<div class="tblwrap"><table><thead><tr><th></th><th class="r">Previsto</th><th class="r">Real</th><th class="r">Desvio</th></tr></thead>'+
    '<tbody>'+linhas+'</tbody></table></div></div>';

  // Distribuição de despesa por categoria (real, com recurso ao plano)
  const fonte = usarReal ? r : p;
  const dadosDonut = S.categorias
    .filter(c => c.tipo === "despesa")
    .map(c => ({nome:(c.icone ? c.icone+" " : "")+c.nome, cor:c.cor, valor: fonte.porCat[c.id] || 0}));

  // Detalhe da fatia focada: os movimentos (ou rubricas) dessa categoria,
  // ali mesmo — sem mudar de vista.
  let drill = "";
  const foco = ui.donutFoco && ui.donutFoco.id === "painelDespesas" ? ui.donutFoco.nome : null;
  if (foco){
    const catFoco = S.categorias.find(c => ((c.icone ? c.icone+" " : "")+c.nome) === foco);
    if (catFoco){
      let linhasDrill = "", totalDrill = 0, resto = 0;
      if (usarReal){
        const doMes = S.movimentos
          .filter(m => m.categoriaId === catFoco.id && m.tipo !== "rendimento" && (m.data || "").indexOf(MES) === 0)
          .sort((a,b) => parseNum(b.valor) - parseNum(a.valor));
        totalDrill = doMes.reduce((s,m) => s + Math.abs(parseNum(m.valor)), 0);
        linhasDrill = doMes.slice(0, 6).map(m =>
          '<tr><td class="num">'+esc((m.data || "").slice(8))+'</td><td>'+esc(m.descricao || "—")+'</td>'+
          '<td class="r num">'+esc(eur(Math.abs(parseNum(m.valor))))+'</td></tr>').join("");
        resto = doMes.length - 6;
      } else {
        const rubs = S.recorrentes
          .filter(x => x.categoriaId === catFoco.id && x.tipo !== "rendimento" && recAtiva(x, MES))
          .sort((a,b) => recMensal(b) - recMensal(a));
        totalDrill = rubs.reduce((s,x) => s + recMensal(x), 0);
        linhasDrill = rubs.slice(0, 6).map(x =>
          '<tr><td class="num">—</td><td>'+esc(x.nome || "—")+'</td>'+
          '<td class="r num">'+esc(eur(recMensal(x)))+'</td></tr>').join("");
        resto = rubs.length - 6;
      }
      drill = '<div style="margin-top:12px" id="drillDonut">'+
        '<div class="barlbl"><span><strong style="color:var(--text)">Detalhe — '+esc(foco)+'</strong></span>'+
        '<span class="num">'+esc(eur(totalDrill))+'</span></div>'+
        (linhasDrill
          ? '<div class="tblwrap"><table><tbody>'+linhasDrill+'</tbody></table></div>'+
            (resto > 0 ? '<div class="muted" style="font-size:12px;margin-top:4px">… e mais '+resto+' registo(s).</div>' : "")
          : '<div class="empty" style="padding:12px">Sem registos nesta categoria em '+esc(mesLabel(MES))+'.</div>')+
        '</div>';
    }
  }
  const grafico =
    '<div class="card"><div class="card-head"><div class="t"><h2>Despesa por categoria</h2>'+
    '<div class="sub">'+(usarReal ? "Movimentos reais" : "Plano previsto")+' de '+esc(mesLabel(MES))+
    ' — clique numa fatia para ver o detalhe.</div></div></div>'+
    donut(dadosDonut, desp, 10, "painelDespesas")+drill+'</div>';

  // Regra 50/30/20
  const g = usarReal ? porGrupo(MES) : (function(){
    const acc = {necessidades:0, desejos:0, poupanca:0};
    for (const [cid, v] of Object.entries(p.porCat)){
      const c = cat(cid);
      if (!c || c.tipo !== "despesa") continue;
      const k = c.grupo || "desejos";
      if (acc[k] != null) acc[k] += v;
    }
    return acc;
  })();
  const regra =
    '<div class="card"'+aj("Regra 50/30/20",
      "Uma referência simples de repartição: metade do rendimento para necessidades, 30% para o que se quer mas se pode dispensar, 20% para poupança. Cada categoria pertence a um destes grupos, editável em Definições.",
      "A amortização de capital conta como poupança")+
    '><div class="card-head"><div class="t"><h2>Regra 50 / 30 / 20</h2>'+
    '<div class="sub">Repartição do rendimento por necessidades, desejos e poupança.</div></div></div>'+
    Object.entries(GRUPOS).map(([k, meta]) => {
      const v = g[k] || 0;
      const share = rend > 0 ? v / rend * 100 : 0;
      const alvoV = rend * meta.alvo / 100;
      return '<div style="margin-bottom:12px">'+
        '<div class="barlbl"><span><strong style="color:var(--text)">'+esc(meta.lbl)+'</strong> · alvo '+meta.alvo+'%</span>'+
        '<span class="num">'+esc(eur(v))+' ('+esc(pct(share))+') de '+esc(eur(alvoV))+'</span></div>'+
        '<div class="bar"><span style="width:'+Math.min(100, share).toFixed(1)+'%;background:'+meta.cor+'"></span></div>'+
      '</div>';
    }).join("")+
    (rend <= 0 ? '<div class="note">Introduza rendimentos para calcular a repartição.</div>' : "")+
    '</div>';

  // Evolução com horizonte selecionável
  const nMeses = ui.evolucaoMeses;
  const meses = [];
  for (let k = nMeses - 1; k >= 0; k--){
    const m = mesShift(MES, -k);
    const rr = realMes(m), pp = planoMes(m);
    const usa = rr.rend > 0 || rr.desp > 0;
    meses.push({mes:m, rend: usa ? rr.rend : pp.rend, desp: usa ? rr.desp : pp.desp});
  }
  const evolucao =
    '<div class="card"><div class="card-head"><div class="t"><h2>Evolução</h2>'+
    '<div class="sub">Meses sem movimentos usam os valores do plano. Passe o ponteiro sobre um mês para ver os valores.</div></div>'+
    '<div class="seg no-print">'+[6,12,24,36].map(n =>
      '<button data-act="evolMeses" data-v="'+n+'" aria-pressed="'+(nMeses===n)+'">'+n+'m</button>').join("")+'</div>'+
    '</div><div class="tblwrap">'+barrasEvolucao(meses)+'</div></div>';

  // Créditos e objetivos (resumo)
  let resumoExtra = "";
  if (S.creditos.length){
    const emDivida = S.creditos.reduce((s,c) => s + saldoDevedorMes(c, MES), 0);
    resumoExtra +=
      '<div class="card"><div class="card-head"><div class="t"><h2>Créditos</h2>'+
      '<div class="sub">Encargo mensal e taxa de esforço.</div></div>'+
      '<button class="btn sm no-print" data-act="ir" data-view="creditos">Ver detalhe</button></div>'+
      '<div class="grid g3">'+
        kpi("Prestações/mês", eur(prestacoesMes), S.creditos.length+" crédito(s) ativo(s)")+
        kpi("Capital em dívida", eur(emDivida), "No fim de "+mesLabel(MES))+
        kpi("Taxa de esforço", pct(esforco),
            esforco > 40 ? "Acima do limiar prudente (40%)" : esforco > 33 ? "Zona de atenção" : "Dentro do razoável",
            esforco > 40 ? "bad" : esforco > 33 ? "warnb" : "good")+
      '</div></div>';
  }
  if (S.objetivos.length){
    resumoExtra +=
      '<div class="card"><div class="card-head"><div class="t"><h2>Objetivos de poupança</h2></div>'+
      '<button class="btn sm no-print" data-act="ir" data-view="objetivos">Gerir</button></div>'+
      S.objetivos.map(o => {
        const alvo = parseNum(o.alvo), atual = parseNum(o.atual);
        const p2 = alvo > 0 ? Math.min(100, atual/alvo*100) : 0;
        return '<div style="margin-bottom:11px">'+
          '<div class="barlbl"><span style="color:var(--text);font-weight:600">'+esc(o.nome)+'</span>'+
          '<span class="num">'+esc(eur(atual))+' / '+esc(eur(alvo))+' · '+esc(pct(p2))+'</span></div>'+
          '<div class="bar"><span style="width:'+p2.toFixed(1)+'%;background:'+esc(o.cor || "var(--pos)")+'"></span></div>'+
        '</div>';
      }).join("")+
      '</div>';
  }

  // Património líquido
  const bal = balanco();
  const temPatrimonio = S.ativos.length > 0;
  const patrimonioCard = temPatrimonio
    ? '<div class="card"><div class="card-head"><div class="t"><h2>Património líquido</h2>'+
      '<div class="sub">Investimentos e bens, menos o capital em dívida.</div></div>'+
      '<button class="btn sm no-print" data-act="ir" data-view="ativos">Ver balanço</button></div>'+
      '<div class="grid g3" style="margin-bottom:14px">'+
        kpi("Líquido", eur(bal.liquido), "Em "+mesLabel(MES), bal.liquido >= 0 ? "good" : "bad")+
        kpi("Financeiros", eur(bal.carteira), financeiros().length+" posição(ões)", "accent")+
        kpi("Ativos", eur(bal.bens), S.ativos.length+" bem(ns)")+
      '</div>'+
      donut([
        {nome:"Carteira de investimentos", cor:"#22a06b", valor: bal.carteira},
        {nome:"Bens patrimoniais", cor:"#2f5fd0", valor: bal.bens},
      ], bal.ativos, 9, "painelAtivos")+
      '</div>'
    : "";

  const simulador = (temPatrimonio || p.saldo > 0)
    ? '<div class="card"><div class="card-head"><div class="t"><h2>Simulador «e se…»</h2>'+
      '<div class="sub">Arraste para ver o efeito de poupar mais por mês. Os valores atualizam-se enquanto arrasta.</div></div></div>'+
      '<div class="grid g2 no-print" style="margin-bottom:16px">'+
        slider("simExtra", "Poupar mais por mês", ui.simExtra, 0, Math.max(500, Math.ceil(Math.max(0, p.saldo)/50)*50), 25, " €")+
        slider("simAnos", "Durante", ui.simAnos, 1, 40, 1, " anos")+
      '</div><div id="simOut">'+simuladorOut()+'</div></div>'
    : "";

  const sankey = sankeyOrcamento(rend, g, usarReal);
  const digest = resumoMensal();
  const atencao = cartaoAtencao();
  return dicaProximoPasso() + kpis + '<div style="height:16px"></div>' +
    (atencao ? atencao + '<div style="height:16px"></div>' : "")+
    (digest ? digest + '<div style="height:16px"></div>' : "")+
    '<div class="grid g2">'+comparativo+grafico+'</div>'+
    '<div style="height:16px"></div>'+
    (sankey ? sankey + '<div style="height:16px"></div>' : "")+
    (function(){ const t = cartaoTesouraria(); return t ? t + '<div style="height:16px"></div>' : ""; })()+
    (function(){ const m = mapaAnual(); return m ? m + '<div style="height:16px"></div>' : ""; })()+
    '<div class="grid g2">'+regra+evolucao+'</div>'+
    (resumoExtra ? '<div style="height:16px"></div><div class="grid g2">'+resumoExtra+'</div>' : "")+
    (patrimonioCard || simulador
      ? '<div style="height:16px"></div><div class="grid g2">'+patrimonioCard+simulador+'</div>' : "");
}

/**
 * Simulador do painel: efeito de um reforço adicional de poupança sobre a
 * carteira e sobre o património líquido, ao fim de N anos.
 */
function simuladorOut(){
  const anos = Math.max(1, Math.min(40, Math.round(ui.simAnos)));
  const extra = Math.max(0, ui.simExtra);
  const meses = anos * 12;

  // Retorno de referência: o da carteira, ou 4% se ainda não houver carteira.
  const rAnual = financeiros().length ? retornoCarteira(true) : 4;
  const rMes = Math.pow(1 + Math.max(-0.99, rAnual/100), 1/12) - 1;

  const serie = projetarCarteira(anos, {ajuste: 0});
  const carteiraBase = serie[serie.length-1].valor;
  // Valor futuro do reforço adicional (série de pagamentos no fim de cada mês)
  const fvExtra = rMes === 0 ? extra * meses : extra * ((Math.pow(1+rMes, meses) - 1) / rMes);
  const carteiraCom = carteiraBase + fvExtra;

  // Bens valorizados e dívida amortizada ao fim do horizonte
  // Idem: a projeção da carteira já cobre os financeiros.
  const bensFuturos = reais().reduce((s,a) => s + valorAtivoFuturo(a, anos), 0);
  const dividaFutura = S.creditos.reduce((s,c) => s + saldoDevedorMes(c, mesShift(MES, meses)), 0);

  const liquidoBase = carteiraBase + bensFuturos - dividaFutura;
  const liquidoCom  = carteiraCom  + bensFuturos - dividaFutura;
  const aportado = extra * meses;
  const jurosGanhos = fvExtra - aportado;

  return '<div class="grid g2" style="margin-bottom:14px">'+
      kpi("Património líquido daqui a "+anos+" anos", eur(liquidoCom),
          extra > 0 ? "+"+eur(liquidoCom - liquidoBase)+" face a não reforçar" : "Sem reforço adicional",
          extra > 0 ? "good" : "accent")+
      kpi("Carteira daqui a "+anos+" anos", eur(carteiraCom),
          "A "+pct(rAnual)+" ao ano")+
    '</div>'+
    (extra > 0
      ? '<div class="tblwrap"><table><tbody>'+
        '<tr><td>Reforço adicional acumulado</td><td class="r num">'+esc(eur(aportado))+'</td></tr>'+
        '<tr><td>Rendimento que esse reforço gera</td><td class="r num pos">+'+esc(eur(jurosGanhos))+'</td></tr>'+
        '</tbody><tfoot><tr><td>Valor acrescentado à carteira</td>'+
        '<td class="r num pos">'+esc(eur(fvExtra))+'</td></tr></tfoot></table></div>'+
        '<div class="note" style="margin-top:12px">Poupar mais '+esc(eur(extra))+' por mês durante '+anos+
        ' anos acrescenta <strong>'+esc(eur(fvExtra))+'</strong> à carteira — dos quais '+esc(eur(jurosGanhos))+
        ' vêm do juro composto, não do seu bolso.</div>'
      : '<div class="note">Arraste o primeiro comando para acrescentar poupança mensal e ver o efeito composto.</div>')+
    (dividaFutura > 0
      ? '<div class="note" style="margin-top:10px">Ao fim de '+anos+' anos ainda restarão <strong>'+esc(eur(dividaFutura))+
        '</strong> de capital em dívida, já descontados no património líquido.</div>' : "");
}

function kpi(lbl, val, hint, tipo){
  return '<div class="kpi '+(tipo || "")+'"><div class="lbl">'+esc(lbl)+'</div>'+
    '<div class="val">'+esc(val)+'</div>'+
    (hint ? '<div class="hint">'+esc(hint)+'</div>' : "")+'</div>';
}

/* Série mensal dos últimos n meses (o próprio incluído), para as tendências. */
function serieMensal(fn, n){
  const out = [];
  for (let i = n - 1; i >= 0; i--) out.push(fn(mesShift(MES, -i)));
  return out;
}
/** Valor do mês: o real quando há movimentos registados, senão o plano. */
function valorMes(campo, mes){
  const r = realMes(mes);
  return (r.rend > 0 || r.desp > 0) ? r[campo] : planoMes(mes)[campo];
}

/** Linha de tendência minimalista, para dentro de um KPI. */
function sparkline(serie){
  const W = 200, H = 26, pad = 3;
  const min = Math.min(...serie), max = Math.max(...serie);
  const amp = (max - min) || 1;
  const x = (i) => pad + i * (W - 2*pad) / Math.max(1, serie.length - 1);
  const y = (v) => H - pad - (v - min) / amp * (H - 2*pad);
  const pts = serie.map((v,i) => x(i).toFixed(1)+","+y(v).toFixed(1)).join(" ");
  const fx = x(serie.length - 1).toFixed(1), fy = y(serie[serie.length-1]).toFixed(1);
  return '<svg class="spark" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" aria-hidden="true">'+
    '<polyline fill="none" stroke="currentColor" stroke-width="1.8" opacity=".55" points="'+pts+'"/>'+
    '<circle cx="'+fx+'" cy="'+fy+'" r="2.6" fill="currentColor"/></svg>';
}

/**
 * KPI com tendência: variação face ao mês anterior e traço dos últimos meses.
 * `maiorMelhor` decide a cor do delta (numa despesa, subir é mau).
 */
function kpiTend(lbl, val, hint, tipo, serie, maiorMelhor){
  const n = serie.length;
  const atual = serie[n-1], anterior = n > 1 ? serie[n-2] : 0;
  let chip = "";
  if (Math.abs(anterior) > 0.005){
    const d = (atual - anterior) / Math.abs(anterior) * 100;
    if (Math.abs(d) >= 0.05){
      const bom = maiorMelhor ? d >= 0 : d <= 0;
      chip = '<span class="delta '+(bom ? "pos" : "neg")+'">'+(d > 0 ? "+" : "−")+
        esc(Math.abs(d).toLocaleString("pt-PT",{maximumFractionDigits:1}))+'% vs. '+
        esc(mesLabel(mesShift(MES,-1), true))+'</span>';
    }
  }
  const varia = serie.some(v => Math.abs(v - serie[0]) > 0.005);
  return '<div class="kpi '+(tipo || "")+'"><div class="lbl">'+esc(lbl)+'</div>'+
    '<div class="val">'+esc(val)+chip+'</div>'+
    (hint ? '<div class="hint">'+esc(hint)+'</div>' : "")+
    (varia ? sparkline(serie) : "")+'</div>';
}

/** Os movimentos do mês depois dos filtros em vigor — a lista que se vê. */
function movimentosFiltrados(){
  let lista = S.movimentos.filter(m => mesDoDia(m.data) === MES);
  if (filtros.texto){
    const q = filtros.texto.toLowerCase();
    lista = lista.filter(m => (m.descricao || "").toLowerCase().includes(q) ||
                              catNome(m.categoriaId).toLowerCase().includes(q));
  }
  if (filtros.categoria) lista = lista.filter(m => m.categoriaId === filtros.categoria);
  if (filtros.membro)    lista = lista.filter(m => m.membroId === filtros.membro);
  if (filtros.tipo)      lista = lista.filter(m => m.tipo === filtros.tipo);
  return lista;
}

/**
 * Termo mais longo comum a várias descrições — serve para propor uma regra
 * («CONTINENTE») a partir dos movimentos que se acabaram de categorizar.
 */
function termoComum(descricoes){
  const listas = descricoes.filter(Boolean).map(d =>
    semAcento(d).split(/[^a-z0-9]+/).filter(t => t.length >= 4));
  if (listas.length < 2) return "";
  let comuns = listas[0].slice();
  for (let i = 1; i < listas.length; i++) comuns = comuns.filter(t => listas[i].indexOf(t) >= 0);
  if (!comuns.length) return "";
  const escolhido = comuns.sort((a,b) => b.length - a.length)[0];
  // Devolver com a grafia original da primeira descrição que o contenha
  for (const d of descricoes){
    if (!d) continue;
    const idx = semAcento(d).indexOf(escolhido);
    if (idx >= 0) return d.substr(idx, escolhido.length);
  }
  return escolhido;
}

/**
 * Calendário do mês com a despesa de cada dia em intensidade de cor —
 * os padrões («os sábados custam-me 80 €») saltam à vista.
 */
function calendarioCalor(){
  const doMes = S.movimentos.filter(m => (m.data || "").indexOf(MES) === 0);
  if (!doMes.length) return "";
  const porDia = {};
  doMes.forEach(m => {
    const d = parseInt((m.data || "").slice(8), 10);
    if (!d) return;
    if (!porDia[d]) porDia[d] = {desp:0, rend:0};
    porDia[d][m.tipo === "rendimento" ? "rend" : "desp"] += Math.abs(parseNum(m.valor));
  });
  const maxDesp = Math.max(1, ...Object.values(porDia).map(x => x.desp));
  const [ano, mm] = MES.split("-").map(Number);
  const nDias = new Date(ano, mm, 0).getDate();
  const off = (new Date(ano, mm - 1, 1).getDay() + 6) % 7;   // segunda-feira primeiro

  let celulas = ["S","T","Q","Q","S","S","D"].map(d =>
    '<div class="hdia" aria-hidden="true">'+d+'</div>').join("");
  for (let i = 0; i < off; i++) celulas += '<div></div>';
  for (let d = 1; d <= nDias; d++){
    const x = porDia[d];
    const alfa = x ? 0.12 + 0.78 * (x.desp / maxDesp) : 0;
    const dd = String(d).padStart(2, "0");
    celulas += '<div class="hcel'+(x ? " hit" : "")+'" style="'+
      (x && x.desp > 0 ? 'background:color-mix(in srgb,var(--neg) '+(alfa*100).toFixed(0)+'%,var(--surface-2));' : "")+
      (x && x.desp === 0 && x.rend > 0 ? 'background:color-mix(in srgb,var(--pos) 25%,var(--surface-2));' : "")+'"'+
      (x ? tipData(dd+"/"+String(mm).padStart(2,"0"), [["Despesa", eur(x.desp)], ["Rendimento", eur(x.rend)]]) : "")+
      '>'+d+'</div>';
  }
  return '<div class="hmap-wrap"><div class="barlbl"><span><strong style="color:var(--text)">Calendário do mês</strong>'+
    ' · quanto mais escuro, maior a despesa do dia</span></div>'+
    '<div class="hmap">'+celulas+'</div></div>';
}

    '<div class="sub">Cada fonte com as suas componentes e o respetivo tratamento fiscal.</div></div></div>'+
    form+'</div><div style="height:16px"></div>'+
    kpis+
    '<div class="grid g2">'+composicao+cascata+'</div>'+
    '<div style="height:16px"></div>'+fichas;
}

/** Ficha de uma fonte de rendimento, com as componentes colapsáveis. */
function fichaRendimento(rd){
  const fx = fiscalRendimento(rd);
  const abertoAgora = aberto("rd-" + rd.id);
  const emEdicao = editando.comp && editando.comp.rdId === rd.id;
  const comps = rd.componentes || [];

  const linhas = comps.map(c => {
    const esp = especieDe(c.especie);
    const v = compMensal(c);
    const ss = sujeitoSS(c), irs = sujeitoIRS(c);
    const marcas = esp.aut
      ? '<span class="tag g-desejos">autónoma '+esc(pct(parseNum(S.fiscal[esp.aut] || 0)))+'</span>'
      : (ss || irs
          ? (ss ? '<span class="tag g-necessidades">SS</span> ' : "") + (irs ? '<span class="tag g-necessidades">IRS</span>' : "")
          : '<span class="tag g-poupanca">isento</span>');
    // Nas prestações sociais mostra-se de onde veio o valor, para não
    // ficar um número solto sem rasto.
    let origem = "";
    if (c.especie === "parentalidade" && c.modalidade){
      const m = modalidadeParental(c.modalidade);
      origem = m.lbl + " · " + pct(m.pct) +
               (parseNum(c.numBebes) > 1 ? " · " + parseNum(c.numBebes) + " bebés" : "") +
               (parseNum(c.internamento) > 0 ? " · internamento " + parseNum(c.internamento) + "d" : "");
    } else if (c.especie === "abonoFamilia"){
      const a = abonoFamilia(c.idadeMeses, c.monoparental,
        {menos36: c.menos36, deficiencia: c.deficiencia, numMenos36: contarMenos36()});
      origem = a.escalao.n + ".º escalão · " + parseNum(c.idadeMeses) + " meses" +
               (a.monoparental ? " · monoparental" : "") +
               (c.menos36 ? " · <36m" : "") +
               (c.deficiencia ? " · deficiência" : "");
    } else if (c.especie === "abonoPrenatal"){
      const a = abonoPrenatal(c.numBebes, c.monoparental);
      origem = "Pré-natal · " + a.escalao.n + ".º escalão" +
               (parseNum(c.numBebes) > 1 ? " · " + parseNum(c.numBebes) + " bebés" : "") +
               (a.monoparental ? " · monoparental" : "");
    } else if (c.especie === "riscoGravidez"){
      origem = pct(PARENTALIDADE.riscoPct) + " da remuneração de referência";
    }

    return '<tr>'+
      '<td><strong>'+esc(c.nome || esp.lbl)+'</strong>'+
        '<br><span class="muted" style="font-size:11.5px">'+esc(origem || esp.lbl)+'</span></td>'+
      '<td>'+marcas+'</td>'+
      '<td><span class="tag"><span class="dot" style="background:'+esc(catCor(c.categoriaId))+'"></span>'+
        esc(catRotulo(c.categoriaId))+'</span></td>'+
      '<td>'+esc((FREQ[c.frequencia] || FREQ.mensal).lbl)+'</td>'+
      '<td class="r num">'+esc(eur(parseNum(c.valor)))+'</td>'+
      '<td class="r num"><strong>'+esc(eur(v))+'</strong></td>'+
      '<td class="r no-print" style="white-space:nowrap">'+
        '<button class="btn sm ghost" data-act="compEditar" data-rd="'+esc(rd.id)+'" data-id="'+esc(c.id)+'">✎</button> '+
        '<button class="btn sm ghost" data-act="compApagar" data-rd="'+esc(rd.id)+'" data-id="'+esc(c.id)+'">✕</button></td>'+
    '</tr>';
  }).join("");

  const corpo = comps.length
    ? '<div class="tblwrap"><table><thead><tr><th>Componente</th><th>Incidência</th><th>Categoria</th>'+
      '<th>Periodicidade</th><th class="r">Valor</th><th class="r">Equiv./mês</th><th class="no-print"></th></tr></thead>'+
      '<tbody>'+linhas+'</tbody>'+
      '<tfoot><tr><td colspan="5">Bruto mensal</td><td class="r num">'+esc(eur(fx.bruto))+'</td>'+
      '<td class="no-print"></td></tr></tfoot></table></div>'
    : '<div class="empty" style="padding:14px">Sem componentes. Acrescente pelo menos o vencimento base.</div>';

  return '<div class="card">'+
    '<div class="card-head">'+
      '<button class="btn ghost sm no-print" data-act="alternar" data-id="rd-'+esc(rd.id)+'" '+
        'aria-expanded="'+abertoAgora+'" title="Mostrar ou esconder as componentes">'+(abertoAgora ? "▾" : "▸")+'</button>'+
      '<div class="t"><h2>'+esc(rd.nome || "Fonte de rendimento")+
        (rd.ativo === false ? ' <span class="tag">inativa</span>' : "")+'</h2>'+
        '<div class="sub">'+(rd.membroId ? esc(membroNome(rd.membroId))+' · ' : "")+
        esc((REGIMES_SS[rd.regime] || REGIMES_SS.dependente).lbl)+' · '+
        comps.length+' componente(s) · bruto '+esc(eur(fx.bruto))+' · líquido <strong>'+esc(eur(fx.liquido))+'</strong>'+
        ' · carga '+esc(pct(fx.taxaEfetiva))+'</div></div>'+
      '<div class="no-print" style="white-space:nowrap">'+
        '<button class="btn sm" data-act="compNovo" data-rd="'+esc(rd.id)+'">+ Componente</button> '+
        '<button class="btn sm ghost" data-act="rdToggle" data-id="'+esc(rd.id)+'" title="Ativar ou desativar">'+(rd.ativo === false ? "○" : "●")+'</button> '+
        '<button class="btn sm ghost" data-act="rdEditar" data-id="'+esc(rd.id)+'">✎</button> '+
        '<button class="btn sm ghost" data-act="rdApagar" data-id="'+esc(rd.id)+'">✕</button></div></div>'+
    (abertoAgora || emEdicao
      ? (emEdicao ? formComponente(rd) : "") + corpo +
        '<div class="grid g4" style="margin-top:14px">'+
          kpi("Bruto", eur(fx.bruto), "Por mês")+
          kpi("Segurança Social", eur(fx.ss), pct(fx.taxaContrib)+" sobre "+eur(fx.baseSS), "bad")+
          kpi("IRS", eur(fx.irs),
              fx.rf && fx.rf.usaTabela
                ? fx.rf.tabela.nome+" · "+pct(fx.taxaIRS)+" efetivos"
                : pct(parseNum(S.fiscal.irsEfetivo))+" sobre "+eur(fx.baseIRS), "bad")+
          kpi("Líquido", eur(fx.liquido), pct(fx.taxaEfetiva)+" de carga", "good")+
        '</div>'+
        (fx.isento > 0
          ? '<div class="note" style="margin-top:12px">'+esc(eur(fx.isento))+
            '/mês não entram nas bases de incidência (subsídio de alimentação dentro do limite, ajudas de custo, abonos).</div>' : "")+
        blocoRetencao(rd, fx)+
        avisoDuplicacao(rd)
      : '<div class="note no-print">Clique em ▸ para ver e editar as componentes.</div>')+
  '</div>';
}

/**
 * Detalhe da retenção na fonte: que tabela, que escalão, e quanto sai de
 * cada pagamento. É a parte que permite conferir contra o recibo.
 */
function blocoRetencao(rd, fx){
  const rf = fx.rf;
  if (!rf || !rf.usaTabela){
    const cat = categoriaRF(rd);
    if (!cat && S.fiscal.modoIRS === "tabela"){
      return '<div class="note" style="margin-top:12px">O regime desta fonte '+
        '('+esc((REGIMES_SS[rd.regime] || REGIMES_SS.dependente).lbl)+') não usa as tabelas de retenção '+
        'do trabalho dependente nem das pensões. A retenção, havendo, segue as regras próprias do regime — '+
        'aqui aplica-se a taxa efetiva definida em Definições.</div>';
    }
    return "";
  }

  const esc0 = rf.escalao;
  const parcela = Array.isArray(esc0.p)
    ? esc0.p[0]*esc0.p[1]*(esc0.p[2] - rf.mensal)
    : parseNum(esc0.p);
  const porDep = (rf.tabela.dep === "dep" ? parseNum(esc0.d) : 0) * rf.dependentes;

  const linhas = rf.detalhe.filter(d => d.base > 0).map(d =>
    '<tr><td>'+esc(d.rotulo)+(d.fator !== 1
        ? ' <span class="muted" style="font-size:11.5px">· '+esc((d.fator*12).toLocaleString("pt-PT",{maximumFractionDigits:2}))+
          '× por ano</span>' : "")+'</td>'+
    '<td class="r num">'+esc(eur(d.base))+'</td>'+
    '<td class="r num">'+esc(pct(d.base > 0 ? d.retencao/d.base*100 : 0))+'</td>'+
    '<td class="r num">'+esc(eur(d.retencao))+'</td>'+
    '<td class="r num">'+esc(eur(d.retencao * d.fator))+'</td></tr>').join("");

  return '<div style="margin-top:16px">'+
    secao(''+
      'Retenção na fonte — '+esc(rf.tabela.nome)+', '+esc(TABELAS_RF.regioes[rf.regiao].lbl)+'')+
    '<div class="note" style="margin-bottom:10px">'+esc(rf.tabela.situacao)+
      (rf.dependentes > 0 && rf.tabela.dep === "dep"
        ? ' · '+rf.dependentes+' dependente(s), '+esc(eur(porDep))+' a abater por pagamento' : "")+
      ' · escalão '+(esc0.sup ? 'superior a ' : 'até ')+esc(eur(esc0.a))+
      ', taxa marginal '+esc(pct(parseNum(esc0.t)*100))+'</div>'+
    '<div class="tblwrap"><table><thead><tr><th>Pagamento</th><th class="r">Valor</th>'+
      '<th class="r">Taxa efetiva</th><th class="r">Retenção</th><th class="r">Equiv./mês</th></tr></thead>'+
      '<tbody>'+linhas+'</tbody>'+
      '<tfoot><tr><td colspan="4">Retenção mensalizada</td>'+
      '<td class="r num">'+esc(eur(rf.retencao))+'</td></tr></tfoot></table></div>'+
    '<div class="note" style="margin-top:10px">Cálculo do escalão: '+
      esc(eur(rf.mensal))+' × '+esc(pct(parseNum(esc0.t)*100))+' − '+esc(eur(parcela))+
      (porDep > 0 ? ' − '+esc(eur(porDep))+' (dependentes)' : "")+
      ' = '+esc(eur(Math.max(0, rf.mensal*parseNum(esc0.t) - parcela - porDep)))+'. '+
      (Array.isArray(esc0.p)
        ? 'Neste escalão a parcela a abater é '+esc(String(esc0.p[0]).replace(".",","))+' × '+
          esc(String(esc0.p[1]).replace(".",","))+' × ('+esc(eur(esc0.p[2]))+' − remuneração).'
        : '')+
      '</div>'+
    '<div class="row no-print" style="margin-top:10px">'+
      '<div style="flex:0 0 auto"><label style="display:inline-flex;align-items:center;gap:7px;font-size:13.5px">'+
        '<input type="checkbox" data-act="rdDeficiencia" data-id="'+esc(rd.id)+'"'+(rd.deficiencia?" checked":"")+'> '+
        'Titular com deficiência (tabela própria)</label></div>'+
    '</div>'+
  '</div>';
}

/**
 * Deteta a dupla contagem mais fácil de cometer: pôr o vencimento a
 * «14× por ano» — que já embute os subsídios — e ainda acrescentar
 * componentes de férias e de Natal. A ferramenta não pode adivinhar
 * qual das duas o utilizador quis, mas pode dizer-lhe que escolha uma.
 */
function avisoDuplicacao(rd){
  const comps = rd.componentes || [];
  const catorze = comps.filter(c => c.frequencia === "catorze" &&
                                    (c.especie === "base" || c.especie === "pensao"));
  const subsidios = comps.filter(c => c.especie === "ferias" || c.especie === "natal");
  if (!catorze.length || !subsidios.length) return "";
  const excesso = subsidios.reduce((s,c) => s + compMensal(c), 0);
  return '<div class="note" style="margin-top:12px;border-left-color:var(--neg)">'+
    '<strong>Possível dupla contagem.</strong> «'+esc(catorze[0].nome || "Vencimento")+
    '» está a <em>14× por ano</em>, o que já inclui os subsídios de férias e de Natal, '+
    'e existem ainda '+subsidios.length+' componente(s) de subsídio à parte — '+
    esc(eur(excesso))+'/mês contados duas vezes. '+
    'Ou põe o vencimento a <em>mensal</em> e mantém os subsídios separados (dá mais controlo), '+
    'ou deixa-o a 14× e elimina-os.</div>';
}

/* Guarda o que já estava escrito quando a espécie ou um parâmetro da
   calculadora muda e o formulário tem de ser repintado. */
let rascunhoComponente = null;

/* Campos das calculadoras que, ao mudar, obrigam a repintar o formulário. */
const CAMPOS_CALC_COMPONENTE = [
  "cpModalidade", "cpNumBebes", "cpInternamento",
  "cpIdadeMeses", "cpMonoparental", "cpMenos36", "cpDeficiencia",
];

/** Lê o estado atual do formulário de componente, para o preservar num repintar. */
function capturarComponente(){
  const v = (id, prop) => { const el = $("#"+id); return el ? (prop === "checked" ? el.checked : el.value) : undefined; };
  const num = (id) => { const el = $("#"+id); return el ? parseNum(el.value) : undefined; };
  return {
    especie: v("cpEspecie"),
    nome: v("cpNome") || "",
    valor: num("cpValor"),
    frequencia: v("cpFreq"),
    categoriaId: v("cpCat"),
    ss: v("cpSS", "checked"), irs: v("cpIRS", "checked"),
    modalidade: v("cpModalidade"),
    numBebes: num("cpNumBebes"),
    internamento: num("cpInternamento"),
    idadeMeses: num("cpIdadeMeses"),
    monoparental: v("cpMonoparental", "checked"),
    menos36: v("cpMenos36", "checked"),
    deficiencia: v("cpDeficiencia", "checked"),
  };
}

/**
 * Seletor de espécies, agrupado em subcategorias. As prestações sociais —
 * abonos e subsídios pagos pela Segurança Social — ficam num grupo próprio,
 * distinto dos rendimentos de trabalho e dos rendimentos de capital.
 */
function seletorEspecies(selecionada){
  const grupos = [
    ["Rendimentos do trabalho", ["base","ferias","natal","alimentacao","extraordinario","premio","comissao","ajudas"]],
    ["Prestações sociais",      ["parentalidade","riscoGravidez","abonoFamilia","abonoPrenatal","abono"]],
    ["Pensões e outros",        ["pensao","renda","capitais","outro"]],
  ];
  const opt = (k) => ESPECIES[k]
    ? '<option value="'+k+'"'+(selecionada===k?" selected":"")+'>'+esc(ESPECIES[k].lbl)+'</option>' : "";
  return grupos.map(([titulo, ks]) =>
    '<optgroup label="'+esc(titulo)+'">'+ks.map(opt).join("")+'</optgroup>').join("");
}

/** Formulário inline de uma componente de rendimento. */
function formComponente(rd){

  const f = rascunhoComponente || c || {especie:"base", frequencia:"mensal"};
  const esp = especieDe(f.especie);
  const ssAtual  = f.ss  == null ? esp.ss  : !!f.ss;
  const irsAtual = f.irs == null ? esp.irs : !!f.irs;

  return '<div class="form no-print"><h3>'+(c ? "Editar componente" : "Nova componente")+'</h3>'+
    '<div class="row">'+
      '<div style="flex:0 0 200px"><label class="field" for="cpEspecie">Espécie</label>'+
        '<select id="cpEspecie">'+seletorEspecies(f.especie)+'</select></div>'+
      '<div style="flex:2 1 180px"><label class="field" for="cpNome">Designação</label>'+
        '<input id="cpNome" placeholder="'+esc(esp.lbl)+'" value="'+esc(f.nome || "")+'"></div>'+
      '<div style="flex:0 0 120px"><label class="field" for="cpValor">Valor (€)</label>'+
        '<input id="cpValor" inputmode="decimal" placeholder="0,00" value="'+valEur(f.valor)+'"></div>'+
      '<div style="flex:0 0 165px"><label class="field" for="cpFreq">Periodicidade</label>'+
        '<select id="cpFreq">'+Object.entries(FREQ).map(([k,v]) =>
          '<option value="'+k+'"'+(f.frequencia===k?" selected":"")+'>'+esc(v.lbl)+'</option>').join("")+'</select></div>'+
      '<div style="flex:1 1 170px"><label class="field" for="cpCat">Categoria</label>'+
        selectCategorias("cpCat", f.categoriaId, "rendimento")+'</div>'+
    '</div>'+
    '<div class="row" style="margin-top:9px">'+
      '<div style="flex:0 0 auto"><label class="field">Incidência</label>'+
        '<label style="display:inline-flex;align-items:center;gap:6px;font-size:13.5px;margin-right:14px">'+
          '<input type="checkbox" id="cpSS"'+(ssAtual?" checked":"")+'> Segurança Social</label>'+
        '<label style="display:inline-flex;align-items:center;gap:6px;font-size:13.5px">'+
          '<input type="checkbox" id="cpIRS"'+(irsAtual?" checked":"")+'> Retenção de IRS</label></div>'+
      '<div style="flex:1 1 auto"></div>'+

    (f.especie === "parentalidade" ? calculadoraParental(rd, f) : "")+
    (f.especie === "riscoGravidez" ? calculadoraRisco(rd) : "")+
    (f.especie === "abonoFamilia"  ? calculadoraAbono(f) : "")+
    (f.especie === "abonoPrenatal" ? calculadoraPrenatal(f) : "")+
    '<div class="actions">'+
      '<button class="btn primary" data-act="compSalvar" data-rd="'+esc(rd.id)+'">'+(c ? "Guardar" : "Adicionar")+'</button>'+
      '<button class="btn ghost" data-act="compCancelar">Cancelar</button>'+
    '</div>'+
    (f.especie === "alimentacao"
      ? '<div class="note" style="margin-top:11px">O subsídio de alimentação é isento até '+
        esc(eur(parseNum(S.fiscal.subsAlimCartao)))+'/dia em cartão-refeição ('+
        esc(eur(parseNum(S.fiscal.subsAlimIsento)))+' em numerário), por '+esc(parseNum(S.fiscal.diasUteis))+
        ' dias. O excedente é tributado. Ajuste os limites em Definições.</div>' : "")+
    '</div>';
}

/* ------------------------------- Plano mensal ------------------------------- */
function viewPlano(){
  const ed = editando.rec ? S.recorrentes.find(r => r.id === editando.rec) : null;
  const f = ed || {tipo:"despesa", frequencia:"mensal", ativo:true};

  const form =
    '<div class="form no-print"><h3>'+(ed ? "Editar rubrica" : "Nova rubrica do plano")+'</h3>'+

      '<input type="hidden" id="rcTipo" value="despesa">'+
      '<div style="flex:2 1 200px"><label class="field" for="rcNome">Designação</label>'+
        '<input id="rcNome" placeholder="Ex.: Renda de casa" value="'+esc(f.nome || "")+'"></div>'+
      '<div style="flex:1 1 170px"><label class="field" for="rcCat">Categoria</label>'+
        selectCategorias("rcCat", f.categoriaId, f.tipo || "despesa")+'</div>'+
      '<div style="flex:1 1 130px"><label class="field" for="rcMembro">Membro</label>'+
        selectMembros("rcMembro", f.membroId)+'</div>'+
      '<div style="flex:0 0 115px"><label class="field" for="rcValor">Valor (€)</label>'+
        '<input id="rcValor" inputmode="decimal" placeholder="0,00" value="'+valEur(f.valor)+'"></div>'+
      '<div style="flex:0 0 165px"><label class="field" for="rcFreq">Periodicidade</label>'+
        '<select id="rcFreq">'+Object.entries(FREQ).map(([k,v]) =>
          '<option value="'+k+'"'+(f.frequencia===k?" selected":"")+'>'+esc(v.lbl)+'</option>').join("")+'</select></div>'+
    '</div>'+
    '<div class="row" style="margin-top:9px">'+
      '<div style="flex:0 0 160px"><label class="field" for="rcInicio">Início (opcional)</label>'+
        '<input type="month" id="rcInicio" value="'+esc(mesDoDia(f.inicio) || "")+'"></div>'+
      '<div style="flex:0 0 160px"><label class="field" for="rcFim">Fim (opcional)</label>'+
        '<input type="month" id="rcFim" value="'+esc(mesDoDia(f.fim) || "")+'"></div>'+
      '<div style="flex:1 1 auto"></div>'+
    '</div>'+
    '<div class="actions">'+
      '<button class="btn primary" data-act="recSalvar">'+(ed ? "Guardar alterações" : "Adicionar ao plano")+'</button>'+
      (ed ? '<button class="btn ghost" data-act="cancelarEd" data-k="rec">Cancelar</button>' : "")+
    '</div></div>';

  const p = planoMes(MES);

  function bloco(tipo, titulo){
    // Ordem manual (arrastar) quando existe; senão, por peso mensal.
    const temOrdem = S.recorrentes.some(r => r.tipo === tipo && r.ordem != null);
    const itens = S.recorrentes.filter(r => r.tipo === tipo)
      .sort((a,b) => temOrdem
        ? (a.ordem != null ? a.ordem : 1e9) - (b.ordem != null ? b.ordem : 1e9)
        : recMensal(b) - recMensal(a));
    if (!itens.length) return '<div class="empty">Sem '+esc(titulo.toLowerCase())+' no plano.</div>';
    const total = itens.filter(r => recAtiva(r, MES)).reduce((s,r) => s + recMensal(r), 0);
    return '<div class="tblwrap"><table><thead><tr>'+
      '<th class="no-print" style="width:26px"></th>'+
      '<th>Designação</th><th>Categoria</th><th>Membro</th><th>Periodicidade</th>'+
      '<th class="r">Valor</th><th class="r">Equiv./mês</th><th class="no-print"></th></tr></thead><tbody>'+
      itens.map(r => {
        const ativa = recAtiva(r, MES);
        return '<tr draggable="true" data-drag="rec" data-id="'+esc(r.id)+'" style="'+(ativa ? "" : "opacity:.45")+'">'+
          '<td class="no-print pega" title="Arrastar para reordenar">⠿</td>'+
          '<td>'+esc(r.nome || "—")+(ativa ? "" : ' <span class="tag">inativa</span>')+'</td>'+
          '<td><span class="tag"><span class="dot" style="background:'+esc(catCor(r.categoriaId))+'"></span>'+esc(catRotulo(r.categoriaId))+'</span></td>'+
          '<td>'+esc(membroNome(r.membroId) || "—")+'</td>'+
          '<td>'+esc((FREQ[r.frequencia] || FREQ.mensal).lbl)+'</td>'+
          '<td class="r num">'+esc(eur(parseNum(r.valor)))+'</td>'+
          '<td class="r num"><strong>'+esc(eur(recMensal(r)))+'</strong></td>'+
          '<td class="r no-print" style="white-space:nowrap">'+

  const encargosAtivosMes = p.encargosAtivos || 0;

      ', já incluídos acima e distribuídos pelas categorias respetivas.</div>' : "";

  return '<div class="card"><div class="card-head"><div class="t"><h2>Despesas fixas</h2>'+

  '</div>';
}

/* ------------------------------- Limites ------------------------------- */
/**
 * Fração do mês já decorrida (0 a 1). Num mês passado ou futuro é 1 —
 * o mês está fechado, e o ritmo deixa de fazer sentido.
 */
function fracaoDoMes(){
  const [a, m] = MES.split("-").map(Number);
  const ultimo = new Date(a, m, 0).getDate();
  if (MES !== isoMes(hoje())) return 1;
  return Math.min(1, hoje().getDate() / ultimo);
}

/** Barra de utilização com a marca de onde se devia estar hoje. */
function barraRitmo(gasto, limite, cor){
  if (!(limite > 0)) return barra(gasto, limite, cor);
  const uso = Math.min(100, gasto / limite * 100);
  const excede = gasto > limite;
  const f = fracaoDoMes() * 100;
  const marca = (f < 99.5)
    ? '<span class="marcaRitmo" style="left:'+f.toFixed(1)+'%" title="Onde devia estar hoje"></span>' : "";
  return '<div class="bar comRitmo" style="height:14px">'+
    '<span style="width:'+uso.toFixed(1)+'%;background:'+esc(excede ? "var(--neg)" : (cor || "var(--accent)"))+'"></span>'+
    marca+'</div>';
}

/** Leitura em palavras do ritmo: quanto resta e quanto dá por dia. */
function textoRitmo(gasto, limite){
  if (!(limite > 0)) return "—";
  const resta = limite - gasto;
  if (resta < 0) return "excedeu " + eur(-resta);
  const dias = diasQueFaltam();
  if (MES !== isoMes(hoje()) || dias <= 0) return "—";
  const esperado = limite * fracaoDoMes();
  const ritmo = gasto <= esperado ? "no ritmo" : "acima do ritmo";
  return ritmo + " · " + eur(resta / dias) + "/dia";
}

/** Anel de progresso com a percentagem no centro. */
function anelProgresso(prog, cor, tamanho){
  const t = tamanho || 74, r = t/2 - 7, c = 2 * Math.PI * r;
  const bruto = parseNum(prog);
  const p = Number.isFinite(bruto) ? Math.max(0, Math.min(100, bruto)) : 0;
  const off = c * (1 - p/100);
  return '<svg class="anel" viewBox="0 0 '+t+' '+t+'" width="'+t+'" height="'+t+'" role="img" '+
    'aria-label="'+esc(pct(p))+' do objetivo">'+
    '<circle cx="'+t/2+'" cy="'+t/2+'" r="'+r+'" fill="none" stroke="var(--surface-3)" stroke-width="8"/>'+
    '<circle class="anel-prog" cx="'+t/2+'" cy="'+t/2+'" r="'+r+'" fill="none" stroke="'+esc(cor)+'" stroke-width="8" '+
      'stroke-linecap="round" stroke-dasharray="'+c.toFixed(1)+'" stroke-dashoffset="'+off.toFixed(1)+'" '+
      'style="--anel-c:'+c.toFixed(1)+'" transform="rotate(-90 '+t/2+' '+t/2+')"/>'+
    '<text x="'+t/2+'" y="'+(t/2 + 5)+'" text-anchor="middle" font-size="'+(t >= 70 ? 15 : 12)+'" '+
      'font-weight="700" fill="var(--text)">'+esc(Math.round(p))+'%</text></svg>';
}

/* Confete de celebração — uma vez por objetivo, e nunca com
   prefers-reduced-motion ativo. */
function festejar(){
  if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const cores = ["#4ade9b","#7aa2ff","#f0b64b","#ff8a7a","#a07ae8","#3a97d4"];
  const host = document.createElement("div");
  host.setAttribute("aria-hidden", "true");
  for (let i = 0; i < 44; i++){
    const f = document.createElement("i");
    f.className = "confete";
    f.style.left = (Math.random()*100).toFixed(1)+"vw";
    f.style.background = cores[i % cores.length];
    f.style.animationDelay = (Math.random()*0.5).toFixed(2)+"s";
    f.style.animationDuration = (1.8 + Math.random()*1.2).toFixed(2)+"s";
    f.style.transform = "rotate("+Math.round(Math.random()*360)+"deg)";
    host.appendChild(f);
  }
  document.body.appendChild(host);
  setTimeout(() => host.remove(), 3600);
}
/** Marca objetivos acabados de concluir e celebra a primeira vez. */
function celebrarConcluidos(){
  let novo = false;
  S.objetivos.forEach(o => {
    const feito = parseNum(o.alvo) > 0 && parseNum(o.atual) >= parseNum(o.alvo);
    if (feito && !o.celebrado){ o.celebrado = true; novo = true; }
  });
  if (novo) festejar();
}

/* ===============================================================
   Estratégias de Poupança e Investimento

   Simuladores por objetivo (reforma, entrada de casa, automóvel,
   fundo de emergência, investir). Cada instrumento é projetado com
   o seu tratamento fiscal português de 2026, e a estratégia pode
   ser executada para o orçamento (rubrica + ativo + objetivo).

   Fontes dos valores fiscais (confirmadas em várias):
     · Certificados de Aforro Série F — base = Euribor 3M, máx. 2,5%,
       + prémios de permanência do 2.º ano; juros a 28% (liberatória).
     · Mais-valias mobiliárias (ações, ETF, obrigações) — 28%; se
       detidas < 365 dias e rendimento no último escalão (≥ 86 634 €),
       englobamento obrigatório (até 48%). CIRS art.º 72.º; PwC 2026.
     · Criptoativos — isentos se detidos ≥ 365 dias; senão 28% (2023+).
     · PPR — dedução à coleta de 20% até ao limite pela idade; 8% no
       resgate nas condições legais. EBF art.º 21.º.
     · IMT/IS na compra — Ofício Circulado 40129/2026 da AT; isenção
       jovem ≤ 35 anos até 330 539 € (Continente).
   =============================================================== */

/* IMT 2026 — Continente, habitação própria e permanente.
   imposto = valor × taxa − parcela a abater, exceto nos dois últimos
   escalões, que aplicam uma taxa única sobre todo o valor. */
const IMT_HPP_2026 = [
  {ate:106346,   taxa:0,   abater:0,        unica:false},
  {ate:145470,   taxa:2,   abater:2126.92,  unica:false},
  {ate:198347,   taxa:5,   abater:6491.02,  unica:false},
  {ate:330539,   taxa:7,   abater:10457.96, unica:false},
  {ate:660982,   taxa:8,   abater:13763.35, unica:false},
  {ate:1150853,  taxa:6,   abater:0,        unica:true},
  {ate:Infinity, taxa:7.5, abater:0,        unica:true},
];
const IS_COMPRA_CASA   = 0.8;     // imposto de selo na aquisição (%)
const ISENCAO_JOVEM_IMT = 330539; // isenção total IMT + IS, jovem ≤ 35 (Continente)
const CUSTOS_ESCRITURA = 1200;    // registos + notário, estimativa

/** IMT devido na compra de habitação própria e permanente (Continente). */
function imtCompra(preco, jovem){
  const v = Math.max(0, parseNum(preco));
  if (jovem && v <= ISENCAO_JOVEM_IMT) return 0;
  const e = IMT_HPP_2026.find(x => v <= x.ate) || IMT_HPP_2026[IMT_HPP_2026.length - 1];
  return e.unica ? v * e.taxa / 100 : Math.max(0, v * e.taxa / 100 - e.abater);
}
/** Tudo o que é preciso juntar para comprar: entrada + IMT + selo + escritura. */
function custosCompraCasa(preco, ltv, jovem){
  const p = Math.max(0, parseNum(preco));
  const isento = !!jovem && p <= ISENCAO_JOVEM_IMT;
  const imt  = imtCompra(p, jovem);
  const selo = isento ? 0 : p * IS_COMPRA_CASA / 100;
  const financia = Math.max(0, Math.min(100, parseNum(ltv))) / 100;
  const entrada = p * (1 - financia);
  const custos = imt + selo + CUSTOS_ESCRITURA;
  return {preco:p, entrada, imt, selo, escritura:CUSTOS_ESCRITURA, custos,
          jovemIsento:isento, total: entrada + custos};
}

/* Como cada instrumento é tributado, para efeitos da simulação. */
function modoFiscalEstrategia(k){
  if (k === "ppr") return "ppr";
  const c = classeDe(k);
  if (c.grupo === "mercado") return k === "cripto" ? "cripto" : "mais_valias";
  if (c.fiscal === "capitais") return "juro_anual";
  return "isento";
}
/** Rótulo curto e explicação longa do regime fiscal de um instrumento. */
function tratamentoFiscal(k){
  const tCap = pct(parseNum(S.fiscal.capitais));
  switch (modoFiscalEstrategia(k)){
    case "ppr": return {
      curto:"8% no resgate + dedução no IRS",
      longo:"Não é tributado durante a acumulação. No resgate dentro das condições legais, "+
        pct(parseNum(S.fiscal.pprSaida))+" sobre o rendimento. As entregas dão dedução à coleta de "+
        pct(parseNum(S.fiscal.pprBeneficio))+", até "+eur(limitePPR(parseNum(S.estrategia.idade)))+
        "/ano conforme a idade (EBF art.º 21.º)."};
    case "mais_valias": return {
      curto:"Mais-valias a "+tCap+" no resgate",
      longo:"As mais-valias (categoria G) são tributadas a "+tCap+" à saída, sobre o ganho. Se detiver "+
        "menos de 365 dias e tiver rendimento coletável no último escalão (≥ 86 634 €), o englobamento "+
        "é obrigatório e a taxa efetiva pode subir até 48%."};
    case "cripto": return {
      curto:"Isento ≥ 1 ano; "+tCap+" antes",
      longo:"Criptoativos detidos 365 dias ou mais ficam isentos de mais-valias (declaram-se no anexo G1). "+
        "Vendidos antes de um ano, são tributados a "+tCap+". Regra em vigor desde 2023."};
    case "juro_anual": return {
      curto:"Juros a "+tCap+" (retidos na fonte)",
      longo:"Os juros são tributados a "+tCap+" (taxa liberatória), retidos quando creditados. Nos "+
        "Certificados de Aforro Série F a taxa base segue a média da Euribor a 3 meses, com o máximo de "+
        "2,5%, mais prémios de permanência a partir do 2.º ano."};
    default: return {curto:"Sem imposto relevante", longo:"Sem tributação relevante nesta simulação."};
  }
}

/**
 * Simula uma estratégia mês a mês, com o tratamento fiscal do instrumento.
 * Instrumentos de juro (depósitos, poupança, aforro, obrigações) capitalizam
 * ao retorno líquido — o imposto é retido a cada crédito de juros. Os de
 * mercado e o PPR crescem ao bruto e só pagam imposto no resgate.
 */
function simularEstrategia(cfg){
  const anos = Math.max(0, Math.min(60, Math.round(parseNum(cfg.anos) || 0)));
  const meses = anos * 12;
  const rAnual = parseNum(cfg.retornoBruto) / 100;
  const infl = parseNum(cfg.inflacao) / 100;
  const modo = cfg.modoFiscal;
  const tCap = parseNum(S.fiscal.capitais) / 100;
  const tPPR = parseNum(S.fiscal.pprSaida) / 100;

  const base = 1 + rAnual;
  const rMesBruto = base > 0 ? Math.pow(base, 1/12) - 1 : -1;
  const baseLiq = 1 + rAnual * (1 - tCap);
  const rMesLiq = baseLiq > 0 ? Math.pow(baseLiq, 1/12) - 1 : -1;
  const rMes = (modo === "juro_anual") ? rMesLiq : rMesBruto;

  const inicial = Math.max(0, parseNum(cfg.inicial));
  let saldo = inicial, aportado = inicial;
  let mensal = Math.max(0, parseNum(cfg.mensal));
  const cresc = parseNum(cfg.crescAnual) / 100;
  const limitePprAno = limitePPR(cfg.idade);
  let beneficioPPR = 0;

  const serie = [{ano:0, valor:saldo, aportado:0, real:saldo}];
  for (let m = 1; m <= meses; m++){
    saldo = saldo * (1 + rMes) + mensal;
    aportado += mensal;
    if (m % 12 === 0){
      if (modo === "ppr"){
        beneficioPPR += Math.min(mensal * 12 * parseNum(S.fiscal.pprBeneficio) / 100, limitePprAno);
      }
      mensal *= (1 + cresc);
      const ano = m / 12;
      serie.push({ano, valor:saldo, aportado: aportado - inicial, real: saldo / Math.pow(1 + infl, ano)});
    }
  }

  const valorBruto = saldo;
  const ganho = Math.max(0, valorBruto - aportado);
  let imposto = 0;
  if (modo === "mais_valias") imposto = ganho * tCap;
  else if (modo === "cripto")  imposto = anos >= 1 ? 0 : ganho * tCap;
  else if (modo === "ppr")     imposto = ganho * tPPR;
  const valorLiquido = valorBruto - imposto;
  return {
    anos, aportado, valorBruto, ganho, imposto, valorLiquido, beneficioPPR, modo, serie,
    real: valorLiquido / Math.pow(1 + infl, anos || 0),
    rendimento: valorLiquido - aportado,
  };
}

/* Três cenários de retorno, para a banda do gráfico (mesmos aportes). */
function estrategiaSeries(cfg){
  const mk = (aj) => simularEstrategia(Object.assign({}, cfg, {retornoBruto: parseNum(cfg.retornoBruto) + aj})).serie;
  return {base: mk(CENARIOS.base.aj), otimista: mk(CENARIOS.otimista.aj), pessimista: mk(CENARIOS.pessimista.aj)};
}

/* Poupança mensal necessária para atingir uma meta líquida, por bisseção
   (o valor final é monótono crescente na entrega mensal). */
function mensalParaMeta(cfg, meta){
  const alvo = Math.max(0, parseNum(meta));
  if (alvo <= 0) return 0;
  const val = (mensal) => simularEstrategia(Object.assign({}, cfg, {mensal})).valorLiquido;
  if (val(0) >= alvo) return 0;
  let lo = 0, hi = Math.max(50, alvo / 12);
  for (let i = 0; i < 50 && val(hi) < alvo; i++) hi *= 2;
  for (let i = 0; i < 60; i++){ const mid = (lo + hi) / 2; if (val(mid) < alvo) lo = mid; else hi = mid; }
  return (lo + hi) / 2;
}

/* Renda mensal que um capital sustenta pela regra dos 4% ao ano. */
const rendaSustentavel = (capital) => Math.max(0, parseNum(capital)) * 0.04 / 12;

/* Meta (€) de cada objetivo, e a decomposição que a explica. */
function metaObjetivo(e){
  const o = OBJETIVOS_ESTRATEGIA[e.objetivo] || {};
  if (o.casa){ const c = custosCompraCasa(e.precoCasa, e.ltv, e.jovemImt); return {meta:c.total, casa:c}; }
  if (o.auto) return {meta: Math.max(0, parseNum(e.precoAuto))};
  if (o.emergencia){ const desp = planoMes(MES).desp; return {meta: Math.max(0, parseNum(e.mesesEmerg)) * desp, despMensal:desp}; }
  return {meta: 0};
}

/* Configuração de simulação a partir do estado, com instrumento opcional. */
function cfgEstrategia(e, mensal, instrumento){
  const o = OBJETIVOS_ESTRATEGIA[e.objetivo] || OBJETIVOS_ESTRATEGIA.reforma;
  let inst = instrumento || e.instrumento;
  if (o.instrumentos.indexOf(inst) < 0) inst = o.instrumentos[0];
  return {
    inicial: parseNum(e.inicial),
    mensal: mensal != null ? mensal : parseNum(e.mensal),
    crescAnual: parseNum(e.crescAnual),
    anos: parseNum(e.anos),
    retornoBruto: classeDe(inst).ret,
    inflacao: parseNum(e.inflacao),
    modoFiscal: modoFiscalEstrategia(inst),
    idade: parseNum(e.idade),
    instrumento: inst,
  };
}

    'Retornos são estimativas de longo prazo, não garantias.</div>';

  const tf = tratamentoFiscal(cfg.instrumento);
  const notaFiscal = '<div class="note" style="margin-top:12px"><strong>'+esc(classeDe(cfg.instrumento).lbl)+' — tratamento fiscal:</strong> '+esc(tf.longo)+'</div>';

  const btnEsforco = (temMeta && mensalNec > 0)

    (temMeta ? ' e um <strong>objetivo</strong> com prazo' : '')+' — tudo ligado ao resto do orçamento.</div>';

  const aviso = '<div class="note" style="margin-top:12px"><strong>Aviso:</strong> é uma ferramenta de cálculo, não aconselhamento financeiro. '+
    'As projeções são aritmética sobre os pressupostos que indica; retornos passados não garantem retornos futuros. As decisões de investimento são suas.</div>';

  return '<div style="height:14px"></div><div class="grid g4" style="margin-bottom:4px">'+kpis+'</div>'+
    chart+blocoCasa+comparacao+notaFiscal+cenarios+executar+aviso;
