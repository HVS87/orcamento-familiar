   --------------------------------------------------------------- */
/** Cabeçalho clicável. `cols` mapeia coluna → função de extração. */
function th(tabela, col, rotulo, classe){
  const o = ordem[tabela];
  const ativo = o && o.col === col;
  const seta = ativo ? (o.dir === 1 ? " ▲" : " ▼") : "";
  /* `aria-sort` diz por onde está ordenado a quem não vê a seta; e o th fica
     cabeçalho de coluna em vez de botão, senão o leitor de ecrã perde a
     ligação entre a célula e a coluna a que ela pertence. A seta é desenho:
     lida em voz alta seria «triângulo apontando para cima». */
  const arias = ativo ? (o.dir === 1 ? "ascending" : "descending") : "none";
  return '<th class="sortable '+(classe || "")+(ativo ? " on" : "")+
    '" data-sort="'+esc(tabela)+'" data-col="'+esc(col)+'" aria-sort="'+arias+'" tabindex="0">'+
    esc(rotulo)+'<span class="seta" aria-hidden="true">'+seta+'</span></th>';
}
/** Ordena uma lista segundo o estado da tabela; `cols` são os extratores. */
function ordenado(lista, tabela, cols, omissao){
  const o = ordem[tabela] || omissao;
  if (!o || !cols[o.col]) return lista;
  const get = cols[o.col];
  return lista.slice().sort((a,b) => {
    const va = get(a), vb = get(b);
    let c;
    if (typeof va === "number" && typeof vb === "number") c = va - vb;
    else c = String(va == null ? "" : va).localeCompare(String(vb == null ? "" : vb), "pt");
    return c * o.dir;
  });
}

/* Estado da última gravação, para o indicador do cabeçalho. */
let _guardado = {em: null, erro: false};

/**
 * Grava o estado. `jaSerializado` é o texto de `S` quando quem chama acabou
 * de o produzir — evita percorrer o orçamento inteiro segunda vez. Quem não
 * o tiver não passa nada, e a função serializa como sempre.
 */
function guardar(jaSerializado){
  try{
    localStorage.setItem(STORE_KEY, jaSerializado || JSON.stringify(S));
    _guardado = {em: Date.now(), erro: false};
  }catch(e){
    // Só avisa à primeira: um armazenamento cheio falharia a cada tecla.
    if (!_guardado.erro) toast("Não foi possível guardar — o armazenamento do navegador está cheio ou bloqueado.");
    _guardado = {em: _guardado.em, erro: true};
  }
  pintarEstadoGuardado();
}

/** Texto discreto no cabeçalho: guardado quando, ou que falhou. */
function pintarEstadoGuardado(){
  const el = $("#estadoGuardado");
  if (!el) return;
  if (_guardado.erro){
    el.textContent = "⚠ por guardar";
    el.title = "A última gravação falhou. Exporte uma cópia em Dados ▾ para não perder o trabalho.";
    el.className = "neg";
    return;
  }
  if (!_guardado.em){ el.textContent = ""; el.title = ""; el.className = "muted"; return; }
  const seg = Math.round((Date.now() - _guardado.em) / 1000);
  el.textContent = seg < 5 ? "guardado" : seg < 60 ? "guardado há "+seg+"s"
    : "guardado há "+Math.round(seg/60)+" min";
  el.title = "Tudo é guardado neste navegador, a cada alteração.";
  el.className = "muted";
}
setInterval(pintarEstadoGuardado, 15000);
function carregar(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if (!raw) return false;
    const d = JSON.parse(raw);
    if (!d || typeof d !== "object") return false;
    S = normalizar(d);
    // Se a cópia vinha de uma versão anterior, grava já a forma atual —
    // caso contrário a migração repetir-se-ia a cada arranque.
    if (JSON.stringify(S) !== raw) guardar();
    return true;
  }catch(e){ return false; }
}
/* ---------------------------------------------------------------
   Sessão — onde se estava, e o que se estava a escrever

   Os dados já se guardam a cada alteração; o que se perdia era o
   contexto: a vista, o mês, os filtros, e sobretudo o formulário
   por gravar. Isto vive à parte dos dados, porque não é orçamento
   nenhum — é o sítio onde a pessoa estava sentada.
   --------------------------------------------------------------- */
const SESSAO_KEY = "orcamento-familiar-sessao";
const SESSAO_VALIDADE = 24 * 3600 * 1000;   // um dia

/** Valores em bruto dos campos de formulário em ecrã. */
function camposValores(){
  const out = {};
  $$(".form input, .form select, .form textarea").forEach(el => {
    if (!el.id) return;
    out[el.id] = (el.type === "checkbox" || el.type === "radio") ? (el.checked ? "1" : "") : el.value;
  });
  return out;
}

/* Fotografia dos campos tal como o formulário os pinta, tirada a cada
   repintura. É contra ela que se mede o que a pessoa escreveu — comparar
   com valores «por omissão» adivinhados nunca acerta em todos os casos. */
let _camposIniciais = {};

/**
 * Campos de formulário visíveis, e quantos foram mesmo mexidos.
 * Uma cor sugerida ou a data de hoje não são trabalho de ninguém: só
 * conta o que difere do que o formulário já trazia.
 */
function camposEmEdicao(){
  const valores = camposValores();
  let alterados = 0;
  Object.keys(valores).forEach(id => {
    if (valores[id] !== (_camposIniciais[id] || "")) alterados++;
  });
  return {valores, preenchidos: alterados};
}

function guardarSessao(){
  try{
    const campos = camposEmEdicao();
    localStorage.setItem(SESSAO_KEY, JSON.stringify({
      preenchidos: campos.preenchidos,
      em: Date.now(), vista: VIEW, mes: MES,
      secaoDespesa: ui.secaoDespesa, evolucaoMeses: ui.evolucaoMeses,
      abertos: ui.abertos, filtros: filtros,
      editando: {rd: editando.rd || null, pat: editando.pat || null, cr: editando.cr || null,
                 obj: editando.obj || null, rec: editando.rec || null, mov: editando.mov || null,
                 cat: editando.cat || null, comp: editando.comp || null, plan: editando.plan || null},
      campos: campos.preenchidos > 0 ? campos.valores : null,
    }));
  }catch(e){ /* sessão é conveniência: nunca deve estorvar */ }
}
let _sessaoT;
function guardarSessaoAdiado(){
  clearTimeout(_sessaoT);
  _sessaoT = setTimeout(guardarSessao, 600);
}

function lerSessao(){
  try{
    const raw = localStorage.getItem(SESSAO_KEY);
    if (!raw) return null;
    const s = JSON.parse(raw);
    if (!s || typeof s !== "object") return null;
    if (!s.em || Date.now() - s.em > SESSAO_VALIDADE) return null;
    return s;
  }catch(e){ return null; }
}

/**
 * Repõe o contexto da última visita: vista, mês, filtros e secções.
 * O formulário por gravar não é reposto em silêncio — perguntar é mais
 * honesto do que devolver texto que a pessoa já não espera ver.
 */
function restaurarSessao(){
  const s = lerSessao();
  if (!s) return;
  if (mesValido(s.mes)) MES = s.mes;
  // Uma sessão gravada por uma versão anterior pode nomear uma vista que
  // hoje é secção («movimentos», «patrimonio»): resolve-se o alias, em vez
  // de o reconhecer e ficar na mesma.
  const alias = ALIAS_VISTA[s.vista];
  if (alias){
    VIEW = alias.vista;
    if (alias.sec) ui.secaoDespesa = alias.sec;
  } else if (VISTAS[s.vista]) VIEW = s.vista;
  if (s.secaoDespesa && !(alias && alias.sec)) ui.secaoDespesa = s.secaoDespesa;
  if (s.evolucaoMeses) ui.evolucaoMeses = s.evolucaoMeses;
  if (s.abertos && typeof s.abertos === "object") ui.abertos = s.abertos;
  if (s.filtros && typeof s.filtros === "object") filtros = Object.assign(filtros, s.filtros);

  // Formulário por gravar: reabre-o e oferece devolver o que lá estava
  if (s.campos && s.editando){
    Object.keys(s.editando).forEach(k => { if (s.editando[k]) editando[k] = s.editando[k]; });
    render();
    const n = s.preenchidos || Object.keys(s.campos).length;
    confirmar("Recuperar o que estava a preencher?",
      "Da última vez ficou um formulário por gravar, com "+n+" campo(s) preenchido(s). Quer recuperá-lo?",
      () => { preencherCampos(s.campos); toast("Formulário recuperado — reveja e grave."); },
      "Recuperar");
  }
}

/** Devolve os valores guardados aos campos que ainda existirem em ecrã. */
function preencherCampos(campos){
  Object.keys(campos).forEach(id => {
    const el = document.getElementById(id);
    if (!el) return;
    if (el.type === "checkbox" || el.type === "radio") el.checked = campos[id] === "1";
    else el.value = campos[id];
    el.dispatchEvent(new Event("input", {bubbles:true}));
  });
}

/* Classes que mudaram de nome quando a carteira passou a fazer parte dos ativos. */
const MAPA_CLASSE_ANTIGA = {depositos:"deposito"};

/** Adivinha a espécie de um rendimento antigo a partir da designação. */
function adivinhaEspecie(nome){
  const n = String(nome || "").toLowerCase();
  if (/férias|ferias/.test(n)) return "ferias";
  if (/natal/.test(n)) return "natal";
  if (/aliment|refei/.test(n)) return "alimentacao";
  if (/suplementar|extraordin|horas extra/.test(n)) return "extraordinario";
  if (/prémio|premio|gratific|bónus|bonus/.test(n)) return "premio";
  if (/comiss/.test(n)) return "comissao";
  if (/ajudas de custo/.test(n)) return "ajudas";
  if (/abono|apoio|subsídio|subsidio/.test(n)) return "abono";
  if (/pensão|pensao|reforma/.test(n)) return "pensao";
  if (/renda/.test(n)) return "renda";
  if (/juros|dividend/.test(n)) return "capitais";
  if (/vencimento|salário|salario|ordenado/.test(n)) return "base";
  return "outro";
}

/** Garante que todas as coleções existem (compatibilidade futura). */
function normalizar(d){
  const base = estadoVazio();
  // `Object.assign({}, base, d)` e não `Object.assign(base, d)`: a segunda
  // forma sobrepõe os valores por omissão dentro do próprio `base`, e todos
  // os recursos a `base.X` mais abaixo passavam a ler o que veio no ficheiro
  // em vez do padrão. Bastava um `categorias:{}` para ficar sem categorias.
  const out = Object.assign({}, base, d);
  out.membros     = Array.isArray(d.membros) ? d.membros : [];
  // Cada membro tem um rosto: um emoji e uma cor, para as tabelas se lerem
  // de relance. Quem vem de uma versão anterior recebe-os por ordem.
  out.membros.forEach((m, i) => {
    if (!m.icone) m.icone = ROSTOS_MEMBRO[i % ROSTOS_MEMBRO.length].icone;
    if (!m.cor)   m.cor   = ROSTOS_MEMBRO[i % ROSTOS_MEMBRO.length].cor;
  });
  out.categorias  = Array.isArray(d.categorias) && d.categorias.length ? d.categorias : base.categorias;
  out.recorrentes = Array.isArray(d.recorrentes) ? d.recorrentes : [];
  // O dia do mês é opcional: sem ele, a rubrica não entra na linha do mês.
  out.recorrentes.forEach(r => { r.dia = diaDoMesValido(r.dia); });
  out.movimentos  = Array.isArray(d.movimentos) ? d.movimentos : [];
  out.objetivos   = Array.isArray(d.objetivos) ? d.objetivos : [];
  // Um objetivo ligado a um ativo que desapareceu volta a acompanhar-se à mão
  out.objetivos.forEach(o => {
    if (o.ativoId == null) o.ativoId = "";
    else o.ativoId = String(o.ativoId);
  });
  // Objetivos já concluídos em cópias antigas não voltam a ser celebrados.
  out.objetivos.forEach(o => {
    if (o.celebrado == null) o.celebrado = parseNum(o.alvo) > 0 && parseNum(o.atual) >= parseNum(o.alvo);
  });
  out.creditos    = Array.isArray(d.creditos) ? d.creditos : [];
  // Os limites são um mapa categoria→valor. Uma lista também passa o teste
  // de «objeto», mas um array com chaves de texto serializa como `[]`: os
  // limites desapareciam em silêncio na gravação seguinte.
  out.limites     = (d.limites && typeof d.limites === "object" && !Array.isArray(d.limites)) ? d.limites : {};
  out.projecao    = Object.assign({}, base.projecao, (d.projecao && typeof d.projecao === "object") ? d.projecao : {});
  out.estrategia  = Object.assign({}, base.estrategia, (d.estrategia && typeof d.estrategia === "object") ? d.estrategia : {});
  // Notas do mês: só chaves que sejam meses, e texto com tecto — é uma nota,
  // não um diário, e o estado inteiro passa pelo histórico a cada alteração.
  out.notas = {};
  if (d.notas && typeof d.notas === "object" && !Array.isArray(d.notas)){
    Object.keys(d.notas).forEach(m => {
      if (/^\d{4}-(0[1-9]|1[0-2])$/.test(m) && String(d.notas[m] || "").trim())
        out.notas[m] = String(d.notas[m]).slice(0, NOTA_MAX);
    });
  }
  out.fechados = {};
  if (d.fechados && typeof d.fechados === "object" && !Array.isArray(d.fechados)){
    Object.keys(d.fechados).forEach(m => {
      if (/^\d{4}-(0[1-9]|1[0-2])$/.test(m)) out.fechados[m] = {em: String((d.fechados[m] || {}).em || "")};
    });
  }
  // Instantâneos do património: um por mês, o último a valer, por ordem
  out.patrimonioHist = (Array.isArray(d.patrimonioHist) ? d.patrimonioHist : [])
    .filter(x => x && /^\d{4}-(0[1-9]|1[0-2])$/.test(x.mes))
    .map(x => ({mes: x.mes, ativo: parseNum(x.ativo), divida: parseNum(x.divida), liquido: parseNum(x.liquido)}));
  const porMes = {};
  out.patrimonioHist.forEach(x => { porMes[x.mes] = x; });
  out.patrimonioHist = Object.keys(porMes).sort().map(m => porMes[m]);

  out.planeadas = (Array.isArray(d.planeadas) ? d.planeadas : [])
    .filter(p => p && p.id)
    .map(p => ({
      id: String(p.id), nome: String(p.nome || "Compra planeada"),
      categoriaId: String(p.categoriaId || ""), membroId: String(p.membroId || ""),
      valor: parseNum(p.valor),
      horizonte: [3,6,12,24].indexOf(parseInt(p.horizonte, 10)) >= 0 ? parseInt(p.horizonte, 10) : 12,
      mes: mesValido(p.mes) ? p.mes : "",
      objetivoId: String(p.objetivoId || ""), feitaEm: String(p.feitaEm || ""),
      criadoEm: String(p.criadoEm || ""),
    }));
  // Uma reserva cujo objetivo desapareceu volta a estar por reservar.
  out.planeadas.forEach(p => {
    if (p.objetivoId && !out.objetivos.some(o => o.id === p.objetivoId)) p.objetivoId = "";
  });
  out.dicasOcultas = Array.isArray(d.dicasOcultas) ? d.dicasOcultas : [];
  out.tutorialVisto = !!d.tutorialVisto;
  out.exemploDemo = !!d.exemploDemo;
  out.paleta = PALETAS[d.paleta] ? d.paleta : "meianoite";
  out.densidade = d.densidade === "compacta" ? "compacta" : "conforto";
  out.comparar = !!d.comparar;
  out.regrasCategoria = (Array.isArray(d.regrasCategoria) ? d.regrasCategoria : [])
    .filter(r => r && typeof r.padrao === "string" && r.padrao.trim())
    .map(r => ({padrao: String(r.padrao).trim(), categoriaId: String(r.categoriaId || "")}));
  out.recorrenciasIgnoradas = Array.isArray(d.recorrenciasIgnoradas) ? d.recorrenciasIgnoradas : [];
  // Painel: só chaves conhecidas. Quem nunca configurou fica com o padrão,
  // e um cartão acrescentado numa versão futura aparece se for de padrão.
  const pn = (d.painel && typeof d.painel === "object") ? d.painel : {};
  const conhecida = (k) => !!CARTOES_PAINEL[k];
  out.painel = {
    ocultos: Array.isArray(pn.ocultos) ? pn.ocultos.filter(conhecida)
             : Object.keys(CARTOES_PAINEL).filter(k => !CARTOES_PAINEL[k].padrao),
    ordem: Array.isArray(pn.ordem) ? pn.ordem.filter(conhecida) : [],
    fechados: Array.isArray(pn.fechados) ? pn.fechados.filter(conhecida) : [],
  };
  out.texto = ["normal","grande","maior"].indexOf(d.texto) >= 0 ? d.texto : "normal";
  out.contraste = d.contraste === "alto" ? "alto" : "normal";
  out.cenarios = (Array.isArray(d.cenarios) ? d.cenarios : [])
    .filter(c => c && c.cfg && typeof c.cfg === "object")
    .map(c => ({nome: String(c.nome || "Cenário"), objetivo: String(c.objetivo || "reforma"),
      cfg: Object.assign({}, c.cfg,
        {instrumento: CLASSES[c.cfg.instrumento] ? c.cfg.instrumento : "aforro"})}));
  out.fiscal      = Object.assign({}, FISCAL_PADRAO, (d.fiscal && typeof d.fiscal === "object") ? d.fiscal : {});
  out.rendimentos = Array.isArray(d.rendimentos) ? d.rendimentos : [];

  // Ativos: aceita o nome atual e o anterior (`patrimonio`), de cópias antigas.
  out.ativos = Array.isArray(d.ativos) ? d.ativos
             : Array.isArray(d.patrimonio) ? d.patrimonio : [];
  delete out.patrimonio;

  // As posições da carteira passaram a ser ativos financeiros: uma poupança
  // é um ativo como outro qualquer, e é assim que tudo fica comparável.
  if (Array.isArray(d.investimentos) && d.investimentos.length){
    const jaMigrados = new Set(out.ativos.map(a => a.id));
    d.investimentos.forEach(i => {
      if (jaMigrados.has(i.id)) return;
      const classe = MAPA_CLASSE_ANTIGA[i.classe] || i.classe || "outros";
      out.ativos.push({
        id: i.id, nome: i.nome, classe,
        aquisicao: parseNum(i.investido), dataAquisicao: i.inicio || "",
        atual: parseNum(i.atual), quantidade: parseNum(i.quantidade), cotacao: parseNum(i.cotacao),
        valorizacao: (i.retorno === "" || i.retorno == null) ? "" : parseNum(i.retorno),
        queda: (i.queda === "" || i.queda == null) ? "" : parseNum(i.queda),
        contribuicao: parseNum(i.reforcoMensal), crescContrib: 0, reinvestimento: 100,
        aportes: [], encargos: [], rendimentos: [],
      });
    });
  }
  delete out.investimentos;

  // Os rendimentos deixaram de ser rubricas do plano e passaram a entidades
  // com componentes (base, subsídios, prémios…). Migra o que existia.
  const antigos = out.recorrentes.filter(r => r.tipo === "rendimento");
  if (antigos.length && !out.rendimentos.length){
    const porMembro = new Map();
    antigos.forEach(r => {
      const k = r.membroId || "";
      if (!porMembro.has(k)){
        porMembro.set(k, {
          id: uid("rd"), nome: k ? ("Rendimentos de " + (((d.membros||[]).find(m => m.id === k)||{}).nome || "membro")) : "Outros rendimentos",
          membroId: k, ativo: true, componentes: [],
        });
      }
      porMembro.get(k).componentes.push({
        id: uid("cp"), nome: r.nome, especie: adivinhaEspecie(r.nome),
        valor: parseNum(r.valor), frequencia: r.frequencia || "mensal",
        categoriaId: r.categoriaId,
        ss: null, irs: null,   // null = usa o tratamento por omissão da espécie
      });
    });
    out.rendimentos = Array.from(porMembro.values());
  }
  out.recorrentes = out.recorrentes.filter(r => r.tipo !== "rendimento");

  // Ícones das categorias: cópias antigas herdam o ícone da semente
  // pelo nome; categorias do utilizador ficam sem ícone até ele escolher.
  const seedIcones = categoriasSeed();
  out.categorias.forEach(c => {
    if (c.icone == null){
      const modelo = seedIcones.find(s => s.nome === c.nome);
      c.icone = modelo ? modelo.icone : "";
    }
  });

  // Categorias em falta em cópias anteriores a esta versão.
  const seed = categoriasSeed();
  ["Manutenção e reparações","Juros de crédito","Seguros de crédito","Amortização de capital",
   "IRS e Segurança Social","Vencimento","Prémios e variáveis","Juros e dividendos","Parentalidade"]
    .forEach(nome => {
      if (!out.categorias.some(c => c.nome === nome)){
        const modelo = seed.find(c => c.nome === nome);
        if (modelo) out.categorias.push(Object.assign({}, modelo, {id: uid("cat")}));
      }
    });

  // Ativos: garantir as coleções e migrar a antiga ligação bem → crédito.
  out.ativos.forEach(a => {
    if (!Array.isArray(a.encargos)) a.encargos = [];
    if (!Array.isArray(a.rendimentos)) a.rendimentos = [];
    if (!Array.isArray(a.aportes)) a.aportes = [];
    if (a.classe == null) a.classe = a.tipo || "outros";
    if (MAPA_CLASSE_ANTIGA[a.classe]) a.classe = MAPA_CLASSE_ANTIGA[a.classe];
    if (a.contribuicao == null) a.contribuicao = 0;
    if (a.crescContrib == null) a.crescContrib = 0;
    if (a.reinvestimento == null) a.reinvestimento = 100;
    if (a.vpt == null) a.vpt = 0;
    delete a.tipo;
    if (a.creditoId){
      const cr = out.creditos.find(c => c.id === a.creditoId);
      if (cr && !cr.ativoId) cr.ativoId = a.id;
      delete a.creditoId;
    }
  });

  out.rendimentos.forEach(r => {
    if (!Array.isArray(r.componentes)) r.componentes = [];
    if (r.ativo == null) r.ativo = true;
    if (!REGIMES_SS[r.regime]) r.regime = "dependente";
    r.deficiencia = !!r.deficiencia;
  });

  // Situação familiar e modo de cálculo do IRS, para cópias anteriores
  // às tabelas oficiais.
  if (!ESTADOS_CIVIS[out.fiscal.estadoCivil]) out.fiscal.estadoCivil = "nao_casado";
  if (!TABELAS_RF.regioes[out.fiscal.regiao]) out.fiscal.regiao = "continente";
  out.fiscal.monoparental = !!out.fiscal.monoparental;
  if (!(parseNum(out.fiscal.ias) > 0)) out.fiscal.ias = FISCAL_PADRAO.ias;
  // Componentes de prestações sociais: garantir os parâmetros próprios.
  out.rendimentos.forEach(r => (r.componentes || []).forEach(c => {
    if (c.especie === "parentalidade"){
      if (!modalidadeParental(c.modalidade)) c.modalidade = "inicial120";
      if (c.numBebes == null) c.numBebes = 1;
      if (c.internamento == null) c.internamento = 0;
    }
    if (c.especie === "abonoFamilia"){
      if (c.idadeMeses == null) c.idadeMeses = 0;
      // Cópias anteriores à opção de <36 meses: derivar da idade.
      if (c.menos36 == null) c.menos36 = parseNum(c.idadeMeses) < 36;
      c.deficiencia = !!c.deficiencia;
    }
    if (c.especie === "abonoPrenatal" && c.numBebes == null) c.numBebes = 1;
  }));
  if (out.fiscal.modoIRS !== "efetiva") out.fiscal.modoIRS = "tabela";
  out.fiscal.dependentes = Math.max(0, Math.round(parseNum(out.fiscal.dependentes)));

  // O limite do PPR deriva da idade — mantém-se coerente mesmo em cópias antigas.
  out.fiscal.pprLimiteAno = limitePPR(out.fiscal.pprIdade);

  // Créditos: valores por omissão dos campos introduzidos nesta versão.
  out.creditos.forEach(c => {
    if (!c.tipoTaxa) c.tipoTaxa = "fixa";
    if (c.ativoId == null) c.ativoId = "";
    if (c.indexante == null) c.indexante = "euribor6m";
    if (c.indexanteValor == null) c.indexanteValor = "";
    if (c.spread == null) c.spread = "";
    if (c.revisaoMeses == null) c.revisaoMeses = "";
    if (c.seguroMensal == null) c.seguroMensal = 0;
    if (c.categoriaJurosId == null) c.categoriaJurosId = "";
    if (c.categoriaCapitalId == null) c.categoriaCapitalId = "";
    if (c.categoriaSeguroId == null) c.categoriaSeguroId = "";
  });

  return out;
}
/* ---------------------------------------------------------------
   Histórico — desfazer e refazer

   Cada alteração guarda uma fotografia do estado anterior. É deliberado
   que seja o estado inteiro e não um diário de operações: o modelo é
   pequeno o suficiente, e assim nenhuma ação precisa de saber desfazer-se
   a si própria — o que seria uma fonte inesgotável de enganos.

   O tamanho está limitado por número de passos e por memória: quem
   importa um extrato grande não deve ficar com o navegador pesado.
   --------------------------------------------------------------- */
const HIST_MAX_PASSOS = 40;
const HIST_MAX_BYTES = 8 * 1024 * 1024;
let historico = {atras: [], frente: []};

function _histBytes(pilha){ return pilha.reduce((s,x) => s + x.json.length, 0); }
function _histAparar(){
  while (historico.atras.length > HIST_MAX_PASSOS ||
         (historico.atras.length > 1 && _histBytes(historico.atras) > HIST_MAX_BYTES)){
    historico.atras.shift();
  }
}
/** Repõe um estado guardado, com as caches limpas e o ecrã repintado. */
function _histRepor(json){
  S = normalizar(JSON.parse(json));
  limparCacheCredito();
  guardar();
  render();
}

const podeDesfazer = () => historico.atras.length > 0;
const podeRefazer  = () => historico.frente.length > 0;

function desfazer(){
  if (!podeDesfazer()){ toast("Nada para desfazer."); return false; }
  const passo = historico.atras.pop();
  historico.frente.push({json: JSON.stringify(S), rotulo: passo.rotulo});
  _histRepor(passo.json);
  toast("Desfeito: "+passo.rotulo+".");
  return true;
}
function refazer(){
  if (!podeRefazer()){ toast("Nada para refazer."); return false; }
  const passo = historico.frente.pop();
  historico.atras.push({json: JSON.stringify(S), rotulo: passo.rotulo});
  _histRepor(passo.json);
  toast("Refeito: "+passo.rotulo+".");
  return true;
}

/**
 * Aplica uma alteração ao estado, deixando-a desfazível.
 * `rotulo` é o que aparece no aviso ao desfazer — se faltar, usa-se um
 * genérico. Alterações que não mudam nada não sujam o histórico.
 */
/* Chaves que descrevem a aplicação e não o orçamento: mudar a paleta,
   arrumar uma sugestão ou reordenar os cartões do painel não faz de uns
   dados de demonstração um orçamento de alguém. */
const CHAVES_INTERFACE = ["paleta", "densidade", "texto", "contraste", "painel",
  "dicasOcultas", "tutorialVisto", "comparar", "exemploDemo",
  "recorrenciasIgnoradas"];
/** Alguma coisa mudou para lá da interface, entre estas duas fotografias? */
function mexeuNoOrcamento(antesJson, depoisJson){
  try{
    const a = JSON.parse(antesJson), b = JSON.parse(depoisJson);
    CHAVES_INTERFACE.forEach(k => { delete a[k]; delete b[k]; });
    return JSON.stringify(a) !== JSON.stringify(b);
  }catch(e){
    return true;   // na dúvida, deixou de ser demonstração
  }
}

function alterar(fn, rotulo){
  const antes = JSON.stringify(S);
  fn();
  limparCacheCredito();
  const depois = JSON.stringify(S);
  if (antes !== depois){
    /* Mexeu-se nos dados: deixaram de ser a família de demonstração intacta.
       A fotografia guardada acima ainda traz a marca, de modo que desfazer
       devolve também esta condição — como devolve tudo o resto.
       Só se pergunta enquanto a marca durar, que é pouco tempo e raro. */
    const eraDemo = S.exemploDemo;
    if (eraDemo && mexeuNoOrcamento(antes, depois)) S.exemploDemo = false;
    historico.atras.push({json: antes, rotulo: rotulo || "última alteração"});
    historico.frente.length = 0;   // um caminho novo apaga o futuro antigo
    _histAparar();
    /* `depois` é o estado por escrito, acabado de fazer: passá-lo poupa uma
       serialização inteira — com cinco anos de movimentos são 555 KB que não
       se voltam a percorrer. Só não serve se a marca de demonstração tiver
       caído entretanto, porque aí o texto já não descreve o que está em `S`. */
    guardar(S.exemploDemo === eraDemo ? depois : null);
  } else {
    guardar(depois);
  }
  render();
}

/* ---------------------------------------------------------------
   Consultas ao modelo
   --------------------------------------------------------------- */
const cat = (id) => S.categorias.find(c => c.id === id);
const catNome = (id) => { const c = cat(id); return c ? c.nome : "Sem categoria"; };
const catCor = (id) => { const c = cat(id); return c ? c.cor : "#8892a6"; };
/** Nome com o ícone à frente, para etiquetas e seletores. */
const catRotulo = (id) => {
  const c = cat(id);
  if (!c) return "Sem categoria";
  return (c.icone ? c.icone + " " : "") + c.nome;
};
const membro = (id) => S.membros.find(m => m.id === id);
const membroNome = (id) => { const m = membro(id); return m ? m.nome : ""; };
/** Nome com o rosto à frente, para seletores e etiquetas de texto. */
const membroRotulo = (id) => {
  const m = membro(id);
  if (!m) return "";
  return (m.icone ? m.icone + " " : "") + m.nome;
};
/** Pastilha com o rosto do membro, para as tabelas. */
function membroPastilha(id){
  const m = membro(id);
  if (!m) return '<span class="muted">—</span>';
  return '<span class="rosto" style="--rc:'+esc(m.cor || "var(--muted)")+'">'+
    '<span class="ri" aria-hidden="true">'+esc(m.icone || "")+'</span>'+esc(m.nome)+'</span>';
}

/** Uma rubrica recorrente está ativa no mês? */
function recAtiva(r, mes){
  if (r.ativo === false) return false;
  if (r.inicio && mesDoDia(r.inicio) > mes) return false;
  if (r.fim && mesDoDia(r.fim) < mes) return false;
  return true;
}
/** Valor mensal normalizado de uma rubrica (provisionamento). */
const recMensal = (r) => parseNum(r.valor) * freqFator(r.frequencia);

/* ---------------------------------------------------------------
   Rendimentos e fiscalidade

   Cada fonte de rendimento tem componentes (base, subsídios, trabalho
   suplementar, prémios…). Cada componente sabe se está sujeito a
   Segurança Social e a retenção de IRS; o subsídio de alimentação
   respeita o limite de isenção diária.
   --------------------------------------------------------------- */

const compMensal = (c) => parseNum(c.valor) * freqFator(c.frequencia);
/** Sujeição a SS/IRS: a do componente, se definida, senão a da espécie. */
const sujeitoSS  = (c) => (c.ss  == null ? especieDe(c.especie).ss  : !!c.ss);
const sujeitoIRS = (c) => (c.irs == null ? especieDe(c.especie).irs : !!c.irs);

/** Parte isenta do subsídio de alimentação, por mês. */
function isencaoAlimentacao(c){
  const f = S.fiscal;
  const limite = (c.cartao === false ? parseNum(f.subsAlimIsento) : parseNum(f.subsAlimCartao))
                 * Math.max(0, parseNum(f.diasUteis));
  return Math.min(compMensal(c), limite);
}

/**
 * Decomposição fiscal de uma fonte de rendimento, em valores mensais.
 * Devolve bruto, bases de incidência, SS, IRS, tributação autónoma e líquido.
 */
/** Taxa de Segurança Social aplicável a uma fonte, pelo seu regime. */
function taxaSS(rd){
  const r = REGIMES_SS[rd && rd.regime] || REGIMES_SS.dependente;
  if (rd && rd.regime === "independente") return parseNum(S.fiscal.ssIndependente);
  if (rd && rd.regime === "dependente")   return parseNum(S.fiscal.ssTrabalhador);
  return r.taxa;
}

/** Categoria de retenção de uma fonte: A no trabalho, H nas pensões. */
function categoriaRF(rd){
  const r = rd && rd.regime;
  if (r === "pensao") return "H";
  if (r === "independente" || r === "isento") return null;   // sem tabela aplicável
  return "A";
}

/**
 * Retenção na fonte de uma fonte de rendimento, pelas tabelas oficiais.
 *
 * A retenção incide sobre cada pagamento, não sobre uma média anual: os
 * subsídios de férias e de Natal são pagamentos autónomos e sofrem retenção
 * própria. Por isso:
 *   · as componentes mensais somam-se numa remuneração mensal e a tabela
 *     aplica-se uma vez a esse total;
 *   · cada componente de outra periodicidade é tratada como pagamento
 *     autónomo — a tabela aplica-se ao valor de cada pagamento e o
 *     resultado é mensalizado pela frequência.
 *
 * Devolve `usaTabela:false` quando o regime não tem tabela (independentes,
 * isentos) ou quando o utilizador escolheu a taxa efetiva à mão.
 */
function retencaoFonte(rd){
  const f = S.fiscal;
  const cat = categoriaRF(rd);
  if (f.modoIRS !== "tabela" || !cat) return {usaTabela:false, retencao:0};

  const chave = tabelaRF(cat, f.estadoCivil, f.dependentes, !!(rd && rd.deficiencia));
  const dependentes = parseNum(f.dependentes);

  let mensal = 0;
  const autonomas = [];
  for (const c of (rd.componentes || [])){
    if (especieDe(c.especie).aut) continue;      // tributado noutra categoria

    // O subsídio de alimentação tem de ser avaliado antes da sujeição a IRS:
    // a espécie está marcada como isenta, mas isso vale só até ao limite —
    // o excedente é remuneração como qualquer outra.
    if (c.especie === "alimentacao"){
      const excedente = compMensal(c) - isencaoAlimentacao(c);
      if (excedente > 0) mensal += excedente;
      continue;
    }

    if (!sujeitoIRS(c)) continue;
    if (c.frequencia === "mensal") mensal += parseNum(c.valor);
    else autonomas.push(c);
  }

  let retencao = retencaoRF(mensal, chave, dependentes);
  const detalhe = [{ rotulo:"Remuneração mensal", base:mensal,
                     retencao: retencaoRF(mensal, chave, dependentes), fator:1 }];

  for (const c of autonomas){
    const valor = parseNum(c.valor);
    const r = retencaoRF(valor, chave, dependentes);
    const fator = freqFator(c.frequencia);
    retencao += r * fator;
    detalhe.push({rotulo: c.nome || especieDe(c.especie).lbl, base:valor, retencao:r, fator});
  }

  const tab = tabRF(chave);
  return {usaTabela:true, retencao, chave, tabela: tab, regiao: regiaoRF(),
          mensal, escalao: escalaoRF(tab, mensal), detalhe, dependentes};
}

function fiscalRendimento(rd){
  if (_emPasse && _cacheFiscal.has(rd)) return _cacheFiscal.get(rd);
  const r = calcularFiscalRendimento(rd);
  if (_emPasse) _cacheFiscal.set(rd, r);
  return r;
}

function calcularFiscalRendimento(rd){
  const f = S.fiscal;
  let bruto = 0, baseSS = 0, baseIRS = 0, isento = 0, social = 0;
  const autonomos = {};   // categoria autónoma -> base

  for (const c of (rd.componentes || [])){
    const v = compMensal(c);
    if (!v) continue;
    bruto += v;
    const esp = especieDe(c.especie);
    if (esp.social) social += v;        // abonos e subsídios da Segurança Social

    if (esp.aut){                       // rendas, juros e dividendos
      autonomos[esp.aut] = (autonomos[esp.aut] || 0) + v;
      continue;
    }
    if (c.especie === "alimentacao"){   // isento até ao limite diário
      const livre = isencaoAlimentacao(c);
      isento += livre;
      const tributavel = v - livre;
      if (tributavel > 0){ baseSS += tributavel; baseIRS += tributavel; }
      continue;
    }
    if (sujeitoSS(c))  baseSS  += v;
    if (sujeitoIRS(c)) baseIRS += v;
    if (!sujeitoSS(c) && !sujeitoIRS(c)) isento += v;
  }

  const taxaContrib = taxaSS(rd);
  const ss  = baseSS  * taxaContrib / 100;
  const rf  = retencaoFonte(rd);
  const irs = rf.usaTabela ? rf.retencao : baseIRS * parseNum(f.irsEfetivo) / 100;
  let autonomo = 0;
  const detalheAutonomo = {};
  for (const [k, base] of Object.entries(autonomos)){
    const taxa = parseNum(f[k] != null ? f[k] : 0);
    const imposto = base * taxa / 100;
    detalheAutonomo[k] = {base, taxa, imposto};
    autonomo += imposto;
  }

  const carga = ss + irs + autonomo;
  return {bruto, baseSS, baseIRS, isento, social, ss, irs, autonomo, detalheAutonomo,
          taxaContrib, carga, liquido: bruto - carga, rf,
          taxaIRS: baseIRS > 0 ? irs / baseIRS * 100 : 0,
          taxaEfetiva: bruto > 0 ? carga / bruto * 100 : 0};
}

/** Soma da fiscalidade de todas as fontes ativas. */
function fiscalTotal(){
  const acc = {bruto:0, ss:0, irs:0, autonomo:0, isento:0, social:0, carga:0, liquido:0, baseSS:0, baseIRS:0};
  for (const rd of S.rendimentos){
    if (rd.ativo === false) continue;
    const x = fiscalRendimento(rd);
    acc.bruto += x.bruto; acc.ss += x.ss; acc.irs += x.irs;
    acc.autonomo += x.autonomo; acc.isento += x.isento; acc.social += x.social;
    acc.baseSS += x.baseSS; acc.baseIRS += x.baseIRS;
    acc.carga += x.carga; acc.liquido += x.liquido;
  }
  acc.taxaEfetiva = acc.bruto > 0 ? acc.carga / acc.bruto * 100 : 0;
  return acc;
}

/* ---------------------------------------------------------------
   Prestações de parentalidade e abono de família

   Não são rendimento tributável, mas fazem parte do orçamento — e são
   calculadas a partir do que a ferramenta já sabe: a remuneração de
   quem vai gozar a licença, e o rendimento do agregado.
   --------------------------------------------------------------- */

/** Mínimo diário do subsídio parental: 80% de 1/30 do IAS. */
const minimoParental = () => parseNum(S.fiscal.ias) / 30 * 0.80;
/** Mínimo diário do parental alargado: 40% de 1/30 do IAS. */
const minimoAlargado = () => parseNum(S.fiscal.ias) / 30 * 0.40;

/**
 * Remuneração de referência diária de uma fonte de rendimento.
 * A lei manda somar os primeiros seis dos últimos oito meses e dividir
 * por 180, sem subsídios de férias e de Natal. Com componentes já
 * mensalizadas, isso equivale à remuneração mensal a dividir por 30.
 */
function remuneracaoReferencia(rd){
  if (!rd) return 0;
  const mensal = (rd.componentes || [])
    .filter(c => c.frequencia === "mensal" && !especieDe(c.especie).isento && !especieDe(c.especie).aut)
    .reduce((s,c) => s + compMensal(c), 0);
  return mensal / 30;
}

/**
 * Subsídio parental mensal de uma modalidade, sobre uma remuneração de
 * referência diária. Nunca abaixo do mínimo legal.
 *
 * `opts.numBebes`      — parto múltiplo: cada bebé além do primeiro acrescenta
 *                        30 dias à licença.
 * `opts.internamento`  — dias de internamento do recém-nascido (prematuridade
 *                        até 33 semanas ou complicações): a licença é acrescida
 *                        de todo o internamento e de mais 30 dias, a 100%.
 * O valor mensal não muda com as extensões — o que muda é a duração total e,
 * portanto, o montante acumulado da licença.
 */
function subsidioParental(rrDiaria, chaveModalidade, opts){
  opts = opts || {};
  const m = modalidadeParental(chaveModalidade);
  const bruto = parseNum(rrDiaria) * m.pct / 100;
  const minimo = m.alargado ? minimoAlargado() : minimoParental();
  const diario = Math.max(minimo, bruto);

  const bebes = Math.max(1, Math.round(parseNum(opts.numBebes)) || 1);
  const diasMultiplos = (bebes - 1) * PARENTALIDADE.diasPorBebeExtra;
  const internamento = Math.max(0, Math.round(parseNum(opts.internamento)));
  const diasInternamento = internamento > 0 ? internamento + PARENTALIDADE.diasAposAltaInternamento : 0;

  const diasBase = m.dias + diasMultiplos;
  const diasTotal = diasBase + diasInternamento;
  // Os dias de internamento são pagos a 100% da referência (subsídio específico).
  const diarioInternamento = Math.max(minimoParental(), parseNum(rrDiaria));
  const total = diario * diasBase + diarioInternamento * diasInternamento;

  return {modalidade:m, diario, mensal: diario * 30,
          diasBase, diasInternamento, diasTotal, bebes,
          total, noMinimo: bruto < minimo};
}

/** Subsídio por risco clínico durante a gravidez: 100% da referência. */
function subsidioRiscoGravidez(rrDiaria){
  const diario = Math.max(minimoParental(), parseNum(rrDiaria) * PARENTALIDADE.riscoPct / 100);
  return {diario, mensal: diario * 30, noMinimo: parseNum(rrDiaria) < minimoParental()};
}

/**
 * Rendimento de referência do agregado para efeitos de abono: o
 * rendimento anual a dividir pelo número de titulares com direito
 * mais um. Usa o bruto das fontes ativas, excluindo as prestações
 * sociais — que não contam como rendimento para este efeito.
 */
function rendimentoReferenciaAbono(){
  let anual = 0;
  for (const rd of S.rendimentos){
    if (rd.ativo === false) continue;
    for (const c of (rd.componentes || [])){
      if (especieDe(c.especie).social) continue;
      anual += compMensal(c) * 12;
    }
  }
  const titulares = Math.max(0, Math.round(parseNum(S.fiscal.dependentes)));
  return anual / (titulares + 1);
}

/**
 * Conta as crianças com menos de 36 meses declaradas no agregado, para a
 * majoração dos agregados com duas ou mais. Cada componente de abono com a
 * marca `menos36` conta uma criança.
 */
function contarMenos36(excluirId){
  let n = 0;
  for (const rd of S.rendimentos){
    if (rd.ativo === false) continue;
    for (const c of (rd.componentes || [])){
      if (c.especie !== "abonoFamilia") continue;
      if (excluirId && c.id === excluirId) continue;
      if (c.menos36) n++;
    }
  }
  return n;
}

/**
 * Abono de família mensal por criança. Soma quatro parcelas:
 *   · o valor base do escalão, pela idade;
 *   · a majoração monoparental (50% sobre a base);
 *   · o acréscimo por criança com menos de 36 meses, se o agregado tiver 2+;
 *   · a bonificação por deficiência, se aplicável.
 *
 * `opts.numMenos36` é o total de crianças com menos de 36 meses no agregado
 * (incluindo esta). `opts.deficiencia` marca a criança com deficiência.
 */
function abonoFamilia(idadeMeses, monoparental, opts){
  opts = opts || {};
  const rr = rendimentoReferenciaAbono();
  const e = escalaoAbono(rr);
  const idade = Math.max(0, parseNum(idadeMeses));
  const base = idade <= 36 ? e.ate36 : (idade <= 72 ? e.ate72 : e.mais72);
  const mono = monoparental != null ? monoparental : !!S.fiscal.monoparental;

  const majMono = base * (mono ? ABONO_FAMILIA.majoracaoMonoparental/100 : 0);
  // O acréscimo só se aplica a crianças que são efetivamente menores de 36 meses.
  const eMenos36 = opts.menos36 != null ? !!opts.menos36 : idade < 36;
  const acrescimo36 = eMenos36 ? acrescimoMenos36(opts.numMenos36, e.n) : 0;
  const bonusDef = opts.deficiencia ? bonificacaoDeficiencia(idade, mono) : 0;

  const valor = base + majMono + acrescimo36 + bonusDef;
  return {escalao:e, rendimentoReferencia:rr, base, monoparental:mono,
          majMono, acrescimo36, bonusDef, valor,
          semDireito: valor <= 0};
}

/**
 * Abono de família pré-natal, a partir da 13.ª semana de gravidez.
 * Mesmos escalões que o abono de crianças até 36 meses, multiplicado pelo
 * número de bebés esperados (gémeos ×2, trigémeos ×3), com majoração
 * monoparental própria de 35%.
 */
function abonoPrenatal(numBebes, monoparental){
  const rr = rendimentoReferenciaAbono();
  const e = escalaoAbono(rr);
  const bebes = Math.max(1, Math.round(parseNum(numBebes)) || 1);
  const mono = monoparental != null ? monoparental : !!S.fiscal.monoparental;
  const base = e.ate36 * bebes;
  const valor = base * (mono ? 1 + ABONO_FAMILIA.majoracaoPrenatalMonoparental/100 : 1);
  return {escalao:e, rendimentoReferencia:rr, base, bebes, monoparental:mono, valor,
          semDireito: valor <= 0};
}

/* Impostos que recaem sobre os ativos, em valor mensal. */
/**
 * Imposto anual pago em dinheiro sobre um ativo — IMI nos imóveis, IUC nos
 * veículos. Os impostos sobre juros e mais-valias não entram aqui: são
 * retidos na fonte, pelo que se refletem no retorno líquido do ativo
 * (ver `retornoLiquido`), não numa despesa mensal.
 */
function impostoAtivo(a){
  const f = S.fiscal;
  const regime = classeDe(a.classe).fiscal;
  if (regime === "imovel"){
    const vpt = parseNum(a.vpt);
    const base = vpt > 0 ? vpt : valorAtivo(a);   // sem VPT, aproxima pelo valor
    return {nome:"IMI", anual: base * parseNum(f.imiTaxa) / 100, estimado: vpt <= 0};
  }
  if (regime === "automovel"){
    return {nome:"IUC", anual: Math.max(0, parseNum(a.iuc)), estimado:false};
  }
  if (regime === "ppr"){
    return {nome:"Sem imposto anual", anual:0, estimado:false, nota:"tributado só à saída"};
  }
  return {nome:"—", anual:0, estimado:false};
}
/** Carga fiscal mensal, em dinheiro, sobre todos os ativos. */
const impostosAtivosMes = () => S.ativos.reduce((s,a) => s + impostoAtivo(a).anual/12, 0);

/* Taxas que dependem do ano e não do contribuinte. As restantes — taxa
   efetiva de IRS, idade, dias de subsídio, situação familiar, região —
   são escolhas de quem usa a ferramenta e nunca são substituídas. */
const TAXAS_ANUAIS = [
  {k:"ssTrabalhador",      lbl:"Segurança Social, conta de outrem",  fmt:"pct"},
  {k:"ssIndependente",     lbl:"Segurança Social, independentes",    fmt:"pct"},
  {k:"capitais",           lbl:"Taxa liberatória",                   fmt:"pct"},
  {k:"rendas",             lbl:"Rendas, taxa base",                  fmt:"pct"},
  {k:"rendaModerada",      lbl:"Rendas, renda moderada",             fmt:"pct"},
  {k:"limiteRendaModerada",lbl:"Teto da renda moderada",             fmt:"eur"},
  {k:"imiTaxa",            lbl:"IMI sobre o VPT",                    fmt:"pct"},
  {k:"subsAlimIsento",     lbl:"Subsídio de alimentação, numerário", fmt:"eur"},
  {k:"subsAlimCartao",     lbl:"Subsídio de alimentação, cartão",    fmt:"eur"},
  {k:"ias",                lbl:"IAS — Indexante dos Apoios Sociais", fmt:"eur"},
  {k:"pprBeneficio",       lbl:"PPR, dedução à coleta",              fmt:"pct"},
  {k:"pprSaida",           lbl:"PPR, taxa à saída",                  fmt:"pct"},
  {k:"pprSaidaFora",       lbl:"PPR, resgate fora das condições",    fmt:"pct"},
];

/**
 * Compara as taxas guardadas com as do ano corrente da ferramenta.
 * Existe para não deixar ninguém a orçamentar com valores de um ano
 * anterior só porque tinha uma cópia gravada — sem lhes mexer sem aviso.
 */
function taxasDesatualizadas(){
  const guardado = parseNum(S.fiscal.ano) || 0;
  if (guardado >= FISCAL_PADRAO.ano) return [];
  return TAXAS_ANUAIS
    .filter(t => Math.abs(parseNum(S.fiscal[t.k]) - parseNum(FISCAL_PADRAO[t.k])) > 1e-9)
    .map(t => Object.assign({}, t, {antigo: parseNum(S.fiscal[t.k]), novo: parseNum(FISCAL_PADRAO[t.k])}));
}

/**
 * Benefício fiscal anual das entregas em PPR (dedução à coleta, EBF art.º 21.º).
 * O limite depende da idade do titular: 400 € até aos 35, 350 € dos 35 aos 50,
 * 300 € acima disso.
 */
function beneficioPPR(){
  const f = S.fiscal;
  const entregas = S.ativos
    .filter(a => a.classe === "ppr")
    .reduce((s,a) => s + parseNum(a.contribuicao) * 12, 0);
  const limite = limitePPR(f.pprIdade);
  const bruto = entregas * parseNum(f.pprBeneficio) / 100;
  return {entregas, limite, beneficio: Math.min(bruto, limite), limitado: bruto > limite};
}

/**
 * Taxa autónoma aplicável às rendas de um ativo (categoria F).
 * A duração do contrato reduz a taxa; os arrendamentos não habitacionais
 * mantêm-se nos 28%.
 */
/**
 * A renda moderada da Lei n.º 9-A/2026 tem condições: contrato de habitação
 * com pelo menos três anos e renda mensal até ao teto legal. Não basta
 * marcar a opção — se a renda exceder o teto, o benefício não se aplica.
 */
function elegivelRendaModerada(a){
  if (!a || !a.contratoModerada || a.contratoNaoHabitacional) return false;
  return rendimentosMensais(a) <= parseNum(S.fiscal.limiteRendaModerada);
}

function taxaRenda(a){
  if (a && a.contratoNaoHabitacional) return 28;
  if (elegivelRendaModerada(a)) return parseNum(S.fiscal.rendaModerada);
  const anos = parseNum(a && a.contratoAnos);
  if (anos >= 20) return 5;
  if (anos >= 10) return 10;
  if (anos >= 5)  return 15;
  return parseNum(S.fiscal.rendas);
}
/** Descrição legível do regime de tributação das rendas de um ativo. */
function regimeRenda(a){
  if (a && a.contratoNaoHabitacional) return "Não habitacional";
  if (elegivelRendaModerada(a)) return "Habitação, renda moderada";
  const anos = parseNum(a && a.contratoAnos);
  if (anos >= 20) return "Habitação, 20 anos ou mais";
  if (anos >= 10) return "Habitação, 10 a menos de 20 anos";
  if (anos >= 5)  return "Habitação, 5 a menos de 10 anos";
  return "Habitação, contrato até 5 anos";
}

/* ---------------------------------------------------------------
   Passe de cálculo

   Uma repintura chama `planoMes` uma vez por mês do gráfico de evolução,
   e cada uma dessas chamadas recalcula a fiscalidade de todas as fontes —
   que não depende do mês. Resultado: dezenas de cálculos idênticos por
   render.

   A cache vive apenas durante uma passagem síncrona de cálculo, aberta
   por `render()` e pelos produtores dos deslizadores. Fora de uma
   passagem não há cache nenhuma: o estado pode ter mudado entretanto, e
   devolver um valor guardado seria mentir. É por isso que a cache é
   explicitamente aberta e fechada, em vez de invalidada por eventos.
   --------------------------------------------------------------- */
let _emPasse = false;
let _cachePlano = new Map();
let _cacheReal = new Map();
let _cacheValor = new WeakMap();
let _cacheFiscal = new WeakMap();

/** Corre `fn` dentro de uma passagem de cálculo com cache. */
function emPasse(fn){
  const jaEstava = _emPasse;
  if (!jaEstava){
    _emPasse = true;
    _cachePlano.clear();
    _cacheReal.clear();
    _cacheValor = new WeakMap();
    _cacheFiscal = new WeakMap();
  }
  try { return fn(); }
  finally { if (!jaEstava) _emPasse = false; }
}

/**
 * Totais do plano (previsto) para um mês.
 * Reúne três origens, todas encaminhadas para as categorias respetivas:
 *   1. rubricas recorrentes introduzidas à mão;
 *   2. créditos — a prestação é decomposta em juros, amortização de capital e seguros;
 *   3. ativos — encargos (IMI, condomínio, manutenção…) e rendimentos (rendas).
 */
function planoMes(mes){
  if (_emPasse && _cachePlano.has(mes)) return _cachePlano.get(mes);
  const r = calcularPlanoMes(mes);
  if (_emPasse) _cachePlano.set(mes, r);
  return r;
}

function calcularPlanoMes(mes){
  const rubricas = S.recorrentes.filter(r => recAtiva(r, mes));
  let rend = 0, desp = 0;
  const porCat = {};
  const add = (cid, v) => { if (v) porCat[cid] = (porCat[cid] || 0) + v; };

  for (const r of rubricas){
    const v = recMensal(r);
    if (r.tipo === "rendimento") rend += v; else desp += v;
    add(r.categoriaId, v);
  }

  // Rendimentos: entram líquidos de SS e IRS quando a fiscalidade está ligada.
  let brutoRend = 0, cargaRend = 0;
  for (const rd of S.rendimentos){
    if (rd.ativo === false) continue;
    const fx = fiscalRendimento(rd);
    brutoRend += fx.bruto; cargaRend += fx.carga;
    for (const c of (rd.componentes || [])){
      const v = compMensal(c);
      if (v) add(c.categoriaId || catPorNome("Outros rendimentos"), v);
    }
  }
  // O bruto entra como rendimento e a carga fiscal sai como despesa: assim
  // ambos ficam visíveis nas categorias, em vez de desaparecerem numa subtração.
  const contarIRS = S.fiscal.contarIRS !== false;
  rend += brutoRend;
  if (contarIRS && cargaRend > 0){
    desp += cargaRend;
    add(catPorNome("IRS e Segurança Social"), cargaRend);
  }

  // Impostos que recaem sobre os ativos e são pagos em dinheiro (IMI, IUC).
  let impostosAtivos = 0;
  for (const a of S.ativos){
    const imp = impostoAtivo(a);
    const v = imp.anual / 12;
    if (v > 0){ desp += v; impostosAtivos += v; add(a.categoriaImpostoId || catPorNome("Impostos"), v); }
  }

  // Créditos: juros são despesa corrente, a amortização constrói património.
  const detalheCredito = [];
  for (const cr of S.creditos){
    const p = parcelaMes(cr, mes);
    if (!p) continue;
    desp += p.juros + p.capital + p.seguro;
    add(catCredito(cr, "juros"), p.juros);
    add(catCredito(cr, "capital"), p.capital);
    add(catCredito(cr, "seguro"), p.seguro);
    detalheCredito.push({credito: cr, parcela: p});
  }

  // Ativos: encargos de posse e rendimentos gerados. Cada arrendamento é
  // tributado à taxa do seu contrato, não a uma taxa única.
  let encargosAtivos = 0, rendaAtivos = 0, impostoRendas = 0;
  for (const a of S.ativos){
    for (const e of (a.encargos || [])){
      const v = parseNum(e.valor) * freqFator(e.frequencia);
      desp += v; encargosAtivos += v;
      add(e.categoriaId || catPorNome("Manutenção e reparações"), v);
    }
    let rendaDoAtivo = 0;
    for (const r of (a.rendimentos || [])){
      const v = parseNum(r.valor) * freqFator(r.frequencia);
      rend += v; rendaAtivos += v; rendaDoAtivo += v;
      add(r.categoriaId || catPorNome("Rendas recebidas"), v);
    }
    if (contarIRS && rendaDoAtivo > 0 && classeDe(a.classe).fiscal === "imovel"){
      impostoRendas += rendaDoAtivo * taxaRenda(a) / 100;
    }
  }
  if (impostoRendas > 0){
    desp += impostoRendas;
    add(catPorNome("IRS e Segurança Social"), impostoRendas);
  }

  return {rend, desp, saldo: rend - desp, porCat, itens: rubricas,
          detalheCredito, encargosAtivos, rendaAtivos, impostoRendas,
          brutoRend, cargaRend: (contarIRS ? cargaRend : 0) + impostoRendas, impostosAtivos};
}

/** Totais reais (movimentos) de um mês. */
function realMes(mes){
  // Entra no passe como o plano: o painel pede o mesmo mês dezenas de
  // vezes (tesouraria e mapa anual pedem doze cada um), e cada chamada
  // sem cache varria a lista inteira de movimentos.
  if (_emPasse && _cacheReal.has(mes)) return _cacheReal.get(mes);
  const movs = S.movimentos.filter(m => mesDoDia(m.data) === mes);
  let rend = 0, desp = 0;
  const porCat = {};
  for (const m of movs){
    const v = Math.abs(parseNum(m.valor));
    if (m.tipo === "rendimento") rend += v; else desp += v;
    porCat[m.categoriaId] = (porCat[m.categoriaId] || 0) + v;
  }
  const r = {rend, desp, saldo: rend - desp, porCat, itens: movs};
  if (_emPasse) _cacheReal.set(mes, r);
  return r;
}

/** Despesa real por grupo (necessidades/desejos/poupança) num mês. */
function porGrupo(mes){
  const r = realMes(mes);
  const g = {necessidades:0, desejos:0, poupanca:0};
  for (const m of r.itens){
    if (m.tipo !== "despesa") continue;
    const c = cat(m.categoriaId);
    const k = (c && c.grupo) ? c.grupo : "desejos";
    if (g[k] != null) g[k] += Math.abs(parseNum(m.valor));
  }
  return g;
}

/** Categoria por nome, com recurso à primeira despesa se não existir. */
function catPorNome(nome){
  const c = S.categorias.find(x => x.nome === nome);
  return c ? c.id : ((S.categorias.find(x => x.tipo === "despesa") || {}).id || "");
}
/** Categoria onde cai cada componente da prestação de um crédito. */
const CAT_CREDITO = {
  juros:   "Juros de crédito",
  capital: "Amortização de capital",
  seguro:  "Seguros de crédito",
};
function catCredito(cr, parte){
  const escolhida = cr["categoria" + parte.charAt(0).toUpperCase() + parte.slice(1) + "Id"];
  return escolhida || catPorNome(CAT_CREDITO[parte]);
}

/** Existe algum dado introduzido pelo utilizador? */
function temDados(){
  return S.movimentos.length || S.recorrentes.length || S.objetivos.length ||
         S.creditos.length || S.rendimentos.length || S.ativos.length;
}

/* ---------------------------------------------------------------
   Crédito — tabela de amortização (prestação constante, método francês)

   A tabela é gerada mês a mês, o que permite tratar taxa fixa e taxa
   variável com o mesmo código: numa taxa indexada, a prestação é
   recalculada em cada revisão sobre o capital e o prazo que restam.
   --------------------------------------------------------------- */

const inicioCredito = (cr) => cr.inicio ? mesDoDia(cr.inicio) : MES;
const prazoCredito = (cr) => Math.max(0, Math.round(parseNum(cr.prazoMeses)));

/** Taxa nominal em vigor hoje (%): fixa, ou indexante + spread. */
function taxaCorrente(cr){
  return cr.tipoTaxa === "variavel"
    ? parseNum(cr.indexanteValor) + parseNum(cr.spread)
    : parseNum(cr.taxaAnual);
}
/** Periodicidade de revisão da taxa, em meses. */
function revisaoCredito(cr){
  if (cr.tipoTaxa !== "variavel") return 0;
  const r = Math.round(parseNum(cr.revisaoMeses));
  return r > 0 ? r : (INDEXANTES[cr.indexante] || INDEXANTES.euribor6m).revisao;
}

/* Cache das tabelas: recalcular 360 linhas a cada repintura seria desperdício. */
const _tabelas = new Map();
function chaveCredito(cr, choque){
  // O mês em análise entra na chave: o choque de taxa aplica-se a partir dele,
  // pelo que a mesma tabela vista em meses diferentes não é a mesma tabela.
  return [cr.id, cr.capital, cr.prazoMeses, cr.inicio, cr.tipoTaxa, cr.taxaAnual,
          cr.indexante, cr.indexanteValor, cr.spread, cr.revisaoMeses, choque, MES].join("|");
}

/**
 * Tabela completa: [{k, mes, taxa, prestacao, juros, capital, saldo}].
 * `choque` desloca o indexante em pontos percentuais, a partir do mês corrente
 * (só afeta crédito de taxa variável — numa taxa fixa não há nada a deslocar).
 */
function tabelaCredito(cr, choque){
  choque = parseNum(choque) || 0;
  const chave = chaveCredito(cr, choque);
  if (_tabelas.has(chave)) return _tabelas.get(chave);

  const n = prazoCredito(cr);
  const C = parseNum(cr.capital);
  const linhas = [];
  if (n > 0 && C > 0){
    const inicio = inicioCredito(cr);
    const revisao = revisaoCredito(cr);
    const variavel = cr.tipoTaxa === "variavel";
    const base = taxaCorrente(cr);
    // O choque entra a partir do mês em análise, não retroativamente.
    const kChoque = Math.max(0, mesDiff(inicio, MES));

    let saldo = C, A = 0, i = 0;
    for (let k = 0; k < n; k++){
      const aplicaChoque = variavel && choque !== 0 && k >= kChoque;
      const taxa = Math.max(0, base + (aplicaChoque ? choque : 0));
      // Recalcula a prestação no arranque e em cada revisão da taxa.
      if (k === 0 || (revisao > 0 && k % revisao === 0)){
        i = taxa / 100 / 12;
        const resto = n - k;
        A = i === 0 ? saldo / resto : saldo * i / (1 - Math.pow(1 + i, -resto));
      }
      const juros = saldo * i;
      const capital = Math.min(Math.max(0, A - juros), saldo);
      saldo = Math.max(0, saldo - capital);
      linhas.push({k, mes: mesShift(inicio, k), taxa, prestacao: juros + capital, juros, capital, saldo});
    }
  }
  // Cache modesta: chega para as tabelas em ecrã e os cenários em simulação.
  if (_tabelas.size > 60) _tabelas.clear();
  _tabelas.set(chave, linhas);
  return linhas;
}
/** Invalida o cache quando os créditos mudam. */
const limparCacheCredito = () => _tabelas.clear();

/**
 * Amortizar um crédito mais depressa: quantos meses poupa e quantos juros.
 * Parte do capital em dívida no mês em análise e simula mês a mês com a
 * prestação atual mais o reforço. A taxa usada é a corrente — numa taxa
 * indexada ela mudará, e por isso o resultado é uma estimativa, não uma
 * promessa.
 */
function simularReforco(cr, extra, mes){
  const m = mes || MES;
  const linhas = tabelaCredito(cr);
  const idx = linhas.findIndex(l => l.mes === m);
  const partida = idx >= 0 ? idx : 0;
  const restantes = linhas.slice(partida);
  if (!restantes.length) return null;

  const saldo0 = restantes[0].saldo + restantes[0].capital;   // antes de pagar este mês
  const i = Math.max(0, taxaCorrente(cr)) / 100 / 12;
  const prest = restantes[0].prestacao;
  const reforco = Math.max(0, parseNum(extra));

  const correr = (pagamento) => {
    let saldo = saldo0, juros = 0, k = 0;
    const limite = 1200;                    // 100 anos: rede contra prestação insuficiente
    while (saldo > 0.005 && k < limite){
      const j = saldo * i;
      const cap = Math.min(Math.max(0, pagamento - j), saldo);
      if (cap <= 0) return null;            // não amortiza: a prestação nem cobre os juros
      juros += j; saldo -= cap; k++;
    }
    return {meses: k, juros};
  };

  const semReforco = correr(prest);
  const comReforco = correr(prest + reforco);
  if (!semReforco || !comReforco) return null;
  return {
    saldo: saldo0, prestacao: prest, reforco,
    mesesAntes: semReforco.meses, mesesDepois: comReforco.meses,
    mesesPoupados: semReforco.meses - comReforco.meses,
    jurosPoupados: semReforco.juros - comReforco.juros,
    fim: mesShift(m, comReforco.meses - 1),
  };
}

/**
 * Por que ordem amortizar. «Avalanche» ataca primeiro a taxa mais alta e
 * é a que poupa mais juros; «bola de neve» ataca o saldo mais pequeno e
 * dá vitórias mais cedo. As duas são defensáveis — a escolha é de quem paga.
 */
function ordemAmortizacao(metodo){
  const ativos = S.creditos.filter(c => creditoAtivo(c, MES) && saldoDevedorMes(c, MES) > 0.5);
  const comDados = ativos.map(c => ({
    cr: c, taxa: taxaCorrente(c), divida: saldoDevedorMes(c, MES), prestacao: encargoCredito(c, MES),
  }));
  return metodo === "bola"
    ? comDados.sort((a,b) => a.divida - b.divida)
    : comDados.sort((a,b) => b.taxa - a.taxa);
}

/** Seguros associados ao crédito, por mês. */
const seguroCredito = (cr) => Math.max(0, parseNum(cr.seguroMensal));

function creditoAtivo(cr, mes){
  const n = prazoCredito(cr);
  if (!n) return false;
  const k = mesDiff(inicioCredito(cr), mes);
  return k >= 0 && k < n;
}
/** Nº de prestações pagas até ao fim do mês indicado. */
function pagasAte(cr, mes){
  const k = mesDiff(inicioCredito(cr), mes) + 1;
  return Math.max(0, Math.min(prazoCredito(cr), k));
}

/**
 * Decomposição da prestação de um mês: juros, capital, seguro e taxa em vigor.
 * Devolve null se o crédito não estiver ativo nesse mês.
 */
function parcelaMes(cr, mes, choque){
  if (!creditoAtivo(cr, mes)) return null;
  const t = tabelaCredito(cr, choque);
  const k = mesDiff(inicioCredito(cr), mes);
  const l = t[k];
  if (!l) return null;
  const seguro = seguroCredito(cr);
  return {juros: l.juros, capital: l.capital, seguro,
          prestacao: l.prestacao, total: l.prestacao + seguro, taxa: l.taxa};
}
/** Prestação (sem seguros) de um mês; por omissão, o mês em análise. */
function prestacao(cr, mes, choque){
  const p = parcelaMes(cr, mes || MES, choque);
  if (p) return p.prestacao;
  // Fora do prazo: devolve a primeira prestação, útil como referência.
  const t = tabelaCredito(cr, choque);
  return t.length ? t[0].prestacao : 0;
}
/** Encargo mensal completo, incluindo seguros. */
function encargoCredito(cr, mes, choque){
  const p = parcelaMes(cr, mes || MES, choque);
  return p ? p.total : 0;
}
/** Capital em dívida no fim do mês indicado. */
function saldoDevedorMes(cr, mes, choque){
  const t = tabelaCredito(cr, choque);
  if (!t.length) return 0;
  const k = mesDiff(inicioCredito(cr), mes);
  if (k < 0) return parseNum(cr.capital);
  if (k >= t.length) return 0;
  return t[k].saldo;
}
/** Mapa de amortização agregado por ano civil. */
function amortizacaoAnual(cr, choque){
  const anos = new Map();
  for (const l of tabelaCredito(cr, choque)){
    const ano = l.mes.slice(0,4);
    const row = anos.get(ano) || {ano, juros:0, capital:0, pago:0, saldo:0, taxa:l.taxa};
    row.juros += l.juros; row.capital += l.capital; row.pago += l.prestacao;
    row.saldo = l.saldo; row.taxa = l.taxa;
    anos.set(ano, row);
  }
  return Array.from(anos.values());
}
const jurosTotais = (cr, choque) =>
  tabelaCredito(cr, choque).reduce((s,l) => s + l.juros, 0);
const custoTotalCredito = (cr, choque) =>
  parseNum(cr.capital) + jurosTotais(cr, choque) + seguroCredito(cr) * prazoCredito(cr);

/** Juros ainda por pagar a partir do mês indicado. */
const jurosFuturos = (cr, mes, choque) =>
  tabelaCredito(cr, choque).filter(l => l.mes >= mes).reduce((s,l) => s + l.juros, 0);

/* ---------------------------------------------------------------
   Investimentos — valorização, retorno e projeções
   --------------------------------------------------------------- */

/** Anos decorridos desde uma data. */
function anosDesde(dataIso){
  if (!dataIso) return 0;
  const meses = mesDiff(mesDoDia(dataIso), isoMes(hoje()));
  return meses > 0 ? meses / 12 : 0;
}

/** Retorno anual esperado de um ativo (%): o do utilizador, ou o típico da classe. */
function retornoAtivo(a){
  const r = a.valorizacao;
  return (r === "" || r == null) ? classeDe(a.classe).ret : parseNum(r);
}
/** Queda numa correção severa (%): a do utilizador, ou a típica da classe. */
function quedaAtivo(a){
  const q = a.queda;
  return (q === "" || q == null) ? classeDe(a.classe).queda : parseNum(q);
}
/**
 * Retorno líquido de imposto (%). Juros, dividendos e mais-valias são tributados
 * na fonte à taxa liberatória; o PPR não é tributado durante a acumulação.
 */
function retornoLiquido(a){
  const bruto = retornoAtivo(a);
  if (bruto <= 0) return bruto;
  const regime = classeDe(a.classe).fiscal;
  if (regime === "capitais") return bruto * (1 - parseNum(S.fiscal.capitais)/100);
  return bruto;
}

const ganho = (a) => valorAtivo(a) - parseNum(a.aquisicao);

/* ---------------------------------------------------------------
   TIR (taxa interna de rentabilidade) — retorno ponderado no tempo

   O CAGR simples ignora quando o dinheiro entrou: quem reforçou muito
   pouco antes de uma subida aparenta um retorno que não teve. A TIR
   resolve o problema descontando cada fluxo à sua própria data.
   --------------------------------------------------------------- */

/** Valor presente líquido de fluxos datados, a uma taxa anual. */
function vpl(fluxos, taxa){
  const t0 = fluxos[0].t;
  return fluxos.reduce((s,f) => s + f.v / Math.pow(1 + taxa, (f.t - t0) / 365.25), 0);
}
/**
 * TIR anual (%) por bisseção — lenta mas incondicionalmente estável, ao
 * contrário de Newton-Raphson, que diverge com fluxos irregulares.
 * `fluxos`: [{t: dias desde a época, v: valor}], aportes negativos.
 */
function tir(fluxos){
  if (!fluxos || fluxos.length < 2) return null;
  const temNeg = fluxos.some(f => f.v < 0), temPos = fluxos.some(f => f.v > 0);
  if (!temNeg || !temPos) return null;

  let lo = -0.9999, hi = 10;                 // −99,99% a +1000% ao ano
  let vLo = vpl(fluxos, lo), vHi = vpl(fluxos, hi);
  if (vLo * vHi > 0) return null;            // sem raiz no intervalo
  for (let i = 0; i < 200; i++){
    const mid = (lo + hi) / 2;
    const v = vpl(fluxos, mid);
    if (Math.abs(v) < 1e-7) return mid * 100;
    if (v * vLo > 0){ lo = mid; vLo = v; } else { hi = mid; }
  }
  return (lo + hi) / 2 * 100;
}

const diasDesdeEpoca = (iso) => Math.round(new Date(iso + "T00:00:00").getTime() / 86400000);

/**
 * Fluxos de caixa de um ativo, para a TIR: aportes registados (negativos),
 * mais o valor atual como resgate teórico (positivo). Sem aportes registados,
 * usa a aquisição na sua data — que é o caso simples de uma só entrada.
 */
function fluxosCaixa(a){
  const lista = [];
  const aportes = (a.aportes || []).filter(x => x.data && parseNum(x.valor) !== 0);
  if (aportes.length){
    aportes.forEach(x => lista.push({t: diasDesdeEpoca(x.data), v: -Math.abs(parseNum(x.valor))}));
  } else if (a.dataAquisicao && parseNum(a.aquisicao) > 0){
    lista.push({t: diasDesdeEpoca(mesDoDia(a.dataAquisicao) + "-01"), v: -parseNum(a.aquisicao)});
  } else {
    return null;
  }
  lista.push({t: diasDesdeEpoca(isoDia(hoje())), v: valorAtivo(a)});
  lista.sort((x,y) => x.t - y.t);
  return lista;
}

/**
 * Retorno obtido (%/ano). Usa a TIR quando há aportes datados suficientes;
 * caso contrário devolve o CAGR sobre a entrada única, sinalizando o método.
 */
function retornoObtido(a){
  const anos = anosDesde(a.dataAquisicao);
  const aportes = (a.aportes || []).filter(x => x.data && parseNum(x.valor) !== 0);
  const aplicado = parseNum(a.aquisicao);

  if (aportes.length >= 1){
    const f = fluxosCaixa(a);
    const r = f ? tir(f) : null;
    if (r != null && Number.isFinite(r)){
      // A TIR só vale o que valerem os fluxos. Se os aportes registados não
      // cobrem o capital aplicado, o resultado é sobre uma parte da história
      // — e isso tem de ser dito, não escondido.
      const somaAportes = aportes.reduce((s,x) => s + Math.abs(parseNum(x.valor)), 0);
      const cobertura = aplicado > 0 ? somaAportes / aplicado : 1;
      return {taxa: r, metodo:"TIR", n: aportes.length,
              somaAportes, cobertura, parcial: aplicado > 0 && Math.abs(cobertura - 1) > 0.02};
    }
  }
  const fim = valorAtivo(a);
  if (anos < 0.5 || aplicado <= 0 || fim <= 0) return null;
  return {taxa: (Math.pow(fim / aplicado, 1 / anos) - 1) * 100, metodo:"CAGR", n:0, cobertura:1, parcial:false};
}

/* Agregados da componente financeira (as poupanças e a carteira). */
const financeiros = () => S.ativos.filter(a => classeDe(a.classe).nat === "financeiro");
const reais       = () => S.ativos.filter(a => classeDe(a.classe).nat === "real");
const porGrupoAtivo = (g) => S.ativos.filter(a => classeDe(a.classe).grupo === g);

const totalInvestido = () => financeiros().reduce((s,a) => s + parseNum(a.aquisicao), 0);
const totalCarteira  = () => financeiros().reduce((s,a) => s + valorAtivo(a), 0);
/** Liquidez imediata: contas à ordem, poupança e depósitos. */
const totalLiquidez  = () => porGrupoAtivo("liquidez").reduce((s,a) => s + valorAtivo(a), 0);

/** Retorno esperado da componente financeira, ponderado pelo valor (%). */
function retornoCarteira(liquido){
  const lista = financeiros();
  const tot = lista.reduce((s,a) => s + valorAtivo(a), 0);
  if (tot <= 0) return 0;
  const f = liquido ? retornoLiquido : retornoAtivo;
  return lista.reduce((s,a) => s + valorAtivo(a) * f(a), 0) / tot;
}
/** Valor da componente financeira após uma correção severa. */
function carteiraAposCorrecao(){
  return financeiros().reduce((s,a) => s + valorAtivo(a) * (1 - quedaAtivo(a)/100), 0);
}

/**
 * Projeta a carteira mês a mês, com juro composto e reforços mensais.
 * opts.ajuste   — pontos percentuais somados ao retorno anual de cada posição
 * opts.correcao — {pct, ano} aplica uma queda única no mês correspondente
 * Devolve uma série anual [{ano, valor, aportado, real}].
 */
function projetarCarteira(anos, opts){
  opts = opts || {};
  const ajuste = opts.ajuste || 0;
  const corr = opts.correcao || null;
  const inflacao = parseNum(S.projecao.inflacao) / 100;
  const passos = Math.max(1, Math.round(anos * 12));
  const mesCorrecao = corr ? Math.round(parseNum(corr.ano) * 12) : -1;
  const liquido = S.fiscal.contarIRS !== false;

  const pos = financeiros().map(a => ({
    valor: valorAtivo(a),
    reforco: parseNum(a.contribuicao),
    cresc: parseNum(a.crescContrib) / 100,
    // Uma taxa anual negativa continua a ser tratável: (1+r)^(1/12)-1 exige r > -100%.
    taxaMes: Math.pow(1 + Math.max(-0.99, ((liquido ? retornoLiquido(a) : retornoAtivo(a)) + ajuste)/100), 1/12) - 1,
    queda: quedaAtivo(a)/100,
  }));

  const soma = () => pos.reduce((s,p) => s + p.valor, 0);
  let aportado = 0;
  const serie = [{ano:0, valor: soma(), aportado:0, real: soma()}];

  for (let k = 1; k <= passos; k++){
    // As contribuições que crescem fazem-no uma vez por ano, no aniversário.
    if (k > 1 && (k - 1) % 12 === 0){
      for (const p of pos) if (p.cresc) p.reforco *= (1 + p.cresc);
    }
    for (const p of pos){
      p.valor = p.valor * (1 + p.taxaMes) + p.reforco;
      aportado += p.reforco;
    }
    if (k === mesCorrecao){
      // A queda de cada classe é escalada pela severidade pedida (100% = queda típica).
      const escala = parseNum(corr.pct) / 100;
      for (const p of pos) p.valor *= Math.max(0, 1 - p.queda * escala);
    }
    if (k % 12 === 0){
      const v = soma();
      serie.push({ano: k/12, valor: v, aportado, real: v / Math.pow(1 + inflacao, k/12)});
    }
  }
  return serie;
}

/**
 * Projeção de um único ativo financeiro, com parâmetros que podem vir do
 * simulador em vez do ativo. Devolve a série anual e os totais.
 *   p.contrib — contribuição mensal
 *   p.cresc   — crescimento anual da contribuição (%)
 *   p.taxa    — retorno anual (%)
 *   p.reinv   — percentagem do rendimento que é reinvestida (%)
 * O que não é reinvestido sai como distribuição (dividendos, juros pagos).
 */
function projetarAtivo(a, anos, p){
  p = p || {};
  const contrib0 = p.contrib != null ? parseNum(p.contrib) : parseNum(a.contribuicao);
  const cresc = (p.cresc != null ? parseNum(p.cresc) : parseNum(a.crescContrib)) / 100;
  const taxaAno = p.taxa != null ? parseNum(p.taxa) : retornoLiquido(a);
  const reinv = (p.reinv != null ? parseNum(p.reinv) : parseNum(a.reinvestimento)) / 100;
  const inflacao = parseNum(S.projecao.inflacao) / 100;

  const passos = Math.max(1, Math.round(anos * 12));
  const taxaMes = Math.pow(1 + Math.max(-0.99, taxaAno/100), 1/12) - 1;

  let valor = valorAtivo(a), contrib = contrib0;
  let aportado = 0, distribuido = 0;
  const serie = [{ano:0, valor, aportado:0, distribuido:0, contrib, real: valor}];

  for (let k = 1; k <= passos; k++){
    if (k > 1 && (k - 1) % 12 === 0 && cresc) contrib *= (1 + cresc);
    const rendimento = valor * taxaMes;
    const retido = rendimento * reinv;
    distribuido += rendimento - retido;
    valor = valor + retido + contrib;
    aportado += contrib;
    if (k % 12 === 0){
      serie.push({ano: k/12, valor, aportado, distribuido, contrib,
                  real: valor / Math.pow(1 + inflacao, k/12)});
    }
  }
  const fim = serie[serie.length-1];
  return {serie, fim, contribFinal: contrib,
          totalAportado: valorAtivo(a) + aportado,
          rendimentoGerado: fim.valor + distribuido - valorAtivo(a) - aportado};
}

/** Parâmetros em uso no simulador de um ativo (os do ativo, se não houver). */
function paramsSimulador(a){
  const s = ui.simAtivo;
  if (s && s.id === a.id) return s;
  return {
    id: a.id,
    anos: 20,
    contrib: parseNum(a.contribuicao),
    cresc: parseNum(a.crescContrib),
    // Sem arredondar: assim o cenário de partida coincide exatamente com o
    // ativo, e o desvio só aparece quando se mexe num comando.
    taxa: retornoLiquido(a),
    reinv: parseNum(a.reinvestimento),
  };
}

/* ---------------------------------------------------------------
   Ativos — entidades com valor, encargos, rendimentos e créditos

   Cada ativo é uma entidade autónoma. Dela pendem:
     · o valor patrimonial e a sua valorização ou depreciação;
     · os encargos de posse (IMI, condomínio, seguros, manutenção);
     · os rendimentos que gera (rendas);
     · os créditos que o financiam (hipoteca, crédito automóvel).
   Todos esses fluxos são encaminhados para as categorias do orçamento.
   --------------------------------------------------------------- */

/** Valor estimado pela taxa de valorização, a partir da aquisição. */
function valorEstimado(a){
  const base = parseNum(a.aquisicao);
  // Um ativo não vale menos do que nada: um capital negativo é um erro de
  // introdução, e deixá-lo passar corromperia o balanço em silêncio.
  if (base <= 0 || !a.dataAquisicao) return Math.max(0, base);
  return Math.max(0, base * Math.pow(1 + retornoAtivo(a)/100, anosDesde(a.dataAquisicao)));
}
/**
 * Valor considerado no balanço, por ordem de fiabilidade:
 * unidades × cotação (ETF, ações, cripto) → valor indicado → estimativa.
 */
function valorAtivo(a){
  if (_emPasse && _cacheValor.has(a)) return _cacheValor.get(a);
  const q = parseNum(a.quantidade), c = parseNum(a.cotacao);
  const v = (q > 0 && c > 0) ? q * c
          : (parseNum(a.atual) > 0 ? parseNum(a.atual) : valorEstimado(a));
  if (_emPasse) _cacheValor.set(a, v);
  return v;
}
/** Como foi obtido o valor em uso — para o dizer ao utilizador. */
function origemValor(a){
  if (parseNum(a.quantidade) > 0 && parseNum(a.cotacao) > 0) return "cotação";
  return parseNum(a.atual) > 0 ? "indicado" : "estimado";
}
/** Valor projetado do ativo daqui a n anos, com as contribuições que tiver. */
function valorAtivoFuturo(a, anos){
  if (classeDe(a.classe).nat === "financeiro" && parseNum(a.contribuicao) > 0){
    return projetarAtivo(a, anos).fim.valor;
  }
  return valorAtivo(a) * Math.pow(1 + retornoAtivo(a)/100, anos);
}

const creditosDoAtivo = (a) => S.creditos.filter(c => c.ativoId === a.id);
/** Capital em dívida dos créditos que financiam o ativo. */
const dividaDoAtivo = (a, mes) =>
  creditosDoAtivo(a).reduce((s,c) => s + saldoDevedorMes(c, mes || MES), 0);
/** Valor líquido: o que sobraria se vendesse e liquidasse a dívida. */
const capitalProprio = (a, mes) => valorAtivo(a) - dividaDoAtivo(a, mes);

/** Encargos de posse, normalizados a mês — incluindo o imposto do ativo. */
const encargosMensais = (a) =>
  (a.encargos || []).reduce((s,e) => s + parseNum(e.valor) * freqFator(e.frequencia), 0)
  + impostoAtivo(a).anual / 12;
/** Rendimentos gerados, normalizados a mês. */
const rendimentosMensais = (a) =>
  (a.rendimentos || []).reduce((s,r) => s + parseNum(r.valor) * freqFator(r.frequencia), 0);
/** Serviço da dívida do ativo (prestação + seguros) no mês. */
const servicoDivida = (a, mes) =>
  creditosDoAtivo(a).reduce((s,c) => s + encargoCredito(c, mes || MES), 0);

/** Fluxo de caixa mensal do ativo: rendas menos encargos e serviço da dívida. */
function fluxoAtivo(a, mes){
  const receita = rendimentosMensais(a);
  const encargos = encargosMensais(a);
  const divida = servicoDivida(a, mes);
  return {receita, encargos, divida, liquido: receita - encargos - divida};
}
/**
 * Rendibilidade de um ativo, em três leituras:
 *   bruta   — rendas sobre o valor, sem descontar nada
 *   liquida — desconta encargos de posse e impostos, não o crédito. Mede o
 *             mérito do ativo, independentemente de como foi financiado.
 *   propria — «cash-on-cash»: fluxo de caixa efetivo sobre o capital próprio
 *             investido. Inclui a alavancagem, e é o que o dinheiro do
 *             agregado está realmente a render.
 */
function rendibilidade(a, mes){
  const v = valorAtivo(a);
  const receita = rendimentosMensais(a) * 12;
  const encargos = encargosMensais(a) * 12;
  const cp = capitalProprio(a, mes);
  const fluxoAnual = fluxoAtivo(a, mes).liquido * 12;
  return {
    bruta:   v > 0 ? receita / v * 100 : 0,
    liquida: v > 0 ? (receita - encargos) / v * 100 : 0,
    propria: cp > 0 ? fluxoAnual / cp * 100 : null,
    capitalProprio: cp, fluxoAnual,
  };
}

/** Balanço patrimonial no mês em análise. */
function balanco(mes){
  mes = mes || MES;
  const carteira = totalCarteira();
  // Só os ativos reais: os financeiros já estão em `carteira`, e somá-los
  // aqui contá-los-ia duas vezes no total.
  const bens = reais().reduce((s,a) => s + valorAtivo(a), 0);
  const divida = S.creditos.reduce((s,c) => s + saldoDevedorMes(c, mes), 0);
  const ativos = carteira + bens;
  return {carteira, bens, ativos, divida, liquido: ativos - divida};
}
